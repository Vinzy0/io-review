ove every individual decision into the full-team meeting"], "ans": 1, "why": "Excessive meeting requirements can undermine team effectiveness; full-team meetings should be reserved for matters needing the whole team. Adding attendees or moving more individual matters into meetings can increase the same burden. (Source: Ms. Chiqui's notes)", "hint": "Match the participants and meeting time to the actual coordination need."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Before announcing a new system, management shows employees data proving the company lost 30% of its market share to competitors, to convince them that the current way of working is no longer acceptable. In Lewin's model, this is:", "opts": ["Refreezing", "Moving", "Internalization", "Unfreezing"], "ans": 3, "why": "Lewin's 3 stages: UNFREEZING = convincing people the current state is unacceptable and change is needed. MOVING = taking steps toward the desired state. REFREEZING = locking in the change through policies and rewards. Internalization is Carnall's final stage, not Lewin's.", "hint": "Management is convincing people the current state is unacceptable."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "After a new customer-service process is rolled out, management writes it into the official policy manual and rewards employees who consistently follow it. In Lewin's model, this is:", "opts": ["Unfreezing", "Moving", "Refreezing", "Adaptation"], "ans": 2, "why": "Refreezing = making the change STICK: formalizing new policies and rewarding behavior consistent with the change.", "hint": "They're locking the new process in place."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A company announced a major restructuring without explaining why it was needed. Employees saw no reason to change, and the effort stalled. Which step of Kotter's model was MOST clearly skipped?", "opts": ["Increase urgency", "Build on wins", "Embed changes into culture", "Create short-term wins"], "ans": 0, "why": "Kotter's step 1 is to INCREASE URGENCY: create a compelling, immediate need for change so the status quo no longer feels acceptable. Without it, people don't buy in. It parallels Lewin's unfreezing.", "hint": "Nobody felt a need for change. That's Kotter's very first step."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "To silence cynics early in a two-year digital transformation, leaders deliberately plan a visible improvement in the first 3 months and publicly reward the team behind it. Which Kotter step is this?", "opts": ["Communicate the vision", "Build a guiding team", "Develop the vision", "Create short-term wins"], "ans": 3, "why": "Create short-term wins = plan visible, unambiguous early improvements and reward the people involved. This builds momentum, validates the strategy, and silences cynics and early resisters.", "hint": "Visible, early, rewarded."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Employees have stopped denying that the new scheduling system is coming. They are now trying it out, learning how it works, and adjusting how they do their jobs. In Carnall's stages of change acceptance, they are in:", "opts": ["Defense", "Adaptation", "Internalization", "Discarding"], "ans": 1, "why": "Carnall's 5 stages: Denial → Defense (justifying the old ways) → Discarding (realizing they must change too) → ADAPTATION (testing the system, learning, adjusting) → Internalization (fully comfortable and immersed in the new culture).", "hint": "They're past denial and actually testing the new system."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "When told about the new process, an employee says she won't push for it, but she'll go along if it's really necessary. Then she asks, 'But are you SURE the old system is actually broken?' She is a:", "opts": ["Receptive changer", "Change resister", "Reluctant changer", "Change analyst"], "ans": 2, "why": "Reluctant changers won't instigate or welcome change but will change if necessary: 'Are you sure it's broken?' Receptive changers: 'If it's broke, I'll help fix it.' Change analysts: change only if it improves things. Change resisters: 'It may be broke, but it's still better than the unknown.'", "hint": "Won't push for change, will go along if necessary, asks if it's really broken."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "A consultant administers an anonymous attitude survey to all employees, compiles results by department, presents the data back to each group, and then helps them plan changes. Which OD intervention is this?", "opts": ["Team building", "Total Quality Management", "Survey feedback", "Appreciative inquiry"], "ans": 2, "why": "Survey feedback = systematic data collection through an anonymous survey, results compiled by unit, FED BACK to members, then groups identify changes. Top management supports and participates.", "hint": "Survey, then results fed back to each group."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "Instead of asking 'What's wrong with our department?', a facilitator asks employees to describe moments when the team was at its best, then uses those strengths to plan the future. This intervention is:", "opts": ["Confrontation meeting", "Process consultation", "Appreciative inquiry", "Survey feedback"], "ans": 2, "why": "Appreciative Inquiry (positive OD) focuses on STRENGTHS, the best of what employees offer, and past successes rather than problems. Its 5-D cycle: Define → Discover → Dream → Design → Deliver.", "hint": "The focus is on strengths, not problems."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "In an Appreciative Inquiry session, employees have just finished identifying their past successes. They are now asked to imagine and describe the ideal future of their department. Which phase is this?", "opts": ["Discover", "Design", "Dream", "Deliver"], "ans": 2, "why": "Define (focus of inquiry) → DISCOVER (what's working, past successes) → DREAM (envision the positive future) → DESIGN (strategies and plans to make it happen) → DELIVER (implement).", "hint": "They've finished discovering. Now they imagine."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Overnight, a traditional bank closes all its physical branches and becomes a purely digital bank, drastically changing how everything is done. According to Burke, this is:", "opts": ["Evolutionary change", "Revolutionary change", "Developmental change", "Incremental change"], "ans": 1, "why": "Burke: EVOLUTIONARY change = continual upgrading and improvement of processes. REVOLUTIONARY change = a 'real jolt to the system' that drastically changes how things are done.", "hint": "Overnight and drastic, or gradual?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Middle managers quietly oppose a restructuring because it will cut their authority, headcount, and budgets. This is mainly which type of resistance to change?", "opts": ["Technical resistance", "Reluctant change", "Political resistance", "Cultural resistance"], "ans": 2, "why": "POLITICAL resistance = concerns about power, influence, resources, and self-interest. TECHNICAL = practical or operational concerns (e.g., the system is hard to use). CULTURAL = clashes with deeply ingrained values, norms, and traditions ('this isn't who we are').", "hint": "What do the middle managers stand to lose?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A company asks employees to identify and eliminate unnecessary forms, reports, and paperwork that serve no useful purpose. In a 'sacred cow hunt,' this targets the:", "opts": ["Speed cow", "Paper cow", "Process cow", "Meeting cow"], "ans": 1, "why": "Sacred cow hunt = removing practices with no useful purpose. PAPER cow = unnecessary paperwork. MEETING cow = too many or too-long meetings. SPEED cow = unnecessary deadlines. There is no 'process cow'.", "hint": "Forms and reports are the target."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A hospital is about to switch to a new electronic scheduling system that nurses will use daily. Which approach is MOST likely to reduce nurses' resistance?", "opts": ["Delay the change until every nurse agrees to it", "Involve nurse representatives in selecting and testing the system", "Announce the change in a memo the day before launch", "Penalize nurses who keep using the old system"], "ans": 1, "why": "The three major strategies for dealing with resistance: EMPATHY and SUPPORT, COMMUNICATION, and PARTICIPATION/INVOLVEMENT. People resist less when they help shape the change. Last-minute memos and penalties raise resistance.", "hint": "People resist less when they help shape the change."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "A consultant observes a team's meetings and helps members become aware of HOW they communicate, make decisions, and handle conflict, so they can solve their own problems in the future. This is a:", "opts": ["Structural intervention", "Content intervention", "Process intervention (process consultation)", "Technostructural intervention"], "ans": 2, "why": "PROCESS interventions help the group see its own INTERNAL DYNAMICS (communication, roles, decision-making, norms). CONTENT interventions address the substance of the work or mission. STRUCTURAL interventions change the group's structure.", "hint": "The consultant focuses on HOW they work together, not on the work itself."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "After a major market disruption, a 50-year-old print publisher redefines its core identity, purpose, and mission, rebuilding itself from the ground up as a digital media company. This is best described as:", "opts": ["Organizational transformation", "Incremental change", "Remedial change", "Organizational development"], "ans": 0, "why": "Organizational TRANSFORMATION = comprehensive change to the organization's fundamental 'DNA' (identity, purpose, mission), usually triggered by major disruption. OD = planned, long-term, organization-wide improvement of the existing system. Remedial change = fixing specific existing problems.", "hint": "They redefined who they are, not just a process."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A new manager constantly changes procedures, even ones that work well, saying 'If it ain't broke, break it.' In terms of how people respond to change, she is a:", "opts": ["Change resister", "Change agent", "Receptive changer", "Change analyst"], "ans": 1, "why": "Change agents enjoy change and often change things just for the sake of it ('If it ain't broke, break it'). Change analysts only change things when it will improve the organization. Receptive changers won't start change but will help.", "hint": "Which change type changes things just for the sake of it?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A 40-year-old snack brand changes its logo, packaging, slogan, and ads to reposition itself for Gen Z buyers. Its operations and structure stay the same. Which type of large-scale organizational change is this?", "opts": ["Structural change", "Rebranding change", "Relocation change", "Transformational change"], "ans": 1, "why": "Rebranding change = altering the organization's brand identity (logo, messaging, image), often to target a new market or reposition. Transformational change would overhaul strategies, processes, and structures; structural change alters reporting lines and hierarchy.", "hint": "What exactly changed: how the company works, or how it presents itself?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A conglomerate splits its food business and its real-estate business into two completely independent companies. This is a:", "opts": ["Merger and acquisition change", "De-merger change", "Incremental change", "Downsizing change"], "ans": 1, "why": "De-merger change is the opposite of a merger: a single organization separates into two or more independent entities. Downsizing reduces the workforce; a merger combines organizations.", "hint": "One company becomes two. What's the opposite of a merger?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A hospital's billing department has a high error rate that is costing money, so management launches a change effort specifically to fix that problem. This is a:", "opts": ["Remedial change", "Developmental change", "Rebranding change", "Transformational change"], "ans": 0, "why": "Remedial change addresses EXISTING problems or weaknesses to fix them. Developmental change ENHANCES existing capabilities that already work (often through training). Transformational change overhauls the whole organization.", "hint": "Is the goal to fix a problem, or to improve something that already works?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A bank whose tellers already perform well enrolls them in advanced training to make their customer-service skills even stronger. This is a:", "opts": ["Revolutionary change", "Remedial change", "Developmental change", "De-merger change"], "ans": 2, "why": "Developmental change enhances EXISTING capabilities and performance levels, often through training. Nothing was broken (which would make it remedial); the bank is building on current strengths.", "hint": "Nothing is broken; they're building on strengths."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "Instead of one big overhaul, a factory makes small, continuous improvements to its existing routines every month, building on what already works. This is:", "opts": ["Transformational change", "De-merger change", "Incremental change", "Revolutionary change"], "ans": 2, "why": "Incremental change = small, continuous improvements to existing practices and routines, building on current strengths rather than introducing radical shifts. It matches Burke's 'evolutionary' change.", "hint": "Small steps, continuously."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A company moves its entire head office from Makati to Clark, affecting employees' commutes, infrastructure, and its local customer base. This is a:", "opts": ["Process and system change", "People and culture change", "Structural change", "Relocation change"], "ans": 3, "why": "Relocation change = moving the organization's operations to a new location, affecting its workforce, infrastructure, and customer base.", "hint": "The company is physically moving."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "An insurance company replaces its paper-based claims workflow with a new digital system, changing the procedures and steps employees follow to process claims. This is mainly a:", "opts": ["Process and system change", "Relocation change", "People and culture change", "Rebranding change"], "ans": 0, "why": "Process and system change modifies HOW work is done: workflows, procedures, and the systems supporting them. People and culture change targets behaviors, attitudes, skills, and culture.", "hint": "The workflow and system are what changed."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change Drivers", "q": "A new data privacy regulation forces a company to change how it collects and stores customer information. In terms of factors driving change, this is a(n):", "opts": ["External factor (market competition)", "Internal factor (new leadership)", "External factor (political and legal)", "Internal factor (operational inefficiency)"], "ans": 2, "why": "External factors come from outside: technology, competition, customer demands, economic, sociocultural, political/legal (new laws and regulations), and crises. Internal factors include leadership changes, performance gaps, strategy, growth or decline, and culture.", "hint": "Did the pressure come from inside the company or outside it?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change Drivers", "q": "A newly appointed CEO arrives with a fresh vision and immediately reshapes the company's priorities and structure. This change is driven mainly by a(n):", "opts": ["External factor: government regulation", "Internal factor: change in leadership", "External factor: market competition", "External factor: economic recession"], "ans": 1, "why": "Changes in leadership/management are an INTERNAL driver: new leaders bring new perspectives, strategies, and visions that lead to changes in structure, culture, and priorities.", "hint": "Where did the push for change come from?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "To boost productivity and well-being, a company redesigns its performance management, goal-setting, appraisal, and reward systems. In terms of intervention types, this is a(n):", "opts": ["Human process intervention", "Technostructural intervention", "Strategic change intervention", "Human resource management intervention"], "ans": 3, "why": "HRM interventions target performance management, goal setting, appraisal, reward systems, talent development, DEIB, and well-being. Human process = interpersonal and group dynamics. Technostructural = structure, technology, work design. Strategic = transformation, restructuring, mergers.", "hint": "Appraisal and reward systems belong to which family of interventions?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "Two companies merge, and consultants design a program to unite their strategies, structures, and cultures into one organization. This is a(n):", "opts": ["Human resource management intervention", "Human process intervention", "Strategic change intervention", "Process consultation"], "ans": 2, "why": "Strategic change interventions revolve around transformational change, restructuring, and uniting two or more organizations during a merger.", "hint": "Uniting two organizations is which kind of intervention?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Employee Input", "q": "Employees are asked to give suggestions on a new policy. Management promises to seriously consider them, but makes no guarantee it will follow them. Which level of employee input is this?", "opts": ["Following", "Shared/team", "Absolute", "Advisory"], "ans": 3, "why": "Levels of employee input: Following (no real control) → Ownership of own product (responsible for own quality) → ADVISORY (input is seriously considered, not guaranteed to be used) → Shared/team (decision made at group level) → Absolute (full authority to decide alone). (Source: Ms. Chiqui's IO notes)", "hint": "Their input is heard, but they don't decide."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Flexible Work", "q": "A company lets employees choose their own start and end times, but everyone must be at work from 10 a.m. to 2 p.m. In a flextime schedule, the 10-to-2 period is called:", "opts": ["Core hours", "Bandwidth", "Gliding time", "Peak-time pay"], "ans": 0, "why": "Core hours = the hours in a flextime schedule when every employee must work. Bandwidth = the total number of potential work hours available each day. Gliding time = choosing hours without advance notice. (Source: Ms. Chiqui's IO notes)", "hint": "The part of the day that's NOT flexible."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Flexible Work", "q": "Two part-time employees split one full-time receptionist position: one works mornings and the other works afternoons. This arrangement is:", "opts": ["Compressed workweek", "Job sharing", "Telecommuting", "Moonlighting"], "ans": 1, "why": "Job sharing = two employees share one job by splitting the work hours. Compressed workweek = full-time hours in fewer days (e.g., 4 × 10 hours). Moonlighting = holding a second job. (Source: Ms. Chiqui's IO notes)", "hint": "One job, two people."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Downsizing", "q": "After a major layoff, the employees who KEPT their jobs report guilt, anxiety, and lower commitment. In downsizing research, these employees are called:", "opts": ["Reluctant changers", "Victims", "Change resisters", "Survivors"], "ans": 3, "why": "Victims = employees who lose their jobs in a layoff. SURVIVORS = employees who retain their jobs after downsizing, and they're affected too (guilt, insecurity). Outplacement programs help victims; communication helps survivors. (Source: Ms. Chiqui's IO notes)", "hint": "They kept their jobs."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change and OD", "q": "After a burst pipe damages a branch, management immediately changes its opening hours for a week. Why is this organizational change without necessarily being an OD program?", "opts": ["It redesigns shared cultural assumptions rather than an operational schedule", "It is a long-term participative effort rather than an immediate adjustment", "It replaces the core identity rather than improving existing operations", "It is a narrow operational response rather than an ongoing development effort"], "ans": 3, "why": "Organizational change can be a specific reactive modification, such as temporary opening hours. OD involves planned, ongoing work on organizational effectiveness rather than every isolated adjustment.", "hint": "Compare the immediate scope and time horizon with a sustained development effort."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change and OD", "q": "A firm keeps its core business but undertakes several years of participative work to improve communication, adaptability, and organizational health. Which description fits best?", "opts": ["A change limited to brand presentation", "A single short-term operational correction", "Organizational transformation of its core identity", "Organizational development"], "ans": 3, "why": "OD is a planned, long-term effort to improve the organization's functioning and capacity. Transformation would involve a fundamental shift in identity or purpose, which this firm is retaining.", "hint": "Ask whether the organization is improving how it functions or redefining what it fundamentally is."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Types of Change", "q": "A company removes a regional management layer and changes which executives its branches report to, while keeping the same products and ownership. Which type of change is most directly involved?", "opts": ["Merger and acquisition change", "Structural change", "Relocation change", "Rebranding change"], "ans": 1, "why": "Structural change alters reporting lines, departmental arrangements, or hierarchy. Rebranding changes market identity and presentation rather than internal authority relationships.", "hint": "Identify the organizational feature being rearranged."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Types of Change", "q": "A firm closes two departments and eliminates 80 positions to reduce its workforce. It remains one company at the same location. Which change type is most specific?", "opts": ["De-merger change", "Rebranding change", "Relocation change", "Downsizing change"], "ans": 3, "why": "Downsizing reduces the organization's size through job or unit elimination. A de-merger separates a company into independent entities rather than simply reducing its workforce.", "hint": "Distinguish shrinking one organization from splitting it into separate organizations."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Types of Change", "q": "One logistics business buys another and combines their ownership and operations. Which change category names the transaction driving the integration?", "opts": ["Merger and acquisition change", "Developmental change", "Relocation change", "De-merger change"], "ans": 0, "why": "Merger and acquisition change concerns organizations combining or one acquiring another. De-merger moves in the opposite direction by separating a business into independent entities.", "hint": "Track what happens to organizational ownership."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Types of Change", "q": "A hospital keeps the same reporting chart but changes staff norms from blaming individuals for errors to discussing mistakes openly for learning. What is the primary focus of this change?", "opts": ["Rebranding change", "Relocation change", "People and culture change", "Structural change"], "ans": 2, "why": "People and culture change targets shared attitudes, behaviors, and norms. Structural change would primarily alter reporting lines or departmental configurations, which remain the same here.", "hint": "The chart is unchanged; identify what employees are being asked to do differently together."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change Drivers", "q": "Customers increasingly demand home delivery, so a retailer changes its service model even though its internal leadership is unchanged. Which external driver is most evident?", "opts": ["Internal role ambiguity", "A new internal leadership vision", "Employee career expectations", "Changing customer preferences"], "ans": 3, "why": "Evolving customer needs can compel changes in services and interaction models. A leadership change is an internal driver and is explicitly absent from this scenario.", "hint": "Locate the pressure outside the organization that prompted the response."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change Drivers", "q": "A broad economic recession reduces demand across an industry, leading a company to restructure its operations. Which driver most directly explains the pressure?", "opts": ["Employee skill development", "Internal leadership succession", "External economic conditions", "Internal culture conflict"], "ans": 2, "why": "Recessions are external economic factors that can trigger restructuring or cost reduction. Internal culture issues concern shared organizational beliefs rather than an economy-wide decline in demand.", "hint": "Consider whether the trigger arose inside one firm or across its wider environment."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change Drivers", "q": "An internal audit finds repeated handoff delays even though market demand and technology are stable. Management redesigns the workflow. Which internal driver is most direct?", "opts": ["New government regulation", "Operational inefficiencies", "Changing customer demographics", "Disruptive external technology"], "ans": 1, "why": "Bottlenecks and low productivity are internal performance gaps that can drive process changes. External technology is not the trigger merely because a workflow is being redesigned.", "hint": "Distinguish the diagnosed cause from the method chosen to address it."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change Drivers", "q": "A typhoon makes a company's main office unusable, requiring an immediate change to how employees work. Which external driver best fits?", "opts": ["An unforeseen crisis", "A planned leadership transition", "A routine career-development cycle", "An internal culture initiative"], "ans": 0, "why": "Natural disasters are crises that can force rapid changes for continuity and safety. The response may involve internal decisions, but its initiating pressure is the external event.", "hint": "Separate where the response is managed from where the disruption originated."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Resistance to Change", "q": "Staff oppose a new database because it cannot exchange records with the software required for their work. Their objections concern functionality rather than status or values. Which resistance is most evident?", "opts": ["Normative commitment", "Technical resistance", "Cultural resistance", "Political resistance"], "ans": 1, "why": "Technical resistance concerns operational and practical problems with a change. Political resistance concerns threats to power or resources, which are not the stated issue here.", "hint": "Identify whether the objection is about how the system works, who gains influence, or what people value."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Resistance to Change", "q": "Employees reject a collaborative process because the firm has long celebrated individual competition as the proper way to succeed. Their budgets and formal authority would be unchanged. Which resistance is most evident?", "opts": ["Political resistance", "Technical resistance", "A lack of task equipment", "Cultural resistance"], "ans": 3, "why": "Cultural resistance grows from established values, norms, and shared assumptions. Political resistance would emphasize losses of power or resources rather than a clash with the accepted way of working.", "hint": "The objection concerns what counts as proper behavior in this organization."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Kotter Change Model", "q": "Employees support a new service vision, but an old approval policy prevents them from trying the new approach. Which Kotter action most directly addresses the problem?", "opts": ["Remove obstacles and enable action", "Repeat the announcement of urgency", "Declare the transformation complete", "Limit implementation to the guiding coalition"], "ans": 0, "why": "Enabling action requires removing structural or administrative barriers that conflict with the vision. Repeating urgency does not remove the approval rule blocking employees who are already willing to act.", "hint": "Look for what prevents willing employees from putting the vision into practice."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Kotter Change Model", "q": "A change sponsor recruits respected staff from different departments who have expertise, credibility, and influence to lead the effort together. Which Kotter step is being implemented?", "opts": ["Embed changes into culture", "Create short-term wins", "Build a guiding team", "Increase urgency"], "ans": 2, "why": "A guiding team brings together people with sufficient influence and credibility to drive change. Creating short-term wins concerns visible early results rather than assembling the people who will lead the effort.", "hint": "Focus on the capacity of the people being brought together."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Kotter Change Model", "q": "A pilot succeeds, and executives want to announce that a company-wide transformation is finished even though most systems remain unchanged. What would Kotter's model recommend?", "opts": ["End the change program because the pilot met its targets", "Restore the previous systems to avoid additional disruption", "Use the early success to pursue deeper changes and maintain momentum", "Stop communicating the vision after the first visible gain"], "ans": 2, "why": "Building on wins uses the credibility of early success to drive broader changes rather than declaring premature victory. A successful pilot is evidence of progress, not proof that the whole transformation is embedded.", "hint": "Distinguish an early milestone from completion across the organization."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Appreciative Inquiry", "q": "An Appreciative Inquiry group has already described past strengths and imagined its preferred future. It now develops concrete strategies to make that future possible. Which phase is this?", "opts": ["Discover", "Design", "Deliver", "Dream"], "ans": 1, "why": "Design turns the envisioned future into strategies and plans. Deliver concerns implementing those plans, while Dream concerns imagining the future rather than specifying how to achieve it.", "hint": "Determine whether the group is imagining, planning, or implementing."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "Before experienced technicians retire, a company records their troubleshooting methods, creates searchable guides, and teaches the methods to newer staff. Which intervention is most directly involved?", "opts": ["Rebranding", "Job evaluation", "Gainsharing", "Knowledge management"], "ans": 3, "why": "Knowledge management helps generate, transform, share, and use organizational knowledge. Gainsharing is a productivity-linked reward intervention rather than a system for retaining technical expertise.", "hint": "Identify the resource the organization is trying to preserve and spread."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Evaluating Change", "q": "Six months after a culture program, the consultant checks whether old routines still dominate daily work instead of relying only on launch attendance. Why is this check useful?", "opts": ["It establishes that attending the launch guarantees behavior change", "It tests whether the desired culture actually replaced the old practices", "It proves that every part of the previous culture was harmful", "It removes the need to reinforce the new practices"], "ans": 1, "why": "Culture evaluation examines whether change occurred and whether old norms or procedures persist. Participation in a launch does not establish lasting adoption, which also requires support and reinforcement. (Source: Ms. Chiqui's notes)", "hint": "Compare evidence that a program happened with evidence that work changed afterward."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Managing Downsizing", "q": "Employees laid off during restructuring receive help identifying transferable skills, exploring suitable jobs, and finding retraining opportunities. Which support is most directly being provided?", "opts": ["Performance appraisal for promotion", "Financial counseling about severance", "Emotional counseling for distress", "Career assessment and guidance"], "ans": 3, "why": "Career assessment and guidance supports decisions about future work and retraining. Financial counseling focuses on issues such as severance and insurance rather than matching skills to a new career direction. (Source: Ms. Chiqui's notes)", "hint": "Identify which problem after job loss the service is designed to address."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A researcher gives the same trait-anxiety inventory to 80 employees in January and again in May, then correlates the two sets of scores. Which reliability estimate is she obtaining?", "opts": ["Alternate-forms reliability", "Split-half reliability", "Test-retest reliability", "Inter-rater reliability"], "ans": 2, "why": "Same test, same people, two occasions, correlate the scores = test-retest. It fits traits that are stable over time, like trait anxiety. Alternate forms would use two different versions; split-half needs only one administration; inter-rater compares scorers.", "hint": "Count the versions of the test and the number of times it was given."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Students retook the same reasoning test only two days after the first session. Many remembered the items, and their second scores were noticeably higher. What most likely distorted the test-retest estimate?", "opts": ["Carryover (practice) effects", "Mortality", "Restriction of range", "Validity shrinkage"], "ans": 0, "why": "Carryover effects happen when the test-retest interval is short: the second session is influenced by memory or practice from the first. Practice effects (higher scores the second time) are one form of this. Mortality = people missing the second session.", "hint": "Think about what a very short interval between sessions does."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "When the interval between two administrations of the same test is longer than six months, the test-retest estimate is often called the:", "opts": ["Coefficient of equivalence", "Coefficient of alienation", "Coefficient of stability", "Coefficient of determination"], "ans": 2, "why": "A long-interval test-retest estimate (over 6 months) = coefficient of stability. Coefficient of equivalence goes with alternate/parallel forms. Coefficient of alienation = variance NOT explained by the predictor; coefficient of determination = r squared, the variance that IS explained.", "hint": "The long interval tells you how steady scores stay over time."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A 50-item multiple-choice exam is scored right or wrong, and its items vary widely in difficulty. Which statistic is the best choice for its inter-item consistency?", "opts": ["KR-20", "Cronbach's alpha", "Cohen's kappa", "KR-21"], "ans": 0, "why": "KR-20 is the statistic of choice for DICHOTOMOUS items (right/wrong) with DIFFERENT difficulty levels. KR-21 assumes all items have about the same difficulty. Cronbach's alpha is for nondichotomous items like Likert scales. Kappa is for rater agreement.", "hint": "Two details matter: how the items are scored, and whether their difficulty is uniform."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A developer builds a 30-item job satisfaction scale answered on a 5-point Likert format. Which internal consistency estimate is most appropriate?", "opts": ["KR-20", "Cronbach's alpha", "KR-21", "Kendall's W"], "ans": 1, "why": "Cronbach's alpha is the preferred internal consistency estimate for NONdichotomous items (Likert, partial credit) and needs only one administration. KR-20 and KR-21 are for right/wrong items. Kendall's W is for agreement among rankings.", "hint": "How is each item answered: right/wrong, or on a range of points?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A newly built 40-item self-esteem scale shows a Cronbach's alpha of .97. According to Streiner, what might this very high value suggest?", "opts": ["The items may be redundant", "The scale has low reliability", "The scale is too heterogeneous", "The scale has perfect validity"], "ans": 0, "why": "Streiner (2003) noted that an alpha above .90 may be 'too high' and signal that items are redundant (saying the same thing in slightly different words). High reliability never proves validity.", "hint": "Can a scale be 'too consistent'? What would cause that?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "After correlating scores on the odd and even items of a single test, a developer applies the Spearman-Brown formula. What is the formula doing here?", "opts": ["Converting raw scores into z-scores", "Correcting scores for guessing", "Estimating the reliability of the full-length test from the half-test correlation", "Estimating the test's criterion-related validity"], "ans": 2, "why": "A split-half correlation only reflects HALF the test. Spearman-Brown adjusts it upward to estimate the reliability of the whole test, since longer tests are more reliable. The Spearman-Brown prophecy formula can also estimate how many items are needed to reach a target reliability.", "hint": "A half-length test has fewer items than the real thing."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "The correlation between the two halves of a test is .60. Using the Spearman-Brown formula, r = 2r_half / (1 + r_half), what is the estimated reliability of the full test?", "opts": [".80", ".75", ".60", ".36"], "ans": 1, "why": "2(.60) / (1 + .60) = 1.20 / 1.60 = .75. The full-test estimate is always higher than the half-test correlation because the whole test has twice as many items. Note: the reviewer names Spearman-Brown but doesn't print this formula; it's the standard textbook formula.", "hint": "Plug .60 into the formula: double it on top, add 1 on the bottom."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Why is splitting a test simply down the middle (first half vs. second half) NOT recommended for split-half reliability?", "opts": ["It always produces a coefficient of zero", "Fatigue, anxiety, and item difficulty can differ between the first and second halves", "It only works for Likert-type items", "It requires two administrations of the test"], "ans": 1, "why": "Dividing a test in the middle can spuriously raise or lower the coefficient because the halves differ in fatigue, test anxiety, and item difficulty (items often get harder toward the end). Odd-even splitting avoids this.", "hint": "What changes between the start and the end of a long test?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Three psychologists independently classify 50 children's drawings into diagnostic categories. Which statistic best measures their agreement?", "opts": ["Pearson r", "Cohen's kappa", "KR-20", "Fleiss' kappa"], "ans": 3, "why": "Kappa statistics are used for NOMINAL (category) data. Cohen's kappa = agreement between TWO raters; Fleiss' kappa = agreement among THREE OR MORE raters. Kendall's W is used when raters RANK things.", "hint": "Nominal categories, and count the raters."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Four judges each rank 10 essay contest entries from best to worst. Which statistic evaluates the agreement of their rankings?", "opts": ["Fleiss' kappa", "Kendall's W", "Cohen's kappa", "Cronbach's alpha"], "ans": 1, "why": "Kendall's W (coefficient of concordance) is for rankings/ordinal data across three or more raters. Kappa is for nominal categories, not ranks.", "hint": "The judges are ranking, not sorting into categories."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A company correlates its hiring test with job performance, but only for employees who were hired, all of whom had top test scores. The validity coefficient comes out surprisingly low. What is the most likely reason?", "opts": ["Inflation of range", "Construct-irrelevant variance", "Carryover effects", "Restriction of range"], "ans": 3, "why": "When the variance of a variable is restricted by sampling (only high scorers were hired), the correlation tends to be LOWER. Inflation of range does the opposite: it makes correlations higher.", "hint": "Who is missing from the sample that was correlated?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A test has a generous time limit so everyone can attempt every item, but some items are so difficult that no test taker gets a perfect score. This is a:", "opts": ["Speed test", "Criterion-referenced test", "Ceiling-effect test", "Power test"], "ans": 3, "why": "POWER test = enough time to try everything, but items vary up to very hard levels, so perfect scores are unlikely. SPEED test = uniform, easy items, and the time limit is what separates people.", "hint": "Everyone has enough time, yet no one gets a perfect score."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Mark's observed score is 80 and the test's standard error of measurement (SEM) is 4. What is the approximate 95% confidence interval for his true score?", "opts": ["78 to 82", "76 to 84", "72 to 88", "68 to 92"], "ans": 2, "why": "95% is about ±2 SEM: 80 − 8 = 72 and 80 + 8 = 88. The 68% interval would be ±1 SEM (76 to 84), and about 99% would be ±3 SEM (68 to 92).", "hint": "95% means about two SEMs on each side of the observed score."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "As a test's reliability increases, what happens to its standard error of measurement?", "opts": ["It stays the same", "It decreases", "It becomes equal to the validity coefficient", "It increases"], "ans": 1, "why": "Higher reliability = lower SEM. A more reliable test has less error in each person's score, so the band around the true score gets narrower.", "hint": "Reliability and measurement error move in which direction relative to each other?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A researcher argues that test scores vary across occasions because of specific features of the testing situation (the number of items, scorer training, purpose of testing) and studies these 'facets' to find a 'universe score.' Which theory is this?", "opts": ["Item response theory", "Generalizability theory", "Domain sampling theory", "Classical test theory"], "ans": 1, "why": "Generalizability theory uses facets, universe, and universe score. Under the same conditions of all facets, the same score should be obtained. Classical test theory is X = T + E. IRT models the probability of a response given a latent trait level.", "hint": "Watch for the words 'facets' and 'universe'."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A licensing exam models the probability that a person with a given level of a latent ability will answer an item of a certain difficulty correctly, using item difficulty and discrimination parameters. This approach is:", "opts": ["Generalizability theory", "Item response theory (latent-trait theory)", "Spearman's two-factor theory", "Classical test theory"], "ans": 1, "why": "IRT (latent-trait theory) models the probability that a person with X amount of ability or trait will perform at level Y on an item. It's widely used in licensing exams and computerized adaptive testing. The Rasch model is one IRT model.", "hint": "The model is about the probability of a response given a hidden ability level."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten subject-matter experts rate each item of a new exam as 'essential,' 'useful but not essential,' or 'not necessary.' Which index will be computed from their ratings?", "opts": ["Item-discrimination index", "Coefficient of stability", "Lawshe's Content Validity Ratio (CVR)", "Kuder-Richardson Formula 20"], "ans": 2, "why": "Lawshe's CVR is based on how many experts rate an item 'essential.' It's a quantitative index of CONTENT validity. A positive CVR means more than half the experts said essential.", "hint": "Experts judging whether items are 'essential' to the content."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten experts rate an item, and exactly 5 of them mark it 'essential.' What is the item's CVR?", "opts": ["0.50", "1.00", "0", "−0.50"], "ans": 2, "why": "CVR = (ne − N/2) / (N/2) = (5 − 5) / 5 = 0. A CVR of zero means exactly half the experts rated the item essential.", "hint": "Compare the number of 'essential' ratings with half of the panel."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten experts rate an item, and 8 of them mark it 'essential.' What is the item's CVR?", "opts": ["0.80", "0.30", "0.60", "1.60"], "ans": 2, "why": "CVR = (ne − N/2) / (N/2) = (8 − 5) / 5 = 3 / 5 = 0.60. A positive value means more than half the panel considered the item essential.", "hint": "Subtract half the panel from the number of 'essential' votes, then divide by half the panel."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A clinic gives patients a new 10-item depression questionnaire and, on the same day, the well-established longer inventory it hopes to replace. The two sets of scores are correlated. This provides evidence of:", "opts": ["Incremental validity", "Content validity", "Predictive validity", "Concurrent validity"], "ans": 3, "why": "Concurrent validity = test and criterion collected at about the SAME TIME. It's often used when a new, shorter test is meant to replace a longer or costlier one. Predictive validity collects the criterion LATER.", "hint": "When was the comparison measure collected?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A company gives an aptitude test to job applicants, then six months later correlates their scores with supervisors' performance ratings. This provides evidence of:", "opts": ["Discriminant validity", "Face validity", "Concurrent validity", "Predictive validity"], "ans": 3, "why": "Predictive validity = test scores now, criterion measured later. It's essential for selection and placement tests that aim to forecast future success.", "hint": "There's a gap of months between the test and the criterion."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A firm already uses a cognitive ability test to predict sales performance. Adding a conscientiousness inventory explains additional variance in sales that the cognitive test alone did not. This shows the inventory's:", "opts": ["Face validity", "Incremental validity", "Validity shrinkage", "Concurrent validity"], "ans": 1, "why": "Incremental validity = how much an ADDITIONAL predictor explains about the criterion beyond the predictors already in use.", "hint": "The new test adds something on top of what's already in use."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on a new anxiety scale correlate .78 with scores on a long-established anxiety inventory. This is evidence of:", "opts": ["Convergent validity", "Content validity", "Inter-rater reliability", "Discriminant validity"], "ans": 0, "why": "Convergent validity = high correlation with an established measure of the SAME construct. Both measures 'converge' on anxiety.", "hint": "Same construct, established measure, high correlation."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on the same new anxiety scale correlate only .05 with a vocabulary test, a construct it should have nothing to do with. This is evidence of:", "opts": ["Discriminant validity", "Known-groups validity", "Predictive validity", "Convergent validity"], "ans": 0, "why": "Discriminant validity = LITTLE relationship with measures of constructs the test should NOT theoretically correlate with. NOTE: the reviewer's definition says 'should theoretically be correlated.' It's missing the word NOT, so use the definition here.", "hint": "Low correlation with something unrelated is what you'd hope for."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A new psychosis screening scale yields much higher scores for patients already diagnosed with schizophrenia than for a community sample with no psychiatric history. This is evidence of construct validity known as:", "opts": ["Evidence of changes with age", "Known-groups validity (group differences)", "Concurrent validity", "Face validity"], "ans": 1, "why": "Known-groups validity: the test differentiates groups already known, from external criteria, to differ on the construct. It's one form of construct validity evidence.", "hint": "The comparison groups already differ on the construct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on a math word-problem test turn out to depend heavily on how well students read English, not just on their math ability. This problem is called:", "opts": ["Item branching", "Construct-irrelevant variance", "Construct underrepresentation", "Restriction of range"], "ans": 1, "why": "Construct-IRRELEVANT variance = scores are influenced by something outside the construct (reading ability). Construct UNDERREPRESENTATION = the test leaves out important parts of the construct.", "hint": "The scores are picking up a skill that isn't part of the construct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A 'depression' inventory asks only about sadness and ignores sleep, appetite, energy, and concentration. Its main weakness is:", "opts": ["Low face validity", "Item bias", "Construct-irrelevant variance", "Construct underrepresentation"], "ans": 3, "why": "Construct underrepresentation = failing to capture important components of the construct. Here the test only taps one facet of depression.", "hint": "What's missing from this depression test?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "In a multitrait-multimethod (MTMM) matrix, the correlations between the SAME trait measured by DIFFERENT methods (the validity diagonal) should be high. High values there are evidence of:", "opts": ["Test-retest reliability", "Discriminant validity", "Content validity", "Convergent validity"], "ans": 3, "why": "Heteromethod-monotrait correlations (same trait, different methods) = the validity diagonal: evidence of CONVERGENT validity. Low heterotrait correlations support DISCRIMINANT validity. Monotrait-monomethod values form the reliability diagonal.", "hint": "Same trait, different methods. Do they agree?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A researcher wants to test whether questionnaire data fit a hypothesized five-factor structure proposed by an existing theory. Which procedure fits best?", "opts": ["Exploratory factor analysis", "Confirmatory factor analysis", "Cross-validation", "Principal component analysis"], "ans": 1, "why": "CFA is 'theory-testing': it confirms a HYPOTHESIZED structure. EFA is 'theory-generating', used when you have no preconceived idea of the factors. PCA reduces data dimensionality.", "hint": "The researcher already has a structure in mind."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "In a factor analysis, the researcher keeps only factors with eigenvalues greater than 1.0. Which rule is this?", "opts": ["Scree test (elbow method)", "Spearman-Brown prophecy", "Rule of three", "Kaiser criterion (K1 rule)"], "ans": 3, "why": "Kaiser criterion = retain factors with eigenvalues > 1.0. It tends to OVERestimate the number of factors when there are many variables. The scree test keeps factors before the 'elbow' of the eigenvalue plot, but it's subjective.", "hint": "An eigenvalue cutoff of 1.0 is named after a person."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A test validated on one sample is re-validated on a new, different sample, and its validity coefficient drops a little. This drop is called:", "opts": ["Validity shrinkage", "Scoring drift", "Co-norming", "Restriction of range"], "ans": 0, "why": "Cross-validation = re-validating on a different group. The decrease in validity that typically follows is validity SHRINKAGE. Co-norming = norming more than one test on the same group.", "hint": "Validity usually drops a little on a fresh sample."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms", "q": "Ana's percentile rank on a reading test is 85. What does this mean?", "opts": ["She scored higher than about 85% of the norm group", "Her score is 85 points above the mean", "She is in the top 85 test takers", "She answered 85% of the items correctly"], "ans": 0, "why": "A percentile = the percentage of people in the norm group whose scores fall BELOW a particular raw score. Don't confuse it with percentage CORRECT, which is the number of items answered correctly × 100.", "hint": "Percentile rank is not the same as percent correct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms", "q": "A university's guidance office builds norms from its own freshmen's scores so it can interpret results relative to its own student population. These are:", "opts": ["National anchor norms", "Local norms", "National norms", "Developmental norms"], "ans": 1, "why": "Local norms are developed by test users to show how the LOCAL population performs. National norms come from a nationally representative sample. National anchor norms are equivalency tables for comparing scores on two different tests.", "hint": "Whose students are the norms based on?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A selection test's validity coefficient with job performance is .40. Based on the reviewer's interpretation table, this test is:", "opts": ["Dependent on the circumstances", "Likely to be useful", "Very beneficial", "Unlikely to be useful"], "ans": 2, "why": "Validity coefficients: above .35 = very beneficial; .21–.35 = likely to be useful; .11–.20 = depends on the circumstances; below .11 = unlikely to be useful. Validity coefficients are much smaller than reliability coefficients, so .40 is strong.", "hint": "Validity coefficients run much lower than reliability coefficients. Check the top band."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A personality scale has a Cronbach's alpha of .75. Based on the usual interpretation table, its internal consistency is:", "opts": ["Good", "Acceptable", "Questionable", "Excellent"], "ans": 1, "why": "Alpha bands: ≥ .90 excellent; .80–.89 good; .70–.79 acceptable; .60–.69 questionable; .50–.59 poor; below .50 unacceptable.", "hint": "Find the band that .75 falls into."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A teacher gives Form A of a vocabulary test, and immediately afterward gives Form B, a different but equivalent version, to the same class. The correlation between the forms mainly reflects error due to:", "opts": ["Time sampling", "Scorer differences", "Item (content) sampling", "Restriction of range"], "ans": 2, "why": "Alternate/parallel forms given IMMEDIATELY mainly capture CONTENT (item) sampling error: differences due to the specific items on each form. Delayed alternate forms capture both time AND content sampling error. Scorer differences are captured by inter-rater reliability.", "hint": "No time passed, so what differs between the two forms?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "When establishing parallel-forms reliability, half the group takes Form A then Form B, while the other half takes Form B then Form A. This technique is used to control:", "opts": ["Carryover effects (counterbalancing)", "Scorer drift", "Construct underrepresentation", "Restriction of range"], "ans": 0, "why": "Counterbalancing uses different sequences for different groups to avoid carryover effects (practice, fatigue) when two forms are administered.", "hint": "Why would you switch the order for half the group?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Liza's observed score is 110 on a test with an SEM of 5. What is the 68% confidence interval for her true score?", "opts": ["108 to 112", "95 to 125", "105 to 115", "100 to 120"], "ans": 2, "why": "68% ≈ ±1 SEM: 110 − 5 = 105 and 110 + 5 = 115. The 95% interval would be ±2 SEM (100 to 120), and about 99% would be ±3 SEM (95 to 125).", "hint": "68% corresponds to one SEM on each side."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Job applicants complain that a 'sales aptitude' test full of abstract geometry puzzles 'has nothing to do with selling,' and some refuse to take it seriously, even though it predicts sales well. The test is weak in:", "opts": ["Predictive validity", "Content validity as rated by SMEs", "Face validity", "Inter-rater reliability"], "ans": 2, "why": "Face validity = whether the test APPEARS to measure what it claims, from the test taker's view. Low face validity can hurt motivation and cooperation even when the test is statistically valid.", "hint": "The problem is how the test looks to the people taking it."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A researcher has 40 personality items and no preconceived idea of how many dimensions they measure. She runs an analysis to discover the underlying structure. Which approach fits?", "opts": ["Known-groups method", "Multitrait-multimethod matrix", "Exploratory factor analysis", "Confirmatory factor analysis"], "ans": 2, "why": "EFA is 'theory-generating': it explores the factor structure when there's no prior hypothesis about how many factors exist or which items belong where. CFA tests a structure that is already hypothesized.", "hint": "There's no hypothesis yet about the structure."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A scree plot shows eigenvalues dropping sharply up to the third factor and then leveling off. Using the scree test, how many factors should be retained?", "opts": ["Only the first factor", "All factors with eigenvalues below 1", "All 40 factors", "Factors before the 'elbow', here about 3"], "ans": 3, "why": "The scree test (elbow method) retains the factors that appear BEFORE the elbow, the point where the curve levels off. Its limitation is subjectivity: different people may see the elbow in different places.", "hint": "Look for where the curve stops dropping sharply."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms", "q": "To build national norms, a test developer divides the population into subgroups by region, age, and socioeconomic status, then randomly samples from each subgroup in proportion to its size. This sampling method is:", "opts": ["Incidental (convenience) sampling", "Purposive sampling", "Snowball sampling", "Stratified-random sampling"], "ans": 3, "why": "Stratified-random sampling = sampling randomly from each subgroup (stratum) so the sample represents the population's makeup. Purposive = deliberately choosing people with specific characteristics. Convenience = whoever is accessible.", "hint": "The population is split into subgroups first."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Accepting Tests", "q": "A Philippine clinic must choose a depression inventory for Filipino adult outpatients. Test A has α = .92 but was normed only on U.S. college students. Test B has α = .84 and was normed on a representative sample of Filipino adults. Which is the better choice, and why?", "opts": ["Test A, because U.S. norms are more scientific", "Neither, because alpha must be exactly 1.00", "Test B, because its norms are directly referable to the client population and its reliability is still good", "Test A, because a higher alpha always means a better test"], "ans": 2, "why": "The Code requires tests that are reliable, valid, and have normative data DIRECTLY REFERABLE to the client population. .84 is still 'good' reliability, but comparing Filipino adults with U.S. college-student norms would make the interpretation inaccurate. Higher reliability alone doesn't win.", "hint": "Reliability isn't the only thing to check. Who was each test normed on?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Accepting Tests", "q": "A company is considering a selection test whose test-retest reliability is .62. Based on the usual guidelines, how should this be judged?", "opts": ["It may have limited applicability (below .70), so it shouldn't be relied on for high-stakes hiring decisions", "Reliability doesn't matter for selection tests", "Good reliability, fine for any decision", "Excellent reliability"], "ans": 0, "why": "Reliability guide: .90+ excellent; .80–.89 good; .70–.79 adequate; below .70 may have limited applicability. For high-stakes decisions, an unreliable test means too much error in each applicant's score.", "hint": "Where does .62 fall on the reliability scale?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Accepting Tests", "q": "A test publisher shows that its new leadership test is extremely reliable (α = .95) but offers no evidence that its scores relate to actual leadership performance. What should a careful test user conclude?", "opts": ["High reliability proves the test is valid", "The test is valid because it is consistent", "Validity only matters for intelligence tests", "Reliability is necessary but not sufficient; without validity evidence the test shouldn't be used for leadership decisions"], "ans": 3, "why": "A test can be consistent yet consistently measure the WRONG thing. Reliability is a precondition for validity, not proof of it. Before using a test for decisions, you need validity evidence (criterion-related, construct, or content).", "hint": "Consistent and accurate aren't the same thing."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Interpreting Scores", "q": "On the WISC-V, a child's Verbal Comprehension index is 105 and her Visual-Spatial index is 99. Before telling the parents she is 'stronger verbally,' what should the psychologist check?", "opts": ["Whether the 6-point difference exceeds what measurement error alone could produce (standard error of the difference)", "Nothing, because any difference is meaningful", "Whether both scores are above 100", "Only the child's grades in school"], "ans": 0, "why": "The standard error of the difference tells how large a difference between two scores must be before it's considered statistically significant. Small gaps may just be measurement error, so the Code warns against interpreting results without considering reliability.", "hint": "Every score has error. Could this gap be just noise?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Interpreting Scores", "q": "On a normally distributed test, a student scores at about the 84th percentile. Approximately what z-score corresponds to this?", "opts": ["+2.0", "0", "−1.0", "+1.0"], "ans": 3, "why": "50% of scores fall below the mean, and about 34% fall between the mean and +1 SD, so 50% + 34% = 84%. The 84th percentile ≈ z = +1. The 98th percentile ≈ z = +2, and the 16th ≈ z = −1.", "hint": "Add the area below the mean to the area between the mean and one SD above it."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Interpreting Scores", "q": "A personality assessment report shows a PAI clinical scale T-score of 72. How should it generally be interpreted?", "opts": ["Exactly average for the norm group", "Below average", "A clinically significant elevation (T ≥ 70, about 2 SD above the mean)", "An invalid profile, since T-scores can't exceed 70"], "ans": 2, "why": "T-scores have mean 50 and SD 10, so 70 is 2 SD above the mean. On the PAI, T-scores of 70 or higher generally indicate clinically significant elevations. Interpretation should still consider the validity scales first.", "hint": "T-scores have mean 50 and SD 10. How far above is 72?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Utility", "q": "A firm wants to know how much a valid test will actually improve its hiring decisions. Which combination of conditions makes a valid test MOST useful?", "opts": ["A low selection ratio (few openings, many applicants) and a moderate base rate", "A validity coefficient of zero", "A base rate of 100% (everyone would succeed anyway)", "A selection ratio of 1.00 (hiring everyone who applies)"], "ans": 0, "why": "A test adds the most utility when the company can be selective (LOW selection ratio) and when success isn't already guaranteed or impossible (moderate base rate). If you hire everyone, or everyone would succeed anyway, the test adds little. These are the inputs to the Taylor-Russell tables.", "hint": "When does a test actually change who gets hired?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Classical Test Theory", "q": "In a hypothetical classical-test-theory example, Lea's true score is 72 but her observed score is 69. What is the error component for that observation?", "opts": ["72", "+3", "69", "-3"], "ans": 3, "why": "Using X = T + E, the error is E = 69 - 72 = -3. The magnitude is 3, but a positive sign would imply that error raised rather than lowered the observed score.", "hint": "Keep the direction of the difference when rearranging the equation."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Under classical test theory, a test has reliability .76 in a particular group. What proportion of observed-score variance is attributed to error in that group?", "opts": ["76%", "87.18%", "24%", "57.76%"], "ans": 2, "why": "Reliability is the proportion of observed variance attributed to true-score variance, leaving 1 - .76 = .24 for error. Squaring .76 would confuse this variance-ratio definition with a separate use of squared correlations.", "hint": "The two variance components must account for the whole observed variance."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Measurement Error", "q": "A scoring spreadsheet mistakenly adds five points to every examinee's total on every administration. Which kind of error is most directly illustrated?", "opts": ["Item-sampling fluctuation", "Random error", "Systematic error", "Temporary test-taker fatigue"], "ans": 2, "why": "A constant offset is systematic error because it biases scores in the same direction. Random error involves unpredictable fluctuations rather than the same five-point addition every time.", "hint": "Compare a repeatable directional shift with unpredictable variation."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Measurement Error", "q": "Unpredictable bursts of construction noise distract different examinees at different moments, making their scores less consistent. Which source of error should the testing center reduce?", "opts": ["Random environmental error", "A constant scoring offset", "Deliberate content underrepresentation", "A fixed reference-group conversion"], "ans": 0, "why": "Unpredictable noise can contribute random error through the testing environment. A constant scoring offset is systematic and would affect scores in a repeatable way rather than fluctuating by moment and examinee.", "hint": "Consider whether the disturbance affects everyone in the same consistent way."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability Improvement", "q": "Essay scores vary greatly depending on which examiner marks them, even though the same completed essays are used. Which improvement most directly targets the identified error?", "opts": ["Train scorers to apply explicit scoring criteria consistently", "Add unrelated topics to broaden the essay prompts", "Replace the norm sample with a larger regional sample", "Lengthen the interval before the students retake the test"], "ans": 0, "why": "Subjective scoring can contribute scorer error, so clearer criteria and scorer training directly address disagreement about the same responses. A longer retest interval changes time-related conditions rather than how those essays are scored.", "hint": "Locate the variation in the measurement process before choosing the remedy."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability Interpretation", "q": "A state-anxiety measure shows low January-to-June stability while students' actual stress circumstances change substantially. Which interpretation is most careful?", "opts": ["The measure must be unsuitable because every psychological attribute is stable", "The low correlation may partly reflect real change in the state being measured", "The result alone proves that the items lack content validity", "The result establishes perfect consistency within each administration"], "ans": 1, "why": "Test-retest evidence is most straightforward for relatively stable attributes. A changing state can produce genuinely different scores, so low temporal stability alone does not identify poor measurement as the sole cause.", "hint": "Ask whether the attribute should have remained unchanged across the interval."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability Designs", "q": "The same examinees take Form A in March and an equivalent Form B in July. Which sources of variation are included in the resulting delayed alternate-form reliability estimate?", "opts": ["Both time sampling and content sampling", "Neither time nor content sampling", "Scorer disagreement only, because two forms are used", "Content sampling only, because the forms differ"], "ans": 0, "why": "Delayed alternate-form designs change both the occasion and the sampled items. An immediate alternate-form design more narrowly addresses form or content differences without the same interval-related variation.", "hint": "Identify both features of the measurement that changed between sessions."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Parallel and Alternate Forms", "q": "Two forms cover the same material and difficulty range, but the publisher has not established the strict statistical equivalence required of parallel forms. Which label is more defensible?", "opts": ["The same form administered twice", "Two halves of one administration", "Strictly parallel forms demonstrated by similar content alone", "Alternate forms intended to be equivalent"], "ans": 3, "why": "Alternate forms can be designed to be equivalent without meeting the stricter requirements for parallel forms. Similar content alone does not demonstrate the required statistical equivalence.", "hint": "Distinguish an intention to match forms from evidence that the strict conditions are met."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Internal Consistency", "q": "A broad battery deliberately samples several different abilities and has a lower overall internal-consistency coefficient than a narrow single-trait scale. What should the reviewer examine before rejecting it?", "opts": ["Whether matching the narrow scale's alpha should override content coverage", "Whether alpha alone establishes suitability for every ability in the battery", "Whether the coefficient difference alone proves a particular factor structure", "Whether separate domain evidence better matches its purpose than one overall coefficient"], "ans": 3, "why": "Heterogeneous content may yield lower internal consistency than homogeneous content. The intended construct coverage matters; forcing every item to repeat one dimension could undermine the battery's broader purpose.", "hint": "Ask what the instrument is designed to cover before demanding that all items behave alike."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Standard Error of Measurement", "q": "A report needs an index of uncertainty around one person's observed test score rather than a description of how spread out the group's scores are. Which index is directly relevant?", "opts": ["Percentile rank of the median", "Standard deviation of the norm group", "Mean of the standardization sample", "Standard error of measurement"], "ans": 3, "why": "The SEM estimates measurement error associated with an individual's observed score. The group's standard deviation describes score dispersion and is not itself the same estimate of individual measurement uncertainty.", "hint": "Separate uncertainty in one measurement from variation among different people."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Confidence Intervals", "q": "Keeping an observed score and SEM unchanged, an examiner moves from an approximate 68% interval to an approximate 95% interval. What happens to the interval?", "opts": ["It becomes narrower because greater confidence means less spread", "It becomes wider because a larger SEM multiplier is used", "Its center shifts upward by one SEM", "Its width remains unchanged because the observed score is fixed"], "ans": 1, "why": "The approximate intervals use one SEM on each side at 68% and two SEMs on each side at 95%. Greater coverage widens the interval around the same observed-score center rather than moving that center.", "hint": "Compare the multipliers needed to cover more of the error distribution."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Planning Reliability", "q": "A developer wants to estimate how changing the number of comparable items would affect reliability before lengthening a test. Which tool addresses this planning question?", "opts": ["Percentile-rank conversion", "Spearman-Brown prophecy formula", "Coefficient of determination", "Lawshe content-validity ratio"], "ans": 1, "why": "The Spearman-Brown approach can estimate reliability after a test is lengthened or shortened with comparable items. A content-validity ratio concerns experts' essentiality judgments rather than predicting the effect of test length.", "hint": "The question concerns a planned change in test length, not a new norm or content judgment."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Content Validity", "q": "Nine of twelve experts rate an item as highly relevant on a four-point relevance scale. What is the item's content validity index, I-CVI?", "opts": ["1.33", ".75", ".25", ".50"], "ans": 1, "why": "I-CVI is the proportion rating the item highly relevant, so 9/12 = .75. Lawshe's CVR uses a different essentiality judgment and a different formula; it should not be substituted here.", "hint": "Check whether the index requested is a simple proportion or an essentiality ratio."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Content Validity", "q": "An item's Lawshe CVR is negative. Without treating this as the whole validity decision, what does the sign indicate about the panel's essentiality judgments?", "opts": ["Exactly half rated the item essential", "Fewer than half rated the item essential", "More than half rated the item essential", "Every expert rated the item highly relevant"], "ans": 1, "why": "A CVR of zero corresponds to half the panel judging the item essential; a negative value places the essential count below half. This is not the same as an I-CVI relevance proportion, which cannot be negative.", "hint": "Use the point at which the essentiality ratio equals zero as your reference."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Local Validation", "q": "A clinic substantially changes an inventory's language and instructions for a new client population. What evidence should it seek before assuming the earlier validation applies unchanged?", "opts": ["Only confirmation that the translated version has the same item count", "Only the original test's cover-page description", "Only a new internal-consistency value from an unrelated population", "Local validation evidence for the adapted version and intended population"], "ans": 3, "why": "Local validation is important when language,
