ility, Validity, Norms", "topic": "Validity", "q": "A researcher has 40 personality items and no preconceived idea of how many dimensions they measure. She runs an analysis to discover the underlying structure. Which approach fits?", "opts": ["Known-groups method", "Multitrait-multimethod matrix", "Exploratory factor analysis", "Confirmatory factor analysis"], "ans": 2, "why": "EFA is 'theory-generating': it explores the factor structure when there's no prior hypothesis about how many factors exist or which items belong where. CFA tests a structure that is already hypothesized.", "hint": "There's no hypothesis yet about the structure."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A scree plot shows eigenvalues dropping sharply up to the third factor and then leveling off. Using the scree test, how many factors should be retained?", "opts": ["All factors with eigenvalues below 1", "Factors before the 'elbow', here about 3", "All 40 factors", "Only the first factor"], "ans": 1, "why": "The scree test (elbow method) retains the factors that appear BEFORE the elbow, the point where the curve levels off. Its limitation is subjectivity: different people may see the elbow in different places.", "hint": "Look for where the curve stops dropping sharply."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms", "q": "To build national norms, a test developer divides the population into subgroups by region, age, and socioeconomic status, then randomly samples from each subgroup in proportion to its size. This sampling method is:", "opts": ["Purposive sampling", "Incidental (convenience) sampling", "Stratified-random sampling", "Snowball sampling"], "ans": 2, "why": "Stratified-random sampling = sampling randomly from each subgroup (stratum) so the sample represents the population's makeup. Purposive = deliberately choosing people with specific characteristics. Convenience = whoever is accessible.", "hint": "The population is split into subgroups first."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Accepting Tests", "q": "A Philippine clinic must choose a depression inventory for Filipino adult outpatients. Test A has α = .92 but was normed only on U.S. college students. Test B has α = .84 and was normed on a representative sample of Filipino adults. Which is the better choice, and why?", "opts": ["Test A, because a higher alpha always means a better test", "Test B, because its norms are directly referable to the client population and its reliability is still good", "Test A, because U.S. norms are more scientific", "Neither, because alpha must be exactly 1.00"], "ans": 1, "why": "The Code requires tests that are reliable, valid, and have normative data DIRECTLY REFERABLE to the client population. .84 is still 'good' reliability, but comparing Filipino adults with U.S. college-student norms would make the interpretation inaccurate. Higher reliability alone doesn't win.", "hint": "Reliability isn't the only thing to check. Who was each test normed on?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Accepting Tests", "q": "A company is considering a selection test whose test-retest reliability is .62. Based on the usual guidelines, how should this be judged?", "opts": ["It may have limited applicability (below .70), so it shouldn't be relied on for high-stakes hiring decisions", "Excellent reliability", "Reliability doesn't matter for selection tests", "Good reliability, fine for any decision"], "ans": 0, "why": "Reliability guide: .90+ excellent; .80–.89 good; .70–.79 adequate; below .70 may have limited applicability. For high-stakes decisions, an unreliable test means too much error in each applicant's score.", "hint": "Where does .62 fall on the reliability scale?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Accepting Tests", "q": "A test publisher shows that its new leadership test is extremely reliable (α = .95) but offers no evidence that its scores relate to actual leadership performance. What should a careful test user conclude?", "opts": ["The test is valid because it is consistent", "Validity only matters for intelligence tests", "High reliability proves the test is valid", "Reliability is necessary but not sufficient; without validity evidence the test shouldn't be used for leadership decisions"], "ans": 3, "why": "A test can be consistent yet consistently measure the WRONG thing. Reliability is a precondition for validity, not proof of it. Before using a test for decisions, you need validity evidence (criterion-related, construct, or content).", "hint": "Consistent and accurate aren't the same thing."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Interpreting Scores", "q": "On the WISC-V, a child's Verbal Comprehension index is 105 and her Visual-Spatial index is 99. Before telling the parents she is 'stronger verbally,' what should the psychologist check?", "opts": ["Nothing, because any difference is meaningful", "Whether both scores are above 100", "Whether the 6-point difference exceeds what measurement error alone could produce (standard error of the difference)", "Only the child's grades in school"], "ans": 2, "why": "The standard error of the difference tells how large a difference between two scores must be before it's considered statistically significant. Small gaps may just be measurement error, so the Code warns against interpreting results without considering reliability.", "hint": "Every score has error. Could this gap be just noise?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Interpreting Scores", "q": "On a normally distributed test, a student scores at about the 84th percentile. Approximately what z-score corresponds to this?", "opts": ["−1.0", "+1.0", "+2.0", "0"], "ans": 1, "why": "50% of scores fall below the mean, and about 34% fall between the mean and +1 SD, so 50% + 34% = 84%. The 84th percentile ≈ z = +1. The 98th percentile ≈ z = +2, and the 16th ≈ z = −1.", "hint": "Add the area below the mean to the area between the mean and one SD above it."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Interpreting Scores", "q": "A personality assessment report shows a PAI clinical scale T-score of 72. How should it generally be interpreted?", "opts": ["Below average", "Exactly average for the norm group", "An invalid profile, since T-scores can't exceed 70", "A clinically significant elevation (T ≥ 70, about 2 SD above the mean)"], "ans": 3, "why": "T-scores have mean 50 and SD 10, so 70 is 2 SD above the mean. On the PAI, T-scores of 70 or higher generally indicate clinically significant elevations. Interpretation should still consider the validity scales first.", "hint": "T-scores have mean 50 and SD 10. How far above is 72?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Utility", "q": "A firm wants to know how much a valid test will actually improve its hiring decisions. Which combination of conditions makes a valid test MOST useful?", "opts": ["A base rate of 100% (everyone would succeed anyway)", "A low selection ratio (few openings, many applicants) and a moderate base rate", "A validity coefficient of zero", "A selection ratio of 1.00 (hiring everyone who applies)"], "ans": 1, "why": "A test adds the most utility when the company can be selective (LOW selection ratio) and when success isn't already guaranteed or impossible (moderate base rate). If you hire everyone, or everyone would succeed anyway, the test adds little. These are the inputs to the Taylor-Russell tables.", "hint": "When does a test actually change who gets hired?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "IQ scores have equal intervals between values but no true zero point (an IQ of 0 doesn't mean 'no intelligence'). On what scale of measurement are they?", "opts": ["Nominal", "Ordinal", "Ratio", "Interval"], "ans": 3, "why": "Interval = ordered, equal intervals, NO absolute zero (IQ, Celsius, calendar years). Ratio adds a true zero (height, weight, reaction time, Kelvin). Ordinal = ranked but unequal gaps. Nominal = categories only.", "hint": "Equal gaps between values, but zero isn't 'none of it'."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher measures participants' reaction times in milliseconds. On what scale is reaction time measured?", "opts": ["Ordinal", "Ratio", "Nominal", "Interval"], "ans": 1, "why": "Reaction time has equal intervals AND a true zero (0 ms = no time elapsed), so it's ratio data. You can say 400 ms is twice as long as 200 ms, which you can only do on a ratio scale.", "hint": "Does 0 ms mean truly 'no time at all'?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Monthly household incomes in a barangay survey are extremely skewed because of a few very wealthy families. Which measure of central tendency best represents the typical household?", "opts": ["Range", "Median", "Mode", "Mean"], "ans": 1, "why": "For skewed interval/ratio data, use the MEDIAN, because the mean gets pulled toward the extreme values. Mean = interval/ratio data that's roughly normal; mode = nominal data. Range measures variability, not central tendency.", "hint": "Which average ignores how extreme the richest families are?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A professor gives an extremely difficult exam. Most students score low and only a few score high. The distribution is:", "opts": ["Mesokurtic", "Negatively skewed (mean < median < mode)", "Positively skewed (mean > median > mode)", "Perfectly normal"], "ans": 2, "why": "POSITIVE skew = relatively few scores at the HIGH end, with the tail pointing right. This is typical of a DIFFICULT test, and mean > median > mode. NEGATIVE skew = few scores at the low end (an EASY test).", "hint": "Where do the few unusual scores sit? The tail points toward them."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "On a very easy quiz, almost everyone scores high and only a few students score low. The distribution is:", "opts": ["Negatively skewed", "Platykurtic", "Bimodal", "Positively skewed"], "ans": 0, "why": "Easy test → most scores pile up high, and the few low scores form a tail to the LEFT = negative skew (mean < median < mode).", "hint": "Where is the tail: among the high scores or the low scores?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A test taker's z-score is −1.5. What is her equivalent T-score?", "opts": ["65", "45", "35", "15"], "ans": 2, "why": "T = 50 + 10(z) = 50 + 10(−1.5) = 50 − 15 = 35. T-scores have a mean of 50 and an SD of 10. A negative z means below the mean, so the T-score must be below 50.", "hint": "T-scores have mean 50 and SD 10. A negative z puts her below 50."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "In a normal distribution, approximately what percentage of scores fall between one standard deviation below and one standard deviation above the mean?", "opts": ["95%", "34%", "50%", "68%"], "ans": 3, "why": "About 34% lie between the mean and +1 SD, and another 34% between the mean and −1 SD, so 68% fall within ±1 SD. About 95% fall within ±2 SD and about 99.7% within ±3 SD.", "hint": "Add the area on both sides of the mean, one SD each way."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher compares the exam scores of a tutored group and a separate untutored group. Scores are interval and normally distributed. Which test should she use?", "opts": ["Mann-Whitney U test", "Chi-square test of independence", "Paired (dependent) t-test", "Independent samples t-test"], "ans": 3, "why": "Two separate, unrelated groups + normal interval/ratio data → independent samples t-test. If the data were skewed or ordinal, its nonparametric equivalent is Mann-Whitney U. A paired t-test is for the SAME people measured twice.", "hint": "How many groups, are they the same people, and is the data normal?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "The same researcher compares tutored vs. untutored students again, but this time the outcome is a Likert-type satisfaction rating and the scores are badly skewed. Which test fits now?", "opts": ["Wilcoxon signed-rank test", "Mann-Whitney U test", "Independent samples t-test", "Friedman test"], "ans": 1, "why": "Mann-Whitney U is the nonparametric equivalent of the independent samples t-test, used for ordinal or non-normal data from two independent groups. Wilcoxon signed-rank is for two RELATED (paired) samples.", "hint": "It's still two separate groups, but the data is no longer normal."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Stress levels of the same 30 students are measured before and after their board exam. The difference scores are normally distributed. Which test should be used?", "opts": ["One-way ANOVA", "Independent samples t-test", "Kruskal-Wallis H test", "Paired (dependent) t-test"], "ans": 3, "why": "Same group measured twice (pre and post) = dependent/paired design → paired t-test. If the difference scores were not normal, you'd use the Wilcoxon signed-rank test.", "hint": "Is this two different groups, or the same people measured twice?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "One group of participants rates their mood (an ordinal rating) at three time points: morning, afternoon, and evening. Which nonparametric test compares the three conditions?", "opts": ["Kruskal-Wallis H test", "Friedman test", "Mann-Whitney U test", "Chi-square goodness of fit"], "ans": 1, "why": "Friedman = nonparametric test for ONE group measured across 3+ conditions (the counterpart of repeated measures ANOVA). Kruskal-Wallis = 3+ INDEPENDENT groups (the counterpart of one-way ANOVA).", "hint": "Same people, three or more measurements, ranked data."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher wants to know whether sex (male/female) is related to preferred counseling format (face-to-face, online, group). The data are frequency counts. Which test fits?", "opts": ["Chi-square test of independence", "Independent samples t-test", "Chi-square goodness of fit", "Pearson r"], "ans": 0, "why": "Two categorical variables in a contingency table → chi-square test of INDEPENDENCE. Goodness of fit is for ONE categorical variable compared against an expected distribution. Chi-square needs raw counts, not percentages.", "hint": "Count how many categorical variables are involved."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A chi-square test of independence uses a contingency table with 3 rows and 4 columns. What are its degrees of freedom?", "opts": ["5", "6", "12", "7"], "ans": 1, "why": "df = (r − 1)(c − 1) = (3 − 1)(4 − 1) = 2 × 3 = 6. For goodness of fit, df = k − 1.", "hint": "Subtract one from the rows and one from the columns, then multiply."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A one-way ANOVA comparing four teaching methods is significant. The groups have equal sizes and equal variances, and the researcher wants to compare all possible pairs of groups. Which post hoc test is ideal?", "opts": ["Dunnett's test", "Tukey's HSD", "Games-Howell test", "Dunn's test"], "ans": 1, "why": "Tukey's HSD = all pairwise comparisons when variances and group sizes are equal. Dunnett's = compares each treatment ONLY against one control group. Games-Howell = when variances are UNEQUAL (Levene's test is significant). Dunn's = follow-up to Kruskal-Wallis.", "hint": "All pairs, with every assumption met."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "In a drug trial, three dosage groups are each compared only against a single placebo control group after a significant ANOVA. Which post hoc test is designed for this?", "opts": ["Nemenyi test", "Tukey's HSD", "Scheffé's test", "Dunnett's test"], "ans": 3, "why": "Dunnett's test compares multiple treatment groups against ONE control/benchmark group only. It reduces the comparisons from k(k−1)/2 to k − 1, which preserves power.", "hint": "Everything is compared with one special group."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A correlation of r = .60 is found between study hours and exam scores. What percentage of the variance in exam scores is accounted for by study hours?", "opts": ["36%", "60%", "40%", "64%"], "ans": 0, "why": "The coefficient of determination = r² = .60² = .36, so 36% of the variance is explained. The remaining 64% (1 − r²) is the coefficient of alienation: variance NOT accounted for.", "hint": "Square the correlation."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher correlates sex (a true dichotomy: male/female) with scores on an interval-level anxiety scale. Which correlation coefficient is appropriate?", "opts": ["Point-biserial", "Biserial", "Tetrachoric", "Phi coefficient"], "ans": 0, "why": "Point-biserial = TRUE dichotomy + interval/ratio. Biserial = ARTIFICIAL dichotomy (e.g., pass/fail created from a score) + interval/ratio. Phi = two dichotomies (true or artificial) in a 2×2 table. Tetrachoric = two artificial dichotomies.", "hint": "Is the two-category variable naturally two categories, or made that way by a cutoff?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Before running a t-test, a researcher checks normality with the Shapiro-Wilk test and gets p = .21. What should she conclude?", "opts": ["The data are not normally distributed", "She must use a nonparametric test", "The result is statistically significant, so normality is violated", "The normality assumption is met (fail to reject H0)"], "ans": 3, "why": "In normality testing, H0 says the data ARE normal. p > .05 means fail to reject H0, so normality is assumed. Unlike most tests, here a NON-significant result is the outcome you want.", "hint": "In normality tests, what does the null hypothesis claim?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher plans 5 pairwise comparisons and wants to keep the familywise alpha at .05 using the Bonferroni correction. What alpha should each comparison use?", "opts": [".25", ".001", ".05", ".01"], "ans": 3, "why": "Bonferroni: α adjusted = α / k = .05 / 5 = .01. It controls the inflated Type I error risk from running many tests, but becomes very conservative as k grows.", "hint": "Divide the overall alpha by the number of comparisons."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Research Design", "q": "A school psychologist wants to test whether a new study-skills program raises grades, but she must use two existing class sections and cannot randomly assign students. Which design is this?", "opts": ["True experimental design", "Correlational design", "Quasi-experimental design", "Cross-sectional design"], "ans": 2, "why": "Quasi-experimental = infers cause and effect when random assignment isn't feasible, using intact groups. A true experiment requires random assignment. Correlational designs don't manipulate anything.", "hint": "What's missing compared to a true experiment?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher compares Likert-scale satisfaction ratings (ordinal) across THREE independent groups: freshmen, sophomores, and juniors. Which nonparametric test should she use?", "opts": ["Wilcoxon signed-rank test", "Mann-Whitney U test", "Kruskal-Wallis H test", "Friedman test"], "ans": 2, "why": "Kruskal-Wallis H = the nonparametric counterpart of one-way ANOVA, for 3+ INDEPENDENT groups. Friedman is for ONE group measured 3+ times. Mann-Whitney is for only two independent groups.", "hint": "How many groups, and are they different people?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Before a post hoc analysis, Levene's test is significant (p = .01), meaning the group variances are unequal. Which pairwise post hoc test is the standard choice?", "opts": ["Tukey's HSD", "Games-Howell test", "Dunnett's test", "Scheffé's test"], "ans": 1, "why": "When Levene's test is significant, homogeneity of variance is violated and Tukey or Scheffé become invalid. Games-Howell doesn't require equal variances or equal group sizes.", "hint": "Which test was designed for unequal variances?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Ten clients rate their anxiety before and after a mindfulness workshop. The difference scores are badly skewed. Which test compares the two conditions?", "opts": ["Mann-Whitney U test", "Paired t-test", "Kruskal-Wallis H test", "Wilcoxon signed-rank test"], "ans": 3, "why": "Wilcoxon signed-rank = the nonparametric counterpart of the paired t-test: the same people measured twice when the difference scores aren't normal. Mann-Whitney is for two INDEPENDENT groups.", "hint": "Same people, two times, non-normal data."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Test Development", "q": "A developer creating national norms for a new aptitude test gives it to 2,000 examinees selected to match the country's population by region, age, sex, and education. This step is called:", "opts": ["Item analysis", "Pilot testing with known groups", "Standardization (norming) with a representative sample", "Cross-validation"], "ans": 2, "why": "Standardization = administering the test to a REPRESENTATIVE sample to establish norms. Matching the sample to the population (e.g., through stratified sampling) makes the norms trustworthy for interpreting individual scores.", "hint": "Giving the test to a sample that mirrors the population."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Test Development", "q": "To check whether the items of a new 'workplace resilience' scale cluster into the three dimensions the theory predicts, the developer analyzes the item intercorrelations. Which statistical method is she using, and for what purpose?", "opts": ["Factor analysis, as evidence of construct validity", "t-test, as evidence of content validity", "Chi-square test, as evidence of reliability", "Kappa, as evidence of inter-rater reliability"], "ans": 0, "why": "Factor analysis identifies the underlying dimensions (factors) among items. Confirming the theory's predicted structure is evidence of CONSTRUCT validity. Here she's testing a predicted structure, so confirmatory factor analysis fits.", "hint": "Items clustering into dimensions."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Development", "q": "A developer wants the final version of her test to have 50 items. As a rule of thumb, about how many items should the first draft of the item pool contain?", "opts": ["About 50", "About 100", "About 60", "About 500"], "ans": 1, "why": "It's usually advisable for the first draft to contain about TWICE the number of items the final version will have, since many will be dropped after tryout and item analysis.", "hint": "Expect to throw out a lot of items after tryout."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Development", "q": "For a 40-item test, roughly how many people should be in the tryout sample according to the informal rule of thumb?", "opts": ["40 to 80", "200 to 400", "At least 1,000", "20 to 40"], "ans": 1, "why": "Rule of thumb: no fewer than 5 and preferably up to 10 subjects per item. 40 items × 5–10 = 200–400. Too few subjects risks 'phantom factors' (artifacts of small samples) in factor analysis.", "hint": "Multiply the number of items by the subjects-per-item rule."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "On a 120-examinee tryout, 102 people answer Item 7 correctly. Its item-difficulty index (p) is .85. How should the item be described?", "opts": ["Average", "Difficult", "Very easy", "Very difficult"], "ans": 2, "why": "p = proportion who answered correctly; the HIGHER the p, the EASIER the item. Ranges: .80–1.00 very easy; .61–.79 easy; .40–.60 average; .20–.39 difficult; .00–.19 very difficult.", "hint": "For p, a bigger number means more people got it right."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "For a four-option multiple-choice item, the chance (guessing) score is .25. Using the 'midpoint' rule, what is the optimal item difficulty?", "opts": [".875", ".50", ".25", ".625"], "ans": 3, "why": "Optimal difficulty = (1.0 + chance) / 2 = (1 + .25) / 2 = .625. The reviewer adds that a value slightly higher, around .74, is often cited for four-option items.", "hint": "Find the point halfway between pure guessing and a perfect score."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "In the upper-scoring group (n = 40), 24 examinees answered an item correctly. In the lower-scoring group (n = 40), 8 did. What is the item-discrimination index d, and how good is the item?", "opts": ["d = .80, a very good item", "d = .40, a poor item", "d = .40, a very good item", "d = .16, a poor item"], "ans": 2, "why": "d = (RH − RL) / n = (24 − 8) / 40 = 16 / 40 = .40. A d of .40 and above = very good item; .30–.39 good; .20–.29 fair; below .20 poor.", "hint": "Subtract the low group's correct count from the high group's, then divide by one group's size."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "An item is answered correctly by MORE low scorers than high scorers, giving a negative discrimination index. What should the developer do?", "opts": ["Revise or discard the item", "Move it to the start of the test", "Use it as an anchor item", "Keep it because it is very difficult"], "ans": 0, "why": "A good item is answered correctly by high scorers on the test as a whole. A negative d means the item works backwards: it may be ambiguous, miskeyed, or misleading. It should be rewritten or dropped.", "hint": "A good item is answered correctly more by high scorers."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "An attitude scale's items run from mild to strong ('I would work beside a person with depression' up to 'I would marry a person with depression'), so agreeing with a strong item implies agreement with the milder ones. This is a:", "opts": ["Guttman scale", "Semantic differential scale", "Stapel scale", "Likert scale"], "ans": 0, "why": "A Guttman scale arranges items sequentially from WEAKER to STRONGER expressions of the attitude. Likert = degree of agreement with independent statements. Semantic differential = bipolar adjectives.", "hint": "Notice how the statements are ordered."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "Respondents rate 'My workplace' on a 7-point scale anchored by opposite adjectives, such as Cold–Warm and Weak–Strong. This item format is a:", "opts": ["Semantic differential scale", "Likert scale", "Visual analogue scale", "Thurstone scale"], "ans": 0, "why": "Semantic differential = a 7-point scale bounded by BIPOLAR adjectives. Likert measures agree/disagree with statements. Thurstone uses judges' scale values (equal-appearing intervals). A visual analogue scale is a continuous 100 mm line.", "hint": "Look at what sits at each end of the scale."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A panel of expert judges assigns each attitude statement a scale value so that intervals between statements are equal across the continuum. Respondents then endorse statements they agree with. This is the:", "opts": ["Guttman scale", "Likert scale", "Q-sort technique", "Thurstone scale (method of equal-appearing intervals)"], "ans": 3, "why": "Thurstone's method of equal-appearing intervals uses expert judges to assign scale values to statements. The phrase 'equal-appearing intervals' points straight to Thurstone.", "hint": "Expert judges assign values with equal-appearing distances."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A personality test presents pairs of statements matched for social desirability, and the respondent must choose the one more like her. Scores show the relative strength of traits within the person. This scaling approach is:", "opts": ["Non-comparative scaling", "Absolute scaling", "Visual analogue scaling", "Forced-choice (ipsative) scaling"], "ans": 3, "why": "Forced-choice items yield IPSATIVE scores: choices are interdependent, so scores reflect relative strengths within one person rather than comparison with others. The EPPS uses this format to reduce faking good.", "hint": "Choosing one option means not choosing the other. What kind of score does that produce?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "To set a passing score for a licensure exam, expert judges estimate, item by item, the proportion of 'minimally competent' candidates who would answer correctly, and these estimates are summed. This is the:", "opts": ["Angoff method", "Method of predictive yield", "Known-groups method", "Bookmark method"], "ans": 0, "why": "Angoff = judges estimate the proportion of minimally competent candidates answering each item correctly; the sum forms the cut score. Bookmark = judges place a bookmark in a booklet of items ordered by IRT difficulty.", "hint": "Judges rate each item one at a time, imagining a barely-passing candidate."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "On a test of advanced math, many gifted students all earn the maximum score, so the test cannot distinguish among them. This is a(n):", "opts": ["Halo effect", "Ceiling effect", "Practice effect", "Floor effect"], "ans": 1, "why": "Ceiling effect = the test can't measure the HIGH end of ability because too many people max out. Floor effect = the test can't distinguish people at the LOW end. Computerized adaptive testing helps reduce both.", "hint": "Everyone is stuck at the top of the scale."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "An item reads: 'I feel anxious and depressed at work.' What item-writing guideline does it violate?", "opts": ["It uses an absolute qualifier", "Its reading level is too low", "It is double-barreled", "It uses a double negative"], "ans": 2, "why": "A double-barreled item combines two distinct ideas (anxiety AND depression) into one. A person who is anxious but not depressed can't answer it accurately. Each item should target a single construct.", "hint": "How many different feelings is the item asking about?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A developer deliberately writes some items in the negative direction ('I rarely feel confident') so that a person who agrees with everything won't get a misleadingly high score. This controls for:", "opts": ["Acquiescence response set", "Ceiling effect", "Item branching", "Central tendency error"], "ans": 0, "why": "Reverse/keyed scoring with negatively phrased items controls ACQUIESCENCE: the tendency to agree with items regardless of content.", "hint": "Some people agree with every statement no matter what it says."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "Boys and girls with the SAME overall level of verbal ability have very different probabilities of answering a particular item correctly. This item shows:", "opts": ["A ceiling effect", "Differential item functioning (DIF)", "Validity shrinkage", "High item reliability"], "ans": 1, "why": "DIF = an item functions differently for one group than another even when the groups have the same level of the underlying trait. It signals possible item bias. 'Same ability, different results' is the giveaway.", "hint": "The two groups are equal in ability. So what does the gap point to?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Revision", "q": "To keep scoring consistent, a publisher gives scorers a protocol scored by a highly authoritative expert as the model to follow. Months later, one scorer's scoring has gradually moved away from that model. The model protocol and the problem are:", "opts": ["Norm group; validity shrinkage", "Anchor protocol; scoring drift", "Item pool; test sophistication", "Test blueprint; observer bias"], "ans": 1, "why": "An ANCHOR protocol is scored by a highly authoritative scorer to serve as a model and resolve discrepancies. SCORING DRIFT is a discrepancy that develops between the anchor protocol's scoring and another scorer's.", "hint": "One is the model protocol; the other is a gradual change away from it."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "On a 120-examinee tryout, only 30 people answer Item 12 correctly. What is its difficulty index, and how is it classified?", "opts": ["p = .25, difficult", "p = .30, average", "p = .25, easy", "p = .75, easy"], "ans": 0, "why": "p = R / T = 30 / 120 = .25. Ranges: .20–.39 = difficult; .00–.19 = very difficult; .40–.60 = average. Remember: a low p means few got it right, so the item is hard.", "hint": "Divide the number correct by the total, then find its band."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "To set a cut score, judges look at each multiple-choice item and decide how many of the distractors a minimally competent candidate could rule out as wrong. Which standard-setting method is this?", "opts": ["Bookmark method", "Known-groups method", "Nedelsky method", "Angoff method"], "ans": 2, "why": "Nedelsky = judges evaluate the options and identify how many distractors a minimally competent candidate could eliminate on each item. Angoff = judges estimate the proportion of minimally competent candidates answering correctly.", "hint": "The judges are looking at the wrong options, not the right answer."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "In a computerized test, a student who misses an item is next given an easier item, while a student who answers correctly gets a harder one. The computer's ability to tailor the order and content of items this way is called:", "opts": ["Item fairness", "Item banking", "Item branching", "Co-validation"], "ans": 2, "why": "Item branching = the computer tailors the content and order of items based on responses to previous items. It's the core of computerized adaptive testing (CAT). An item BANK is just a large collection of test questions.", "hint": "The next item depends on the previous answer."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "A psychologist answers a court's referral question by integrating test scores, interviews with the client and family, school records, and behavioral observation into a psychological report. Compared with testing alone, this is:", "opts": ["Psychological assessment", "Psychological testing", "A cut score decision", "Psychometric soundness"], "ans": 0, "why": "ASSESSMENT gathers and INTEGRATES data from many sources (tests, interviews, observation, collateral sources) to answer a referral question. The assessor is key, and the output is a psychological report. TESTING measures variables with a test and yields a score or psychometric report.", "hint": "Count the sources of information, and notice who puts them together."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "An assessor gives a reasoning task, then teaches the child a strategy, then gives a similar task again to see how much the child can learn with help. This 'sandwich' approach is:", "opts": ["Collaborative psychological assessment", "Retrospective assessment", "Dynamic psychological assessment", "Ecological momentary assessment"], "ans": 2, "why": "Dynamic assessment = evaluation → intervention → evaluation (the 'sandwich method'). It estimates learning potential, the zone of proximal development, rather than only current performance.", "hint": "Look at the order: test, teach, test again."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "Throughout an evaluation, the assessor and client work as partners, from deciding what questions to explore all the way to the final feedback. This is:", "opts": ["Actuarial assessment", "Remote assessment", "Collaborative psychological assessment", "Dynamic psychological assessment"], "ans": 2, "why": "Collaborative assessment = assessor and assessee as 'partners' from initial contact to final feedback. Therapeutic assessment goes further, emphasizing self-discovery and new understanding throughout the process.", "hint": "Assessor and client are equal partners."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "A patient with panic disorder gets app prompts five times a day asking her to rate her anxiety and note where she is and what she's doing at that exact moment. This is:", "opts": ["Ecological momentary assessment", "Analogue study", "Psychological autopsy", "Retrospective assessment"], "ans": 0, "why": "Ecological momentary assessment = 'in the moment' evaluation of problems and related thoughts and behaviors at the very time and place they occur. Retrospective assessment looks back at a person's state at an earlier time.", "hint": "When and where is the information being collected?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Under the A/B/C classification of test user qualifications, an individually administered intelligence test or a projective test like the Rorschach is usually:", "opts": ["Level C, requiring a Registered Psychologist", "Level B, usable by any teacher", "Level A, usable with just the manual", "Unclassified"], "ans": 0, "why": "Level A = straightforward with the manual (e.g., achievement tests). Level B = needs psychometric knowledge (group intelligence tests, objective personality tests), typically RPm with supervision. Level C = highly specialized training (individual intelligence tests, projectives) = RPsy.", "hint": "Which tests need the most specialized training to interpret?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Under RA 10029, which task is within the role of a Registered Psychometrician?", "opts": ["Administering, scoring, and interpreting an objective/structured personality test like the 16PF", "Diagnosing a client with major depressive disorder", "Interpreting the Rorschach Inkblot Test", "Conducting psychotherapy"], "ans": 0, "why": "An RPm's role: administering and scoring objective and structured personality tests (excluding projective tests and other higher-level tests), interpreting those results and writing reports on them, and conducting preparatory intake interviews. Projectives, diagnosis, and psychotherapy belong to psychologists.", "hint": "RPms handle structured tests, not projectives or treatment."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Which pairing of test type and time orientation is correct?", "opts": ["Achievement measures past learning; aptitude predicts future potential", "Intelligence measures only past learning", "Aptitude tests rely only on content validity", "Achievement predicts the future; aptitude measures past learning"], "ans": 0, "why": "ACHIEVEMENT = prior/learned information (past-oriented, content validity). INTELLIGENCE = general mental ability (present-oriented). APTITUDE = potential for learning and performance (future-oriented, content AND criterion-related validity).", "hint": "Think past, present, and future."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Battery", "q": "A psychologist includes two different depression measures in a battery so that a second measure can strengthen her initial impression from the first. This is the battery's:", "opts": ["Additive function", "Confirmatory function", "Complementary function", "Comparative function"], "ans": 1, "why": "Confirmatory = two or more measures of the SAME domain to strengthen an impression. Additive = measuring DIFFERENT domains to broaden understanding. Complementary = measures of the same domain that yield different rather than confirming results.", "hint": "Same domain, and the goal is to back up a first impression."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Decisions", "q": "A government agency hires every applicant who meets the minimum qualifying score on its exam, without comparing applicants to one another. What type of decision is this?", "opts": ["Individual decision", "Absolute decision", "Institutional ranking decision", "Comparative decision"], "ans": 1, "why": "ABSOLUTE decisions look at who meets the minimum score needed to qualify. COMPARATIVE decisions compare people's scores to see who scored best. INDIVIDUAL decisions are made by test takers about themselves.", "hint": "Is anyone being ranked against anyone else?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Interviews", "q": "Clinicians in a hospital reach different diagnoses for the same patients because each uses vague, personal guidelines for including or excluding symptoms. A structured interview mainly reduces this source of error, called:", "opts": ["Observer drift", "Error variance from test construction", "Criterion variance", "Information variance"], "ans": 2, "why": "Criterion variance = error from vague guidelines for inclusion or exclusion in categories. Information variance = variability in the amount and type of information gathered from clients. Structured interviews reduce both.", "hint": "The problem is the rules for deciding, not the information collected."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Behavioral Assessment", "q": "A client trying to quit smoking is asked to record every cigarette in a log as it happens. Just from keeping the log, her smoking drops. This is the:", "opts": ["Hawthorne effect of analogue studies", "Halo effect", "Reactivity effect of self-monitoring", "Practice effect"], "ans": 2, "why": "Self-monitoring often produces REACTIVITY: the act of measuring your own behavior changes it, usually reducing undesirable behaviors or increasing adaptive ones.", "hint": "The act of recording changed the behavior."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Behavioral Assessment", "q": "A client with a spider phobia is asked to approach a caged spider in a clinic room while the clinician records how close she gets, her heart rate, and her distress ratings. This is a(n):", "opts": ["Psychological autopsy", "Situational interview", "Naturalistic observation", "Behavioral avoidance task in an analogue study"], "ans": 3, "why": "Analogue studies evaluate behavior in controlled, simulated settings that mirror real situations. A Behavioral Avoidance Task (BAT), approaching a feared stimulus under control, is a classic example. Naturalistic observation happens in real-world settings.", "hint": "A controlled, simulated situation with the feared object."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Computers in Testing", "q": "A computer-generated report combines the client's test results with data from other sources, such as interview notes and history, into one interpretive narrative. This is a(n):", "opts": ["Extended scoring report", "Simple scoring report", "Integrative report", "Consultative report"], "ans": 2, "why": "Simple scoring report = only lists scores. Extended scoring report = adds statistical analyses. Interpretive report = adds interpretive statements. Consultative report = written for professionals, with an expert opinion. INTEGRATIVE report = integrates data from sources OTHER than the test.", "hint": "Is the report using only test data, or other information too?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Clinical Judgment", "q": "Instead of relying on intuition, a forensic team decides a parolee's risk level using empirically demonstrated statistical rules applied to his records. This approach is:", "opts": ["Actuarial assessment", "Authoritative interpretation", "Intuitive interpretation", "Collaborative assessment"], "ans": 0, "why": "Actuarial assessment = applying empirically demonstrated statistical rules as the deciding factor in the assessor's judgment. The mechanical approach goes further, adding computer algorithms. Intuitive interpretation relies on feelings with no empirical basis.", "hint": "Statistical rules, not gut feeling."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Projective Tests", "q": "A client is given stems like 'My mother...' and 'I fear...' and asked to finish each sentence. In the classification of projective techniques, this is a(n):", "opts": ["Completion technique", "Construction technique", "Expressive technique", "Association technique"], "ans": 0, "why": "Projective techniques: Completion = finish a statement (sentence completion tests); Association = say the first thing that comes to mind (word association, Rorschach); Construction = make something from a stimulus (stories, as in the TAT); Expressive = express through creative means (drawing).", "hint": "The client finishes something that was started."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A psychologist needs a full individual intelligence evaluation for a 17-year-old student. Which Wechsler test covers her age?", "opts": ["WISC-V, because she is still in school", "WAIS-5 (16 to 90+ years)", "WPPSI-IV (2:6 to 7:7)", "WISC-V (6:0 to 16:11)"], "ans": 1, "why": "WISC-V covers 6 years 0 months to 16 years 11 months, so at 17 she's past it. WAIS-5 covers 16 to 90+. WPPSI-IV is for young children (2:6–7:7). Age ranges are a favorite board question.", "hint": "Check where the WISC-V's age range ends."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A 4-year-old needs an individually administered IQ test that also has nonverbal and verbal routes for every factor. Which test covers ages 2 to 85+ and gives equal weight to verbal and nonverbal domains?", "opts": ["Stanford-Binet Fifth Edition (SB-5)", "WAIS-5", "Wonderlic Cognitive Ability Test", "Purdue Non-Language Test"], "ans": 0, "why": "SB-5 covers ages 2 to 85+, measures five factors (Fluid Reasoning, Knowledge, Quantitative Reasoning, Visual-Spatial, Working Memory), and gives equal weight to verbal and nonverbal domains in each. It was developed by Gale Roid and is based on CHC theory.", "hint": "Only one of these tests spans early childhood to old age."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A recent immigrant who speaks very little English and has a mild hearing impairment needs a measure of general intelligence (g). Which test is the BEST choice?", "opts": ["Thurstone Test of Mental Alertness", "Raven's Progressive Matrices", "Panukat ng Katalinuhang Pilipino", "Watson-Glaser Critical Thinking Appraisal"], "ans": 1, "why": "Raven's measures abstract reasoning and Spearman's g independently of language, reading level, or cultural background. It's considered one of the purest measures of g. Thurstone and Watson-Glaser depend heavily on language, and the PKP uses Filipino.", "hint": "Which test works without language?"}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "Which version of Raven's Progressive Matrices is designed for children aged 5 to 11, older adults, and people with cognitive difficulties, and uses colored backgrounds?", "opts": ["Advanced Progressive Matrices (APM)", "Standard Progressive Matrices (SPM)", "Colored Progressive Matrices (CPM)", "Culture Fair Intelligence Test, Scale 3"], "ans": 2, "why": "CPM = 36 items in sets A, Ab, B, with color to hold attention (young children, the elderly, clinical groups). SPM = 60 items in five sets A–E, for ages 6–65+ of average ability. APM = 48 items, for above-average adults.", "hint": "Young children, color, and 36 items."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A Filipino HR officer wants a culturally grounded, Filipino-language intelligence test for applicants aged 16 and above that yields crystallized, fluid, and general intelligence scores. Which test fits?", "opts": ["Panukat ng Ugali at Pagkatao (PUP) by Enriquez", "Panukat ng Katalinuhang Pilipino (PKP) by Palacio", "Philippine Thematic Apperception Test (PTAT) by Lagmay", "Panukat ng Pagkataong Pilipino (PPP) by Carlota"], "ans": 1, "why": "PKP (Palacio) = Filipino intelligence test for ages 16+, with 135 items in 4 subtests (Talasalitaan, Ugnayan, Kakayahan sa mga Bilang, Isinasalarawang Problema), yielding CIS, FIS, and GIS. PUP and PPP are PERSONALITY tests; PTAT is projective.", "hint": "'Katalinuhan' means intelligence. The others measure personality."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "A guidance counselor wants a multi-score aptitude PROFILE (verbal reasoning, numerical ability, abstract reasoning, mechanical reasoning, space relations, and more) instead of a single IQ, to guide students' career choices. Which test fits best?", "opts": ["Satisfaction with Life Scale", "Raven's Standard Progressive Matrices", "Wonderlic Cognitive Ability Test", "Differential Aptitude Tests (DAT)"], "ans": 3, "why": "The DAT gives a multidimensional aptitude profile highlighting strengths, not a single summary IQ. It's used for educational and vocational guidance. Wonderlic gives one quick cognitive score for hiring.", "hint": "The counselor wants several scores, not one IQ."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "An employer wants a quick measure of applicants' general cognitive ability: 50 items in 12 minutes, with no penalty for wrong answers. Which test is this?", "opts": ["Flanagan Industrial Tests", "Wonderlic Cognitive Ability Test", "Thurstone Test of Mental Alertness", "Purdue Non-Language Test"], "ans": 1, "why": "Wonderlic = 50 items, 12 minutes, raw score maximum 50, used widely for personnel selection. Thurstone Test of Mental Alertness = 126 items in 20 minutes, alternating linguistic and quantitative items. Purdue = 25 minutes of nonverbal items.", "hint": "Very short and quick, used for hiring."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "A company screening management trainees wants to measure how well candidates recognize assumptions, evaluate arguments, and draw warranted conclusions. Which test fits?", "opts": ["Wonderlic Cognitive Ability Test", "Strong Interest Inventory", "Edwards Personal Preference Schedule", "Watson-Glaser Critical Thinking Appraisal"], "ans": 3, "why": "Watson-Glaser measures critical thinking: Recognize assumptions, Evaluate arguments, Draw conclusions. Its subtests are Inference, Recognition of Assumptions, Deduction, Interpretation, and Evaluation of Arguments.", "hint": "Assumptions, arguments, conclusions."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A career counselor uses a test based on Jung's theory of psychological types that sorts people on E–I, S–N, T–F, and J–P preferences. Which test is this?", "opts": ["NEO Personality Inventory", "Sixteen Personality Factor Questionnaire (16PF)", "Myers-Briggs Type Indicator (MBTI)", "Edwards Personal Preference Schedule"], "ans": 2, "why": "The MBTI makes Jung's psychological types practical: Extraversion–Introversion, Sensing–Intuition, Thinking–Feeling, Judging–Perceiving. It's for ages 14 and older.", "hint": "Jung's types and four letter pairs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A personality test based on Murray's needs presents 225 forced-choice statement pairs matched for social desirability, and includes repeated pairs to compute a consistency score. Which test is this?", "opts": ["Myers-Briggs Type Indicator", "Basic Personality Inventory", "Personality Assessment Inventory", "Edwards Personal Preference Schedule (EPPS)"], "ans": 3, "why": "EPPS = 15 needs (achievement, deference, order, exhibition, autonomy, affiliation, intraception, succorance, dominance, abasement, nurturance, change, endurance, heterosexuality, aggression), 225 forced-choice pairs, a consistency score from 15 repeated pairs, and desirability-matched pairs to reduce faking good.", "hint": "Forced-choice pairs plus a list of needs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A client's 16PF results are reported on a 1-to-10 standard score scale with a mean of 5.5 and an SD of 2. These scores are:", "opts": ["Deviation IQs", "T-scores", "STEN scores", "Stanines"], "ans": 2, "why": "STEN (standard ten): mean 5.5, SD 2, used by the 16PF. STANINE (standard nine): mean 5, SD 2. T-score: mean 50, SD 10 (MMPI, NEO, PAI, CPI). Deviation IQ: mean 100, SD 15.", "hint": "A mean of 5.5 on a ten-point scale."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A 16PF profile shows a very high score on Factor L. What does this suggest about the person?", "opts": ["Vigilant: suspicious, skeptical, and guarded", "Apprehensive: self-doubting and worried", "Warm: outgoing and attentive to others", "Rule-conscious: dutiful and conforming"], "ans": 0, "why": "Factor L = Vigilance (suspicious and guarded vs. trusting). A = Warmth, G = Rule-Consciousness, O = Apprehension, C = Emotional Stability, E = Dominance, H = Social Boldness, Q3 = Perfectionism, Q4 = Tension.", "hint": "Think of the factor letter as 'Lookout'."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A psychologist needs a measure of the Big Five that also gives six facet scores per domain (e.g., N1 Anxiety to N6 Vulnerability). Which instrument fits?", "opts": ["California Psychological Inventory", "MBTI", "NEO-FFI only", "NEO-PI-R / NEO-PI-3"], "ans": 3, "why": "The full NEO-PI-R/NEO-PI-3 (240 items) gives the 5 domains PLUS 6 facets each. The NEO-FFI is the 60-item short form, which gives domain scores only. The MBTI measures Jungian types, not the Big Five.", "hint": "Domains AND facets require the long form."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "An adult client's MCMI-IV profile shows a Base Rate (BR) score of 78 on the Borderline scale. How should this be interpreted?", "opts": ["Exactly average for the clinical sample", "A validity problem that invalidates the profile", "Not interpretable, since it is below 85", "Significant elevation: above the BR 75 cutoff for presence of the disorder"], "ans": 3, "why": "MCMI-IV Base Rate scores: BR 60 = median (scores below 60 are generally not interpreted); BR 75 = cutoff for PRESENCE of the disorder; BR 85+ = the disorder is PROMINENT. BR scores reflect how common the disorder is in clinical samples.", "hint": "Recall the three Base Rate cutoffs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "In a personal injury lawsuit, a psychologist suspects the plaintiff is exaggerating symptoms. On the Personality Assessment Inventory, which validity scale targets this?", "opts": ["Inconsistency (ICN)", "Positive Impression (PIM)", "Negative Impression (NIM)", "Infrequency (INF)"], "ans": 2, "why": "PAI validity scales: NIM = exaggeration, cry for help, or malingering ('fake bad'); PIM = defensiveness or minimizing flaws ('fake good'); ICN = random or careless responding; INF = confusion or gross carelessness.", "hint": "Exaggerating = trying to look worse."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "A clinician needs the current standard edition of the MMPI for a 30-year-old outpatient. Which version and population are correct?", "opts": ["MMPI-3, for ages 14 to 18", "MMPI-A-RF, for adults 18 and older", "MMPI-2, the current standard with 335 items", "MMPI-3, with 335 items, for adults 18 and older"], "ans": 3, "why": "MMPI-3 = the current standard edition, 335 items, for ages 18+. MMPI-2 had 567 items; MMPI-2-RF had 338. MMPI-A-RF (241 items) is for ADOLESCENTS aged 14–18.", "hint": "Check the item count and age range of the current edition."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Filipino Tests", "q": "A researcher wants a Filipino personality test with three forms: Form K (interpersonal relationships), Form S (personal traits), and Form KS (intelligence and creativity). Which test is this?", "opts": ["Panukat ng Ugali at Pagkatao (PUP) by Enriquez", "Pictorial Self-Concept Scale by Pasao", "Panukat ng Katalinuhang Pilipino (PKP) by Palacio", "Panukat ng Pagkataong Pilipino (PPP) by Carlota"], "ans": 3, "why": "PPP (Carlota) has Forms K, S, and KS and is for ages 13+. PUP (Enriquez) measures Filipino-oriented traits with validity scales Pagkakaila (denial) and Kaugalian (cultural norms). PKP is an intelligence test.", "hint": "Remember which author's test has the K, S, and KS forms."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Interest Tests", "q": "A career inventory compares a student's interests with those of satisfied workers in hundreds of occupations, and organizes results by RIASEC General Occupational Themes. Which test is this?", "opts": ["Strong Interest Inventory", "Edwards Personal Preference Schedule", "Differential Aptitude Tests", "Thurstone Interest Schedule"], "ans": 0, "why": "The Strong (SVIB → Strong-Campbell → modern SII) uses General Occupational Themes (RIASEC), Basic Interest Scales, Occupational Scales (matching satisfied workers), and Personal Style Scales. It's an INTEREST inventory, not an aptitude test.", "hint": "RIASEC themes and comparisons with satisfied workers."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "A child client is shown picture cards of animals (lions, bears, monkeys) in human-like social situations and asked to tell a story about each. Which test is this?", "opts": ["Hand Test", "Children's Apperception Test (CAT) by Bellak", "Kinetic Family Drawing", "Rorschach Inkblot Test"], "ans": 1, "why": "The CAT (Leopold and Sonya Bellak, 1949) is the children's version of the TAT and uses animal figures in human situations. The Philippine versions (PTAT and PCTAT) were developed by Alfredo Lagmay, with Filipino scenes.", "hint": "Animals in human-like scenes for children."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "A psychologist asks a child to 'draw everyone in your family, including yourself, DOING something.' Which projective technique is this?", "opts": ["House-Tree-Person (HTP)", "Draw-A-Person Test", "Kinetic Family Drawing (KFD)", "Hand Test"], "ans": 2, "why": "The KFD's unique instruction is that family members must be drawn DOING something (in action). HTP asks for a house, a tree, and a person. Draw-A-Person estimates intellectual maturity in children.", "hint": "The family members are doing something."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "In a correctional setting, a psychologist wants a projective test specifically aimed at action tendencies, particularly acting out and aggressive behavior. Which test fits?", "opts": ["Hand Test", "Satisfaction with Life Scale", "Sacks Sentence Completion Test", "Thematic Apperception Test"], "ans": 0, "why": "The Hand Test (ages 5+) measures action tendencies, especially acting out and aggression. The SSCT taps attitudes about family, sex, interpersonal relationships, and self-concept. The TAT reveals perceptions of interpersonal relationships.", "hint": "This test focuses on acting out."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "Of the 10 Rorschach inkblot cards, how are they grouped by color?", "opts": ["5 black and gray; 2 black, gray, and red; 3 multicolored", "10 black and gray", "5 multicolored; 5 black and gray", "3 black and gray; 7 multicolored"], "ans": 0, "why": "Rorschach: 5 achromatic (black and gray) cards, 2 black-gray-red cards, and 3 multicolored cards, for 10 in total.", "hint": "There are three color groups across the ten cards."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Filipino Tests", "q": "On the Panukat ng Ugali at Pagkatao (PUP), which scale checks whether the respondent is denying common human faults and weaknesses, and can invalidate the protocol if excessive?", "opts": ["Pagkakaila (Denial scale)", "Pagkamapagtimpi", "Pagkasigurista", "Kaugalian (Cultural Norms scale)"], "ans": 0, "why": "PUP's validity scales: Pagkakaila = denial of basic human faults or weaknesses; Kaugalian = agreement with traditional Philippine cultural norms, to check candor. Pagkasigurista (prudence) and Pagkamapagtimpi (self-control) are trait scales, not validity scales.", "hint": "'Kaila' is related to denying."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Tests", "q": "A physician refers a 74-year-old patient with recent forgetfulness for a quick screening of cognitive impairment (orientation, memory, attention, language). Which instrument is the most appropriate FIRST step?", "opts": ["Edwards Personal Preference Schedule", "Rorschach Inkblot Test", "Mini-Mental State Examination (MMSE)", "Strong Interest Inventory"], "ans": 2, "why": "The MMSE has a long history as a brief screening tool for cognitive impairment, measuring concentration, language, orientation, memory, and attention. The 7-Minute Screen is another option for Alzheimer's symptoms. A positive screen leads to a fuller neuropsychological evaluation. (Source: Ms. Chiqui's notes, Cohen and Swerdlik)", "hint": "You need a quick screen, not a full battery."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Tests", "q": "A neuropsychologist wants to assess frontal-lobe executive functions (planning, shifting mental set, and inhibiting impulsive responding) by having the patient sort cards by changing rules. Which test fits?", "opts": ["Satisfaction with Life Scale", "Ishihara test", "Purdue Pegboard Test", "Wisconsin Card Sorting Test"], "ans": 3, "why": "The Wisconsin Card Sorting Test requires sorting cards by figures and colors as the rule changes, tapping concentration, planning, cognitive flexibility in shifting set, working memory, and impulse inhibition, all associated with frontal-lobe functioning. Ishihara screens color blindness; Purdue Pegboard measures manual dexterity. (Source: Ms. Chiqui's notes)", "hint": "Executive function plus changing sorting rules."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Tests", "q": "A child is asked to copy nine geometric designs. The results are used to assess perceptual-motor (visual-motor) maturation and possible neurological impairment. Which test is this?", "opts": ["Controlled Word Association Test", "Thematic Apperception Test", "Wechsler Similarities subtest", "Bender Visual-Motor Gestalt Test"], "ans": 3, "why": "The Bender Visual-Motor Gestalt Test (Bender, 1938) uses designs the examinee copies to assess perceptual maturation and neurological impairment. Similarities measures verbal abstraction; the Controlled Word Association Test measures verbal fluency. (Source: Ms. Chiqui's notes)", "hint": "Copying designs to check visual-motor maturation."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Tests", "q": "During an evaluation, a patient shows abnormal reflexes, and neuroimaging confirms cranial nerve damage. In neuropsychological terms, these findings are:", "opts": ["Hard signs: definite indicators of neurological deficit", "Signs of malingering", "Soft signs: merely suggestive of deficit", "Extra-test behaviors"], "ans": 0, "why": "HARD signs = definite indicators of neurological deficit (abnormal reflexes, cranial nerve damage on imaging). SOFT signs = only suggestive (e.g., trouble accurately copying a figure). Either can prompt referral to a specialist. (Source: Ms. Chiqui's notes)", "hint": "Definite or only suggestive?"}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Forensic Assessment", "q": "A court asks a psychologist whether a defendant with schizophrenia is competent to stand trial. Which question is the evaluation fundamentally about?", "opts": ["Does he have a diagnosis of psychosis?", "Can he understand the charges against him and assist in his own defense?", "Did he have a mental disorder at the time of the crime?", "Is he likely to reoffend after release?"], "ans": 1, "why": "Competency to stand trial concerns PRESENT ability: understanding the charges and proceedings and being able to assist one's lawyer. A diagnosis alone (psychosis, intellectual disability, a neurological disorder) does NOT automatically make someone incompetent. Sanity at the time of the crime is a different question: criminal responsibility. (Source: Ms. Chiqui's notes)", "hint": "Competency is about the present, not the moment of the crime."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Forensic Assessment", "q": "Under the ALI standard, a defendant may be found not responsible ('not guilty by reason of insanity') if, at the time of the crime and because of mental disease or defect, he:", "opts": ["Has any psychiatric diagnosis", "Felt regret after the crime", "Is currently unable to understand courtroom procedures", "Lacked substantial capacity to appreciate the wrongfulness of his conduct or to conform it to the law"], "ans": 3, "why": "ALI standard: not responsible if, at the time of the conduct, mental disease or defect left the person lacking substantial capacity EITHER to appreciate its criminality (wrongfulness) OR to conform conduct to the law. Current ability to follow proceedings is a competency issue, not insanity. The RCRAS is one systematic tool for insanity evaluations. (Source: Ms. Chiqui's notes)", "hint": "The insanity standard looks at the time of the crime."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Forensic Assessment", "q": "A parole board asks for an assessment of an inmate's risk of violent reoffending. Which instrument, combining clinician ratings of traits like callousness and impulsiveness with criminal-history records, is most relevant?", "opts": ["Psychopathy Checklist (PCL) by Hare", "Strong Interest Inventory", "Kinetic Family Drawing", "Myers-Briggs Type Indicator"], "ans": 0, "why": "Hare's PCL rates personality characteristics (callousness, impulsiveness, lack of empathy) plus history from records (e.g., criminal versatility). Psychopathy ratings have predicted violent recidivism and parole failure. (Source: Ms. Chiqui's notes, Cohen and Swerdlik)", "hint": "Parole risk is linked to psychopathy."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "During a standardized group test, a proctor notices examinees look confused, so she rephrases the instructions in her own words and gives an extra two minutes. What is the main problem?", "opts": ["She prevented a ceiling effect", "She built rapport correctly", "She provided a legitimate accommodation", "She made administrative deviations that threaten comparison with the norms"], "ans": 3, "why": "Standardized administration means reading instructions VERBATIM and keeping exact timing. Rephrasing instructions or changing time limits are administrative deviations, so scores can no longer be fairly compared with the norm group.", "hint": "What does 'standardized' require of the examiner?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "For a student with low vision, the examiner provides a large-print version of a math reasoning test. The construct measured stays the same. This change is a(n):", "opts": ["Administrative deviation", "Construct bias", "Accommodation", "Modification"], "ans": 2, "why": "ACCOMMODATION = an adjustment that reduces the impact of a disability WITHOUT changing the construct being measured (extra time for motor deficits, large print). MODIFICATION = a change that alters the construct and can invalidate comparison with norms.", "hint": "Is the test still measuring the same skill?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "An examiner reads a reading-comprehension passage ALOUD to a student with dyslexia. Why is this considered a modification rather than an accommodation?", "opts": ["It uses large-print materials", "It changes the construct from reading comprehension to listening comprehension", "It was done after the test", "It gives the student extra time"], "ans": 1, "why": "Reading the passage aloud means the student no longer has to READ, so the test now measures listening, not reading comprehension. Changing the construct makes it a modification, and scores can't be compared to the norms.", "hint": "What skill is the student using now?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "An examiner who expects a child to be gifted unconsciously gives subtle encouraging cues and scores the child's ambiguous answers generously. This examiner effect is the:", "opts": ["Expectancy (Rosenthal) effect", "Flynn effect", "Halo effect in self-report", "Carryover effect"], "ans": 0, "why": "The expectancy/Rosenthal effect: examiner expectations subtly influence the test taker's performance through micro-cues or biased scoring of ambiguous responses.", "hint": "The examiner's expectations shaped the result."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Intelligence Issues", "q": "A school compares this year's students with norms collected 30 years ago and finds their IQs inflated by about 9 points. This is consistent with the:", "opts": ["Flynn effect", "Hawthorne effect", "Restriction of range", "Practice effect"], "ans": 0, "why": "The Flynn effect = the worldwide historic rise in raw intelligence test scores, about 3 IQ points per decade. Thirty years × 3 points ≈ 9 points. That's why outdated norms inflate scores.", "hint": "How many points per decade, and how many decades?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Equivalence", "q": "To adapt an English personality inventory for Filipinos, a team translates it into Filipino, then has a separate translator turn the Filipino version back into English to check that the meaning was preserved. This procedure is:", "opts": ["Back translation, for linguistic equivalence", "Conceptual equivalence testing only", "Co-norming", "Cross-validation"], "ans": 0, "why": "Back translation checks LINGUISTIC equivalence: whether the test was translated accurately. CONCEPTUAL equivalence = the construct means the same thing across cultures. METRIC equivalence = the same psychometric properties across groups.", "hint": "Translate, then translate back."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Bias", "q": "Two groups with equal overall ability perform very differently on a few specific items that refer to snow sports, which one group has never experienced. This is an example of:", "opts": ["Ceiling effect", "Predictive (criterion) bias", "Construct bias", "Item (content) bias"], "ans": 3, "why": "Item bias = specific items are easier or harder for members of a group of EQUAL ability. Construct bias = the whole test measures different constructs across groups. Predictive bias = the test predicts criterion outcomes differently for different groups.", "hint": "Equal ability, but a few specific items are unfair."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Behavioral Assessment", "q": "After several weeks of classroom observation, an observer has gradually started coding milder behaviors as 'aggression' than she did on day one, without realizing it. This error is:", "opts": ["Central tendency error", "Observer drift", "Demand characteristics", "Reactivity"], "ans": 1, "why": "Observer drift = a gradual, unintentional shift over time in how an observer applies the coding criteria. Retraining and periodic inter-observer reliability checks help prevent it.", "hint": "The observer's standards slowly shifted over time."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Behavioral Assessment", "q": "A normally rowdy student becomes unusually quiet and well-behaved only while the school psychologist sits in the back of the classroom observing. This is:", "opts": ["Reactivity", "Time sampling error", "Observer bias", "Observer drift"], "ans": 0, "why": "Reactivity = an alteration in a person's natural behavior caused by the AWARENESS of being observed. It's a subject-related error, unlike observer drift or observer bias, which come from the observer.", "hint": "Whose behavior changed: the observer's or the student's?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretation", "q": "An examiner's report simply states: 'The client typed 45 words per minute on the typing test,' with no inference about underlying traits. In Sundberg's levels of interpretation, this is:", "opts": ["Level II: hypothetical construct", "Level I: direct sample, minimal inference", "Level III: dynamic case conceptualization", "Level II: descriptive generalization"], "ans": 1, "why": "Level I = test data treated as a direct behavior sample with minimal inference. Level II = generalizing to broader traits or inferring internal constructs. Level III = a fully integrated, high-inference case conceptualization of the person.", "hint": "No inference at all, just what was observed."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "A company's selection test predicted that an applicant would succeed, so she was hired, but she failed in the job. In decision theory terms, this outcome is a:", "opts": ["False negative", "False positive", "True positive", "True negative"], "ans": 1, "why": "FALSE POSITIVE (Type I) = predicted success that does not occur. FALSE NEGATIVE (Type II) = predicted failure, but the person would have succeeded. True positives and true negatives are correct predictions (hits).", "hint": "The test said 'yes' and reality said 'no'."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "A company has 10 job openings and 200 applicants. What is the selection ratio?", "opts": [".20", "20", "2.0", ".05"], "ans": 3, "why": "Selection ratio = number to be hired ÷ number of applicants = 10 / 200 = .05. A low selection ratio means the company can be very selective, which increases a valid test's utility.", "hint": "Openings divided by applicants."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "An HR analyst wants to estimate the MEAN difference in performance between employees selected with the test and those not selected, as an index of what the test adds to existing procedures. Which tool fits?", "opts": ["Taylor-Russell tables", "Brogden-Cronbach-Gleser formula", "Naylor-Shine tables", "Expectancy tables"], "ans": 2, "why": "Naylor-Shine = difference between the MEANS of the selected and unselected groups. Taylor-Russell = how much adding a test improves selection, as a proportion of successful hires. Brogden-Cronbach-Gleser = the peso/dollar utility gain.", "hint": "It compares the MEANS of selected and unselected groups."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Cut Scores", "q": "An employer decides that a high score on a teamwork test can make up for a lower score on a technical test when combining applicants' results. This is the:", "opts": ["Compensatory model of selection", "Fixed cut score method", "Known-groups method", "Multiple hurdle model"], "ans": 0, "why": "Compensatory model = high scores on one attribute can compensate for lower scores on another. Multiple hurdle = a cut score must be passed at each stage, with no compensation.", "hint": "Strength in one area makes up for weakness in another."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Cut Scores", "q": "To set a cut score, a developer gives the test to a group known to have mastered the skill and a group known NOT to have mastered it, then sets the cut where the two groups' distributions separate. This is the:", "opts": ["Method of predictive yield", "Angoff method", "Bookmark method", "Known-groups method"], "ans": 3, "why": "The known-groups method collects predictor data from groups known to possess, and not to possess, the trait or ability of interest. Angoff relies on experts' item-by-item judgments; bookmark relies on items ordered by IRT difficulty.", "hint": "Compare two groups that differ on the skill."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretation", "q": "During a WISC-V session, the examiner notes that the child repeatedly sighs, erases answers, and says 'I'm stupid' whenever an item gets hard. These observations, which aren't part of the test content but may matter for interpretation, are called:", "opts": ["Construct-irrelevant variance", "Extra-test behavior", "Scoring drift", "Test sophistication"], "ans": 1, "why": "Extra-test behavior = observations of what the examinee does and how they react during testing that are only indirectly related to the test content but may be significant for interpretation.", "hint": "Behavior that isn't part of the test content."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "MSE", "q": "During a mental status exam, the patient says 'I feel fine, really happy,' but the clinician observes a blank face and little emotional expression throughout the interview. Which statement is correct?", "opts": ["'Happy' is her affect; the blank expression is her mood", "Both describe her thought content", "'Happy' is her reported mood; the blank expression describes her affect", "Both describe her insight"], "ans": 2, "why
