nse?' This is a:", "opts": ["Skill-level determiner", "Disqualifier", "Organizational-fit question", "Clarifier"], "ans": 1, "why": "Disqualifiers quickly check MUST-HAVE minimum requirements. Failing them removes the candidate from consideration. Clarifiers clear up information already given; skill-level determiners test actual proficiency.", "hint": "A must-have requirement. Fail it and you're out."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "An interviewer rates an average applicant as 'excellent' because the three applicants just before him were very weak. This is the:", "opts": ["Contrast effect", "Negative-information bias", "Interviewer-interviewee similarity", "Primacy effect"], "ans": 0, "why": "Contrast effect = judging a candidate by comparison with the IMMEDIATELY PRECEDING candidates instead of against job standards. Structured interviews with standardized scoring reduce this.", "hint": "The rating depends on who came right before him."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "Applicants first take a cognitive ability test. Only those who pass are interviewed, and only those who pass the interview take the medical exam. This is the:", "opts": ["Multiple-hurdle approach", "Multiple-cutoff approach", "Banding", "Top-down selection"], "ans": 0, "why": "Multiple HURDLE = one test at a time; you must pass each before moving on (sequential). Multiple CUTOFF = all tests given at once (simultaneous); the applicant must meet the cutoff on each. Hurdle saves money when later steps (like medical exams) are expensive.", "hint": "One test at a time. You must pass each to reach the next."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "A company treats all applicants whose test scores fall within the same score range as equivalent, then chooses among them using other factors such as diversity goals. This is:", "opts": ["Rule of three", "Banding", "Top-down selection", "Passing scores"], "ans": 1, "why": "Banding = groups scores within a range (accounting for measurement error) as statistically equivalent. It tries to hire top scorers while allowing flexibility, e.g., for affirmative action. Rule of three = the top 3 names go to the hiring manager.", "hint": "Scores within a range are treated as equal."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "Given a test's validity, the selection ratio, and the base rate, HR wants to estimate what PERCENTAGE of future hires will be successful on the job. Which tool should they use?", "opts": ["Lawshe tables", "Taylor-Russell tables", "Brogden-Cronbach-Gleser utility formula", "Proportion of correct decisions"], "ans": 1, "why": "Taylor-Russell tables = proportion of SELECTED applicants who will be successful, using validity, selection ratio, and base rate. Lawshe tables = probability that a PARTICULAR applicant with a given score will succeed. Brogden-Cronbach-Gleser = the MONETARY gain from using the test.", "hint": "They want the proportion of hires who will succeed, not one applicant's odds and not money."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "The CFO asks the HR head: 'In pesos, how much will the company gain each year by using this new selection test instead of our current interview?' Which tool answers this?", "opts": ["Markov analysis", "Lawshe tables", "Brogden-Cronbach-Gleser utility formula", "Taylor-Russell tables"], "ans": 2, "why": "Brogden-Cronbach-Gleser estimates the MONETARY value (utility) of a selection procedure compared with random selection or a less valid method. Money question = Brogden-Cronbach-Gleser.", "hint": "The question is about pesos."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HR Planning", "q": "A job posting lists: 'Bachelor's degree in Psychology, at least 1 year of HR experience, RPm license preferred.' This part of the job analysis output is the:", "opts": ["Task inventory", "Job evaluation", "Job specification", "Job description"], "ans": 2, "why": "Job SPECIFICATION = the minimum QUALIFICATIONS a PERSON must have (education, experience, skills). Job DESCRIPTION = what the JOB entails (duties, responsibilities, working conditions). Tip: specification = specs of the person.", "hint": "This lists what the PERSON must have, not what the job involves."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HR Planning", "q": "A hospital has historically needed 1 nurse for every 4 beds. It uses this to estimate that its new 200-bed wing will need 50 nurses. Which forecasting method is this?", "opts": ["Trend analysis", "Scatter plot", "Markov analysis", "Ratio analysis"], "ans": 3, "why": "Ratio analysis = uses the historical RATIO between a business factor (beds, sales, output) and the number of employees needed. Trend analysis = studying past employment levels over the years. Markov analysis = tracking the probabilities of employees MOVING between jobs.", "hint": "A historical ratio between beds and nurses."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HR Planning", "q": "An HR analyst builds a matrix showing that each year 70% of junior analysts stay junior, 15% are promoted to senior, and 15% leave. This is used to forecast internal labor supply. This is:", "opts": ["Trend analysis", "Markov analysis", "Ratio analysis", "Personnel replacement chart"], "ans": 1, "why": "Markov analysis tracks the movement (transition probabilities) of employees from one job category to another over time. A personnel replacement chart identifies specific internal candidates for key positions.", "hint": "The matrix shows probabilities of moving between job levels."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Recruitment", "q": "Over 20 years, a company has become filled with employees who share very similar personalities and values. Similar people are drawn to it and hired, and people who don't fit tend to leave. This is explained by:", "opts": ["Realistic job preview", "Contrast effect", "Person-job fit", "Schneider's Attraction-Selection-Attrition (ASA) framework"], "ans": 3, "why": "ASA (Benjamin Schneider): people are ATTRACTED to organizations like them, organizations SELECT people like them, and misfits leave (ATTRITION). Over time the organization becomes homogeneous, which reinforces its existing culture.", "hint": "Similar people are drawn in, picked, and the misfits leave. Think of Schneider's three-step framework."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Recruitment", "q": "Many new call-center agents quit within their first month, saying 'the job was nothing like what was advertised.' Which intervention best addresses this?", "opts": ["Executive search firms", "Raising starting pay", "Realistic Job Preview (RJP)", "Forced distribution appraisals"], "ans": 2, "why": "Job Expectations Theory: a gap between expected and actual job reality lowers motivation and satisfaction and leads to turnover. A Realistic Job Preview gives applicants an honest picture of both the good and bad parts of the job, so expectations match reality.", "hint": "The problem is a gap between what they expected and what they got."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Recruitment", "q": "To fill a Chief Financial Officer position, a company hires an outside firm that specifically targets executives who are currently employed elsewhere and not job-hunting. This is using:", "opts": ["A job fair", "An executive search firm (headhunter) to reach passive applicants", "A public employment agency", "Employee referrals"], "ans": 1, "why": "Executive search firms (headhunters) handle higher-paying, non-entry-level positions. Passive applicants are currently employed and not actively looking, but may be open to the right offer. Public employment agencies focus on entry-level or blue-collar jobs.", "hint": "Currently employed, not job-hunting, senior role."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Careers", "q": "A company that has been losing money for two years finally appoints its first female CEO, right in the middle of the crisis, when failure is very likely. This illustrates the:", "opts": ["Dual career ladder", "Golem effect", "Glass cliff", "Glass ceiling"], "ans": 2, "why": "Glass CLIFF = women and minorities are more likely to be given leadership roles that are risky or precarious, often during crises. Glass CEILING = the invisible barrier that STOPS women and minorities from rising to top positions in the first place. NOTE: the reviewer's definition of glass ceiling actually describes the glass cliff. Use the definition here.", "hint": "She got the job, but at the most dangerous possible moment."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Careers", "q": "A brilliant senior software engineer has no interest in managing people. The company lets her keep rising in title, pay, and prestige as a technical expert. This is a:", "opts": ["Dual career ladder", "Spiral career path", "Lateral career path", "Demotion"], "ans": 0, "why": "Dual career ladder = lets skilled individual contributors advance in pay and prestige WITHOUT taking on management duties. It helps retain technical talent. A lateral path = moving across to a different role at a similar level.", "hint": "She advances without becoming a manager."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRM vs HRD", "q": "Which of these activities is best classified as HUMAN RESOURCE DEVELOPMENT rather than Human Resource Management?", "opts": ["Processing payroll and government-mandated benefits", "Filling current vacancies quickly", "Ensuring compliance with labor laws", "Designing a leadership program to prepare employees for future management roles"], "ans": 3, "why": "HRM = administrative/operational, PRESENT needs: right people, right place, right time; compliance; compensation. HRD = investing in employees' GROWTH for FUTURE needs and building a learning culture. Preparing people for future roles = HRD.", "hint": "HRM covers present needs and compliance. Which option builds for the future?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Motivation", "q": "A plant pays a group bonus to all its workers whenever the plant's productivity improves above its baseline. The bonus is based on the plant's performance, not on company-wide profits. This incentive is:", "opts": ["Gain sharing", "Profit sharing", "Merit pay", "Stock options"], "ans": 0, "why": "GAIN sharing = group-wide financial incentives tied to IMPROVEMENTS in performance or productivity. PROFIT sharing = a percentage of company PROFITS above a certain amount. MERIT pay = individual raises based on performance APPRAISAL scores.", "hint": "The bonus is tied to the plant's productivity improvement, not company profits."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "An applicant sits before the HR manager, the department head, and a senior engineer at the same time, and each takes turns asking questions. This interview style is a:", "opts": ["Return interview", "Panel interview", "Group interview", "Serial interview"], "ans": 1, "why": "Panel = multiple interviewers, one applicant. Serial = a series of single interviews. Return = like serial but with time passing between interviews. Group = multiple applicants interviewed at the same time.", "hint": "Count the interviewers and the applicants in the room."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "A kind-hearted supervisor gives almost every one of her 15 staff an 'Outstanding' rating, including several who clearly underperform. This rating error is:", "opts": ["Halo effect", "Central tendency error", "Strictness error", "Leniency error"], "ans": 3, "why": "Leniency = consistently giving HIGHER-than-deserved ratings to most or all employees. Strictness = consistently lower. Central tendency = everyone in the middle. Halo = one trait coloring other traits of the SAME person.", "hint": "She's rating everyone too high, not just one person on several traits."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "Throughout the year, a supervisor keeps a running log of specific, observable examples of each employee's effective and ineffective behaviors, then uses the log at appraisal time. This is the:", "opts": ["Forced distribution method", "Graphic rating scale", "Paired comparison method", "Critical incident method"], "ans": 3, "why": "The critical incident method keeps a running record of specific, observable examples of effective and ineffective job behaviors during the appraisal period. It also reduces recency error, since the whole year is documented.", "hint": "A year-long record of specific examples."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "To design a new training program for bank tellers, HR interviews experienced tellers, observes them at work, and uses task inventories to list the tasks performed and the competencies needed. Which part of needs analysis is this?", "opts": ["Task analysis", "Organizational analysis", "Person analysis", "Reaction evaluation"], "ans": 0, "why": "Task analysis uses job analysis methods (interviews, observation, task inventories) to identify the tasks performed, the conditions under which they're performed, and the competencies needed. Person analysis identifies WHICH employees need training.", "hint": "HR is studying the job's tasks, not which tellers need training."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRD vs OD", "q": "HR runs a coaching program to build each employee's skills, while a separate initiative redesigns the company's culture and processes to improve the organization's overall health. Which statement correctly distinguishes them?", "opts": ["The coaching is OD; the culture redesign is HRD", "Both are HRM because HR runs them", "Both are OD because they involve people", "The coaching program is HRD (focused on individuals); the culture redesign is OD (focused on the organization as a whole)"], "ans": 3, "why": "HRD = primarily the INDIVIDUAL employee and their skills, knowledge, and growth. OD = primarily the ORGANIZATION AS A WHOLE: its processes, culture, structure, and long-term effectiveness.", "hint": "Who is the main target of each effort: one person, or the whole organization?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRD vs Training", "q": "A one-day workshop teaches new cashiers how to use the store's POS system so they can do their current job. Compared with HRD, this is best described as:", "opts": ["HRD: long-term, broad, for future roles", "Employee training: short-term, task-oriented, for the current job", "OD: organization-wide change", "Career planning"], "ans": 1, "why": "Employee TRAINING = acquiring specific knowledge and skills for the CURRENT job; short-term, narrow, task-oriented. HRD = holistic, long-term, and continuous, covering current and future roles and career progression.", "hint": "Is it for the current job or long-term growth?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRM vs HRD", "q": "Which responsibility belongs more to the Human Resource DEVELOPMENT Manager than to the HR Manager?", "opts": ["Empowering employees through training and career-growth opportunities and retraining talent", "Administering payroll and benefits", "Filling vacancies with the right people at the right time", "Ensuring compliance with labor laws"], "ans": 0, "why": "The HRD Manager empowers employees to become a major asset through training, career growth, and retraining talent. The HR Manager handles the administrative and operational side: staffing, compliance, compensation, and the right people in the right place at the right time.", "hint": "Which manager focuses on growing people?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Staffing", "q": "An excellent sales agent keeps getting promoted until she becomes a regional manager, a role where she struggles badly and burns out. This illustrates the:", "opts": ["Peter Principle", "Dual career ladder", "Glass cliff", "Galatea effect"], "ans": 0, "why": "The Peter Principle = organizations tend to promote good employees until they reach the level at which they're no longer competent (their 'highest level of incompetence'). Using job analysis to base promotions on actual job requirements helps prevent it. (Source: Ms. Chiqui's IO notes)", "hint": "Being great at one job doesn't guarantee being good at the next one up."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Job Evaluation", "q": "To set salaries, a company identifies compensable factors (responsibility, education, working conditions), assigns points to each based on importance, and totals the points for every job. Which job evaluation method is this?", "opts": ["Point method", "Ranking method", "Classification method", "Salary survey"], "ans": 0, "why": "Point method = jobs are scored on key factors with assigned points that are summed to determine the wage rate. Ranking = simply ordering jobs from highest to lowest. Classification = sorting jobs into predetermined classes or grades. A salary survey asks OTHER companies what they pay. (Source: Ms. Chiqui's IO notes)", "hint": "Factors, points, then a total."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Job Evaluation", "q": "An HR officer sends surveys to other banks to compare what they pay their tellers, so the bank's own teller salaries stay competitive. She is checking:", "opts": ["Distributive justice within a team", "Pay compression", "External equity", "Internal equity"], "ans": 2, "why": "EXTERNAL equity compares a job's pay with the external market (other organizations). INTERNAL equity compares jobs within the same organization based on their relative value. (Source: Ms. Chiqui's IO notes)", "hint": "Is she comparing with other companies or within her own?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Job Analysis", "q": "A job analyst uses a structured questionnaire by McCormick and colleagues, with 194 items organized into six dimensions such as information input, mental processes, and work output. Which method is this?", "opts": ["Critical Incident Technique", "Job Elements Inventory (JEI)", "Position Analysis Questionnaire (PAQ)", "Functional Job Analysis"], "ans": 2, "why": "PAQ (McCormick, Jeanneret, and Mecham, 1972): structured, 194 items, six dimensions. The JEI (Cornelius and Hakel) is a 153-item alternative that's easier to read. The Critical Incident Technique (Flanagan) uses reports of good and bad behavior. (Source: Ms. Chiqui's IO notes)", "hint": "194 items in six dimensions is the classic structured questionnaire."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Job Analysis", "q": "Instead of analyzing each job's tasks, a company identifies broad competencies (like 'customer obsession' and 'integrity') that apply to ALL employees and link to the company's mission. This approach is:", "opts": ["Job evaluation", "Job analysis", "Task inventory", "Competency modeling"], "ans": 3, "why": "Competency modeling identifies universal, more abstract competencies tied to high performance and the organization's mission, and doesn't focus on the specific work performed. Job analysis examines specific tasks and the KSAOs that distinguish jobs. (Source: Ms. Chiqui's IO notes)", "hint": "Broad competencies for everyone, tied to the mission."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Compensation", "q": "Besides her salary, an employee receives HMO coverage, paid leaves, and a retirement plan. These are forms of:", "opts": ["Non-financial compensation", "Merit pay", "Direct financial compensation", "Indirect financial compensation"], "ans": 3, "why": "Direct financial = wages, salaries, bonuses, commissions. INDIRECT financial = benefits, leaves, retirement plans. Non-financial = career development and recognition opportunities. (Source: Ms. Chiqui's IO notes)", "hint": "They're worth money, but they aren't paid as cash."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A newly formed project team keeps clashing: members argue over who should lead, push back on each other's ideas, and disagree about roles. In Tuckman's model, the team is in the:", "opts": ["Storming stage", "Performing stage", "Norming stage", "Forming stage"], "ans": 0, "why": "Forming = orienting, defining the task, ground rules. STORMING = conflict over roles, leadership, and norms. Norming = unity, shared understanding, agreed processes. Performing = achieving goals and high-level problem solving. Adjourning = temporary teams disband.", "hint": "Conflict over roles and leadership is the giveaway."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A task force set its direction at its first meeting, did very little for weeks, then at exactly the halfway point of its deadline drastically revised its whole strategy and worked intensely. This pattern is described by:", "opts": ["Tuckman's storming stage", "Brooks' Law", "Punctuated equilibrium", "Group polarization"], "ans": 2, "why": "Punctuated equilibrium (Gersick): instead of moving through stages, teams set direction at the first meeting, follow it, then drastically revise their strategy about HALFWAY through. The midpoint is the giveaway.", "hint": "Look at WHEN the big change happened."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "In a group thesis, Mika notices that Ben is barely contributing but will still get the same grade. To avoid being 'taken advantage of,' Mika reduces her own effort too. Mika's behavior is the:", "opts": ["Free-rider effect", "Social facilitation", "Sucker effect", "Social compensation"], "ans": 2, "why": "SUCKER effect = reducing your effort because you see OTHERS free-riding. Ben is the FREE RIDER (low effort because his contribution feels dispensable). SOCIAL COMPENSATION is the opposite of Mika: working HARDER to make up for weak teammates.", "hint": "Mika isn't the one coasting. She's reacting to someone who is."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "For an important company pitch, Carla works much harder than usual because she expects her less-capable teammates to perform poorly. This is:", "opts": ["The sucker effect", "Social loafing", "Social compensation", "Social inhibition"], "ans": 2, "why": "Social compensation = a motivational GAIN where an individual INCREASES effort to make up for the anticipated poor performance of other members, especially on tasks that matter to them.", "hint": "She works HARDER because of weak teammates."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A manager wants to reduce social loafing in a 12-person team. Which strategy is MOST effective?", "opts": ["Increase the team size so the workload is spread out", "Give only one shared team grade or rating", "Measure and make each member's individual contribution visible", "Assign everyone identical tasks"], "ans": 2, "why": "Ways to minimize social loafing: form SMALLER groups, SPECIALIZE tasks, MEASURE INDIVIDUAL performance, enrich the job, and select motivated, team-oriented people. Larger groups, a single shared rating, and identical tasks all make loafing EASIER, because individual effort gets hidden.", "hint": "Loafing thrives when individual effort is hidden."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Groupthink", "q": "During a board meeting, a director has serious doubts about an expansion plan but stays silent because everyone else seems to agree and she doesn't want to disrupt the harmony. Which groupthink symptom is this?", "opts": ["Direct conformity pressure", "Mindguards", "Self-censorship", "Illusion of unanimity"], "ans": 2, "why": "SELF-CENSORSHIP = members suppress their OWN doubts. Illusion of unanimity = the group wrongly reads that silence as agreement. Mindguards shield the group from outside contradicting information. Direct conformity pressure = OTHERS pressure a dissenter.", "hint": "The doubt stays inside her own head."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Groupthink", "q": "The CEO's executive assistant quietly filters out consultants' reports that criticize the merger plan before they reach the board, so the board stays confident in its decision. The assistant is acting as a:", "opts": ["Change analyst", "Liaison", "Devil's advocate", "Mindguard"], "ans": 3, "why": "Mindguards actively protect the group from information that might contradict its shared beliefs or consensus. A devil's advocate does the OPPOSITE: deliberately raises counterarguments, which is a remedy for groupthink.", "hint": "Someone is blocking information from reaching the group."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A mountain-climbing team can only move as fast as its slowest climber. In terms of group tasks, this is a(n):", "opts": ["Additive task", "Pooled task", "Disjunctive task", "Conjunctive task"], "ans": 3, "why": "Conjunctive = performance is determined by the WEAKEST member. Disjunctive = determined by the BEST member (e.g., a quiz bee where one right answer is enough). Additive = output is the SUM of all members' contributions (e.g., tug of war).", "hint": "Who sets the pace for the whole team?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A newly hired data encoder makes far more errors whenever his supervisor stands behind him and watches. This is:", "opts": ["Social inhibition", "Social loafing", "Social facilitation", "Social compensation"], "ans": 0, "why": "The presence of others helps performance on easy or well-learned tasks (SOCIAL FACILITATION) but HURTS performance on new or difficult tasks (SOCIAL INHIBITION). As a beginner, this task is still hard for him, so being watched makes him worse.", "hint": "Is this task easy or still hard for him?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A software project is already behind schedule, so the manager adds five new programmers to the team. The project ends up finishing even LATER. This illustrates:", "opts": ["Social loafing", "Punctuated equilibrium", "Brooks' Law", "Parkinson's Law"], "ans": 2, "why": "Brooks' Law: adding people to a project that is already running late makes it later, because new members need time to learn and communication overhead increases. It's an example of process losses.", "hint": "Why could more people make a late project even slower?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "In an emergency room, doctors, nurses, and technicians constantly pass the patient and information back and forth to one another until the patient is stabilized. This is which type of task interdependence?", "opts": ["Additive interdependence", "Pooled interdependence", "Reciprocal interdependence", "Sequential interdependence"], "ans": 2, "why": "POOLED = sharing a common resource (budget, machine, admin support): the lowest interdependence. SEQUENTIAL = one person's output is the next person's input, like an assembly line. RECIPROCAL = work goes back and forth among members: the HIGHEST interdependence.", "hint": "Work goes back and forth repeatedly, not one-way."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Conflict", "q": "Two department heads both want the full ₱1M training budget. After discussion, each department gets ₱500,000. Neither gets everything it wanted. Which conflict style is this?", "opts": ["Forcing", "Compromising", "Collaborating", "Accommodating"], "ans": 1, "why": "Compromising = each party gives up something; the reviewer labels it 'lose-lose'. Collaborating = both find a solution that FULLY meets both needs ('win-win'). Accommodating = one side gives in ('lose-win'). Forcing = one side wins at the other's expense ('win-lose').", "hint": "Each side gave up half."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Conflict", "q": "A union and management cannot agree on a wage increase. They bring in a neutral third party who listens to both sides and then hands down a decision both must follow. This is:", "opts": ["Arbitration", "Triangling", "Negotiation and bargaining", "Mediation"], "ans": 0, "why": "MEDIATION = a neutral third party HELPS both sides reach their own agreement (the mediator does not decide). ARBITRATION = the neutral third party listens, then MAKES THE DECISION. Triangling = discussing the conflict with a third party instead of the person involved (an avoiding style).", "hint": "The third party makes the decision, not just helps."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "Jessa says about her teammate: 'I trust Mark because I've worked with him for three years and he always delivers exactly when he says he will.' This is:", "opts": ["Knowledge-based trust", "Identification-based trust", "Collective efficacy", "Calculus-based trust"], "ans": 0, "why": "Calculus-based = trust because the other person would face SANCTIONS for violating it. KNOWLEDGE-based = trust from the PREDICTABILITY of their behavior (track record). Identification-based = mutual understanding and an EMOTIONAL bond.", "hint": "His track record makes him predictable."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "Each member of a cautious investment committee leaned slightly toward a safe option. After group discussion, the committee chose an even MORE cautious option than any member originally preferred. This is:", "opts": ["Group polarization", "Social loafing", "Groupthink", "Illusion of invulnerability"], "ans": 0, "why": "Group polarization = groups make decisions that are MORE EXTREME than individuals' initial positions, in whichever direction the group already leaned (riskier OR more cautious). Groupthink is about poor decisions from excessive cohesion and suppressed dissent.", "hint": "The group ended up more extreme than any individual."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "To generate ideas without production blocking or evaluation apprehension, a facilitator asks members to silently write down their ideas on paper before any discussion happens. This technique is:", "opts": ["Confrontation meeting", "Brainstorming", "Interacting group", "Brainwriting"], "ans": 3, "why": "Brainwriting removes conversation during idea generation, so people don't have to wait their turn or fear judgment. In brainstorming, people say ideas ALOUD (with no criticism allowed until all ideas are given).", "hint": "No talking during idea generation; ideas are written."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A team's unwritten rule is that everyone 'should' cover for a coworker who is sick, and those who refuse are frowned upon. This expectation of what OUGHT to be done is a(n):", "opts": ["Descriptive norm", "Injunctive (prescriptive) norm", "Formal policy", "Role ambiguity"], "ans": 1, "why": "Injunctive/prescriptive norms = what people SHOULD do, or what is approved or disapproved of. Descriptive norms = what most people actually DO. 'Should' and 'frowned upon' point to injunctive.", "hint": "Is this about what people actually do, or what they ought to do?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Conflict", "q": "Instead of talking to the coworker she's in conflict with, Liza keeps complaining about him to a third coworker. In conflict-style terms, this is:", "opts": ["Triangling, a form of the avoiding style", "Accommodating", "Arbitration", "Collaborating"], "ans": 0, "why": "Triangling = discussing the conflict with a third party instead of the person involved. It falls under the AVOIDING style, along with withdrawal. It keeps the conflict from being resolved directly.", "hint": "She's talking about him, not to him."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Types", "q": "A tech company sets up a small, secretive team that works outside normal bureaucracy with high autonomy to rapidly prototype a risky new product. This is a:", "opts": ["Production team", "Advisory team", "Departmental team", "Skunkworks"], "ans": 3, "why": "Skunkworks = a small, often secretive, highly autonomous team working on innovative, high-risk projects outside traditional constraints. Advisory teams give expert recommendations; departmental teams are permanent functional units.", "hint": "Secret, autonomous, risky innovation."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Types", "q": "A team of nurses runs an entire hospital ward with no traditional manager, sharing leadership and full responsibility for the unit's outcomes. This is a:", "opts": ["Task force (project) team", "Self-directed team", "Advisory team", "Virtual team"], "ans": 1, "why": "Self-directed teams have high autonomy, are responsible for a complete work process, and operate without a traditional manager, sharing leadership. Task force teams are TEMPORARY and cross-functional.", "hint": "No manager, full responsibility."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Before announcing a new system, management shows employees data proving the company lost 30% of its market share to competitors, to convince them that the current way of working is no longer acceptable. In Lewin's model, this is:", "opts": ["Internalization", "Moving", "Refreezing", "Unfreezing"], "ans": 3, "why": "Lewin's 3 stages: UNFREEZING = convincing people the current state is unacceptable and change is needed. MOVING = taking steps toward the desired state. REFREEZING = locking in the change through policies and rewards. Internalization is Carnall's final stage, not Lewin's.", "hint": "Management is convincing people the current state is unacceptable."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "After a new customer-service process is rolled out, management writes it into the official policy manual and rewards employees who consistently follow it. In Lewin's model, this is:", "opts": ["Unfreezing", "Moving", "Refreezing", "Adaptation"], "ans": 2, "why": "Refreezing = making the change STICK: formalizing new policies and rewarding behavior consistent with the change.", "hint": "They're locking the new process in place."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A company announced a major restructuring without explaining why it was needed. Employees saw no reason to change, and the effort stalled. Which step of Kotter's model was MOST clearly skipped?", "opts": ["Build on wins", "Embed changes into culture", "Create short-term wins", "Increase urgency"], "ans": 3, "why": "Kotter's step 1 is to INCREASE URGENCY: create a compelling, immediate need for change so the status quo no longer feels acceptable. Without it, people don't buy in. It parallels Lewin's unfreezing.", "hint": "Nobody felt a need for change. That's Kotter's very first step."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "To silence cynics early in a two-year digital transformation, leaders deliberately plan a visible improvement in the first 3 months and publicly reward the team behind it. Which Kotter step is this?", "opts": ["Communicate the vision", "Create short-term wins", "Build a guiding team", "Develop the vision"], "ans": 1, "why": "Create short-term wins = plan visible, unambiguous early improvements and reward the people involved. This builds momentum, validates the strategy, and silences cynics and early resisters.", "hint": "Visible, early, rewarded."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Employees have stopped denying that the new scheduling system is coming. They are now trying it out, learning how it works, and adjusting how they do their jobs. In Carnall's stages of change acceptance, they are in:", "opts": ["Internalization", "Discarding", "Adaptation", "Defense"], "ans": 2, "why": "Carnall's 5 stages: Denial → Defense (justifying the old ways) → Discarding (realizing they must change too) → ADAPTATION (testing the system, learning, adjusting) → Internalization (fully comfortable and immersed in the new culture).", "hint": "They're past denial and actually testing the new system."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "When told about the new process, an employee says she won't push for it, but she'll go along if it's really necessary. Then she asks, 'But are you SURE the old system is actually broken?' She is a:", "opts": ["Change resister", "Change analyst", "Reluctant changer", "Receptive changer"], "ans": 2, "why": "Reluctant changers won't instigate or welcome change but will change if necessary: 'Are you sure it's broken?' Receptive changers: 'If it's broke, I'll help fix it.' Change analysts: change only if it improves things. Change resisters: 'It may be broke, but it's still better than the unknown.'", "hint": "Won't push for change, will go along if necessary, asks if it's really broken."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "A consultant administers an anonymous attitude survey to all employees, compiles results by department, presents the data back to each group, and then helps them plan changes. Which OD intervention is this?", "opts": ["Total Quality Management", "Team building", "Survey feedback", "Appreciative inquiry"], "ans": 2, "why": "Survey feedback = systematic data collection through an anonymous survey, results compiled by unit, FED BACK to members, then groups identify changes. Top management supports and participates.", "hint": "Survey, then results fed back to each group."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "Instead of asking 'What's wrong with our department?', a facilitator asks employees to describe moments when the team was at its best, then uses those strengths to plan the future. This intervention is:", "opts": ["Confrontation meeting", "Appreciative inquiry", "Survey feedback", "Process consultation"], "ans": 1, "why": "Appreciative Inquiry (positive OD) focuses on STRENGTHS, the best of what employees offer, and past successes rather than problems. Its 5-D cycle: Define → Discover → Dream → Design → Deliver.", "hint": "The focus is on strengths, not problems."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "In an Appreciative Inquiry session, employees have just finished identifying their past successes. They are now asked to imagine and describe the ideal future of their department. Which phase is this?", "opts": ["Design", "Dream", "Deliver", "Discover"], "ans": 1, "why": "Define (focus of inquiry) → DISCOVER (what's working, past successes) → DREAM (envision the positive future) → DESIGN (strategies and plans to make it happen) → DELIVER (implement).", "hint": "They've finished discovering. Now they imagine."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Overnight, a traditional bank closes all its physical branches and becomes a purely digital bank, drastically changing how everything is done. According to Burke, this is:", "opts": ["Developmental change", "Incremental change", "Revolutionary change", "Evolutionary change"], "ans": 2, "why": "Burke: EVOLUTIONARY change = continual upgrading and improvement of processes. REVOLUTIONARY change = a 'real jolt to the system' that drastically changes how things are done.", "hint": "Overnight and drastic, or gradual?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Middle managers quietly oppose a restructuring because it will cut their authority, headcount, and budgets. This is mainly which type of resistance to change?", "opts": ["Political resistance", "Reluctant change", "Technical resistance", "Cultural resistance"], "ans": 0, "why": "POLITICAL resistance = concerns about power, influence, resources, and self-interest. TECHNICAL = practical or operational concerns (e.g., the system is hard to use). CULTURAL = clashes with deeply ingrained values, norms, and traditions ('this isn't who we are').", "hint": "What do the middle managers stand to lose?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A company asks employees to identify and eliminate unnecessary forms, reports, and paperwork that serve no useful purpose. In a 'sacred cow hunt,' this targets the:", "opts": ["Paper cow", "Speed cow", "Process cow", "Meeting cow"], "ans": 0, "why": "Sacred cow hunt = removing practices with no useful purpose. PAPER cow = unnecessary paperwork. MEETING cow = too many or too-long meetings. SPEED cow = unnecessary deadlines. There is no 'process cow'.", "hint": "Forms and reports are the target."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A hospital is about to switch to a new electronic scheduling system that nurses will use daily. Which approach is MOST likely to reduce nurses' resistance?", "opts": ["Penalize nurses who keep using the old system", "Delay the change until every nurse agrees to it", "Involve nurse representatives in selecting and testing the system", "Announce the change in a memo the day before launch"], "ans": 2, "why": "The three major strategies for dealing with resistance: EMPATHY and SUPPORT, COMMUNICATION, and PARTICIPATION/INVOLVEMENT. People resist less when they help shape the change. Last-minute memos and penalties raise resistance.", "hint": "People resist less when they help shape the change."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "A consultant observes a team's meetings and helps members become aware of HOW they communicate, make decisions, and handle conflict, so they can solve their own problems in the future. This is a:", "opts": ["Content intervention", "Structural intervention", "Technostructural intervention", "Process intervention (process consultation)"], "ans": 3, "why": "PROCESS interventions help the group see its own INTERNAL DYNAMICS (communication, roles, decision-making, norms). CONTENT interventions address the substance of the work or mission. STRUCTURAL interventions change the group's structure.", "hint": "The consultant focuses on HOW they work together, not on the work itself."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "After a major market disruption, a 50-year-old print publisher redefines its core identity, purpose, and mission, rebuilding itself from the ground up as a digital media company. This is best described as:", "opts": ["Organizational transformation", "Remedial change", "Incremental change", "Organizational development"], "ans": 0, "why": "Organizational TRANSFORMATION = comprehensive change to the organization's fundamental 'DNA' (identity, purpose, mission), usually triggered by major disruption. OD = planned, long-term, organization-wide improvement of the existing system. Remedial change = fixing specific existing problems.", "hint": "They redefined who they are, not just a process."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A new manager constantly changes procedures, even ones that work well, saying 'If it ain't broke, break it.' In terms of how people respond to change, she is a:", "opts": ["Receptive changer", "Change agent", "Change analyst", "Change resister"], "ans": 1, "why": "Change agents enjoy change and often change things just for the sake of it ('If it ain't broke, break it'). Change analysts only change things when it will improve the organization. Receptive changers won't start change but will help.", "hint": "Which change type changes things just for the sake of it?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A 40-year-old snack brand changes its logo, packaging, slogan, and ads to reposition itself for Gen Z buyers. Its operations and structure stay the same. Which type of large-scale organizational change is this?", "opts": ["Relocation change", "Structural change", "Transformational change", "Rebranding change"], "ans": 3, "why": "Rebranding change = altering the organization's brand identity (logo, messaging, image), often to target a new market or reposition. Transformational change would overhaul strategies, processes, and structures; structural change alters reporting lines and hierarchy.", "hint": "What exactly changed: how the company works, or how it presents itself?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A conglomerate splits its food business and its real-estate business into two completely independent companies. This is a:", "opts": ["Downsizing change", "Incremental change", "De-merger change", "Merger and acquisition change"], "ans": 2, "why": "De-merger change is the opposite of a merger: a single organization separates into two or more independent entities. Downsizing reduces the workforce; a merger combines organizations.", "hint": "One company becomes two. What's the opposite of a merger?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A hospital's billing department has a high error rate that is costing money, so management launches a change effort specifically to fix that problem. This is a:", "opts": ["Remedial change", "Rebranding change", "Transformational change", "Developmental change"], "ans": 0, "why": "Remedial change addresses EXISTING problems or weaknesses to fix them. Developmental change ENHANCES existing capabilities that already work (often through training). Transformational change overhauls the whole organization.", "hint": "Is the goal to fix a problem, or to improve something that already works?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A bank whose tellers already perform well enrolls them in advanced training to make their customer-service skills even stronger. This is a:", "opts": ["Revolutionary change", "Developmental change", "De-merger change", "Remedial change"], "ans": 1, "why": "Developmental change enhances EXISTING capabilities and performance levels, often through training. Nothing was broken (which would make it remedial); the bank is building on current strengths.", "hint": "Nothing is broken; they're building on strengths."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "Instead of one big overhaul, a factory makes small, continuous improvements to its existing routines every month, building on what already works. This is:", "opts": ["Transformational change", "Revolutionary change", "De-merger change", "Incremental change"], "ans": 3, "why": "Incremental change = small, continuous improvements to existing practices and routines, building on current strengths rather than introducing radical shifts. It matches Burke's 'evolutionary' change.", "hint": "Small steps, continuously."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "A company moves its entire head office from Makati to Clark, affecting employees' commutes, infrastructure, and its local customer base. This is a:", "opts": ["Structural change", "Relocation change", "Process and system change", "People and culture change"], "ans": 1, "why": "Relocation change = moving the organization's operations to a new location, affecting its workforce, infrastructure, and customer base.", "hint": "The company is physically moving."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Large-Scale Change", "q": "An insurance company replaces its paper-based claims workflow with a new digital system, changing the procedures and steps employees follow to process claims. This is mainly a:", "opts": ["Rebranding change", "Relocation change", "People and culture change", "Process and system change"], "ans": 3, "why": "Process and system change modifies HOW work is done: workflows, procedures, and the systems supporting them. People and culture change targets behaviors, attitudes, skills, and culture.", "hint": "The workflow and system are what changed."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change Drivers", "q": "A new data privacy regulation forces a company to change how it collects and stores customer information. In terms of factors driving change, this is a(n):", "opts": ["Internal factor (operational inefficiency)", "External factor (market competition)", "External factor (political and legal)", "Internal factor (new leadership)"], "ans": 2, "why": "External factors come from outside: technology, competition, customer demands, economic, sociocultural, political/legal (new laws and regulations), and crises. Internal factors include leadership changes, performance gaps, strategy, growth or decline, and culture.", "hint": "Did the pressure come from inside the company or outside it?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Change Drivers", "q": "A newly appointed CEO arrives with a fresh vision and immediately reshapes the company's priorities and structure. This change is driven mainly by a(n):", "opts": ["External factor: government regulation", "External factor: market competition", "Internal factor: change in leadership", "External factor: economic recession"], "ans": 2, "why": "Changes in leadership/management are an INTERNAL driver: new leaders bring new perspectives, strategies, and visions that lead to changes in structure, culture, and priorities.", "hint": "Where did the push for change come from?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "To boost productivity and well-being, a company redesigns its performance management, goal-setting, appraisal, and reward systems. In terms of intervention types, this is a(n):", "opts": ["Strategic change intervention", "Human resource management intervention", "Human process intervention", "Technostructural intervention"], "ans": 1, "why": "HRM interventions target performance management, goal setting, appraisal, reward systems, talent development, DEIB, and well-being. Human process = interpersonal and group dynamics. Technostructural = structure, technology, work design. Strategic = transformation, restructuring, mergers.", "hint": "Appraisal and reward systems belong to which family of interventions?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "Two companies merge, and consultants design a program to unite their strategies, structures, and cultures into one organization. This is a(n):", "opts": ["Human process intervention", "Strategic change intervention", "Human resource management intervention", "Process consultation"], "ans": 1, "why": "Strategic change interventions revolve around transformational change, restructuring, and uniting two or more organizations during a merger.", "hint": "Uniting two organizations is which kind of intervention?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Employee Input", "q": "Employees are asked to give suggestions on a new policy. Management promises to seriously consider them, but makes no guarantee it will follow them. Which level of employee input is this?", "opts": ["Absolute", "Shared/team", "Following", "Advisory"], "ans": 3, "why": "Levels of employee input: Following (no real control) → Ownership of own product (responsible for own quality) → ADVISORY (input is seriously considered, not guaranteed to be used) → Shared/team (decision made at group level) → Absolute (full authority to decide alone). (Source: Ms. Chiqui's IO notes)", "hint": "Their input is heard, but they don't decide."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Flexible Work", "q": "A company lets employees choose their own start and end times, but everyone must be at work from 10 a.m. to 2 p.m. In a flextime schedule, the 10-to-2 period is called:", "opts": ["Peak-time pay", "Gliding time", "Core hours", "Bandwidth"], "ans": 2, "why": "Core hours = the hours in a flextime schedule when every employee must work. Bandwidth = the total number of potential work hours available each day. Gliding time = choosing hours without advance notice. (Source: Ms. Chiqui's IO notes)", "hint": "The part of the day that's NOT flexible."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Flexible Work", "q": "Two part-time employees split one full-time receptionist position: one works mornings and the other works afternoons. This arrangement is:", "opts": ["Compressed workweek", "Job sharing", "Telecommuting", "Moonlighting"], "ans": 1, "why": "Job sharing = two employees share one job by splitting the work hours. Compressed workweek = full-time hours in fewer days (e.g., 4 × 10 hours). Moonlighting = holding a second job. (Source: Ms. Chiqui's IO notes)", "hint": "One job, two people."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Downsizing", "q": "After a major layoff, the employees who KEPT their jobs report guilt, anxiety, and lower commitment. In downsizing research, these employees are called:", "opts": ["Reluctant changers", "Change resisters", "Victims", "Survivors"], "ans": 3, "why": "Victims = employees who lose their jobs in a layoff. SURVIVORS = employees who retain their jobs after downsizing, and they're affected too (guilt, insecurity). Outplacement programs help victims; communication helps survivors. (Source: Ms. Chiqui's IO notes)", "hint": "They kept their jobs."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A researcher gives the same trait-anxiety inventory to 80 employees in January and again in May, then correlates the two sets of scores. Which reliability estimate is she obtaining?", "opts": ["Split-half reliability", "Test-retest reliability", "Inter-rater reliability", "Alternate-forms reliability"], "ans": 1, "why": "Same test, same people, two occasions, correlate the scores = test-retest. It fits traits that are stable over time, like trait anxiety. Alternate forms would use two different versions; split-half needs only one administration; inter-rater compares scorers.", "hint": "Count the versions of the test and the number of times it was given."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Students retook the same reasoning test only two days after the first session. Many remembered the items, and their second scores were noticeably higher. What most likely distorted the test-retest estimate?", "opts": ["Mortality", "Restriction of range", "Carryover (practice) effects", "Validity shrinkage"], "ans": 2, "why": "Carryover effects happen when the test-retest interval is short: the second session is influenced by memory or practice from the first. Practice effects (higher scores the second time) are one form of this. Mortality = people missing the second session.", "hint": "Think about what a very short interval between sessions does."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "When the interval between two administrations of the same test is longer than six months, the test-retest estimate is often called the:", "opts": ["Coefficient of equivalence", "Coefficient of alienation", "Coefficient of stability", "Coefficient of determination"], "ans": 2, "why": "A long-interval test-retest estimate (over 6 months) = coefficient of stability. Coefficient of equivalence goes with alternate/parallel forms. Coefficient of alienation = variance NOT explained by the predictor; coefficient of determination = r squared, the variance that IS explained.", "hint": "The long interval tells you how steady scores stay over time."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A 50-item multiple-choice exam is scored right or wrong, and its items vary widely in difficulty. Which statistic is the best choice for its inter-item consistency?", "opts": ["KR-20", "Cohen's kappa", "KR-21", "Cronbach's alpha"], "ans": 0, "why": "KR-20 is the statistic of choice for DICHOTOMOUS items (right/wrong) with DIFFERENT difficulty levels. KR-21 assumes all items have about the same difficulty. Cronbach's alpha is for nondichotomous items like Likert scales. Kappa is for rater agreement.", "hint": "Two details matter: how the items are scored, and whether their difficulty is uniform."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A developer builds a 30-item job satisfaction scale answered on a 5-point Likert format. Which internal consistency estimate is most appropriate?", "opts": ["Kendall's W", "KR-20", "KR-21", "Cronbach's alpha"], "ans": 3, "why": "Cronbach's alpha is the preferred internal consistency estimate for NONdichotomous items (Likert, partial credit) and needs only one administration. KR-20 and KR-21 are for right/wrong items. Kendall's W is for agreement among rankings.", "hint": "How is each item answered: right/wrong, or on a range of points?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A newly built 40-item self-esteem scale shows a Cronbach's alpha of .97. According to Streiner, what might this very high value suggest?", "opts": ["The scale is too heterogeneous", "The items may be redundant", "The scale has low reliability", "The scale has perfect validity"], "ans": 1, "why": "Streiner (2003) noted that an alpha above .90 may be 'too high' and signal that items are redundant (saying the same thing in slightly different words). High reliability never proves validity.", "hint": "Can a scale be 'too consistent'? What would cause that?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "After correlating scores on the odd and even items of a single test, a developer applies the Spearman-Brown formula. What is the formula doing here?", "opts": ["Estimating the test's criterion-related validity", "Converting raw scores into z-scores", "Correcting scores for guessing", "Estimating the reliability of the full-length test from the half-test correlation"], "ans": 3, "why": "A split-half correlation only reflects HALF the test. Spearman-Brown adjusts it upward to estimate the reliability of the whole test, since longer tests are more reliable. The Spearman-Brown prophecy formula can also estimate how many items are needed to reach a target reliability.", "hint": "A half-length test has fewer items than the real thing."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "The correlation between the two halves of a test is .60. Using the Spearman-Brown formula, r = 2r_half / (1 + r_half), what is the estimated reliability of the full test?", "opts": [".80", ".36", ".60", ".75"], "ans": 3, "why": "2(.60) / (1 + .60) = 1.20 / 1.60 = .75. The full-test estimate is always higher than the half-test correlation because the whole test has twice as many items. Note: the reviewer names Spearman-Brown but doesn't print this formula; it's the standard textbook formula.", "hint": "Plug .60 into the formula: double it on top, add 1 on the bottom."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Why is splitting a test simply down the middle (first half vs. second half) NOT recommended for split-half reliability?", "opts": ["It always produces a coefficient of zero", "It requires two administrations of the test", "It only works for Likert-type items", "Fatigue, anxiety, and item difficulty can differ between the first and second halves"], "ans": 3, "why": "Dividing a test in the middle can spuriously raise or lower the coefficient because the halves differ in fatigue, test anxiety, and item difficulty (items often get harder toward the end). Odd-even splitting avoids this.", "hint": "What changes between the start and the end of a long test?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Three psychologists independently classify 50 children's drawings into diagnostic categories. Which statistic best measures their agreement?", "opts": ["Fleiss' kappa", "Cohen's kappa", "Pearson r", "KR-20"], "ans": 0, "why": "Kappa statistics are used for NOMINAL (category) data. Cohen's kappa = agreement between TWO raters; Fleiss' kappa = agreement among THREE OR MORE raters. Kendall's W is used when raters RANK things.", "hint": "Nominal categories, and count the raters."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Four judges each rank 10 essay contest entries from best to worst. Which statistic evaluates the agreement of their rankings?", "opts": ["Cohen's kappa", "Kendall's W", "Fleiss' kappa", "Cronbach's alpha"], "ans": 1, "why": "Kendall's W (coefficient of concordance) is for rankings/ordinal data across three or more raters. Kappa is for nominal categories, not ranks.", "hint": "The judges are ranking, not sorting into categories."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A company correlates its hiring test with job performance, but only for employees who were hired, all of whom had top test scores. The validity coefficient comes out surprisingly low. What is the most likely reason?", "opts": ["Inflation of range", "Restriction of range", "Carryover effects", "Construct-irrelevant variance"], "ans": 1, "why": "When the variance of a variable is restricted by sampling (only high scorers were hired), the correlation tends to be LOWER. Inflation of range does the opposite: it makes correlations higher.", "hint": "Who is missing from the sample that was correlated?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A test has a generous time limit so everyone can attempt every item, but some items are so difficult that no test taker gets a perfect score. This is a:", "opts": ["Power test", "Speed test", "Ceiling-effect test", "Criterion-referenced test"], "ans": 0, "why": "POWER test = enough time to try everything, but items vary up to very hard levels, so perfect scores are unlikely. SPEED test = uniform, easy items, and the time limit is what separates people.", "hint": "Everyone has enough time, yet no one gets a perfect score."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Mark's observed score is 80 and the test's standard error of measurement (SEM) is 4. What is the approximate 95% confidence interval for his true score?", "opts": ["76 to 84", "78 to 82", "72 to 88", "68 to 92"], "ans": 2, "why": "95% is about ±2 SEM: 80 − 8 = 72 and 80 + 8 = 88. The 68% interval would be ±1 SEM (76 to 84), and about 99% would be ±3 SEM (68 to 92).", "hint": "95% means about two SEMs on each side of the observed score."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "As a test's reliability increases, what happens to its standard error of measurement?", "opts": ["It becomes equal to the validity coefficient", "It decreases", "It stays the same", "It increases"], "ans": 1, "why": "Higher reliability = lower SEM. A more reliable test has less error in each person's score, so the band around the true score gets narrower.", "hint": "Reliability and measurement error move in which direction relative to each other?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A researcher argues that test scores vary across occasions because of specific features of the testing situation (the number of items, scorer training, purpose of testing) and studies these 'facets' to find a 'universe score.' Which theory is this?", "opts": ["Generalizability theory", "Item response theory", "Domain sampling theory", "Classical test theory"], "ans": 0, "why": "Generalizability theory uses facets, universe, and universe score. Under the same conditions of all facets, the same score should be obtained. Classical test theory is X = T + E. IRT models the probability of a response given a latent trait level.", "hint": "Watch for the words 'facets' and 'universe'."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A licensing exam models the probability that a person with a given level of a latent ability will answer an item of a certain difficulty correctly, using item difficulty and discrimination parameters. This approach is:", "opts": ["Spearman's two-factor theory", "Generalizability theory", "Classical test theory", "Item response theory (latent-trait theory)"], "ans": 3, "why": "IRT (latent-trait theory) models the probability that a person with X amount of ability or trait will perform at level Y on an item. It's widely used in licensing exams and computerized adaptive testing. The Rasch model is one IRT model.", "hint": "The model is about the probability of a response given a hidden ability level."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten subject-matter experts rate each item of a new exam as 'essential,' 'useful but not essential,' or 'not necessary.' Which index will be computed from their ratings?", "opts": ["Kuder-Richardson Formula 20", "Coefficient of stability", "Lawshe's Content Validity Ratio (CVR)", "Item-discrimination index"], "ans": 2, "why": "Lawshe's CVR is based on how many experts rate an item 'essential.' It's a quantitative index of CONTENT validity. A positive CVR means more than half the experts said essential.", "hint": "Experts judging whether items are 'essential' to the content."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten experts rate an item, and exactly 5 of them mark it 'essential.' What is the item's CVR?", "opts": ["1.00", "0.50", "−0.50", "0"], "ans": 3, "why": "CVR = (ne − N/2) / (N/2) = (5 − 5) / 5 = 0. A CVR of zero means exactly half the experts rated the item essential.", "hint": "Compare the number of 'essential' ratings with half of the panel."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten experts rate an item, and 8 of them mark it 'essential.' What is the item's CVR?", "opts": ["0.30", "1.60", "0.60", "0.80"], "ans": 2, "why": "CVR = (ne − N/2) / (N/2) = (8 − 5) / 5 = 3 / 5 = 0.60. A positive value means more than half the panel considered the item essential.", "hint": "Subtract half the panel from the number of 'essential' votes, then divide by half the panel."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A clinic gives patients a new 10-item depression questionnaire and, on the same day, the well-established longer inventory it hopes to replace. The two sets of scores are correlated. This provides evidence of:", "opts": ["Concurrent validity", "Predictive validity", "Content validity", "Incremental validity"], "ans": 0, "why": "Concurrent validity = test and criterion collected at about the SAME TIME. It's often used when a new, shorter test is meant to replace a longer or costlier one. Predictive validity collects the criterion LATER.", "hint": "When was the comparison measure collected?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A company gives an aptitude test to job applicants, then six months later correlates their scores with supervisors' performance ratings. This provides evidence of:", "opts": ["Face validity", "Discriminant validity", "Concurrent validity", "Predictive validity"], "ans": 3, "why": "Predictive validity = test scores now, criterion measured later. It's essential for selection and placement tests that aim to forecast future success.", "hint": "There's a gap of months between the test and the criterion."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A firm already uses a cognitive ability test to predict sales performance. Adding a conscientiousness inventory explains additional variance in sales that the cognitive test alone did not. This shows the inventory's:", "opts": ["Validity shrinkage", "Face validity", "Concurrent validity", "Incremental validity"], "ans": 3, "why": "Incremental validity = how much an ADDITIONAL predictor explains about the criterion beyond the predictors already in use.", "hint": "The new test adds something on top of what's already in use."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on a new anxiety scale correlate .78 with scores on a long-established anxiety inventory. This is evidence of:", "opts": ["Inter-rater reliability", "Content validity", "Convergent validity", "Discriminant validity"], "ans": 2, "why": "Convergent validity = high correlation with an established measure of the SAME construct. Both measures 'converge' on anxiety.", "hint": "Same construct, established measure, high correlation."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on the same new anxiety scale correlate only .05 with a vocabulary test, a construct it should have nothing to do with. This is evidence of:", "opts": ["Discriminant validity", "Convergent validity", "Known-groups validity", "Predictive validity"], "ans": 0, "why": "Discriminant validity = LITTLE relationship with measures of constructs the test should NOT theoretically correlate with. NOTE: the reviewer's definition says 'should theoretically be correlated.' It's missing the word NOT, so use the definition here.", "hint": "Low correlation with something unrelated is what you'd hope for."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A new psychosis screening scale yields much higher scores for patients already diagnosed with schizophrenia than for a community sample with no psychiatric history. This is evidence of construct validity known as:", "opts": ["Face validity", "Concurrent validity", "Known-groups validity (group differences)", "Evidence of changes with age"], "ans": 2, "why": "Known-groups validity: the test differentiates groups already known, from external criteria, to differ on the construct. It's one form of construct validity evidence.", "hint": "The comparison groups already differ on the construct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on a math word-problem test turn out to depend heavily on how well students read English, not just on their math ability. This problem is called:", "opts": ["Item branching", "Construct underrepresentation", "Construct-irrelevant variance", "Restriction of range"], "ans": 2, "why": "Construct-IRRELEVANT variance = scores are influenced by something outside the construct (reading ability). Construct UNDERREPRESENTATION = the test leaves out important parts of the construct.", "hint": "The scores are picking up a skill that isn't part of the construct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A 'depression' inventory asks only about sadness and ignores sleep, appetite, energy, and concentration. Its main weakness is:", "opts": ["Item bias", "Construct underrepresentation", "Construct-irrelevant variance", "Low face validity"], "ans": 1, "why": "Construct underrepresentation = failing to capture important components of the construct. Here the test only taps one facet of depression.", "hint": "What's missing from this depression test?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "In a multitrait-multimethod (MTMM) matrix, the correlations between the SAME trait measured by DIFFERENT methods (the validity diagonal) should be high. High values there are evidence of:", "opts": ["Convergent validity", "Content validity", "Discriminant validity", "Test-retest reliability"], "ans": 0, "why": "Heteromethod-monotrait correlations (same trait, different methods) = the validity diagonal: evidence of CONVERGENT validity. Low heterotrait correlations support DISCRIMINANT validity. Monotrait-monomethod values form the reliability diagonal.", "hint": "Same trait, different methods. Do they agree?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A researcher wants to test whether questionnaire data fit a hypothesized five-factor structure proposed by an existing theory. Which procedure fits best?", "opts": ["Principal component analysis", "Confirmatory factor analysis", "Exploratory factor analysis", "Cross-validation"], "ans": 1, "why": "CFA is 'theory-testing': it confirms a HYPOTHESIZED structure. EFA is 'theory-generating', used when you have no preconceived idea of the factors. PCA reduces data dimensionality.", "hint": "The researcher already has a structure in mind."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "In a factor analysis, the researcher keeps only factors with eigenvalues greater than 1.0. Which rule is this?", "opts": ["Kaiser criterion (K1 rule)", "Spearman-Brown prophecy", "Scree test (elbow method)", "Rule of three"], "ans": 0, "why": "Kaiser criterion = retain factors with eigenvalues > 1.0. It tends to OVERestimate the number of factors when there are many variables. The scree test keeps factors before the 'elbow' of the eigenvalue plot, but it's subjective.", "hint": "An eigenvalue cutoff of 1.0 is named after a person."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A test validated on one sample is re-validated on a new, different sample, and its validity coefficient drops a little. This drop is called:", "opts": ["Validity shrinkage", "Scoring drift", "Restriction of range", "Co-norming"], "ans": 0, "why": "Cross-validation = re-validating on a different group. The decrease in validity that typically follows is validity SHRINKAGE. Co-norming = norming more than one test on the same group.", "hint": "Validity usually drops a little on a fresh sample."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms", "q": "Ana's percentile rank on a reading test is 85. What does this mean?", "opts": ["She scored higher than about 85% of the norm group", "Her score is 85 points above the mean", "She is in the top 85 test takers", "She answered 85% of the items correctly"], "ans": 0, "why": "A percentile = the percentage of people in the norm group whose scores fall BELOW a particular raw score. Don't confuse it with percentage CORRECT, which is the number of items answered correctly × 100.", "hint": "Percentile rank is not the same as percent correct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms", "q": "A university's guidance office builds norms from its own freshmen's scores so it can interpret results relative to its own student population. These are:", "opts": ["National norms", "Developmental norms", "Local norms", "National anchor norms"], "ans": 2, "why": "Local norms are developed by test users to show how the LOCAL population performs. National norms come from a nationally representative sample. National anchor norms are equivalency tables for comparing scores on two different tests.", "hint": "Whose students are the norms based on?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A selection test's validity coefficient with job performance is .40. Based on the reviewer's interpretation table, this test is:", "opts": ["Likely to be useful", "Unlikely to be useful", "Very beneficial", "Dependent on the circumstances"], "ans": 2, "why": "Validity coefficients: above .35 = very beneficial; .21–.35 = likely to be useful; .11–.20 = depends on the circumstances; below .11 = unlikely to be useful. Validity coefficients are much smaller than reliability coefficients, so .40 is strong.", "hint": "Validity coefficients run much lower than reliability coefficients. Check the top band."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A personality scale has a Cronbach's alpha of .75. Based on the usual interpretation table, its internal consistency is:", "opts": ["Excellent", "Good", "Questionable", "Acceptable"], "ans": 3, "why": "Alpha bands: ≥ .90 excellent; .80–.89 good; .70–.79 acceptable; .60–.69 questionable; .50–.59 poor; below .50 unacceptable.", "hint": "Find the band that .75 falls into."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A teacher gives Form A of a vocabulary test, and immediately afterward gives Form B, a different but equivalent version, to the same class. The correlation between the forms mainly reflects error due to:", "opts": ["Restriction of range", "Scorer differences", "Item (content) sampling", "Time sampling"], "ans": 2, "why": "Alternate/parallel forms given IMMEDIATELY mainly capture CONTENT (item) sampling error: differences due to the specific items on each form. Delayed alternate forms capture both time AND content sampling error. Scorer differences are captured by inter-rater reliability.", "hint": "No time passed, so what differs between the two forms?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "When establishing parallel-forms reliability, half the group takes Form A then Form B, while the other half takes Form B then Form A. This technique is used to control:", "opts": ["Construct underrepresentation", "Scorer drift", "Restriction of range", "Carryover effects (counterbalancing)"], "ans": 3, "why": "Counterbalancing uses different sequences for different groups to avoid carryover effects (practice, fatigue) when two forms are administered.", "hint": "Why would you switch the order for half the group?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Liza's observed score is 110 on a test with an SEM of 5. What is the 68% confidence interval for her true score?", "opts": ["100 to 120", "105 to 115", "95 to 125", "108 to 112"], "ans": 1, "why": "68% ≈ ±1 SEM: 110 − 5 = 105 and 110 + 5 = 115. The 95% interval would be ±2 SEM (100 to 120), and about 99% would be ±3 SEM (95 to 125).", "hint": "68% corresponds to one SEM on each side."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Job applicants complain that a 'sales aptitude' test full of abstract geometry puzzles 'has nothing to do with selling,' and some refuse to take it seriously, even though it predicts sales well. The test is weak in:", "opts": ["Inter-rater reliability", "Face validity", "Content validity as rated by SMEs", "Predictive validity"], "ans": 1, "why": "Face validity = whether the test APPEARS to measure what it claims, from the test taker's view. Low face validity can hurt motivation and cooperation even when the test is statistically valid.", "hint": "The problem is how the test looks to the people taking it."}, {"subj": "pa", "set": "Set 1 - Reliab
