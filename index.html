ee on a wage increase. They bring in a neutral third party who listens to both sides and then hands down a decision both must follow. This is:", "opts": ["Mediation", "Negotiation and bargaining", "Arbitration", "Triangling"], "ans": 2, "why": "MEDIATION = a neutral third party HELPS both sides reach their own agreement (the mediator does not decide). ARBITRATION = the neutral third party listens, then MAKES THE DECISION. Triangling = discussing the conflict with a third party instead of the person involved (an avoiding style).", "hint": "The third party makes the decision, not just helps."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "Jessa says about her teammate: 'I trust Mark because I've worked with him for three years and he always delivers exactly when he says he will.' This is:", "opts": ["Collective efficacy", "Calculus-based trust", "Identification-based trust", "Knowledge-based trust"], "ans": 3, "why": "Calculus-based = trust because the other person would face SANCTIONS for violating it. KNOWLEDGE-based = trust from the PREDICTABILITY of their behavior (track record). Identification-based = mutual understanding and an EMOTIONAL bond.", "hint": "His track record makes him predictable."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "Each member of a cautious investment committee leaned slightly toward a safe option. After group discussion, the committee chose an even MORE cautious option than any member originally preferred. This is:", "opts": ["Groupthink", "Social loafing", "Illusion of invulnerability", "Group polarization"], "ans": 3, "why": "Group polarization = groups make decisions that are MORE EXTREME than individuals' initial positions, in whichever direction the group already leaned (riskier OR more cautious). Groupthink is about poor decisions from excessive cohesion and suppressed dissent.", "hint": "The group ended up more extreme than any individual."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "To generate ideas without production blocking or evaluation apprehension, a facilitator asks members to silently write down their ideas on paper before any discussion happens. This technique is:", "opts": ["Brainstorming", "Confrontation meeting", "Brainwriting", "Interacting group"], "ans": 2, "why": "Brainwriting removes conversation during idea generation, so people don't have to wait their turn or fear judgment. In brainstorming, people say ideas ALOUD (with no criticism allowed until all ideas are given).", "hint": "No talking during idea generation; ideas are written."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Before announcing a new system, management shows employees data proving the company lost 30% of its market share to competitors, to convince them that the current way of working is no longer acceptable. In Lewin's model, this is:", "opts": ["Moving", "Unfreezing", "Refreezing", "Internalization"], "ans": 1, "why": "Lewin's 3 stages: UNFREEZING = convincing people the current state is unacceptable and change is needed. MOVING = taking steps toward the desired state. REFREEZING = locking in the change through policies and rewards. Internalization is Carnall's final stage, not Lewin's.", "hint": "Management is convincing people the current state is unacceptable."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "After a new customer-service process is rolled out, management writes it into the official policy manual and rewards employees who consistently follow it. In Lewin's model, this is:", "opts": ["Refreezing", "Moving", "Adaptation", "Unfreezing"], "ans": 0, "why": "Refreezing = making the change STICK: formalizing new policies and rewarding behavior consistent with the change.", "hint": "They're locking the new process in place."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A company announced a major restructuring without explaining why it was needed. Employees saw no reason to change, and the effort stalled. Which step of Kotter's model was MOST clearly skipped?", "opts": ["Create short-term wins", "Increase urgency", "Embed changes into culture", "Build on wins"], "ans": 1, "why": "Kotter's step 1 is to INCREASE URGENCY: create a compelling, immediate need for change so the status quo no longer feels acceptable. Without it, people don't buy in. It parallels Lewin's unfreezing.", "hint": "Nobody felt a need for change. That's Kotter's very first step."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "To silence cynics early in a two-year digital transformation, leaders deliberately plan a visible improvement in the first 3 months and publicly reward the team behind it. Which Kotter step is this?", "opts": ["Communicate the vision", "Create short-term wins", "Develop the vision", "Build a guiding team"], "ans": 1, "why": "Create short-term wins = plan visible, unambiguous early improvements and reward the people involved. This builds momentum, validates the strategy, and silences cynics and early resisters.", "hint": "Visible, early, rewarded."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Employees have stopped denying that the new scheduling system is coming. They are now trying it out, learning how it works, and adjusting how they do their jobs. In Carnall's stages of change acceptance, they are in:", "opts": ["Discarding", "Adaptation", "Internalization", "Defense"], "ans": 1, "why": "Carnall's 5 stages: Denial → Defense (justifying the old ways) → Discarding (realizing they must change too) → ADAPTATION (testing the system, learning, adjusting) → Internalization (fully comfortable and immersed in the new culture).", "hint": "They're past denial and actually testing the new system."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "When told about the new process, an employee says she won't push for it, but she'll go along if it's really necessary. Then she asks, 'But are you SURE the old system is actually broken?' She is a:", "opts": ["Reluctant changer", "Change resister", "Receptive changer", "Change analyst"], "ans": 0, "why": "Reluctant changers won't instigate or welcome change but will change if necessary: 'Are you sure it's broken?' Receptive changers: 'If it's broke, I'll help fix it.' Change analysts: change only if it improves things. Change resisters: 'It may be broke, but it's still better than the unknown.'", "hint": "Won't push for change, will go along if necessary, asks if it's really broken."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "A consultant administers an anonymous attitude survey to all employees, compiles results by department, presents the data back to each group, and then helps them plan changes. Which OD intervention is this?", "opts": ["Appreciative inquiry", "Total Quality Management", "Survey feedback", "Team building"], "ans": 2, "why": "Survey feedback = systematic data collection through an anonymous survey, results compiled by unit, FED BACK to members, then groups identify changes. Top management supports and participates.", "hint": "Survey, then results fed back to each group."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "Instead of asking 'What's wrong with our department?', a facilitator asks employees to describe moments when the team was at its best, then uses those strengths to plan the future. This intervention is:", "opts": ["Confrontation meeting", "Survey feedback", "Appreciative inquiry", "Process consultation"], "ans": 2, "why": "Appreciative Inquiry (positive OD) focuses on STRENGTHS, the best of what employees offer, and past successes rather than problems. Its 5-D cycle: Define → Discover → Dream → Design → Deliver.", "hint": "The focus is on strengths, not problems."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "In an Appreciative Inquiry session, employees have just finished identifying their past successes. They are now asked to imagine and describe the ideal future of their department. Which phase is this?", "opts": ["Discover", "Design", "Deliver", "Dream"], "ans": 3, "why": "Define (focus of inquiry) → DISCOVER (what's working, past successes) → DREAM (envision the positive future) → DESIGN (strategies and plans to make it happen) → DELIVER (implement).", "hint": "They've finished discovering. Now they imagine."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Overnight, a traditional bank closes all its physical branches and becomes a purely digital bank, drastically changing how everything is done. According to Burke, this is:", "opts": ["Evolutionary change", "Developmental change", "Incremental change", "Revolutionary change"], "ans": 3, "why": "Burke: EVOLUTIONARY change = continual upgrading and improvement of processes. REVOLUTIONARY change = a 'real jolt to the system' that drastically changes how things are done.", "hint": "Overnight and drastic, or gradual?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Middle managers quietly oppose a restructuring because it will cut their authority, headcount, and budgets. This is mainly which type of resistance to change?", "opts": ["Technical resistance", "Cultural resistance", "Reluctant change", "Political resistance"], "ans": 3, "why": "POLITICAL resistance = concerns about power, influence, resources, and self-interest. TECHNICAL = practical or operational concerns (e.g., the system is hard to use). CULTURAL = clashes with deeply ingrained values, norms, and traditions ('this isn't who we are').", "hint": "What do the middle managers stand to lose?"}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A company asks employees to identify and eliminate unnecessary forms, reports, and paperwork that serve no useful purpose. In a 'sacred cow hunt,' this targets the:", "opts": ["Paper cow", "Process cow", "Meeting cow", "Speed cow"], "ans": 0, "why": "Sacred cow hunt = removing practices with no useful purpose. PAPER cow = unnecessary paperwork. MEETING cow = too many or too-long meetings. SPEED cow = unnecessary deadlines. There is no 'process cow'.", "hint": "Forms and reports are the target."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A hospital is about to switch to a new electronic scheduling system that nurses will use daily. Which approach is MOST likely to reduce nurses' resistance?", "opts": ["Penalize nurses who keep using the old system", "Involve nurse representatives in selecting and testing the system", "Delay the change until every nurse agrees to it", "Announce the change in a memo the day before launch"], "ans": 1, "why": "The three major strategies for dealing with resistance: EMPATHY and SUPPORT, COMMUNICATION, and PARTICIPATION/INVOLVEMENT. People resist less when they help shape the change. Last-minute memos and penalties raise resistance.", "hint": "People resist less when they help shape the change."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "A consultant observes a team's meetings and helps members become aware of HOW they communicate, make decisions, and handle conflict, so they can solve their own problems in the future. This is a:", "opts": ["Structural intervention", "Technostructural intervention", "Process intervention (process consultation)", "Content intervention"], "ans": 2, "why": "PROCESS interventions help the group see its own INTERNAL DYNAMICS (communication, roles, decision-making, norms). CONTENT interventions address the substance of the work or mission. STRUCTURAL interventions change the group's structure.", "hint": "The consultant focuses on HOW they work together, not on the work itself."}, {"subj": "io", "set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "After a major market disruption, a 50-year-old print publisher redefines its core identity, purpose, and mission, rebuilding itself from the ground up as a digital media company. This is best described as:", "opts": ["Incremental change", "Organizational transformation", "Remedial change", "Organizational development"], "ans": 1, "why": "Organizational TRANSFORMATION = comprehensive change to the organization's fundamental 'DNA' (identity, purpose, mission), usually triggered by major disruption. OD = planned, long-term, organization-wide improvement of the existing system. Remedial change = fixing specific existing problems.", "hint": "They redefined who they are, not just a process."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A researcher gives the same trait-anxiety inventory to 80 employees in January and again in May, then correlates the two sets of scores. Which reliability estimate is she obtaining?", "opts": ["Split-half reliability", "Inter-rater reliability", "Test-retest reliability", "Alternate-forms reliability"], "ans": 2, "why": "Same test, same people, two occasions, correlate the scores = test-retest. It fits traits that are stable over time, like trait anxiety. Alternate forms would use two different versions; split-half needs only one administration; inter-rater compares scorers.", "hint": "Count the versions of the test and the number of times it was given."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Students retook the same reasoning test only two days after the first session. Many remembered the items, and their second scores were noticeably higher. What most likely distorted the test-retest estimate?", "opts": ["Carryover (practice) effects", "Restriction of range", "Validity shrinkage", "Mortality"], "ans": 0, "why": "Carryover effects happen when the test-retest interval is short: the second session is influenced by memory or practice from the first. Practice effects (higher scores the second time) are one form of this. Mortality = people missing the second session.", "hint": "Think about what a very short interval between sessions does."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "When the interval between two administrations of the same test is longer than six months, the test-retest estimate is often called the:", "opts": ["Coefficient of stability", "Coefficient of equivalence", "Coefficient of alienation", "Coefficient of determination"], "ans": 0, "why": "A long-interval test-retest estimate (over 6 months) = coefficient of stability. Coefficient of equivalence goes with alternate/parallel forms. Coefficient of alienation = variance NOT explained by the predictor; coefficient of determination = r squared, the variance that IS explained.", "hint": "The long interval tells you how steady scores stay over time."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A 50-item multiple-choice exam is scored right or wrong, and its items vary widely in difficulty. Which statistic is the best choice for its inter-item consistency?", "opts": ["Cronbach's alpha", "Cohen's kappa", "KR-20", "KR-21"], "ans": 2, "why": "KR-20 is the statistic of choice for DICHOTOMOUS items (right/wrong) with DIFFERENT difficulty levels. KR-21 assumes all items have about the same difficulty. Cronbach's alpha is for nondichotomous items like Likert scales. Kappa is for rater agreement.", "hint": "Two details matter: how the items are scored, and whether their difficulty is uniform."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A developer builds a 30-item job satisfaction scale answered on a 5-point Likert format. Which internal consistency estimate is most appropriate?", "opts": ["Kendall's W", "Cronbach's alpha", "KR-21", "KR-20"], "ans": 1, "why": "Cronbach's alpha is the preferred internal consistency estimate for NONdichotomous items (Likert, partial credit) and needs only one administration. KR-20 and KR-21 are for right/wrong items. Kendall's W is for agreement among rankings.", "hint": "How is each item answered: right/wrong, or on a range of points?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A newly built 40-item self-esteem scale shows a Cronbach's alpha of .97. According to Streiner, what might this very high value suggest?", "opts": ["The scale has perfect validity", "The scale has low reliability", "The items may be redundant", "The scale is too heterogeneous"], "ans": 2, "why": "Streiner (2003) noted that an alpha above .90 may be 'too high' and signal that items are redundant (saying the same thing in slightly different words). High reliability never proves validity.", "hint": "Can a scale be 'too consistent'? What would cause that?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "After correlating scores on the odd and even items of a single test, a developer applies the Spearman-Brown formula. What is the formula doing here?", "opts": ["Estimating the test's criterion-related validity", "Correcting scores for guessing", "Converting raw scores into z-scores", "Estimating the reliability of the full-length test from the half-test correlation"], "ans": 3, "why": "A split-half correlation only reflects HALF the test. Spearman-Brown adjusts it upward to estimate the reliability of the whole test, since longer tests are more reliable. The Spearman-Brown prophecy formula can also estimate how many items are needed to reach a target reliability.", "hint": "A half-length test has fewer items than the real thing."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "The correlation between the two halves of a test is .60. Using the Spearman-Brown formula, r = 2r_half / (1 + r_half), what is the estimated reliability of the full test?", "opts": [".80", ".60", ".36", ".75"], "ans": 3, "why": "2(.60) / (1 + .60) = 1.20 / 1.60 = .75. The full-test estimate is always higher than the half-test correlation because the whole test has twice as many items. Note: the reviewer names Spearman-Brown but doesn't print this formula; it's the standard textbook formula.", "hint": "Plug .60 into the formula: double it on top, add 1 on the bottom."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Why is splitting a test simply down the middle (first half vs. second half) NOT recommended for split-half reliability?", "opts": ["It requires two administrations of the test", "It only works for Likert-type items", "Fatigue, anxiety, and item difficulty can differ between the first and second halves", "It always produces a coefficient of zero"], "ans": 2, "why": "Dividing a test in the middle can spuriously raise or lower the coefficient because the halves differ in fatigue, test anxiety, and item difficulty (items often get harder toward the end). Odd-even splitting avoids this.", "hint": "What changes between the start and the end of a long test?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Three psychologists independently classify 50 children's drawings into diagnostic categories. Which statistic best measures their agreement?", "opts": ["Fleiss' kappa", "KR-20", "Cohen's kappa", "Pearson r"], "ans": 0, "why": "Kappa statistics are used for NOMINAL (category) data. Cohen's kappa = agreement between TWO raters; Fleiss' kappa = agreement among THREE OR MORE raters. Kendall's W is used when raters RANK things.", "hint": "Nominal categories, and count the raters."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Four judges each rank 10 essay contest entries from best to worst. Which statistic evaluates the agreement of their rankings?", "opts": ["Kendall's W", "Fleiss' kappa", "Cronbach's alpha", "Cohen's kappa"], "ans": 0, "why": "Kendall's W (coefficient of concordance) is for rankings/ordinal data across three or more raters. Kappa is for nominal categories, not ranks.", "hint": "The judges are ranking, not sorting into categories."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A company correlates its hiring test with job performance, but only for employees who were hired, all of whom had top test scores. The validity coefficient comes out surprisingly low. What is the most likely reason?", "opts": ["Construct-irrelevant variance", "Inflation of range", "Restriction of range", "Carryover effects"], "ans": 2, "why": "When the variance of a variable is restricted by sampling (only high scorers were hired), the correlation tends to be LOWER. Inflation of range does the opposite: it makes correlations higher.", "hint": "Who is missing from the sample that was correlated?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A test has a generous time limit so everyone can attempt every item, but some items are so difficult that no test taker gets a perfect score. This is a:", "opts": ["Ceiling-effect test", "Criterion-referenced test", "Power test", "Speed test"], "ans": 2, "why": "POWER test = enough time to try everything, but items vary up to very hard levels, so perfect scores are unlikely. SPEED test = uniform, easy items, and the time limit is what separates people.", "hint": "Everyone has enough time, yet no one gets a perfect score."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "Mark's observed score is 80 and the test's standard error of measurement (SEM) is 4. What is the approximate 95% confidence interval for his true score?", "opts": ["72 to 88", "76 to 84", "78 to 82", "68 to 92"], "ans": 0, "why": "95% is about ±2 SEM: 80 − 8 = 72 and 80 + 8 = 88. The 68% interval would be ±1 SEM (76 to 84), and about 99% would be ±3 SEM (68 to 92).", "hint": "95% means about two SEMs on each side of the observed score."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "As a test's reliability increases, what happens to its standard error of measurement?", "opts": ["It decreases", "It becomes equal to the validity coefficient", "It stays the same", "It increases"], "ans": 0, "why": "Higher reliability = lower SEM. A more reliable test has less error in each person's score, so the band around the true score gets narrower.", "hint": "Reliability and measurement error move in which direction relative to each other?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A researcher argues that test scores vary across occasions because of specific features of the testing situation (the number of items, scorer training, purpose of testing) and studies these 'facets' to find a 'universe score.' Which theory is this?", "opts": ["Item response theory", "Domain sampling theory", "Generalizability theory", "Classical test theory"], "ans": 2, "why": "Generalizability theory uses facets, universe, and universe score. Under the same conditions of all facets, the same score should be obtained. Classical test theory is X = T + E. IRT models the probability of a response given a latent trait level.", "hint": "Watch for the words 'facets' and 'universe'."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A licensing exam models the probability that a person with a given level of a latent ability will answer an item of a certain difficulty correctly, using item difficulty and discrimination parameters. This approach is:", "opts": ["Item response theory (latent-trait theory)", "Generalizability theory", "Spearman's two-factor theory", "Classical test theory"], "ans": 0, "why": "IRT (latent-trait theory) models the probability that a person with X amount of ability or trait will perform at level Y on an item. It's widely used in licensing exams and computerized adaptive testing. The Rasch model is one IRT model.", "hint": "The model is about the probability of a response given a hidden ability level."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten subject-matter experts rate each item of a new exam as 'essential,' 'useful but not essential,' or 'not necessary.' Which index will be computed from their ratings?", "opts": ["Kuder-Richardson Formula 20", "Lawshe's Content Validity Ratio (CVR)", "Item-discrimination index", "Coefficient of stability"], "ans": 1, "why": "Lawshe's CVR is based on how many experts rate an item 'essential.' It's a quantitative index of CONTENT validity. A positive CVR means more than half the experts said essential.", "hint": "Experts judging whether items are 'essential' to the content."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten experts rate an item, and exactly 5 of them mark it 'essential.' What is the item's CVR?", "opts": ["0", "−0.50", "1.00", "0.50"], "ans": 0, "why": "CVR = (ne − N/2) / (N/2) = (5 − 5) / 5 = 0. A CVR of zero means exactly half the experts rated the item essential.", "hint": "Compare the number of 'essential' ratings with half of the panel."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Ten experts rate an item, and 8 of them mark it 'essential.' What is the item's CVR?", "opts": ["0.80", "1.60", "0.30", "0.60"], "ans": 3, "why": "CVR = (ne − N/2) / (N/2) = (8 − 5) / 5 = 3 / 5 = 0.60. A positive value means more than half the panel considered the item essential.", "hint": "Subtract half the panel from the number of 'essential' votes, then divide by half the panel."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A clinic gives patients a new 10-item depression questionnaire and, on the same day, the well-established longer inventory it hopes to replace. The two sets of scores are correlated. This provides evidence of:", "opts": ["Incremental validity", "Concurrent validity", "Content validity", "Predictive validity"], "ans": 1, "why": "Concurrent validity = test and criterion collected at about the SAME TIME. It's often used when a new, shorter test is meant to replace a longer or costlier one. Predictive validity collects the criterion LATER.", "hint": "When was the comparison measure collected?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A company gives an aptitude test to job applicants, then six months later correlates their scores with supervisors' performance ratings. This provides evidence of:", "opts": ["Face validity", "Discriminant validity", "Concurrent validity", "Predictive validity"], "ans": 3, "why": "Predictive validity = test scores now, criterion measured later. It's essential for selection and placement tests that aim to forecast future success.", "hint": "There's a gap of months between the test and the criterion."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A firm already uses a cognitive ability test to predict sales performance. Adding a conscientiousness inventory explains additional variance in sales that the cognitive test alone did not. This shows the inventory's:", "opts": ["Face validity", "Validity shrinkage", "Incremental validity", "Concurrent validity"], "ans": 2, "why": "Incremental validity = how much an ADDITIONAL predictor explains about the criterion beyond the predictors already in use.", "hint": "The new test adds something on top of what's already in use."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on a new anxiety scale correlate .78 with scores on a long-established anxiety inventory. This is evidence of:", "opts": ["Discriminant validity", "Convergent validity", "Content validity", "Inter-rater reliability"], "ans": 1, "why": "Convergent validity = high correlation with an established measure of the SAME construct. Both measures 'converge' on anxiety.", "hint": "Same construct, established measure, high correlation."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on the same new anxiety scale correlate only .05 with a vocabulary test, a construct it should have nothing to do with. This is evidence of:", "opts": ["Discriminant validity", "Known-groups validity", "Convergent validity", "Predictive validity"], "ans": 0, "why": "Discriminant validity = LITTLE relationship with measures of constructs the test should NOT theoretically correlate with. NOTE: the reviewer's definition says 'should theoretically be correlated.' It's missing the word NOT, so use the definition here.", "hint": "Low correlation with something unrelated is what you'd hope for."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A new psychosis screening scale yields much higher scores for patients already diagnosed with schizophrenia than for a community sample with no psychiatric history. This is evidence of construct validity known as:", "opts": ["Evidence of changes with age", "Known-groups validity (group differences)", "Concurrent validity", "Face validity"], "ans": 1, "why": "Known-groups validity: the test differentiates groups already known, from external criteria, to differ on the construct. It's one form of construct validity evidence.", "hint": "The comparison groups already differ on the construct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "Scores on a math word-problem test turn out to depend heavily on how well students read English, not just on their math ability. This problem is called:", "opts": ["Restriction of range", "Construct-irrelevant variance", "Item branching", "Construct underrepresentation"], "ans": 1, "why": "Construct-IRRELEVANT variance = scores are influenced by something outside the construct (reading ability). Construct UNDERREPRESENTATION = the test leaves out important parts of the construct.", "hint": "The scores are picking up a skill that isn't part of the construct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A 'depression' inventory asks only about sadness and ignores sleep, appetite, energy, and concentration. Its main weakness is:", "opts": ["Construct underrepresentation", "Low face validity", "Construct-irrelevant variance", "Item bias"], "ans": 0, "why": "Construct underrepresentation = failing to capture important components of the construct. Here the test only taps one facet of depression.", "hint": "What's missing from this depression test?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "In a multitrait-multimethod (MTMM) matrix, the correlations between the SAME trait measured by DIFFERENT methods (the validity diagonal) should be high. High values there are evidence of:", "opts": ["Test-retest reliability", "Content validity", "Discriminant validity", "Convergent validity"], "ans": 3, "why": "Heteromethod-monotrait correlations (same trait, different methods) = the validity diagonal: evidence of CONVERGENT validity. Low heterotrait correlations support DISCRIMINANT validity. Monotrait-monomethod values form the reliability diagonal.", "hint": "Same trait, different methods. Do they agree?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A researcher wants to test whether questionnaire data fit a hypothesized five-factor structure proposed by an existing theory. Which procedure fits best?", "opts": ["Confirmatory factor analysis", "Principal component analysis", "Exploratory factor analysis", "Cross-validation"], "ans": 0, "why": "CFA is 'theory-testing': it confirms a HYPOTHESIZED structure. EFA is 'theory-generating', used when you have no preconceived idea of the factors. PCA reduces data dimensionality.", "hint": "The researcher already has a structure in mind."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "In a factor analysis, the researcher keeps only factors with eigenvalues greater than 1.0. Which rule is this?", "opts": ["Kaiser criterion (K1 rule)", "Scree test (elbow method)", "Spearman-Brown prophecy", "Rule of three"], "ans": 0, "why": "Kaiser criterion = retain factors with eigenvalues > 1.0. It tends to OVERestimate the number of factors when there are many variables. The scree test keeps factors before the 'elbow' of the eigenvalue plot, but it's subjective.", "hint": "An eigenvalue cutoff of 1.0 is named after a person."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A test validated on one sample is re-validated on a new, different sample, and its validity coefficient drops a little. This drop is called:", "opts": ["Co-norming", "Restriction of range", "Validity shrinkage", "Scoring drift"], "ans": 2, "why": "Cross-validation = re-validating on a different group. The decrease in validity that typically follows is validity SHRINKAGE. Co-norming = norming more than one test on the same group.", "hint": "Validity usually drops a little on a fresh sample."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms", "q": "Ana's percentile rank on a reading test is 85. What does this mean?", "opts": ["She scored higher than about 85% of the norm group", "She answered 85% of the items correctly", "She is in the top 85 test takers", "Her score is 85 points above the mean"], "ans": 0, "why": "A percentile = the percentage of people in the norm group whose scores fall BELOW a particular raw score. Don't confuse it with percentage CORRECT, which is the number of items answered correctly × 100.", "hint": "Percentile rank is not the same as percent correct."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms", "q": "A university's guidance office builds norms from its own freshmen's scores so it can interpret results relative to its own student population. These are:", "opts": ["National norms", "Local norms", "Developmental norms", "National anchor norms"], "ans": 1, "why": "Local norms are developed by test users to show how the LOCAL population performs. National norms come from a nationally representative sample. National anchor norms are equivalency tables for comparing scores on two different tests.", "hint": "Whose students are the norms based on?"}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity", "q": "A selection test's validity coefficient with job performance is .40. Based on the reviewer's interpretation table, this test is:", "opts": ["Likely to be useful", "Unlikely to be useful", "Dependent on the circumstances", "Very beneficial"], "ans": 3, "why": "Validity coefficients: above .35 = very beneficial; .21–.35 = likely to be useful; .11–.20 = depends on the circumstances; below .11 = unlikely to be useful. Validity coefficients are much smaller than reliability coefficients, so .40 is strong.", "hint": "Validity coefficients run much lower than reliability coefficients. Check the top band."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reliability", "q": "A personality scale has a Cronbach's alpha of .75. Based on the usual interpretation table, its internal consistency is:", "opts": ["Questionable", "Good", "Excellent", "Acceptable"], "ans": 3, "why": "Alpha bands: ≥ .90 excellent; .80–.89 good; .70–.79 acceptable; .60–.69 questionable; .50–.59 poor; below .50 unacceptable.", "hint": "Find the band that .75 falls into."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "IQ scores have equal intervals between values but no true zero point (an IQ of 0 doesn't mean 'no intelligence'). On what scale of measurement are they?", "opts": ["Ordinal", "Nominal", "Interval", "Ratio"], "ans": 2, "why": "Interval = ordered, equal intervals, NO absolute zero (IQ, Celsius, calendar years). Ratio adds a true zero (height, weight, reaction time, Kelvin). Ordinal = ranked but unequal gaps. Nominal = categories only.", "hint": "Equal gaps between values, but zero isn't 'none of it'."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher measures participants' reaction times in milliseconds. On what scale is reaction time measured?", "opts": ["Nominal", "Ratio", "Ordinal", "Interval"], "ans": 1, "why": "Reaction time has equal intervals AND a true zero (0 ms = no time elapsed), so it's ratio data. You can say 400 ms is twice as long as 200 ms, which you can only do on a ratio scale.", "hint": "Does 0 ms mean truly 'no time at all'?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Monthly household incomes in a barangay survey are extremely skewed because of a few very wealthy families. Which measure of central tendency best represents the typical household?", "opts": ["Mode", "Median", "Range", "Mean"], "ans": 1, "why": "For skewed interval/ratio data, use the MEDIAN, because the mean gets pulled toward the extreme values. Mean = interval/ratio data that's roughly normal; mode = nominal data. Range measures variability, not central tendency.", "hint": "Which average ignores how extreme the richest families are?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A professor gives an extremely difficult exam. Most students score low and only a few score high. The distribution is:", "opts": ["Mesokurtic", "Positively skewed (mean > median > mode)", "Negatively skewed (mean < median < mode)", "Perfectly normal"], "ans": 1, "why": "POSITIVE skew = relatively few scores at the HIGH end, with the tail pointing right. This is typical of a DIFFICULT test, and mean > median > mode. NEGATIVE skew = few scores at the low end (an EASY test).", "hint": "Where do the few unusual scores sit? The tail points toward them."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "On a very easy quiz, almost everyone scores high and only a few students score low. The distribution is:", "opts": ["Platykurtic", "Negatively skewed", "Bimodal", "Positively skewed"], "ans": 1, "why": "Easy test → most scores pile up high, and the few low scores form a tail to the LEFT = negative skew (mean < median < mode).", "hint": "Where is the tail: among the high scores or the low scores?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A test taker's z-score is −1.5. What is her equivalent T-score?", "opts": ["65", "35", "45", "15"], "ans": 1, "why": "T = 50 + 10(z) = 50 + 10(−1.5) = 50 − 15 = 35. T-scores have a mean of 50 and an SD of 10. A negative z means below the mean, so the T-score must be below 50.", "hint": "T-scores have mean 50 and SD 10. A negative z puts her below 50."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "In a normal distribution, approximately what percentage of scores fall between one standard deviation below and one standard deviation above the mean?", "opts": ["68%", "50%", "34%", "95%"], "ans": 0, "why": "About 34% lie between the mean and +1 SD, and another 34% between the mean and −1 SD, so 68% fall within ±1 SD. About 95% fall within ±2 SD and about 99.7% within ±3 SD.", "hint": "Add the area on both sides of the mean, one SD each way."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher compares the exam scores of a tutored group and a separate untutored group. Scores are interval and normally distributed. Which test should she use?", "opts": ["Chi-square test of independence", "Paired (dependent) t-test", "Mann-Whitney U test", "Independent samples t-test"], "ans": 3, "why": "Two separate, unrelated groups + normal interval/ratio data → independent samples t-test. If the data were skewed or ordinal, its nonparametric equivalent is Mann-Whitney U. A paired t-test is for the SAME people measured twice.", "hint": "How many groups, are they the same people, and is the data normal?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "The same researcher compares tutored vs. untutored students again, but this time the outcome is a Likert-type satisfaction rating and the scores are badly skewed. Which test fits now?", "opts": ["Friedman test", "Wilcoxon signed-rank test", "Independent samples t-test", "Mann-Whitney U test"], "ans": 3, "why": "Mann-Whitney U is the nonparametric equivalent of the independent samples t-test, used for ordinal or non-normal data from two independent groups. Wilcoxon signed-rank is for two RELATED (paired) samples.", "hint": "It's still two separate groups, but the data is no longer normal."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Stress levels of the same 30 students are measured before and after their board exam. The difference scores are normally distributed. Which test should be used?", "opts": ["Paired (dependent) t-test", "Independent samples t-test", "Kruskal-Wallis H test", "One-way ANOVA"], "ans": 0, "why": "Same group measured twice (pre and post) = dependent/paired design → paired t-test. If the difference scores were not normal, you'd use the Wilcoxon signed-rank test.", "hint": "Is this two different groups, or the same people measured twice?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "One group of participants rates their mood (an ordinal rating) at three time points: morning, afternoon, and evening. Which nonparametric test compares the three conditions?", "opts": ["Mann-Whitney U test", "Kruskal-Wallis H test", "Chi-square goodness of fit", "Friedman test"], "ans": 3, "why": "Friedman = nonparametric test for ONE group measured across 3+ conditions (the counterpart of repeated measures ANOVA). Kruskal-Wallis = 3+ INDEPENDENT groups (the counterpart of one-way ANOVA).", "hint": "Same people, three or more measurements, ranked data."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher wants to know whether sex (male/female) is related to preferred counseling format (face-to-face, online, group). The data are frequency counts. Which test fits?", "opts": ["Independent samples t-test", "Chi-square test of independence", "Chi-square goodness of fit", "Pearson r"], "ans": 1, "why": "Two categorical variables in a contingency table → chi-square test of INDEPENDENCE. Goodness of fit is for ONE categorical variable compared against an expected distribution. Chi-square needs raw counts, not percentages.", "hint": "Count how many categorical variables are involved."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A chi-square test of independence uses a contingency table with 3 rows and 4 columns. What are its degrees of freedom?", "opts": ["5", "12", "6", "7"], "ans": 2, "why": "df = (r − 1)(c − 1) = (3 − 1)(4 − 1) = 2 × 3 = 6. For goodness of fit, df = k − 1.", "hint": "Subtract one from the rows and one from the columns, then multiply."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A one-way ANOVA comparing four teaching methods is significant. The groups have equal sizes and equal variances, and the researcher wants to compare all possible pairs of groups. Which post hoc test is ideal?", "opts": ["Tukey's HSD", "Dunn's test", "Dunnett's test", "Games-Howell test"], "ans": 0, "why": "Tukey's HSD = all pairwise comparisons when variances and group sizes are equal. Dunnett's = compares each treatment ONLY against one control group. Games-Howell = when variances are UNEQUAL (Levene's test is significant). Dunn's = follow-up to Kruskal-Wallis.", "hint": "All pairs, with every assumption met."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "In a drug trial, three dosage groups are each compared only against a single placebo control group after a significant ANOVA. Which post hoc test is designed for this?", "opts": ["Scheffé's test", "Tukey's HSD", "Dunnett's test", "Nemenyi test"], "ans": 2, "why": "Dunnett's test compares multiple treatment groups against ONE control/benchmark group only. It reduces the comparisons from k(k−1)/2 to k − 1, which preserves power.", "hint": "Everything is compared with one special group."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A correlation of r = .60 is found between study hours and exam scores. What percentage of the variance in exam scores is accounted for by study hours?", "opts": ["40%", "60%", "36%", "64%"], "ans": 2, "why": "The coefficient of determination = r² = .60² = .36, so 36% of the variance is explained. The remaining 64% (1 − r²) is the coefficient of alienation: variance NOT accounted for.", "hint": "Square the correlation."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher correlates sex (a true dichotomy: male/female) with scores on an interval-level anxiety scale. Which correlation coefficient is appropriate?", "opts": ["Tetrachoric", "Biserial", "Point-biserial", "Phi coefficient"], "ans": 2, "why": "Point-biserial = TRUE dichotomy + interval/ratio. Biserial = ARTIFICIAL dichotomy (e.g., pass/fail created from a score) + interval/ratio. Phi = two dichotomies (true or artificial) in a 2×2 table. Tetrachoric = two artificial dichotomies.", "hint": "Is the two-category variable naturally two categories, or made that way by a cutoff?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Before running a t-test, a researcher checks normality with the Shapiro-Wilk test and gets p = .21. What should she conclude?", "opts": ["The normality assumption is met (fail to reject H0)", "The result is statistically significant, so normality is violated", "She must use a nonparametric test", "The data are not normally distributed"], "ans": 0, "why": "In normality testing, H0 says the data ARE normal. p > .05 means fail to reject H0, so normality is assumed. Unlike most tests, here a NON-significant result is the outcome you want.", "hint": "In normality tests, what does the null hypothesis claim?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher plans 5 pairwise comparisons and wants to keep the familywise alpha at .05 using the Bonferroni correction. What alpha should each comparison use?", "opts": [".05", ".01", ".001", ".25"], "ans": 1, "why": "Bonferroni: α adjusted = α / k = .05 / 5 = .01. It controls the inflated Type I error risk from running many tests, but becomes very conservative as k grows.", "hint": "Divide the overall alpha by the number of comparisons."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Research Design", "q": "A school psychologist wants to test whether a new study-skills program raises grades, but she must use two existing class sections and cannot randomly assign students. Which design is this?", "opts": ["True experimental design", "Cross-sectional design", "Correlational design", "Quasi-experimental design"], "ans": 3, "why": "Quasi-experimental = infers cause and effect when random assignment isn't feasible, using intact groups. A true experiment requires random assignment. Correlational designs don't manipulate anything.", "hint": "What's missing compared to a true experiment?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Development", "q": "A developer wants the final version of her test to have 50 items. As a rule of thumb, about how many items should the first draft of the item pool contain?", "opts": ["About 50", "About 60", "About 100", "About 500"], "ans": 2, "why": "It's usually advisable for the first draft to contain about TWICE the number of items the final version will have, since many will be dropped after tryout and item analysis.", "hint": "Expect to throw out a lot of items after tryout."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Development", "q": "For a 40-item test, roughly how many people should be in the tryout sample according to the informal rule of thumb?", "opts": ["At least 1,000", "200 to 400", "20 to 40", "40 to 80"], "ans": 1, "why": "Rule of thumb: no fewer than 5 and preferably up to 10 subjects per item. 40 items × 5–10 = 200–400. Too few subjects risks 'phantom factors' (artifacts of small samples) in factor analysis.", "hint": "Multiply the number of items by the subjects-per-item rule."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "On a 120-examinee tryout, 102 people answer Item 7 correctly. Its item-difficulty index (p) is .85. How should the item be described?", "opts": ["Very difficult", "Difficult", "Very easy", "Average"], "ans": 2, "why": "p = proportion who answered correctly; the HIGHER the p, the EASIER the item. Ranges: .80–1.00 very easy; .61–.79 easy; .40–.60 average; .20–.39 difficult; .00–.19 very difficult.", "hint": "For p, a bigger number means more people got it right."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "For a four-option multiple-choice item, the chance (guessing) score is .25. Using the 'midpoint' rule, what is the optimal item difficulty?", "opts": [".50", ".25", ".875", ".625"], "ans": 3, "why": "Optimal difficulty = (1.0 + chance) / 2 = (1 + .25) / 2 = .625. The reviewer adds that a value slightly higher, around .74, is often cited for four-option items.", "hint": "Find the point halfway between pure guessing and a perfect score."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "In the upper-scoring group (n = 40), 24 examinees answered an item correctly. In the lower-scoring group (n = 40), 8 did. What is the item-discrimination index d, and how good is the item?", "opts": ["d = .40, a very good item", "d = .40, a poor item", "d = .80, a very good item", "d = .16, a poor item"], "ans": 0, "why": "d = (RH − RL) / n = (24 − 8) / 40 = 16 / 40 = .40. A d of .40 and above = very good item; .30–.39 good; .20–.29 fair; below .20 poor.", "hint": "Subtract the low group's correct count from the high group's, then divide by one group's size."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "An item is answered correctly by MORE low scorers than high scorers, giving a negative discrimination index. What should the developer do?", "opts": ["Move it to the start of the test", "Use it as an anchor item", "Revise or discard the item", "Keep it because it is very difficult"], "ans": 2, "why": "A good item is answered correctly by high scorers on the test as a whole. A negative d means the item works backwards: it may be ambiguous, miskeyed, or misleading. It should be rewritten or dropped.", "hint": "A good item is answered correctly more by high scorers."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "An attitude scale's items run from mild to strong ('I would work beside a person with depression' up to 'I would marry a person with depression'), so agreeing with a strong item implies agreement with the milder ones. This is a:", "opts": ["Likert scale", "Stapel scale", "Guttman scale", "Semantic differential scale"], "ans": 2, "why": "A Guttman scale arranges items sequentially from WEAKER to STRONGER expressions of the attitude. Likert = degree of agreement with independent statements. Semantic differential = bipolar adjectives.", "hint": "Notice how the statements are ordered."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "Respondents rate 'My workplace' on a 7-point scale anchored by opposite adjectives, such as Cold–Warm and Weak–Strong. This item format is a:", "opts": ["Likert scale", "Thurstone scale", "Semantic differential scale", "Visual analogue scale"], "ans": 2, "why": "Semantic differential = a 7-point scale bounded by BIPOLAR adjectives. Likert measures agree/disagree with statements. Thurstone uses judges' scale values (equal-appearing intervals). A visual analogue scale is a continuous 100 mm line.", "hint": "Look at what sits at each end of the scale."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A panel of expert judges assigns each attitude statement a scale value so that intervals between statements are equal across the continuum. Respondents then endorse statements they agree with. This is the:", "opts": ["Thurstone scale (method of equal-appearing intervals)", "Guttman scale", "Likert scale", "Q-sort technique"], "ans": 0, "why": "Thurstone's method of equal-appearing intervals uses expert judges to assign scale values to statements. The phrase 'equal-appearing intervals' points straight to Thurstone.", "hint": "Expert judges assign values with equal-appearing distances."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A personality test presents pairs of statements matched for social desirability, and the respondent must choose the one more like her. Scores show the relative strength of traits within the person. This scaling approach is:", "opts": ["Non-comparative scaling", "Forced-choice (ipsative) scaling", "Visual analogue scaling", "Absolute scaling"], "ans": 1, "why": "Forced-choice items yield IPSATIVE scores: choices are interdependent, so scores reflect relative strengths within one person rather than comparison with others. The EPPS uses this format to reduce faking good.", "hint": "Choosing one option means not choosing the other. What kind of score does that produce?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "To set a passing score for a licensure exam, expert judges estimate, item by item, the proportion of 'minimally competent' candidates who would answer correctly, and these estimates are summed. This is the:", "opts": ["Angoff method", "Known-groups method", "Method of predictive yield", "Bookmark method"], "ans": 0, "why": "Angoff = judges estimate the proportion of minimally competent candidates answering each item correctly; the sum forms the cut score. Bookmark = judges place a bookmark in a booklet of items ordered by IRT difficulty.", "hint": "Judges rate each item one at a time, imagining a barely-passing candidate."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "On a test of advanced math, many gifted students all earn the maximum score, so the test cannot distinguish among them. This is a(n):", "opts": ["Floor effect", "Ceiling effect", "Halo effect", "Practice effect"], "ans": 1, "why": "Ceiling effect = the test can't measure the HIGH end of ability because too many people max out. Floor effect = the test can't distinguish people at the LOW end. Computerized adaptive testing helps reduce both.", "hint": "Everyone is stuck at the top of the scale."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "An item reads: 'I feel anxious and depressed at work.' What item-writing guideline does it violate?", "opts": ["Its reading level is too low", "It is double-barreled", "It uses a double negative", "It uses an absolute qualifier"], "ans": 1, "why": "A double-barreled item combines two distinct ideas (anxiety AND depression) into one. A person who is anxious but not depressed can't answer it accurately. Each item should target a single construct.", "hint": "How many different feelings is the item asking about?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A developer deliberately writes some items in the negative direction ('I rarely feel confident') so that a person who agrees with everything won't get a misleadingly high score. This controls for:", "opts": ["Ceiling effect", "Acquiescence response set", "Central tendency error", "Item branching"], "ans": 1, "why": "Reverse/keyed scoring with negatively phrased items controls ACQUIESCENCE: the tendency to agree with items regardless of content.", "hint": "Some people agree with every statement no matter what it says."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "Boys and girls with the SAME overall level of verbal ability have very different probabilities of answering a particular item correctly. This item shows:", "opts": ["Validity shrinkage", "A ceiling effect", "High item reliability", "Differential item functioning (DIF)"], "ans": 3, "why": "DIF = an item functions differently for one group than another even when the groups have the same level of the underlying trait. It signals possible item bias. 'Same ability, different results' is the giveaway.", "hint": "The two groups are equal in ability. So what does the gap point to?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Revision", "q": "To keep scoring consistent, a publisher gives scorers a protocol scored by a highly authoritative expert as the model to follow. Months later, one scorer's scoring has gradually moved away from that model. The model protocol and the problem are:", "opts": ["Norm group; validity shrinkage", "Anchor protocol; scoring drift", "Test blueprint; observer bias", "Item pool; test sophistication"], "ans": 1, "why": "An ANCHOR protocol is scored by a highly authoritative scorer to serve as a model and resolve discrepancies. SCORING DRIFT is a discrepancy that develops between the anchor protocol's scoring and another scorer's.", "hint": "One is the model protocol; the other is a gradual change away from it."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "A psychologist answers a court's referral question by integrating test scores, interviews with the client and family, school records, and behavioral observation into a psychological report. Compared with testing alone, this is:", "opts": ["Psychometric soundness", "A cut score decision", "Psychological testing", "Psychological assessment"], "ans": 3, "why": "ASSESSMENT gathers and INTEGRATES data from many sources (tests, interviews, observation, collateral sources) to answer a referral question. The assessor is key, and the output is a psychological report. TESTING measures variables with a test and yields a score or psychometric report.", "hint": "Count the sources of information, and notice who puts them together."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "An assessor gives a reasoning task, then teaches the child a strategy, then gives a similar task again to see how much the child can learn with help. This 'sandwich' approach is:", "opts": ["Dynamic psychological assessment", "Ecological momentary assessment", "Retrospective assessment", "Collaborative psychological assessment"], "ans": 0, "why": "Dynamic assessment = evaluation → intervention → evaluation (the 'sandwich method'). It estimates learning potential, the zone of proximal development, rather than only current performance.", "hint": "Look at the order: test, teach, test again."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "Throughout an evaluation, the assessor and client work as partners, from deciding what questions to explore all the way to the final feedback. This is:", "opts": ["Remote assessment", "Collaborative psychological assessment", "Dynamic psychological assessment", "Actuarial assessment"], "ans": 1, "why": "Collaborative assessment = assessor and assessee as 'partners' from initial contact to final feedback. Therapeutic assessment goes further, emphasizing self-discovery and new understanding throughout the process.", "hint": "Assessor and client are equal partners."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "A patient with panic disorder gets app prompts five times a day asking her to rate her anxiety and note where she is and what she's doing at that exact moment. This is:", "opts": ["Ecological momentary assessment", "Psychological autopsy", "Analogue study", "Retrospective assessment"], "ans": 0, "why": "Ecological momentary assessment = 'in the moment' evaluation of problems and related thoughts and behaviors at the very time and place they occur. Retrospective assessment looks back at a person's state at an earlier time.", "hint": "When and where is the information being collected?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Under the A/B/C classification of test user qualifications, an individually administered intelligence test or a projective test like the Rorschach is usually:", "opts": ["Level C, requiring a Registered Psychologist", "Level A, usable with just the manual", "Level B, usable by any teacher", "Unclassified"], "ans": 0, "why": "Level A = straightforward with the manual (e.g., achievement tests). Level B = needs psychometric knowledge (group intelligence tests, objective personality tests), typically RPm with supervision. Level C = highly specialized training (individual intelligence tests, projectives) = RPsy.", "hint": "Which tests need the most specialized training to interpret?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Under RA 10029, which task is within the role of a Registered Psychometrician?", "opts": ["Administering, scoring, and interpreting an objective/structured personality test like the 16PF", "Interpreting the Rorschach Inkblot Test", "Conducting psychotherapy", "Diagnosing a client with major depressive disorder"], "ans": 0, "why": "An RPm's role: administering and scoring objective and structured personality tests (excluding projective tests and other higher-level tests), interpreting those results and writing reports on them, and conducting preparatory intake interviews. Projectives, diagnosis, and psychotherapy belong to psychologists.", "hint": "RPms handle structured tests, not projectives or treatment."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Which pairing of test type and time orientation is correct?", "opts": ["Intelligence measures only past learning", "Aptitude tests rely only on content validity", "Achievement predicts the future; aptitude measures past learning", "Achievement measures past learning; aptitude predicts future potential"], "ans": 3, "why": "ACHIEVEMENT = prior/learned information (past-oriented, content validity). INTELLIGENCE = general mental ability (present-oriented). APTITUDE = potential for learning and performance (future-oriented, content AND criterion-related validity).", "hint": "Think past, present, and future."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Battery", "q": "A psychologist includes two different depression measures in a battery so that a second measure can strengthen her initial impression from the first. This is the battery's:", "opts": ["Complementary function", "Additive function", "Confirmatory function", "Comparative function"], "ans": 2, "why": "Confirmatory = two or more measures of the SAME domain to strengthen an impression. Additive = measuring DIFFERENT domains to broaden understanding. Complementary = measures of the same domain that yield different rather than confirming results.", "hint": "Same domain, and the goal is to back up a first impression."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Decisions", "q": "A government agency hires every applicant who meets the minimum qualifying score on its exam, without comparing applicants to one another. What type of decision is this?", "opts": ["Individual decision", "Comparative decision", "Institutional ranking decision", "Absolute decision"], "ans": 3, "why": "ABSOLUTE decisions look at who meets the minimum score needed to qualify. COMPARATIVE decisions compare people's scores to see who scored best. INDIVIDUAL decisions are made by test takers about themselves.", "hint": "Is anyone being ranked against anyone else?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Interviews", "q": "Clinicians in a hospital reach different diagnoses for the same patients because each uses vague, personal guidelines for including or excluding symptoms. A structured interview mainly reduces this source of error, called:", "opts": ["Criterion variance", "Information variance", "Error variance from test construction", "Observer drift"], "ans": 0, "why": "Criterion variance = error from vague guidelines for inclusion or exclusion in categories. Information variance = variability in the amount and type of information gathered from clients. Structured interviews reduce both.", "hint": "The problem is the rules for deciding, not the information collected."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Behavioral Assessment", "q": "A client trying to quit smoking is asked to record every cigarette in a log as it happens. Just from keeping the log, her smoking drops. This is the:", "opts": ["Practice effect", "Hawthorne effect of analogue studies", "Reactivity effect of self-monitoring", "Halo effect"], "ans": 2, "why": "Self-monitoring often produces REACTIVITY: the act of measuring your own behavior changes it, usually reducing undesirable behaviors or increasing adaptive ones.", "hint": "The act of recording changed the behavior."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Behavioral Assessment", "q": "A client with a spider phobia is asked to approach a caged spider in a clinic room while the clinician records how close she gets, her heart rate, and her distress ratings. This is a(n):", "opts": ["Behavioral avoidance task in an analogue study", "Situational interview", "Naturalistic observation", "Psychological autopsy"], "ans": 0, "why": "Analogue studies evaluate behavior in controlled, simulated settings that mirror real situations. A Behavioral Avoidance Task (BAT), approaching a feared stimulus under control, is a classic example. Naturalistic observation happens in real-world settings.", "hint": "A controlled, simulated situation with the feared object."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Computers in Testing", "q": "A computer-generated report combines the client's test results with data from other sources, such as interview notes and history, into one interpretive narrative. This is a(n):", "opts": ["Simple scoring report", "Extended scoring report", "Integrative report", "Consultative report"], "ans": 2, "why": "Simple scoring report = only lists scores. Extended scoring report = adds statistical analyses. Interpretive report = adds interpretive statements. Consultative report = written for professionals, with an expert opinion. INTEGRATIVE report = integrates data from sources OTHER than the test.", "hint": "Is the report using only test data, or other information too?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Clinical Judgment", "q": "Instead of relying on intuition, a forensic team decides a parolee's risk level using empirically demonstrated statistical rules applied to his records. This approach is:", "opts": ["Collaborative assessment", "Intuitive interpretation", "Actuarial assessment", "Authoritative interpretation"], "ans": 2, "why": "Actuarial assessment = applying empirically demonstrated statistical rules as the deciding factor in the assessor's judgment. The mechanical approach goes further, adding computer algorithms. Intuitive interpretation relies on feelings with no empirical basis.", "hint": "Statistical rules, not gut feeling."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A psychologist needs a full individual intelligence evaluation for a 17-year-old student. Which Wechsler test covers her age?", "opts": ["WAIS-5 (16 to 90+ years)", "WISC-V (6:0 to 16:11)", "WPPSI-IV (2:6 to 7:7)", "WISC-V, because she is still in school"], "ans": 0, "why": "WISC-V covers 6 years 0 months to 16 years 11 months, so at 17 she's past it. WAIS-5 covers 16 to 90+. WPPSI-IV is for young children (2:6–7:7). Age ranges are a favorite board question.", "hint": "Check where the WISC-V's age range ends."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A 4-year-old needs an individually administered IQ test that also has nonverbal and verbal routes for every factor. Which test covers ages 2 to 85+ and gives equal weight to verbal and nonverbal domains?", "opts": ["WAIS-5", "Purdue Non-Language Test", "Wonderlic Cognitive Ability Test", "Stanford-Binet Fifth Edition (SB-5)"], "ans": 3, "why": "SB-5 covers ages 2 to 85+, measures five factors (Fluid Reasoning, Knowledge, Quantitative Reasoning, Visual-Spatial, Working Memory), and gives equal weight to verbal and nonverbal domains in each. It was developed by Gale Roid and is based on CHC theory.", "hint": "Only one of these tests spans early childhood to old age."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A recent immigrant who speaks very little English and has a mild hearing impairment needs a measure of general intelligence (g). Which test is the BEST choice?", "opts": ["Thurstone Test of Mental Alertness", "Watson-Glaser Critical Thinking Appraisal", "Panukat ng Katalinuhang Pilipino", "Raven's Progressive Matrices"], "ans": 3, "why": "Raven's measures abstract reasoning and Spearman's g independently of language, reading level, or cultural background. It's considered one of the purest measures of g. Thurstone and Watson-Glaser depend heavily on language, and the PKP uses Filipino.", "hint": "Which test works without language?"}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "Which version of Raven's Progressive Matrices is designed for children aged 5 to 11, older adults, and people with cognitive difficulties, and uses colored backgrounds?", "opts": ["Advanced Progressive Matrices (APM)", "Culture Fair Intelligence Test, Scale 3", "Colored Progressive Matrices (CPM)", "Standard Progressive Matrices (SPM)"], "ans": 2, "why": "CPM = 36 items in sets A, Ab, B, with color to hold attention (young children, the elderly, clinical groups). SPM = 60 items in five sets A–E, for ages 6–65+ of average ability. APM = 48 items, for above-average adults.", "hint": "Young children, color, and 36 items."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A Filipino HR officer wants a culturally grounded, Filipino-language intelligence test for applicants aged 16 and above that yields crystallized, fluid, and general intelligence scores. Which test fits?", "opts": ["Panukat ng Ugali at Pagkatao (PUP) by Enriquez", "Panukat ng Katalinuhang Pilipino (PKP) by Palacio", "Philippine Thematic Apperception Test (PTAT) by Lagmay", "Panukat ng Pagkataong Pilipino (PPP) by Carlota"], "ans": 1, "why": "PKP (Palacio) = Filipino intelligence test for ages 16+, with 135 items in 4 subtests (Talasalitaan, Ugnayan, Kakayahan sa mga Bilang, Isinasalarawang Problema), yielding CIS, FIS, and GIS. PUP and PPP are PERSONALITY tests; PTAT is projective.", "hint": "'Katalinuhan' means intelligence. The others measure personality."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "A guidance counselor wants a multi-score aptitude PROFILE (verbal reasoning, numerical ability, abstract reasoning, mechanical reasoning, space relations, and more) instead of a single IQ, to guide students' career choices. Which test fits best?", "opts": ["Satisfaction with Life Scale", "Raven's Standard Progressive Matrices", "Wonderlic Cognitive Ability Test", "Differential Aptitude Tests (DAT)"], "ans": 3, "why": "The DAT gives a multidimensional aptitude profile highlighting strengths, not a single summary IQ. It's used for educational and vocational guidance. Wonderlic gives one quick cognitive score for hiring.", "hint": "The counselor wants several scores, not one IQ."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "An employer wants a quick measure of applicants' general cognitive ability: 50 items in 12 minutes, with no penalty for wrong answers. Which test is this?", "opts": ["Thurstone Test of Mental Alertness", "Flanagan Industrial Tests", "Purdue Non-Language Test", "Wonderlic Cognitive Ability Test"], "ans": 3, "why": "Wonderlic = 50 items, 12 minutes, raw score maximum 50, used widely for personnel selection. Thurstone Test of Mental Alertness = 126 items in 20 minutes, alternating linguistic and quantitative items. Purdue = 25 minutes of nonverbal items.", "hint": "Very short and quick, used for hiring."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "A company screening management trainees wants to measure how well candidates recognize assumptions, evaluate arguments, and draw warranted conclusions. Which test fits?", "opts": ["Edwards Personal Preference Schedule", "Wonderlic Cognitive Ability Test", "Watson-Glaser Critical Thinking Appraisal", "Strong Interest Inventory"], "ans": 2, "why": "Watson-Glaser measures critical thinking: Recognize assumptions, Evaluate arguments, Draw conclusions. Its subtests are Inference, Recognition of Assumptions, Deduction, Interpretation, and Evaluation of Arguments.", "hint": "Assumptions, arguments, conclusions."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A career counselor uses a test based on Jung's theory of psychological types that sorts people on E–I, S–N, T–F, and J–P preferences. Which test is this?", "opts": ["NEO Personality Inventory", "Edwards Personal Preference Schedule", "Sixteen Personality Factor Questionnaire (16PF)", "Myers-Briggs Type Indicator (MBTI)"], "ans": 3, "why": "The MBTI makes Jung's psychological types practical: Extraversion–Introversion, Sensing–Intuition, Thinking–Feeling, Judging–Perceiving. It's for ages 14 and older.", "hint": "Jung's types and four letter pairs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A personality test based on Murray's needs presents 225 forced-choice statement pairs matched for social desirability, and includes repeated pairs to compute a consistency score. Which test is this?", "opts": ["Basic Personality Inventory", "Myers-Briggs Type Indicator", "Edwards Personal Preference Schedule (EPPS)", "Personality Assessment Inventory"], "ans": 2, "why": "EPPS = 15 needs (achievement, deference, order, exhibition, autonomy, affiliation, intraception, succorance, dominance, abasement, nurturance, change, endurance, heterosexuality, aggression), 225 forced-choice pairs, a consistency score from 15 repeated pairs, and desirability-matched pairs to reduce faking good.", "hint": "Forced-choice pairs plus a list of needs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A client's 16PF results are reported on a 1-to-10 standard score scale with a mean of 5.5 and an SD of 2. These scores are:", "opts": ["STEN scores", "Stanines", "T-scores", "Deviation IQs"], "ans": 0, "why": "STEN (standard ten): mean 5.5, SD 2, used by the 16PF. STANINE (standard nine): mean 5, SD 2. T-score: mean 50, SD 10 (MMPI, NEO, PAI, CPI). Deviation IQ: mean 100, SD 15.", "hint": "A mean of 5.5 on a ten-point scale."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A 16PF profile shows a very high score on Factor L. What does this suggest about the person?", "opts": ["Warm: outgoing and attentive to others", "Vigilant: suspicious, skeptical, and guarded", "Apprehensive: self-doubting and worried", "Rule-conscious: dutiful and conforming"], "ans": 1, "why": "Factor L = Vigilance (suspicious and guarded vs. trusting). A = Warmth, G = Rule-Consciousness, O = Apprehension, C = Emotional Stability, E = Dominance, H = Social Boldness, Q3 = Perfectionism, Q4 = Tension.", "hint": "Think of the factor letter as 'Lookout'."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A psychologist needs a measure of the Big Five that also gives six facet scores per domain (e.g., N1 Anxiety to N6 Vulnerability). Which instrument fits?", "opts": ["NEO-PI-R / NEO-PI-3", "NEO-FFI only", "MBTI", "California Psychological Inventory"], "ans": 0, "why": "The full NEO-PI-R/NEO-PI-3 (240 items) gives the 5 domains PLUS 6 facets each. The NEO-FFI is the 60-item short form, which gives domain scores only. The MBTI measures Jungian types, not the Big Five.", "hint": "Domains AND facets require the long form."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "An adult client's MCMI-IV profile shows a Base Rate (BR) score of 78 on the Borderline scale. How should this be interpreted?", "opts": ["A validity problem that invalidates the profile", "Significant elevation: above the BR 75 cutoff for presence of the disorder", "Not interpretable, since it is below 85", "Exactly average for the clinical sample"], "ans": 1, "why": "MCMI-IV Base Rate scores: BR 60 = median (scores below 60 are generally not interpreted); BR 75 = cutoff for PRESENCE of the disorder; BR 85+ = the disorder is PROMINENT. BR scores reflect how common the disorder is in clinical samples.", "hint": "Recall the three Base Rate cutoffs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "In a personal injury lawsuit, a psychologist suspects the plaintiff is exaggerating symptoms. On the Personality Assessment Inventory, which validity scale targets this?", "opts": ["Inconsistency (ICN)", "Infrequency (INF)", "Positive Impression (PIM)", "Negative Impression (NIM)"], "ans": 3, "why": "PAI validity scales: NIM = exaggeration, cry for help, or malingering ('fake bad'); PIM = defensiveness or minimizing flaws ('fake good'); ICN = random or careless responding; INF = confusion or gross carelessness.", "hint": "Exaggerating = trying to look worse."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "A clinician needs the current standard edition of the MMPI for a 30-year-old outpatient. Which version and population are correct?", "opts": ["MMPI-3, with 335 items, for adults 18 and older", "MMPI-2, the current standard with 335 items", "MMPI-3, for ages 14 to 18", "MMPI-A-RF, for adults 18 and older"], "ans": 0, "why": "MMPI-3 = the current standard edition, 335 items, for ages 18+. MMPI-2 had 567 items; MMPI-2-RF had 338. MMPI-A-RF (241 items) is for ADOLESCENTS aged 14–18.", "hint": "Check the item count and age range
