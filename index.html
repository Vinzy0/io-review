ity characteristics rather than locating the client on a few traits used to describe everyone. Which approach is emphasized?", "opts": ["Idiographic approach", "Nomothetic approach", "Norm-referenced ranking alone", "Actuarial classification alone"], "ans": 0, "why": "The idiographic approach examines the individual's distinctive constellation of characteristics. The nomothetic approach seeks common dimensions that describe differences across many people. (Source: Ms. Chiqui's notes)", "hint": "Decide whether the goal is the individual's unique pattern or a common framework across people."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Career Assessment", "q": "A student enjoys artistic activities but asks whether that enjoyment proves she already has the technical skills for a design career. What should a counselor explain?", "opts": ["A low interest score proves the student cannot learn the occupation", "Interests and demonstrated skills answer different questions and may require different measures", "One interest inventory replaces all ability and skill information", "An interest score directly establishes every required occupational skill"], "ans": 1, "why": "Career assessment can examine interests, aptitudes, and skills as distinct areas. A preference measure describes likes and involvements rather than directly demonstrating the skills required for a job. (Source: Ms. Chiqui's notes)", "hint": "Separate wanting to do an activity from being able to perform it at the required level."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Clinical Assessment Purposes", "q": "A client's diagnosis is already established, but the clinician assesses current functioning and likely treatment needs. Why is further assessment still useful?", "opts": ["Further assessment is relevant only to employment decisions", "An established diagnosis supplies all information needed for intervention", "Assessment is useful only when no diagnosis has been made", "Assessment can guide treatment planning beyond assigning a diagnosis"], "ans": 3, "why": "Clinical assessment can clarify functioning, treatment choices, and intervention needs as well as diagnosis. A diagnostic label does not answer every question about the person's present needs. (Source: Ms. Chiqui's notes)", "hint": "Identify the practical decisions that remain after naming the disorder."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Clinical Assessment Process", "q": "Interview data suggest one explanation for a client's difficulty, but test findings point elsewhere. Which next step best reflects the assessment process described in the notes?", "opts": ["Revisit the hypotheses and examine relevant history and collateral information", "Choose the result from the shorter instrument to reduce burden", "Accept the test result automatically because it is numerical", "Accept the first interview impression regardless of other evidence"], "ans": 0, "why": "Tests and interviews can confirm or challenge initial hypotheses, while history and collateral records add relevant evidence. Conflicting findings call for integration and investigation rather than automatically privileging one source. (Source: Ms. Chiqui's notes)", "hint": "Treat disagreement as information for examining the competing explanations."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A psychologist needs a full individual intelligence evaluation for a 17-year-old student. Which Wechsler test covers her age?", "opts": ["WISC-V, because she is still in school", "WISC-V (6:0 to 16:11)", "WAIS-5 (16 to 90+ years)", "WPPSI-IV (2:6 to 7:7)"], "ans": 2, "why": "WISC-V covers 6 years 0 months to 16 years 11 months, so at 17 she's past it. WAIS-5 covers 16 to 90+. WPPSI-IV is for young children (2:6–7:7). Age ranges are a favorite board question.", "hint": "Check where the WISC-V's age range ends."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A 4-year-old needs an individually administered IQ test that also has nonverbal and verbal routes for every factor. Which test covers ages 2 to 85+ and gives equal weight to verbal and nonverbal domains?", "opts": ["WAIS-5", "Wonderlic Cognitive Ability Test", "Stanford-Binet Fifth Edition (SB-5)", "Purdue Non-Language Test"], "ans": 2, "why": "SB-5 covers ages 2 to 85+, measures five factors (Fluid Reasoning, Knowledge, Quantitative Reasoning, Visual-Spatial, Working Memory), and gives equal weight to verbal and nonverbal domains in each. It was developed by Gale Roid and is based on CHC theory.", "hint": "Only one of these tests spans early childhood to old age."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A recent immigrant who speaks very little English and has a mild hearing impairment needs a measure of general intelligence (g). Which test is the BEST choice?", "opts": ["Watson-Glaser Critical Thinking Appraisal", "Raven's Progressive Matrices", "Thurstone Test of Mental Alertness", "Panukat ng Katalinuhang Pilipino"], "ans": 1, "why": "Raven's measures abstract reasoning and Spearman's g independently of language, reading level, or cultural background. It's considered one of the purest measures of g. Thurstone and Watson-Glaser depend heavily on language, and the PKP uses Filipino.", "hint": "Which test works without language?"}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "Which version of Raven's Progressive Matrices is designed for children aged 5 to 11, older adults, and people with cognitive difficulties, and uses colored backgrounds?", "opts": ["Standard Progressive Matrices (SPM)", "Advanced Progressive Matrices (APM)", "Colored Progressive Matrices (CPM)", "Culture Fair Intelligence Test, Scale 3"], "ans": 2, "why": "CPM = 36 items in sets A, Ab, B, with color to hold attention (young children, the elderly, clinical groups). SPM = 60 items in five sets A–E, for ages 6–65+ of average ability. APM = 48 items, for above-average adults.", "hint": "Young children, color, and 36 items."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Intelligence Tests", "q": "A Filipino HR officer wants a culturally grounded, Filipino-language intelligence test for applicants aged 16 and above that yields crystallized, fluid, and general intelligence scores. Which test fits?", "opts": ["Panukat ng Ugali at Pagkatao (PUP) by Enriquez", "Philippine Thematic Apperception Test (PTAT) by Lagmay", "Panukat ng Katalinuhang Pilipino (PKP) by Palacio", "Panukat ng Pagkataong Pilipino (PPP) by Carlota"], "ans": 2, "why": "PKP (Palacio) = Filipino intelligence test for ages 16+, with 135 items in 4 subtests (Talasalitaan, Ugnayan, Kakayahan sa mga Bilang, Isinasalarawang Problema), yielding CIS, FIS, and GIS. PUP and PPP are PERSONALITY tests; PTAT is projective.", "hint": "'Katalinuhan' means intelligence. The others measure personality."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "A guidance counselor wants a multi-score aptitude PROFILE (verbal reasoning, numerical ability, abstract reasoning, mechanical reasoning, space relations, and more) instead of a single IQ, to guide students' career choices. Which test fits best?", "opts": ["Wonderlic Cognitive Ability Test", "Differential Aptitude Tests (DAT)", "Raven's Standard Progressive Matrices", "Satisfaction with Life Scale"], "ans": 1, "why": "The DAT gives a multidimensional aptitude profile highlighting strengths, not a single summary IQ. It's used for educational and vocational guidance. Wonderlic gives one quick cognitive score for hiring.", "hint": "The counselor wants several scores, not one IQ."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "An employer wants a quick measure of applicants' general cognitive ability: 50 items in 12 minutes, with no penalty for wrong answers. Which test is this?", "opts": ["Flanagan Industrial Tests", "Thurstone Test of Mental Alertness", "Purdue Non-Language Test", "Wonderlic Cognitive Ability Test"], "ans": 3, "why": "Wonderlic = 50 items, 12 minutes, raw score maximum 50, used widely for personnel selection. Thurstone Test of Mental Alertness = 126 items in 20 minutes, alternating linguistic and quantitative items. Purdue = 25 minutes of nonverbal items.", "hint": "Very short and quick, used for hiring."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Aptitude Tests", "q": "A company screening management trainees wants to measure how well candidates recognize assumptions, evaluate arguments, and draw warranted conclusions. Which test fits?", "opts": ["Strong Interest Inventory", "Edwards Personal Preference Schedule", "Watson-Glaser Critical Thinking Appraisal", "Wonderlic Cognitive Ability Test"], "ans": 2, "why": "Watson-Glaser measures critical thinking: Recognize assumptions, Evaluate arguments, Draw conclusions. Its subtests are Inference, Recognition of Assumptions, Deduction, Interpretation, and Evaluation of Arguments.", "hint": "Assumptions, arguments, conclusions."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A career counselor uses a test based on Jung's theory of psychological types that sorts people on E–I, S–N, T–F, and J–P preferences. Which test is this?", "opts": ["Edwards Personal Preference Schedule", "NEO Personality Inventory", "Myers-Briggs Type Indicator (MBTI)", "Sixteen Personality Factor Questionnaire (16PF)"], "ans": 2, "why": "The MBTI makes Jung's psychological types practical: Extraversion–Introversion, Sensing–Intuition, Thinking–Feeling, Judging–Perceiving. It's for ages 14 and older.", "hint": "Jung's types and four letter pairs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A personality test based on Murray's needs presents 225 forced-choice statement pairs matched for social desirability, and includes repeated pairs to compute a consistency score. Which test is this?", "opts": ["Edwards Personal Preference Schedule (EPPS)", "Personality Assessment Inventory", "Basic Personality Inventory", "Myers-Briggs Type Indicator"], "ans": 0, "why": "EPPS = 15 needs (achievement, deference, order, exhibition, autonomy, affiliation, intraception, succorance, dominance, abasement, nurturance, change, endurance, heterosexuality, aggression), 225 forced-choice pairs, a consistency score from 15 repeated pairs, and desirability-matched pairs to reduce faking good.", "hint": "Forced-choice pairs plus a list of needs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A client's 16PF results are reported on a 1-to-10 standard score scale with a mean of 5.5 and an SD of 2. These scores are:", "opts": ["Stanines", "Deviation IQs", "STEN scores", "T-scores"], "ans": 2, "why": "STEN (standard ten): mean 5.5, SD 2, used by the 16PF. STANINE (standard nine): mean 5, SD 2. T-score: mean 50, SD 10 (MMPI, NEO, PAI, CPI). Deviation IQ: mean 100, SD 15.", "hint": "A mean of 5.5 on a ten-point scale."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A 16PF profile shows a very high score on Factor L. What does this suggest about the person?", "opts": ["Apprehensive: self-doubting and worried", "Vigilant: suspicious, skeptical, and guarded", "Rule-conscious: dutiful and conforming", "Warm: outgoing and attentive to others"], "ans": 1, "why": "Factor L = Vigilance (suspicious and guarded vs. trusting). A = Warmth, G = Rule-Consciousness, O = Apprehension, C = Emotional Stability, E = Dominance, H = Social Boldness, Q3 = Perfectionism, Q4 = Tension.", "hint": "Think of the factor letter as 'Lookout'."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Personality Tests", "q": "A psychologist needs a measure of the Big Five that also gives six facet scores per domain (e.g., N1 Anxiety to N6 Vulnerability). Which instrument fits?", "opts": ["California Psychological Inventory", "NEO-PI-R / NEO-PI-3", "MBTI", "NEO-FFI only"], "ans": 1, "why": "The full NEO-PI-R/NEO-PI-3 (240 items) gives the 5 domains PLUS 6 facets each. The NEO-FFI is the 60-item short form, which gives domain scores only. The MBTI measures Jungian types, not the Big Five.", "hint": "Domains AND facets require the long form."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "An adult client's MCMI-IV profile shows a Base Rate (BR) score of 78 on the Borderline scale. How should this be interpreted?", "opts": ["Exactly average for the clinical sample", "Not interpretable, since it is below 85", "Significant elevation: above the BR 75 cutoff for presence of the disorder", "A validity problem that invalidates the profile"], "ans": 2, "why": "MCMI-IV Base Rate scores: BR 60 = median (scores below 60 are generally not interpreted); BR 75 = cutoff for PRESENCE of the disorder; BR 85+ = the disorder is PROMINENT. BR scores reflect how common the disorder is in clinical samples.", "hint": "Recall the three Base Rate cutoffs."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "In a personal injury lawsuit, a psychologist suspects the plaintiff is exaggerating symptoms. On the Personality Assessment Inventory, which validity scale targets this?", "opts": ["Infrequency (INF)", "Positive Impression (PIM)", "Inconsistency (ICN)", "Negative Impression (NIM)"], "ans": 3, "why": "PAI validity scales: NIM = exaggeration, cry for help, or malingering ('fake bad'); PIM = defensiveness or minimizing flaws ('fake good'); ICN = random or careless responding; INF = confusion or gross carelessness.", "hint": "Exaggerating = trying to look worse."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Clinical Tests", "q": "A clinician needs the current standard edition of the MMPI for a 30-year-old outpatient. Which version and population are correct?", "opts": ["MMPI-3, with 335 items, for adults 18 and older", "MMPI-3, for ages 14 to 18", "MMPI-2, the current standard with 335 items", "MMPI-A-RF, for adults 18 and older"], "ans": 0, "why": "MMPI-3 = the current standard edition, 335 items, for ages 18+. MMPI-2 had 567 items; MMPI-2-RF had 338. MMPI-A-RF (241 items) is for ADOLESCENTS aged 14–18.", "hint": "Check the item count and age range of the current edition."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Filipino Tests", "q": "A researcher wants a Filipino personality test with three forms: Form K (interpersonal relationships), Form S (personal traits), and Form KS (intelligence and creativity). Which test is this?", "opts": ["Panukat ng Ugali at Pagkatao (PUP) by Enriquez", "Panukat ng Pagkataong Pilipino (PPP) by Carlota", "Pictorial Self-Concept Scale by Pasao", "Panukat ng Katalinuhang Pilipino (PKP) by Palacio"], "ans": 1, "why": "PPP (Carlota) has Forms K, S, and KS and is for ages 13+. PUP (Enriquez) measures Filipino-oriented traits with validity scales Pagkakaila (denial) and Kaugalian (cultural norms). PKP is an intelligence test.", "hint": "Remember which author's test has the K, S, and KS forms."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Interest Tests", "q": "A career inventory compares a student's interests with those of satisfied workers in hundreds of occupations, and organizes results by RIASEC General Occupational Themes. Which test is this?", "opts": ["Strong Interest Inventory", "Differential Aptitude Tests", "Edwards Personal Preference Schedule", "Thurstone Interest Schedule"], "ans": 0, "why": "The Strong (SVIB → Strong-Campbell → modern SII) uses General Occupational Themes (RIASEC), Basic Interest Scales, Occupational Scales (matching satisfied workers), and Personal Style Scales. It's an INTEREST inventory, not an aptitude test.", "hint": "RIASEC themes and comparisons with satisfied workers."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "A child client is shown picture cards of animals (lions, bears, monkeys) in human-like social situations and asked to tell a story about each. Which test is this?", "opts": ["Rorschach Inkblot Test", "Kinetic Family Drawing", "Children's Apperception Test (CAT) by Bellak", "Hand Test"], "ans": 2, "why": "The CAT (Leopold and Sonya Bellak, 1949) is the children's version of the TAT and uses animal figures in human situations. The Philippine versions (PTAT and PCTAT) were developed by Alfredo Lagmay, with Filipino scenes.", "hint": "Animals in human-like scenes for children."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "A psychologist asks a child to 'draw everyone in your family, including yourself, DOING something.' Which projective technique is this?", "opts": ["Kinetic Family Drawing (KFD)", "House-Tree-Person (HTP)", "Draw-A-Person Test", "Hand Test"], "ans": 0, "why": "The KFD's unique instruction is that family members must be drawn DOING something (in action). HTP asks for a house, a tree, and a person. Draw-A-Person estimates intellectual maturity in children.", "hint": "The family members are doing something."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "In a correctional setting, a psychologist wants a projective test specifically aimed at action tendencies, particularly acting out and aggressive behavior. Which test fits?", "opts": ["Hand Test", "Thematic Apperception Test", "Sacks Sentence Completion Test", "Satisfaction with Life Scale"], "ans": 0, "why": "The Hand Test (ages 5+) measures action tendencies, especially acting out and aggression. The SSCT taps attitudes about family, sex, interpersonal relationships, and self-concept. The TAT reveals perceptions of interpersonal relationships.", "hint": "This test focuses on acting out."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "Of the 10 Rorschach inkblot cards, how are they grouped by color?", "opts": ["10 black and gray", "5 black and gray; 2 black, gray, and red; 3 multicolored", "3 black and gray; 7 multicolored", "5 multicolored; 5 black and gray"], "ans": 1, "why": "Rorschach: 5 achromatic (black and gray) cards, 2 black-gray-red cards, and 3 multicolored cards, for 10 in total.", "hint": "There are three color groups across the ten cards."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Filipino Tests", "q": "On the Panukat ng Ugali at Pagkatao (PUP), which scale checks whether the respondent is denying common human faults and weaknesses, and can invalidate the protocol if excessive?", "opts": ["Kaugalian (Cultural Norms scale)", "Pagkamapagtimpi", "Pagkakaila (Denial scale)", "Pagkasigurista"], "ans": 2, "why": "PUP's validity scales: Pagkakaila = denial of basic human faults or weaknesses; Kaugalian = agreement with traditional Philippine cultural norms, to check candor. Pagkasigurista (prudence) and Pagkamapagtimpi (self-control) are trait scales, not validity scales.", "hint": "'Kaila' is related to denying."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Tests", "q": "A physician refers a 74-year-old patient with recent forgetfulness for a quick screening of cognitive impairment (orientation, memory, attention, language). Which instrument is the most appropriate FIRST step?", "opts": ["Mini-Mental State Examination (MMSE)", "Strong Interest Inventory", "Edwards Personal Preference Schedule", "Rorschach Inkblot Test"], "ans": 0, "why": "The MMSE has a long history as a brief screening tool for cognitive impairment, measuring concentration, language, orientation, memory, and attention. The 7-Minute Screen is another option for Alzheimer's symptoms. A positive screen leads to a fuller neuropsychological evaluation. (Source: Ms. Chiqui's notes, Cohen and Swerdlik)", "hint": "You need a quick screen, not a full battery."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Tests", "q": "A neuropsychologist wants to assess frontal-lobe executive functions (planning, shifting mental set, and inhibiting impulsive responding) by having the patient sort cards by changing rules. Which test fits?", "opts": ["Ishihara test", "Satisfaction with Life Scale", "Wisconsin Card Sorting Test", "Purdue Pegboard Test"], "ans": 2, "why": "The Wisconsin Card Sorting Test requires sorting cards by figures and colors as the rule changes, tapping concentration, planning, cognitive flexibility in shifting set, working memory, and impulse inhibition, all associated with frontal-lobe functioning. Ishihara screens color blindness; Purdue Pegboard measures manual dexterity. (Source: Ms. Chiqui's notes)", "hint": "Executive function plus changing sorting rules."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Tests", "q": "A child is asked to copy nine geometric designs. The results are used to assess perceptual-motor (visual-motor) maturation and possible neurological impairment. Which test is this?", "opts": ["Thematic Apperception Test", "Wechsler Similarities subtest", "Controlled Word Association Test", "Bender Visual-Motor Gestalt Test"], "ans": 3, "why": "The Bender Visual-Motor Gestalt Test (Bender, 1938) uses designs the examinee copies to assess perceptual maturation and neurological impairment. Similarities measures verbal abstraction; the Controlled Word Association Test measures verbal fluency. (Source: Ms. Chiqui's notes)", "hint": "Copying designs to check visual-motor maturation."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Tests", "q": "During an evaluation, a patient shows abnormal reflexes, and neuroimaging confirms cranial nerve damage. In neuropsychological terms, these findings are:", "opts": ["Soft signs: merely suggestive of deficit", "Hard signs: definite indicators of neurological deficit", "Signs of malingering", "Extra-test behaviors"], "ans": 1, "why": "HARD signs = definite indicators of neurological deficit (abnormal reflexes, cranial nerve damage on imaging). SOFT signs = only suggestive (e.g., trouble accurately copying a figure). Either can prompt referral to a specialist. (Source: Ms. Chiqui's notes)", "hint": "Definite or only suggestive?"}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Forensic Assessment", "q": "A court asks a psychologist whether a defendant with schizophrenia is competent to stand trial. Which question is the evaluation fundamentally about?", "opts": ["Can he understand the charges against him and assist in his own defense?", "Did he have a mental disorder at the time of the crime?", "Is he likely to reoffend after release?", "Does he have a diagnosis of psychosis?"], "ans": 0, "why": "Competency to stand trial concerns PRESENT ability: understanding the charges and proceedings and being able to assist one's lawyer. A diagnosis alone (psychosis, intellectual disability, a neurological disorder) does NOT automatically make someone incompetent. Sanity at the time of the crime is a different question: criminal responsibility. (Source: Ms. Chiqui's notes)", "hint": "Competency is about the present, not the moment of the crime."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Forensic Assessment", "q": "Under the ALI standard, a defendant may be found not responsible ('not guilty by reason of insanity') if, at the time of the crime and because of mental disease or defect, he:", "opts": ["Has any psychiatric diagnosis", "Lacked substantial capacity to appreciate the wrongfulness of his conduct or to conform it to the law", "Is currently unable to understand courtroom procedures", "Felt regret after the crime"], "ans": 1, "why": "ALI standard: not responsible if, at the time of the conduct, mental disease or defect left the person lacking substantial capacity EITHER to appreciate its criminality (wrongfulness) OR to conform conduct to the law. Current ability to follow proceedings is a competency issue, not insanity. The RCRAS is one systematic tool for insanity evaluations. (Source: Ms. Chiqui's notes)", "hint": "The insanity standard looks at the time of the crime."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Forensic Assessment", "q": "A parole board asks for an assessment of an inmate's risk of violent reoffending. Which instrument, combining clinician ratings of traits like callousness and impulsiveness with criminal-history records, is most relevant?", "opts": ["Kinetic Family Drawing", "Strong Interest Inventory", "Myers-Briggs Type Indicator", "Psychopathy Checklist (PCL) by Hare"], "ans": 3, "why": "Hare's PCL rates personality characteristics (callousness, impulsiveness, lack of empathy) plus history from records (e.g., criminal versatility). Psychopathy ratings have predicted violent recidivism and parole failure. (Source: Ms. Chiqui's notes, Cohen and Swerdlik)", "hint": "Parole risk is linked to psychopathy."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Age-Appropriate Selection", "q": "A psychologist specifically wants a Wechsler intellectual assessment for a 3-year-old. Which listed instrument has an appropriate age range?", "opts": ["WRAT-5", "WISC-V", "WAIS-IV", "WPPSI-IV"], "ans": 3, "why": "WPPSI-IV covers young children beginning at age 2 years 6 months. WISC-V begins at age 6, so its norms would not fit this 3-year-old.", "hint": "Check the lower age limit rather than choosing any test from the same family."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Achievement Assessment", "q": "A referral asks about current word reading, spelling, and math computation rather than general intelligence or vocational interests. Which instrument most directly samples those skills?", "opts": ["MMPI-3", "Strong Interest Inventory", "WRAT-5", "NEO PI-R"], "ans": 2, "why": "WRAT-5 assesses fundamental academic achievement in reading, spelling, and math computation. A general personality inventory would address a different information need rather than directly sample those academic skills.", "hint": "Match the measured domains to the specific academic tasks in the referral."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Well-Being Assessment", "q": "A researcher wants a brief measure of a person's overall evaluative judgment of life satisfaction rather than momentary positive mood. Which tool most directly fits?", "opts": ["Satisfaction with Life Scale", "Job Descriptive Index", "Minnesota Satisfaction Questionnaire", "A state-anxiety inventory"], "ans": 0, "why": "The SWLS assesses a conscious global evaluation of life satisfaction. The workplace satisfaction measures address specific job attitudes rather than the person's evaluation of life as a whole.", "hint": "Distinguish life as a whole from a specific domain or a passing emotional state."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Culturally Relevant Stimuli", "q": "A qualified examiner wants an adult storytelling projective method whose ambiguous cards depict Filipino scenes, clothing, and social situations. Which listed instrument was designed with this content?", "opts": ["Rorschach Inkblot Test", "Bender-Gestalt Test", "Hand Test", "Philippine Thematic Apperception Test"], "ans": 3, "why": "The Philippine TAT uses ambiguous cards depicting Filipino contexts. That content distinction does not by itself establish every psychometric claim, but it identifies the requested instrument rather than an inkblot or visual-motor task.", "hint": "Focus on the type and context of the stimulus material."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Fluid and Crystallized Abilities", "q": "An assessor wants to emphasize reasoning through unfamiliar patterns instead of recalling learned vocabulary. Which broad ability should the chosen tasks primarily target?", "opts": ["Crystallized intelligence", "Personality adjustment", "Fluid intelligence", "Vocational interest"], "ans": 2, "why": "Fluid intelligence emphasizes reasoning with novel material, while crystallized intelligence concerns acquired knowledge and skills. A vocabulary task would more directly sample knowledge built through cultural and educational exposure. (Source: Ms. Chiqui's notes)", "hint": "Distinguish solving a new problem from retrieving what has already been learned."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Fluid and Crystallized Abilities", "q": "A referral specifically concerns the breadth of knowledge and verbal concepts a student has acquired through schooling and experience. Which evidence is most directly relevant?", "opts": ["Tasks assessing crystallized knowledge", "A measure limited to novel abstract-pattern reasoning", "An inventory of preferred occupations", "A personality-response consistency scale"], "ans": 0, "why": "Crystallized intelligence includes learned knowledge and skills shaped by education and culture. Novel-pattern reasoning emphasizes fluid ability and would not by itself answer the acquired-knowledge question. (Source: Ms. Chiqui's notes)", "hint": "Choose evidence about accumulated learning rather than preferences or unfamiliar problem solving."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Cognitive Domains", "q": "Within a WISC-V evaluation, the referral asks about a child's ability to hold information in mind and manipulate it. Which index is most directly relevant?", "opts": ["Verbal Comprehension Index", "Visual-Spatial Index", "Working Memory Index", "Processing Speed Index"], "ans": 2, "why": "The Working Memory Index concerns registering, maintaining, manipulating, and recalling information in conscious awareness. Processing speed emphasizes rapid accurate handling of simple visual information rather than holding and transforming information.", "hint": "Identify whether the task demands mental retention and transformation or rapid scanning."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Cognitive Domains", "q": "A WISC-V referral focuses on how quickly and accurately a child scans and discriminates simple visual information. Which index best addresses that question?", "opts": ["Working Memory Index", "Processing Speed Index", "Fluid Reasoning Index", "Verbal Comprehension Index"], "ans": 1, "why": "The Processing Speed Index emphasizes rapid, accurate visual scanning and discrimination. Working memory concerns holding or manipulating information rather than speed on simple visual material.", "hint": "Match the referral to the main demand of the task, including whether speed is central."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Accessible Test Selection", "q": "A client has both language limitations and a major visual impairment. Why should an examiner avoid automatically choosing a visual nonverbal test solely because it reduces language demands?", "opts": ["Every nonverbal test has the same administration and norming requirements", "Removing spoken language guarantees that all accessibility barriers are removed", "Nonverbal content makes sensory demands irrelevant to interpretation", "The tool must also fit the client's other relevant capacities and the referral purpose"], "ans": 3, "why": "Appropriate selection considers the client's language, competence, other relevant characteristics, and assessment purpose. Reducing language demands does not remove a visual task's access demands. (Source: Ms. Chiqui's notes)", "hint": "Check every capability the response format requires, not just the spoken language."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Normal Personality Assessment", "q": "A counselor needs a normal-personality inventory emphasizing interpersonal effectiveness, leadership potential, and everyday social characteristics. Which listed tool is most directly designed for this focus?", "opts": ["Raven's Progressive Matrices", "California Psychological Inventory", "Bender-Gestalt Test", "Wide Range Achievement Test"], "ans": 1, "why": "The CPI assesses normal-personality and interpersonal characteristics relevant to development and social functioning. An achievement or reasoning measure provides different information and is not a substitute for that personality focus.", "hint": "Match the construct domain rather than the general label 'psychological test.'"}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Mechanical Aptitude", "q": "A technical-school referral asks about understanding the effects of forces on pulleys, gears, and other tools. Which listed test most directly addresses that aptitude?", "opts": ["Rotter Incomplete Sentence Blank", "California Psychological Inventory", "Strong Interest Inventory", "Bennett Mechanical Comprehension Test"], "ans": 3, "why": "The Bennett Mechanical Comprehension Test targets understanding and solving basic mechanical problems. An interest inventory may show preferences for technical work without measuring mechanical comprehension. (Source: Ms. Chiqui's notes)", "hint": "Identify whether the needed evidence concerns mechanical understanding or liking technical activities."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Career Tools", "q": "A counselor selects a career-interest instrument explicitly organized around Holland's vocational personality types and work environments. Which listed tool matches the description in the notes?", "opts": ["Edwards Personal Preference Schedule", "Minnesota Satisfaction Questionnaire", "Watson-Glaser Critical Thinking Appraisal", "Self-Directed Search"], "ans": 3, "why": "The Self-Directed Search explores interests within Holland's framework of vocational types and environments. A job-satisfaction measure addresses an attitude toward a job rather than that career-interest framework. (Source: Ms. Chiqui's notes)", "hint": "Look for the theory and information goal, rather than a test that happens to mention work."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Sentence Completion", "q": "A qualified examiner wants an adult sentence-completion technique to explore attitudes, feelings, and conflicts, including attitudes toward family members. Which listed method fits?", "opts": ["Sachs Sentence Completion Test", "Kinetic Family Drawing", "Raven's Progressive Matrices", "Bender-Gestalt Test"], "ans": 0, "why": "The Sachs Sentence Completion Test elicits attitudes and conflicts through incomplete sentences. Kinetic Family Drawing also concerns family material but obtains it through a drawing task rather than sentence completion.", "hint": "Both the information sought and the response format must fit."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Neuropsychological Batteries", "q": "A neuropsychologist hand-picks tests to address one patient's distinctive injury history and presenting problems. Which battery approach is being used?", "opts": ["Fixed battery", "Uniform interest profile", "Flexible battery", "Single global screening score"], "ans": 2, "why": "A flexible battery consists of instruments selected for the particular patient and purpose. A fixed battery uses a predefined set within a standardized interpretive framework rather than this individualized selection. (Source: Ms. Chiqui's notes)", "hint": "Consider whether the test set is predetermined or tailored to the case."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Battery Selection", "q": "An examiner assembles a flexible battery but several tests repeatedly measure the same function, adding fatigue without useful additional information. What selection issue should be reviewed?", "opts": ["Whether more tests automatically mean more complete evidence", "Whether the longest battery is necessarily the most appropriate", "Whether identical functions guarantee different sources of information", "Redundancy and burden relative to the referral's information needs"], "ans": 3, "why": "The notes warn that flexible batteries can overlap in functions and waste testing and scoring time. Each measure should justify the information it adds to the case rather than lengthening the battery for its own sake. (Source: Ms. Chiqui's notes)", "hint": "Ask what useful information each additional measure contributes."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Choosing Information Sources", "q": "A client cannot provide a reliable developmental history during assessment. Which additional source is most relevant to reconstructing that history?", "opts": ["A second unrelated interest inventory", "Relevant records and people who know the client's history", "A faster version of the same current symptom checklist", "A ranking of other clients' test scores"], "ans": 1, "why": "Clinical assessment can supplement the client's account with case history, relevant records, and knowledgeable informants. Repeating a current symptom measure does not by itself reconstruct developmental history. (Source: Ms. Chiqui's notes)", "hint": "Choose a source that can actually know the missing historical information."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Trait and State Measures", "q": "A clinician wants to assess anxiety experienced right now before a procedure rather than the client's usual long-term tendency. Which kind of measure best matches that time frame?", "opts": ["A state-anxiety measure", "A trait-anxiety measure alone", "A general achievement test", "A career-interest inventory"], "ans": 0, "why": "A state is relatively temporary and situation dependent, so a current-state measure fits the immediate question. A trait measure targets a more enduring tendency and may not reflect the present procedure-related experience.", "hint": "Match the measure's time frame to the time frame in the referral."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Purpose-Based Selection", "q": "A school can administer a short group reasoning test to many students, but one referred child needs a detailed individualized assessment of several domains. What should guide the method chosen for that referral?", "opts": ["The information and level of detail needed for that child's assessment purpose", "The group test's speed as the sole decision criterion", "The desire to use identical methods for all referrals regardless of need", "The assumption that any general score answers every referral question"], "ans": 0, "why": "Tools should be pertinent to the referral and purpose and appropriate to the client. Group efficiency is valuable, but it does not establish that a brief general score yields the detailed information needed in this individual referral. (Source: Ms. Chiqui's notes)", "hint": "Begin with the decision the assessment must support, then consider the method's coverage."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "During a standardized group test, a proctor notices examinees look confused, so she rephrases the instructions in her own words and gives an extra two minutes. What is the main problem?", "opts": ["She made administrative deviations that threaten comparison with the norms", "She prevented a ceiling effect", "She provided a legitimate accommodation", "She built rapport correctly"], "ans": 0, "why": "Standardized administration means reading instructions VERBATIM and keeping exact timing. Rephrasing instructions or changing time limits are administrative deviations, so scores can no longer be fairly compared with the norm group.", "hint": "What does 'standardized' require of the examiner?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "For a student with low vision, the examiner provides a large-print version of a math reasoning test. The construct measured stays the same. This change is a(n):", "opts": ["Administrative deviation", "Modification", "Construct bias", "Accommodation"], "ans": 3, "why": "ACCOMMODATION = an adjustment that reduces the impact of a disability WITHOUT changing the construct being measured (extra time for motor deficits, large print). MODIFICATION = a change that alters the construct and can invalidate comparison with norms.", "hint": "Is the test still measuring the same skill?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "An examiner reads a reading-comprehension passage ALOUD to a student with dyslexia. Why is this considered a modification rather than an accommodation?", "opts": ["It gives the student extra time", "It changes the construct from reading comprehension to listening comprehension", "It was done after the test", "It uses large-print materials"], "ans": 1, "why": "Reading the passage aloud means the student no longer has to READ, so the test now measures listening, not reading comprehension. Changing the construct makes it a modification, and scores can't be compared to the norms.", "hint": "What skill is the student using now?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "An examiner who expects a child to be gifted unconsciously gives subtle encouraging cues and scores the child's ambiguous answers generously. This examiner effect is the:", "opts": ["Expectancy (Rosenthal) effect", "Flynn effect", "Halo effect in self-report", "Carryover effect"], "ans": 0, "why": "The expectancy/Rosenthal effect: examiner expectations subtly influence the test taker's performance through micro-cues or biased scoring of ambiguous responses.", "hint": "The examiner's expectations shaped the result."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Intelligence Issues", "q": "A school compares this year's students with norms collected 30 years ago and finds their IQs inflated by about 9 points. This is consistent with the:", "opts": ["Flynn effect", "Practice effect", "Restriction of range", "Hawthorne effect"], "ans": 0, "why": "The Flynn effect = the worldwide historic rise in raw intelligence test scores, about 3 IQ points per decade. Thirty years × 3 points ≈ 9 points. That's why outdated norms inflate scores.", "hint": "How many points per decade, and how many decades?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Equivalence", "q": "To adapt an English personality inventory for Filipinos, a team translates it into Filipino, then has a separate translator turn the Filipino version back into English to check that the meaning was preserved. This procedure is:", "opts": ["Back translation, for linguistic equivalence", "Cross-validation", "Co-norming", "Conceptual equivalence testing only"], "ans": 0, "why": "Back translation checks LINGUISTIC equivalence: whether the test was translated accurately. CONCEPTUAL equivalence = the construct means the same thing across cultures. METRIC equivalence = the same psychometric properties across groups.", "hint": "Translate, then translate back."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Bias", "q": "Two groups with equal overall ability perform very differently on a few specific items that refer to snow sports, which one group has never experienced. This is an example of:", "opts": ["Ceiling effect", "Predictive (criterion) bias", "Item (content) bias", "Construct bias"], "ans": 2, "why": "Item bias = specific items are easier or harder for members of a group of EQUAL ability. Construct bias = the whole test measures different constructs across groups. Predictive bias = the test predicts criterion outcomes differently for different groups.", "hint": "Equal ability, but a few specific items are unfair."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Behavioral Assessment", "q": "After several weeks of classroom observation, an observer has gradually started coding milder behaviors as 'aggression' than she did on day one, without realizing it. This error is:", "opts": ["Observer drift", "Demand characteristics", "Reactivity", "Central tendency error"], "ans": 0, "why": "Observer drift = a gradual, unintentional shift over time in how an observer applies the coding criteria. Retraining and periodic inter-observer reliability checks help prevent it.", "hint": "The observer's standards slowly shifted over time."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Behavioral Assessment", "q": "A normally rowdy student becomes unusually quiet and well-behaved only while the school psychologist sits in the back of the classroom observing. This is:", "opts": ["Reactivity", "Observer bias", "Time sampling error", "Observer drift"], "ans": 0, "why": "Reactivity = an alteration in a person's natural behavior caused by the AWARENESS of being observed. It's a subject-related error, unlike observer drift or observer bias, which come from the observer.", "hint": "Whose behavior changed: the observer's or the student's?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretation", "q": "An examiner's report simply states: 'The client typed 45 words per minute on the typing test,' with no inference about underlying traits. In Sundberg's levels of interpretation, this is:", "opts": ["Level II: hypothetical construct", "Level III: dynamic case conceptualization", "Level I: direct sample, minimal inference", "Level II: descriptive generalization"], "ans": 2, "why": "Level I = test data treated as a direct behavior sample with minimal inference. Level II = generalizing to broader traits or inferring internal constructs. Level III = a fully integrated, high-inference case conceptualization of the person.", "hint": "No inference at all, just what was observed."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "A company's selection test predicted that an applicant would succeed, so she was hired, but she failed in the job. In decision theory terms, this outcome is a:", "opts": ["False positive", "True positive", "False negative", "True negative"], "ans": 0, "why": "FALSE POSITIVE (Type I) = predicted success that does not occur. FALSE NEGATIVE (Type II) = predicted failure, but the person would have succeeded. True positives and true negatives are correct predictions (hits).", "hint": "The test said 'yes' and reality said 'no'."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "A company has 10 job openings and 200 applicants. What is the selection ratio?", "opts": ["20", ".05", ".20", "2.0"], "ans": 1, "why": "Selection ratio = number to be hired ÷ number of applicants = 10 / 200 = .05. A low selection ratio means the company can be very selective, which increases a valid test's utility.", "hint": "Openings divided by applicants."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "An HR analyst wants to estimate the MEAN difference in performance between employees selected with the test and those not selected, as an index of what the test adds to existing procedures. Which tool fits?", "opts": ["Expectancy tables", "Naylor-Shine tables", "Taylor-Russell tables", "Brogden-Cronbach-Gleser formula"], "ans": 1, "why": "Naylor-Shine = difference between the MEANS of the selected and unselected groups. Taylor-Russell = how much adding a test improves selection, as a proportion of successful hires. Brogden-Cronbach-Gleser = the peso/dollar utility gain.", "hint": "It compares the MEANS of selected and unselected groups."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Cut Scores", "q": "An employer decides that a high score on a teamwork test can make up for a lower score on a technical test when combining applicants' results. This is the:", "opts": ["Fixed cut score method", "Compensatory model of selection", "Known-groups method", "Multiple hurdle model"], "ans": 1, "why": "Compensatory model = high scores on one attribute can compensate for lower scores on another. Multiple hurdle = a cut score must be passed at each stage, with no compensation.", "hint": "Strength in one area makes up for weakness in another."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Cut Scores", "q": "To set a cut score, a developer gives the test to a group known to have mastered the skill and a group known NOT to have mastered it, then sets the cut where the two groups' distributions separate. This is the:", "opts": ["Known-groups method", "Method of predictive yield", "Angoff method", "Bookmark method"], "ans": 0, "why": "The known-groups method collects predictor data from groups known to possess, and not to possess, the trait or ability of interest. Angoff relies on experts' item-by-item judgments; bookmark relies on items ordered by IRT difficulty.", "hint": "Compare two groups that differ on the skill."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretation", "q": "During a WISC-V session, the examiner notes that the child repeatedly sighs, erases answers, and says 'I'm stupid' whenever an item gets hard. These observations, which aren't part of the test content but may matter for interpretation, are called:", "opts": ["Test sophistication", "Extra-test behavior", "Scoring drift", "Construct-irrelevant variance"], "ans": 1, "why": "Extra-test behavior = observations of what the examinee does and how they react during testing that are only indirectly related to the test content but may be significant for interpretation.", "hint": "Behavior that isn't part of the test content."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "MSE", "q": "During a mental status exam, the patient says 'I feel fine, really happy,' but the clinician observes a blank face and little emotional expression throughout the interview. Which statement is correct?", "opts": ["Both describe her thought content", "'Happy' is her reported mood; the blank expression describes her affect", "'Happy' is her affect; the blank expression is her mood", "Both describe her insight"], "ans": 1, "why": "MOOD = the patient's SUBJECTIVE, self-reported emotional state ('I feel happy'). AFFECT = the clinician's OBJECTIVE observation of emotional expression ('flat affect'). A mismatch between them is clinically important.", "hint": "One comes from the patient's own words; the other is what the clinician sees."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "MSE", "q": "In the mental status exam, a patient's understanding of the nature and severity of his own illness is assessed under:", "opts": ["Thought content", "Orientation", "Judgment", "Insight"], "ans": 3, "why": "Insight = the patient's understanding of their own illness, including its nature and severity. Judgment = the ability to make sound decisions and act appropriately. Orientation = awareness of person, place, and time.", "hint": "Does he understand his own condition?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Cut Scores", "q": "A company decides it will hire only the top 10% of scorers on its exam, whatever their actual scores turn out to be. This kind of cut score is:", "opts": ["Relative (norm-referenced) cut score", "Compensatory cut score", "Fixed cut score", "Multiple cut scores"], "ans": 0, "why": "A RELATIVE cut score is based on norm-related considerations (where you stand compared with others, like the top 10%). A FIXED cut score is set by judgment of the minimum proficiency required, no matter how others perform.", "hint": "Is the cutoff based on a minimum skill level or on ranking against others?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretation", "q": "From a single elevated score on a test-anxiety scale, a report concludes the student 'has a general tendency toward high test anxiety.' In Sundberg's levels of interpretation, this is:", "opts": ["Level II: descriptive generalization", "Extra-test behavior", "Level III: dynamic case conceptualization", "Level I: direct sample"], "ans": 0, "why": "Level II includes DESCRIPTIVE GENERALIZATION: expanding a specific score into a general trait category. Level I treats data as a direct sample with no inference. Level III integrates everything into a full, high-inference model of the person.", "hint": "One score has been expanded into a general trait."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Equivalence", "q": "A team adapting a 'self-esteem' scale finds that in the new culture, the construct itself is understood differently, as tied to family honor rather than individual worth. Which type of test equivalence is in question?", "opts": ["Parallel-forms equivalence", "Conceptual equivalence", "Linguistic equivalence", "Metric equivalence"], "ans": 1, "why": "Conceptual equivalence = the construct has the same MEANING across cultures. Linguistic equivalence = accurate wording and translation. Metric equivalence = the same psychometric properties across groups. A perfect translation can still fail conceptually.", "hint": "The problem isn't the words; it's what the idea means."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration Challenges", "q": "Halfway through a timed group intelligence test, a fire drill forces everyone out of the room for 15 minutes. What is the most appropriate response?", "opts": ["Give everyone extra points to make up for it", "Document the irregularity and consider its effect on the scores' validity in the report (or re-test if the manual requires)", "Tell examinees the answers they missed", "Ignore it and score the tests normally without mention"], "ans": 1, "why": "Unusual administration conditions are a source of error. The examiner should record the irregularity, follow the manual's guidance (which may require a re-test), and note any reservations in the interpretation. The Code says we must indicate reservations about interpretations.", "hint": "Something non-standard happened. What should the record say?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration Challenges", "q": "During an individually administered vocabulary subtest, the examinee asks, 'What does that word mean?' What should the examiner do?", "opts": ["Give only the neutral prompts allowed by the manual, without defining or hinting at the word", "Give a synonym as a hint", "Explain the word so the examinee isn't anxious", "Skip the rest of the subtest"], "ans": 0, "why": "Standardized administration means following the manual exactly. Defining a word on a VOCABULARY test gives away the answer and changes what's being measured. Rapport should ease anxiety without providing unfair hints or encouragement.", "hint": "What is a vocabulary subtest actually measuring?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration Challenges", "q": "A 7-year-old becomes tired and restless halfway through a long test battery and starts guessing randomly. What is the best course of action?", "opts": ["Score the random guesses as her true ability", "Discard all results without noting why", "Push through so the battery finishes today", "Allow a break or continue in another session, and note the fatigue as extra-test behavior"], "ans": 3, "why": "Test-taker state factors like fatigue and low motivation are sources of error variance. Breaks (where the manual permits) or a second session protect validity, and noting the behavior helps interpretation.", "hint": "What causes error here, and how can you protect the results?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Scoring Accuracy", "q": "A child's raw score was correct, but the examiner converted it using the table for the wrong age band. What should happen before interpreting the result?", "opts": ["Recalculate with the appropriate table and verify the corrected derived scores", "Keep the derived score because the raw total was correct", "Treat the conversion error as evidence of low ability", "Average the two age-band conversions to reduce the difference"], "ans": 0, "why": "Correct raw totals can still produce wrong derived scores when inappropriate conversion tables are used. The age-band conversion must be corrected before interpreting the client's standing.", "hint": "Follow the score from the original response through every conversion step."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Scoring Accuracy", "q": "An examiner discovers that she used an earlier edition's scoring key on protocols from a revised test. What is the appropriate next step?", "opts": ["Apply an arbitrary point adjustment to every result", "Retain the old scores because editions usually have similar titles", "Check the current manual, rescore affected protocols, and correct resulting reports", "Change only the highest scores to preserve the group mean"], "ans": 2, "why": "Scoring should follow the appropriate standardized key and procedures for the administered edition. An arbitrary adjustment does not establish which answers or derived scores were affected.", "hint": "Use the actual administered version as the reference for correction."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Response Verification", "q": "An answer sheet contains two marks on one item. The examiner thinks she can guess which mark the examinee intended. What should guide scoring?", "opts": ["The mark that matches the examiner's preferred interpretation", "The answer that would bring the total nearer the group average", "The option the examiner believes the examinee probably knew", "The manual's scoring rule for double-marked responses"], "ans": 3, "why": "Response documents should be checked for double marks and scored using standardized rules. Inferring the intended answer adds examiner judgment that may depart from those rules.", "hint": "Resolve ambiguous markings through a defined rule rather than a personal inference."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Pre-Administration Checks", "q": "A proctor discovers missing stimulus cards just as individual testing is about to begin. Which response best protects the assessment procedure?", "opts": ["Start and substitute similar pictures from the internet", "Explain that missing cards cannot influence the result", "Skip the missing items without checking scoring consequences", "Resolve the missing-material problem before starting the standardized task"], "ans": 3, "why": "Preparation includes verifying that required stimulus materials are complete. Improvised replacements or unexamined omissions can change the task and undermine the planned scoring and interpretation.", "hint": "Ask whether the intended task can actually be administered with the materials available."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Timing Preparation", "q": "Before a strictly timed test, the examiner finds that the stopwatch repeatedly stops without warning. What is the most appropriate action?", "opts": ["Ignore timing because the instructions were read correctly", "Estimate elapsed time from how long the task feels", "Use a reliable timing device before administering the timed task", "Give the same unplanned extra time to everyone afterward"], "ans": 2, "why": "Standardized timed tasks require precise timing and prepared equipment. Reading the correct instructions cannot compensate for an unknown or inconsistent testing interval.", "hint": "Identify which administration requirement the faulty equipment prevents."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Rapport and Standardization", "q": "An anxious examinee asks whether each answer is correct while taking a standardized ability test. Which response best balances rapport and standardization?", "opts": ["Nod approvingly only when the examinee selects the correct answer", "Give harder hints until the examinee succeeds", "Offer neutral reassurance while following the manual's permitted feedback", "Explain the solution after every incorrect response"], "ans": 2, "why": "Rapport should reduce anxiety without supplying unfair cues or hints. Correctness feedback can guide later responses and alter the standardized task unless specifically permitted.", "hint": "Support the person without teaching the answers during the measurement."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "State Factors", "q": "A client arrives visibly ill and unable to sustain attention for a nonurgent assessment. What is the most defensible response?", "opts": ["Assume illness cannot affect a standardized test", "Consider postponement and document how the current condition affects the assessment plan", "Add a fixed number of points to compensate for illness", "Proceed and interpret all low scores as stable limitations"], "ans": 1, "why": "Illness and acute state factors can affect performance independently of the intended construct. For a nonurgent assessment, considering a better time is more defensible than interpreting compromised performance as a stable limitation.", "hint": "Ask whether today's performance would answer the referral about the person's usual functioning."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Accommodations and Constructs", "q": "An examiner considers extra time for a client on a task whose intended construct includes processing speed. What must be checked before calling the change an accommodation?", "opts": ["Whether changing timing has the same meaning on every test", "Whether the altered timing changes the construct and the supported score interpretation", "Whether every disability-related adjustment leaves the construct unchanged", "Whether extra time automatically preserves all original norm comparisons"], "ans": 1, "why": "An accommodation minimizes an access barrier without changing the measured construct. When speed is part of that construct, extra time may alter the meaning of the score, so the manual and evidence must guide the decision.", "hint": "Examine what the test is meant to measure before deciding what the adjustment preserves."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretive Conditions", "q": "A client reports taking a medication that makes her drowsy during testing. Which interpretation practice is appropriate?", "opts": ["Tell her to stop the prescribed medication for future testing", "Discard the information because it is not an item response", "Document the relevant condition and consider its possible effect on performance", "Infer that every low score proves a permanent impairment"], "ans": 2, "why": "Medication effects and drowsiness are relevant state conditions that may influence scores. The examiner should consider the limitation rather than assume a stable impairment or give unsupported medication instructions.", "hint": "Record a possible performance influence without turning it into a medical treatment decision."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration Deviations", "q": "An examiner accidentally gives one examinee an unauthorized clue that helps solve several later items. What is the appropriate response when preparing the report?", "opts": ["Treat the administration as fully standard because only one clue was given", "Document the deviation and evaluate its effect on the score's interpretability", "Omit the event so the report contains only numerical results", "Subtract an arbitrary number of points and assume comparability is restored"], "ans": 1, "why": "Improper prompting is an administration deviation that can change performance. Its impact must be evaluated and reported as needed; an invented point correction does not demonstrate restored comparability.", "hint": "Ask whether the obtained performance still supports the original standardized inference."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Scorer Calibration", "q": "Two scorers disagree on responses governed by a judgment-based rubric. What resource can help them recalibrate their scoring to the test's intended standard?", "opts": ["The current client's expected diagnosis", "An authoritative anchor protocol and scoring guidelines", "The score distribution the employer would prefer", "A rule to give every ambiguous response full credit"], "ans": 1, "why": "An anchor protocol provides a model of authoritative scoring for resolving discrepancies. Expected diagnosis or desired results should not substitute for applying the scoring standard.", "hint": "Use a reference for how responses should be scored rather than how the client should turn out."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Data Verification", "q": "A report shows a total of 83, but the original scored protocol sums to 68; the conversion table itself was applied correctly to the entered total. Where should correction begin?", "opts": ["Interpret 83 because software generated the final page", "Average 83 and 68 as competing estimates", "Choose a different norm table until the report seems plausible", "Verify and correct the transcribed raw total against the protocol"], "ans": 3, "why": "Data verification must check the input against the original protocol. A correctly applied conversion cannot rescue an incorrectly entered raw score.", "hint": "Trace the mismatch to the first step at which the recorded information changed."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Post-Administration Procedures", "q": "After group testing, one reusable booklet is missing. What should the proctor do before simply closing the session paperwork?", "opts": ["Order a replacement without resolving the missing original", "Assume the booklet was blank and omit it from the inventory", "Account for the missing material and follow the site's test-security procedure", "Replace the inventory total with the number of booklets found"], "ans": 2, "why": "Post-administration procedures include collecting and accounting for test materials. Changing the count does not resolve a missing secure booklet, and circulating test content would increase the security problem.", "hint": "Treat the discrepancy as a material-accountability problem requiring follow-through."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Behavioral Sampling", "q": "An observer judges a child's typical classroom activity from observations made only during the first five minutes after recess. Which limitation most directly threatens that conclusion?", "opts": ["A fixed scoring-key offset", "A lack of expert item-essentiality ratings", "Unrepresentative time sampling", "An unusually long retest interval"], "ans": 2, "why": "Observing only an atypical time can distort conclusions about usual behavior. Sampling additional relevant periods addresses that limitation more directly than changing score conversions or retest timing.", "hint": "Ask whether the observation periods represent the behavior the conclusion describes."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Operational Definitions", "q": "Observers disagree because one counts any loud speech as aggression while another counts only threats or physical attacks. What should be improved first?", "opts": ["A clear shared operational definition with examples and boundaries", "A larger observation sample with unchanged behavioral definitions", "A longer interval between repeated observation sessions", "A narrower score range for admitting children to observation"], "ans": 0, "why": "Ambiguous behavioral definitions reduce agreement about what counts as an event. A larger sample cannot resolve observers recording different kinds of behavior.", "hint": "Make sure observers are counting the same event before comparing their counts."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Observation Coding", "q": "Observers must track 25 overlapping behavior categories simultaneously and repeatedly miss events. Which procedural change most directly addresses the source of error?", "opts": ["Simplify and clarify the coding scheme while retaining the behaviors needed for the referral", "Keep the scheme and infer unrecorded events after the session", "Add more overlapping categories to capture every possible distinction", "Replace observed events with the child's expected diagnosis"], "ans": 0, "why": "Overly complex coding systems can increase recording errors and reduce reliability. A clearer manageable scheme addresses the task demand rather than encouraging guessed observations.", "hint": "Consider what a human observer can consistently track in real time."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Observer Fatigue", "q": "An observer's event recording becomes less accurate near the end of long continuous observation periods. Which adjustment most directly targets this problem?", "opts": ["Replace missed events with the session's average event count", "Use manageable observation periods and appropriate breaks", "Treat late-session omissions as proof the behavior stopped", "Increase the session length to obtain still more data"], "ans": 1, "why": "Long observation intervals and heavy recording demands can cause fatigue and inattention. Manageable periods address that source of error, while assumed replacement counts do not recover the missing observations.", "hint": "Match the remedy to the observer's declining attention over time."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Participant Effects", "q": "Before a task, an assistant strongly suggests that helpful participants usually report feeling calmer. Participants then tailor their ratings to that expectation. Which effect is most directly illustrated?", "opts": ["Observer drift", "Restriction of the norm sample", "Scoring-table error", "Demand characteristics"], "ans": 3, "why": "Demand characteristics are cues about expected behavior that influence participants' responses. Observer drift is a change in the observer's coding standards rather than participants adjusting to perceived expectations.", "hint": "Locate whose behavior changes and what information prompts it."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Observer Bias Prevention", "q": "Observers who know which pupils received an intervention consistently record more improvement for those pupils. Which design change most directly reduces this expectancy influence when feasible?", "opts": ["Use pupils' expected improvement as the coding standard", "Tell observers the outcome the researchers hope to find", "Keep observers unaware of intervention assignment", "Select only observation periods showing the desired effect"], "ans": 2, "why": "Prior knowledge about intervention membership can bias recording toward expected outcomes. Masking that information reduces the specific expectancy cue rather than building the desired result into the coding.", "hint": "Consider what an observer needs to know to code the behavior accurately."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Levels of Interpretation", "q": "A report integrates developmental history, relationships, current stressors, cognitive scores, and observations into a model of the client's difficulties. Which Sundberg level is emphasized?", "opts": ["A raw-score listing without psychological inference", "Level III: dynamic case conceptualization", "Level II: descriptive generalization from an isolated score", "Level I: direct behavioral sample"], "ans": 1, "why": "Level III builds an integrated individualized account using historical, contextual, and multiple-method evidence. Level I stays near the direct behavioral sample rather than constructing this broader explanatory model.", "hint": "Consider how far the interpretation integrates evidence beyond the isolated score."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Basis of Interpretation", "q": "An assessor justifies an interpretation with relevant research findings rather than saying only that a famous psychologist once supported it. Which approach is being emphasized?", "opts": ["Authoritative approach", "Intuitive approach", "Empirical/conceptual approach", "Mechanical score conversion"], "ans": 2, "why": "The empirical/conceptual approach grounds interpretation in research. An authoritative approach relies on experts' standing, which is a different basis from presenting the relevant evidence itself.", "hint": "Check the justification for the claim rather than the confidence with which it is stated."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Behavioral Notes", "q": "During testing, a child repeatedly pauses and says, 'I don't want to get it wrong.' Which note best preserves useful behavioral evidence without adding an unsupported conclusion?", "opts": ["Record the observed pauses and statement with their testing context", "Record that the child intentionally tried to invalidate the test", "Delete the observation because it was not a keyed response", "Record a permanent personality diagnosis from the pauses alone"], "ans": 0, "why": "Behavioral observations during testing can matter for interpretation even when they are not item content. Factual contextual notes preserve the evidence without assuming a motive or diagnosis that the behavior alone does not establish.", "hint": "Separate what the examiner saw and heard from an explanation for it."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Teleassessment Challenges", "q": "A timed remote task is disrupted by a long connection loss, leaving the examiner unsure how much working time the client actually had. What is the most defensible response?", "opts": ["Hide the disruption to keep the report focused on the result", "Document the disruption and follow appropriate procedures to judge score usability or arrange reassessment", "Interpret the score as standard because the client eventually submitted answers", "Add a fixed number of points without reference to the manual"], "ans": 1, "why": "Poor connectivity can affect timed performance, and interpretation must consider the appropriateness of the obtained result. An undocumented arbitrary score correction does not establish that standard conditions were restored. (Source: Ms. Chiqui's notes)", "hint": "First determine whether the recorded performance still supports the intended comparison."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Mode of Administration", "q": "A test validated for supervised paper administration is moved to unsupervised home use with different instructions and response conditions. Which assumption requires evidence?", "opts": ["That the original score interpretation remains supported under the changed conditions", "That a digital total removes the effects of environmental differences", "That home administration automatically improves standardization", "That using the same test title makes the two procedures equivalent"], "ans": 0, "why": "Changes in instructions, setting, and supervision can affect performance and comparability. Using the same content or test name does not by itself demonstrate that the original interpretation transfers to the new procedure.", "hint": "Compare the actual measurement conditions rather than only the item text."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Language Challenges", "q": "Before testing, an examiner learns that the client does not understand the language used in the standardized instructions. Which response best protects the intended inference?", "opts": ["Seek an appropriate validated language version or qualified assessment arrangement", "Raise the final score by a standard language-compensation amount", "Proceed and treat misunderstanding as evidence of low reasoning ability", "Translate every item spontaneously and assume the original norms still apply"], "ans": 0, "why": "Language proficiency and translation artifacts can change what a test measures. A suitable validated language arrangement is preferable to treating misunderstanding as low ability or assuming improvised translation preserves comparability.", "hint": "Remove the mismatch through a supported assessment method rather than an invented score adjustment."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Score Precision in Decisions", "q": "A clinical report treats a score just above a reference boundary as an exact, error-free measure of a client's condition. What should the reviewer request?", "opts": ["An interpretation that considers measurement uncertainty and other relevant assessment evidence", "Removal of all contextual information because a numerical score is available", "An automatic diagnosis based only on rounding the score upward", "A statement that the boundary eliminates all measurement error"], "ans": 0, "why": "An observed score carries measurement uncertainty, and interpretation must consider psychometric appropriateness. A reference boundary does not make the score error-free or replace the need for relevant contextual evidence. (Source: Ms. Chiqui's notes)", "hint": "A precise-looking number can still carry uncertainty."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A court orders a psychological evaluation of a defendant. Under the Code of Ethics, is the psychologist required to obtain the defendant's informed consent before assessment?", "opts": ["Yes, but only from the judge", "No, because defendants have no right to privacy", "Yes, informed consent is always required with no exceptions", "No, informed consent is not required when the assessment is mandated by law"], "ans": 3, "why": "The Code says we gather informed consent prior to assessment EXCEPT when (a) it is mandated by law, (b) consent is implied, as in routine educational, institutional, and organizational activity, or (c) the purpose is to determine the person's decisional capacity. NOTE: the reviewer lists these three without the word 'EXCEPT,' which flips the meaning. They are EXCEPTIONS to the consent requirement.", "hint": "The Code lists situations where consent is NOT needed. Is a court order one of them?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A school gives its yearly routine group achievement test to all Grade 9 students as part of normal school operations. What kind of consent situation is this under the Code?", "opts": ["Consent is not possible for minors, so the test cannot be given", "Consent must be signed individually by every student before testing", "Only verbal assent from the principal is needed", "Implied consent, as in routine educational activity"], "ans": 3, "why": "Routine educational, institutional, or organizational assessments fall under IMPLIED consent, one of the three exceptions to formal informed consent (along
