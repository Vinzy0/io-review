, "hint": "Find the structural step that prevents the strategic promise from being delivered."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Structure Pros & Cons", "q": "A retailer keeps several layers of supervision. Its response times are stable, but each added management layer substantially raises payroll. Which downside of a tall hierarchy does this illustrate?", "opts": ["Greater administrative overhead", "Competing product and functional authority", "Loss of functional specialization", "Dependence on outside contractors"], "ans": 0, "why": "A hierarchy can cost more to operate because it adds levels of management. Dual reporting is a matrix concern and does not follow merely from paying for more supervisory levels.", "hint": "Distinguish the budget consequence from delays or competing reporting lines."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Structure Pros & Cons", "q": "After removing middle managers, a studio finds two employees accepting the same client job while another job is unassigned. Which action best addresses a typical weakness of its new flat structure?", "opts": ["Centralize all professional training under one specialist", "Require each employee to work only with outside contractors", "Add more tasks to every employee's job description equally", "Clarify task ownership and coordination responsibilities"], "ans": 3, "why": "Flat structures can suffer role ambiguity and coordination difficulties. Clarifying ownership targets the overlap and gap; adding tasks without clarifying ownership can worsen both.", "hint": "The problem is who owns each result, rather than how much total work exists."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A retailer replaces separate purchasing, stocking, and customer-service departments with permanent store teams that share skills and make decisions about their complete service process. Which structural choice is this?", "opts": ["Temporary project task force", "Network structure", "Team-based structure", "Functional structure"], "ans": 2, "why": "A team-based structure organizes work around teams, often with cross-functional skills and decision authority. A project task force is temporary, whereas these teams are the retailer's continuing operating arrangement.", "hint": "Look at the continuing unit around which work is organized."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A company wants branch pricing decisions to follow one corporate direction and prioritizes consistency over local discretion. Which distribution of authority best fits that priority?", "opts": ["Decentralized decision making", "Self-directed team authority", "Centralized decision making", "Independent divisional pricing authority"], "ans": 2, "why": "Centralization concentrates decision authority at the top, supporting consistent direction. Decentralization gives lower levels more discretion and may produce more local variation.", "hint": "Where must the final decision sit if one uniform direction is the priority?"}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Structure Pros & Cons", "q": "Branch managers may approve refunds locally, so complaints are resolved quickly. However, customers now receive different remedies at different branches. Which tradeoff should management recognize?", "opts": ["Local discretion improved speed but weakened consistency", "Central control improved local discretion but slowed specialization", "Functional grouping improved partner access but increased outsourcing", "Dual reporting improved consistency but removed functional expertise"], "ans": 0, "why": "Decentralization can speed decisions and use local expertise, but it can also reduce consistency across units. Dual reporting is associated with a matrix, not simply with distributing refund authority.", "hint": "One benefit and one cost arise from letting local managers decide."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "An administrator is deciding which jobs should be grouped into Finance, Operations, and HR units, rather than changing the duties within any one job. What is she primarily doing?", "opts": ["Job enlargement", "Departmentalization", "Job enrichment", "Job rotation"], "ans": 1, "why": "Departmentalization groups jobs so common tasks can be coordinated. Enrichment changes the responsibility or control within an individual job rather than grouping jobs into units.", "hint": "Distinguish arranging several jobs from redesigning one person's work."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A new employee knows her supervisor handles leave requests, the department head handles appeals, and the director handles unresolved disputes. Which structural element makes that escalation route clear?", "opts": ["Span of control", "Skill variety", "Chain of command", "Job enlargement"], "ans": 2, "why": "The chain of command defines formal reporting and authority relationships through the organization. Span of control concerns how many people a manager supervises, not the route for escalating a decision.", "hint": "Follow the route upward rather than counting direct reports."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Role Accountability", "q": "Marketing and Sales both claim final authority over customer-discount approval, and neither role description settles the issue. Which structural response best targets the source of the conflict?", "opts": ["Reduce customer contact without changing decision rights", "Rotate both managers through unrelated technical jobs", "Update role descriptions and the authority chart to identify the decision owner", "Offer the same attendance incentive to both departments"], "ans": 2, "why": "Jurisdictional ambiguity involves unclear territory or authority and can be reduced by clear job descriptions and current organization charts. A general incentive does not settle who has the right to approve the discount. (Source: Ms. Chiqui's notes)", "hint": "Before improving cooperation, identify what each side believes it is entitled to decide."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Strategy and Structure", "q": "A factory shifts from mass-producing one standard item to making small batches of customized orders. Why should management review its organizational design?", "opts": ["Only the number of employees can influence the appropriate design", "The structure that supported mass production must fit customized work equally well", "Different production technologies can require different coordination and structural arrangements", "Product customization removes the need for defined roles and responsibility"], "ans": 2, "why": "Woodward's contingency perspective links production technology with organizational structure. The shift in how work is produced is a reason to reconsider design rather than assume one structure fits every technology.", "hint": "Consider what changes in the way work must be organized when orders stop being uniform."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Business Elements", "q": "A shop shifts from selling ready-made computers to offering booked consultations for small businesses. Under the four-element framework, which plan best aligns people and processes with the new offering and market?", "opts": ["Train staff in consultation and redesign booking around business clients", "Keep retail scripts and retain walk-in queues for every consultation", "Add more ready-made stock without changing staff roles or appointments", "Change the logo while retaining the same skills and sales workflow"], "ans": 0, "why": "The new customers and service require suitable employee capabilities and a workflow that supports consultations. A logo change concerns presentation and does not align the people and processes needed to deliver the new service.", "hint": "Consider what must change inside the business to deliver its new promise."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Business Elements", "q": "A business review lists its trained workforce, order-handling workflow, subscription packages, and intended buyers. Which entry represents the products/services element?", "opts": ["The subscription packages it sells", "The steps for processing a new subscription", "The employees trained to support subscribers", "The organizations buying subscriptions"], "ans": 0, "why": "Products and services are the offerings the business sells or provides. The order-handling steps are processes, which explain how the offering is delivered rather than what is offered.", "hint": "Distinguish the offering itself from its delivery and its users."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Job Design", "q": "A repair technician already chooses her schedule and receives clear quality reports, but uses only one repetitive procedure. Which change most directly increases skill variety?", "opts": ["Let her choose the same procedure's starting time", "Train and assign her to diagnose, repair, and test several kinds of equipment", "Send her additional reports on the same repairs", "Explain more often how customers benefit from the repair"], "ans": 1, "why": "Skill variety concerns the range of abilities used in performing a job. More scheduling freedom changes autonomy, while more quality information changes feedback rather than the skills used.", "hint": "Ask which change alters the range of abilities exercised during the work."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Structure Pros & Cons", "q": "A plant performs a stable, repetitive production process and values predictable procedures and tight control more than rapid experimentation. Which structural pattern most closely matches these priorities?", "opts": ["Temporary cross-functional task force", "Mechanistic structure", "Network of independent partners", "Organic structure"], "ans": 1, "why": "Mechanistic structures emphasize specialization, formal rules, centralized decisions, and predictable control. Organic structures offer more flexibility and less formalization, which better suit changing demands than the stated priority.", "hint": "Focus on the level of standardization and discretion the work requires."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Decision Authority", "q": "A team must reach a joint decision about its weekly allocation of work. A member may contribute to that decision but cannot set the allocation alone. Which level of employee input does this illustrate?", "opts": ["Ownership of own product", "Absolute", "Shared/participative/team", "Advisory"], "ans": 2, "why": "The shared level gives employees decision power exercised at group level. Advisory input only promises consideration of suggestions, while absolute input allows an employee to decide independently. (Source: Ms. Chiqui's notes)", "hint": "Determine whether the group decides or merely advises someone else."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "Before designing any training, an HR officer checks whether the company's goals call for it, whether the budget allows it, and whether top management will support it. Which part of needs analysis is this?", "opts": ["Job evaluation", "Person analysis", "Organizational analysis", "Task analysis"], "ans": 2, "why": "Needs analysis has 3 levels. ORGANIZATIONAL analysis = goals, resources, climate, and support for training. TASK analysis = which tasks and competencies a job requires (interviews, observation, task inventories). PERSON analysis = WHICH employees need training and in what (appraisal scores, surveys, skills tests).", "hint": "She's looking at the company's goals, budget and support, not at any specific job or person."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "HR reviews performance appraisal scores and gives a skills test to identify exactly which customer-service agents need training and in which areas. This is:", "opts": ["Organizational analysis", "Utility analysis", "Task analysis", "Person analysis"], "ans": 3, "why": "Person analysis = determining WHICH employees need training and in WHAT areas, using appraisal scores, surveys, interviews, skills and knowledge tests, and critical incidents.", "hint": "The question is WHICH employees need training."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "After a customer-service training program, HR tracks whether complaint rates dropped and repeat sales increased over the next six months. Which training-evaluation criterion is being measured?", "opts": ["Learning", "Organizational results", "Reactions", "Behavior change"], "ans": 1, "why": "Four criteria: REACTIONS (did trainees like it/find it useful?), LEARNING (did they understand and retain the content?), BEHAVIOR (do they act differently on the job?), RESULTS (organizational outcomes like productivity, costs, quality, sales). Complaint rates and sales are organizational results.", "hint": "Complaint rates and sales are outcomes for the whole organization."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "Trainees scored 95% on the post-training exam, but six weeks later their supervisors see no change in how they actually do their jobs. Which problem is this?", "opts": ["Overlearning", "Poor transfer of training (behavior change failed)", "Poor learning", "Negative trainee reactions"], "ans": 1, "why": "LEARNING happened (the 95% exam), but it didn't carry over to the workplace. Transfer of training = generalizing and maintaining trained skills on the job. That's the BEHAVIOR criterion.", "hint": "The exam proves they learned it. What didn't happen afterward?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "Airline pilots repeatedly practice emergency landing procedures in a simulator even after they have already mastered them perfectly. This practice is called:", "opts": ["Overlearning", "Programmed instruction", "Cross-training", "Job rotation"], "ans": 0, "why": "Overlearning = continuing to practice a task after it has been successfully learned. It makes the skill automatic and resistant to stress, which is critical for emergencies. It improves transfer of training.", "hint": "They keep practicing after they've already mastered it."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "A trainer explains a task, demonstrates it, has the trainee perform it step by step, and gives immediate feedback until the trainee does it correctly. This on-the-job method is:", "opts": ["Job shadowing", "Job Instruction Training (JIT)", "Programmed instruction", "Apprenticeship"], "ans": 1, "why": "JIT = structured, step-by-step: trainer demonstrates → trainee practices → feedback. Apprenticeship = long-term OJT plus classroom, usually for skilled trades. Job shadowing = only OBSERVING an experienced worker. Programmed instruction = self-paced, off-the-job learning in small chunks.", "hint": "Demonstrate, practice, feedback, step by step, on the job."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "A new employee completes a self-paced online module that presents information in small chunks, asks a question after each chunk, and gives immediate feedback. This is:", "opts": ["Programmed instruction", "Role-playing", "Case study", "Lecture"], "ans": 0, "why": "Programmed instruction = self-paced, small chunks, followed by questions and IMMEDIATE feedback. It's an off-the-job method. A case study = analyzing a real or hypothetical organizational problem. Role-playing = acting out scenarios to practice interpersonal skills.", "hint": "Self-paced, small chunks, a question after each chunk."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "Over several years, a senior partner guides a junior associate not only on work skills but on long-term career direction, professional networks, and personal growth. This is:", "opts": ["Coaching", "Job Instruction Training", "Job shadowing", "Mentoring"], "ans": 3, "why": "MENTORING = long-term, broad career AND personal development. COACHING = short-term, focused on IMMEDIATE performance improvement in a specific skill. Key exam tip: long-term + career + personal = mentoring.", "hint": "Several years, career AND personal growth. Compare that with short-term skill feedback."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "A 24-year-old social media specialist is assigned to teach the 58-year-old marketing director how to use TikTok analytics and AI tools. This is:", "opts": ["Reverse mentoring", "Apprenticeship", "Coaching", "Cross-training"], "ans": 0, "why": "Reverse mentoring = OLDER employees learn from YOUNGER ones, often about technology or new trends.", "hint": "Who is teaching whom here?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "A company collects performance ratings on a supervisor from her own boss, her peers, her subordinates, and the clients she serves. This is:", "opts": ["Rating committee", "Forced distribution", "Management by Objectives", "360-degree feedback"], "ans": 3, "why": "360-degree feedback = performance information from MULTIPLE sources all around the employee (supervisors, peers, subordinates, customers, self). A rating committee = the immediate supervisor plus 3 or 4 other supervisors.", "hint": "Ratings are coming from every direction around her."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "To avoid conflict, a supervisor rates all 20 of her staff '3' on a 5-point scale, even though their performance clearly differs. This is:", "opts": ["Halo effect", "Strictness error", "Leniency error", "Central tendency error"], "ans": 3, "why": "Central tendency = rating most or all employees around the MIDDLE of the scale. Leniency = rating everyone too HIGH. Strictness = rating everyone too LOW. Halo = one trait influences ratings on other, unrelated traits.", "hint": "Everyone gets the same score, right in the middle."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "An employee performed poorly for ten months, then worked extremely hard in the two weeks right before the annual appraisal. He receives an 'Outstanding' rating. This is the:", "opts": ["Proximity error", "Primacy effect", "Halo effect", "Recency effect"], "ans": 3, "why": "Recency effect = giving too much weight to RECENT performance while overlooking earlier performance in the appraisal period. Primacy = relying on the FIRST information. Proximity error = similar ratings for items placed close together on the form.", "hint": "Which part of the year is driving the rating?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "Because Joy is always punctual and well-groomed, her supervisor also gives her high ratings on creativity, teamwork, and technical skill, areas where she is only average. This is the:", "opts": ["Contrast effect", "Halo effect", "Leniency error", "Similar-to-me effect"], "ans": 1, "why": "Halo effect = one positive impression or high rating on ONE dimension spills over onto other, UNRELATED dimensions. Leniency would mean rating ALL employees too high, not one employee across traits.", "hint": "One good trait is spilling over onto unrelated ones."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "A division head must place exactly 10% of employees in 'Exceeds,' 70% in 'Meets,' and 20% in 'Needs Improvement,' regardless of how the team actually performed. This is the:", "opts": ["Forced distribution method", "Graphic rating scale", "Behaviorally Anchored Rating Scale", "Paired comparison method"], "ans": 0, "why": "Forced distribution ('rank or yank') = the rater must place set PERCENTAGES of employees into each category. It prevents leniency and central tendency, but can be unfair when a whole team is strong.", "hint": "Set percentages per category, no matter how the team performed."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "A supervisor with 6 staff members uses the paired comparison method on overall effectiveness. How many comparisons must she make?", "opts": ["30", "6", "15", "12"], "ans": 2, "why": "Paired comparison compares every employee with every other employee once. Number of pairs = n(n − 1) / 2 = 6 × 5 / 2 = 15. This formula is a favorite in board exams.", "hint": "Each person is compared with every other person exactly once. Count the pairs."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "An appraisal form describes, for each performance level of 'Handling Customer Complaints,' a specific example of behavior (e.g., Level 5: 'Calmly resolves the issue and follows up within 24 hours'). This is a:", "opts": ["Behaviorally Anchored Rating Scale (BARS)", "Narrative report", "Graphic rating scale", "Critical incident log"], "ans": 0, "why": "BARS = uses specific BEHAVIORAL examples (built from critical incidents) to ANCHOR each level of the scale. A graphic rating scale just lists traits with a numeric scale. The critical incident method = a running log of actual effective/ineffective behaviors, not a scale.", "hint": "Each scale level is anchored by a specific behavior example."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "At the start of the year, a manager and an employee jointly set specific, measurable targets. At year-end, the employee is evaluated on how many of those targets were achieved. This is:", "opts": ["Management by Objectives (MBO)", "Forced distribution", "Alternation ranking", "Behaviorally Anchored Rating Scales"], "ans": 0, "why": "MBO = supervisor and employee COLLABORATIVELY set SMART objectives, then evaluate on goal attainment. It's goal-focused appraisal.", "hint": "Goals set together at the start, then rated on whether they were met."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "An interviewer asks: 'Tell me about a time you had to deal with an angry customer. What exactly did you do?' What type of interview question is this?", "opts": ["Disqualifier", "Clarifier", "Past-focused / patterned-behavior question", "Future-focused / situational question"], "ans": 2, "why": "Past-focused (patterned behavior) questions ask how you ACTUALLY behaved in the past: 'Tell me about a time...' They rest on the idea that past behavior predicts future behavior. Situational questions are hypothetical: 'What WOULD you do if...?'", "hint": "'Tell me about a time...' asks about the past."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "An interviewer asks: 'Suppose a coworker takes credit for a report you wrote. What would you do?' This is a:", "opts": ["Future-focused / situational question", "Skill-level determiner", "Past-focused / patterned-behavior question", "Organizational-fit question"], "ans": 0, "why": "'What WOULD you do if...' = hypothetical future situation = situational question. Compare with 'Tell me about a TIME when...' = past-focused/patterned behavior.", "hint": "'What would you do if...' asks about a hypothetical future."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "For a delivery-rider position, the first interview question is: 'Do you have a valid professional driver's license?' This is a:", "opts": ["Skill-level determiner", "Disqualifier", "Organizational-fit question", "Clarifier"], "ans": 1, "why": "Disqualifiers quickly check MUST-HAVE minimum requirements. Failing them removes the candidate from consideration. Clarifiers clear up information already given; skill-level determiners test actual proficiency.", "hint": "A must-have requirement. Fail it and you're out."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "An interviewer rates an average applicant as 'excellent' because the three applicants just before him were very weak. This is the:", "opts": ["Negative-information bias", "Interviewer-interviewee similarity", "Primacy effect", "Contrast effect"], "ans": 3, "why": "Contrast effect = judging a candidate by comparison with the IMMEDIATELY PRECEDING candidates instead of against job standards. Structured interviews with standardized scoring reduce this.", "hint": "The rating depends on who came right before him."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "Applicants first take a cognitive ability test. Only those who pass are interviewed, and only those who pass the interview take the medical exam. This is the:", "opts": ["Multiple-cutoff approach", "Top-down selection", "Multiple-hurdle approach", "Banding"], "ans": 2, "why": "Multiple HURDLE = one test at a time; you must pass each before moving on (sequential). Multiple CUTOFF = all tests given at once (simultaneous); the applicant must meet the cutoff on each. Hurdle saves money when later steps (like medical exams) are expensive.", "hint": "One test at a time. You must pass each to reach the next."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "A company treats all applicants whose test scores fall within the same score range as equivalent, then chooses among them using other factors such as diversity goals. This is:", "opts": ["Passing scores", "Banding", "Top-down selection", "Rule of three"], "ans": 1, "why": "Banding = groups scores within a range (accounting for measurement error) as statistically equivalent. It tries to hire top scorers while allowing flexibility, e.g., for affirmative action. Rule of three = the top 3 names go to the hiring manager.", "hint": "Scores within a range are treated as equal."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "Given a test's validity, the selection ratio, and the base rate, HR wants to estimate what PERCENTAGE of future hires will be successful on the job. Which tool should they use?", "opts": ["Brogden-Cronbach-Gleser utility formula", "Lawshe tables", "Taylor-Russell tables", "Proportion of correct decisions"], "ans": 2, "why": "Taylor-Russell tables = proportion of SELECTED applicants who will be successful, using validity, selection ratio, and base rate. Lawshe tables = probability that a PARTICULAR applicant with a given score will succeed. Brogden-Cronbach-Gleser = the MONETARY gain from using the test.", "hint": "They want the proportion of hires who will succeed, not one applicant's odds and not money."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "The CFO asks the HR head: 'In pesos, how much will the company gain each year by using this new selection test instead of our current interview?' Which tool answers this?", "opts": ["Markov analysis", "Lawshe tables", "Brogden-Cronbach-Gleser utility formula", "Taylor-Russell tables"], "ans": 2, "why": "Brogden-Cronbach-Gleser estimates the MONETARY value (utility) of a selection procedure compared with random selection or a less valid method. Money question = Brogden-Cronbach-Gleser.", "hint": "The question is about pesos."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HR Planning", "q": "A job posting lists: 'Bachelor's degree in Psychology, at least 1 year of HR experience, RPm license preferred.' This part of the job analysis output is the:", "opts": ["Job evaluation", "Job specification", "Task inventory", "Job description"], "ans": 1, "why": "Job SPECIFICATION = the minimum QUALIFICATIONS a PERSON must have (education, experience, skills). Job DESCRIPTION = what the JOB entails (duties, responsibilities, working conditions). Tip: specification = specs of the person.", "hint": "This lists what the PERSON must have, not what the job involves."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HR Planning", "q": "A hospital has historically needed 1 nurse for every 4 beds. It uses this to estimate that its new 200-bed wing will need 50 nurses. Which forecasting method is this?", "opts": ["Scatter plot", "Ratio analysis", "Markov analysis", "Trend analysis"], "ans": 1, "why": "Ratio analysis = uses the historical RATIO between a business factor (beds, sales, output) and the number of employees needed. Trend analysis = studying past employment levels over the years. Markov analysis = tracking the probabilities of employees MOVING between jobs.", "hint": "A historical ratio between beds and nurses."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HR Planning", "q": "An HR analyst builds a matrix showing that each year 70% of junior analysts stay junior, 15% are promoted to senior, and 15% leave. This is used to forecast internal labor supply. This is:", "opts": ["Markov analysis", "Trend analysis", "Ratio analysis", "Personnel replacement chart"], "ans": 0, "why": "Markov analysis tracks the movement (transition probabilities) of employees from one job category to another over time. A personnel replacement chart identifies specific internal candidates for key positions.", "hint": "The matrix shows probabilities of moving between job levels."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Recruitment", "q": "Over 20 years, a company has become filled with employees who share very similar personalities and values. Similar people are drawn to it and hired, and people who don't fit tend to leave. This is explained by:", "opts": ["Person-job fit", "Contrast effect", "Schneider's Attraction-Selection-Attrition (ASA) framework", "Realistic job preview"], "ans": 2, "why": "ASA (Benjamin Schneider): people are ATTRACTED to organizations like them, organizations SELECT people like them, and misfits leave (ATTRITION). Over time the organization becomes homogeneous, which reinforces its existing culture.", "hint": "Similar people are drawn in, picked, and the misfits leave. Think of Schneider's three-step framework."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Recruitment", "q": "Many new call-center agents quit within their first month, saying 'the job was nothing like what was advertised.' Which intervention best addresses this?", "opts": ["Realistic Job Preview (RJP)", "Raising starting pay", "Forced distribution appraisals", "Executive search firms"], "ans": 0, "why": "Job Expectations Theory: a gap between expected and actual job reality lowers motivation and satisfaction and leads to turnover. A Realistic Job Preview gives applicants an honest picture of both the good and bad parts of the job, so expectations match reality.", "hint": "The problem is a gap between what they expected and what they got."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Recruitment", "q": "To fill a Chief Financial Officer position, a company hires an outside firm that specifically targets executives who are currently employed elsewhere and not job-hunting. This is using:", "opts": ["A public employment agency", "An executive search firm (headhunter) to reach passive applicants", "A job fair", "Employee referrals"], "ans": 1, "why": "Executive search firms (headhunters) handle higher-paying, non-entry-level positions. Passive applicants are currently employed and not actively looking, but may be open to the right offer. Public employment agencies focus on entry-level or blue-collar jobs.", "hint": "Currently employed, not job-hunting, senior role."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Careers", "q": "A company that has been losing money for two years finally appoints its first female CEO, right in the middle of the crisis, when failure is very likely. This illustrates the:", "opts": ["Glass cliff", "Dual career ladder", "Golem effect", "Glass ceiling"], "ans": 0, "why": "Glass CLIFF = women and minorities are more likely to be given leadership roles that are risky or precarious, often during crises. Glass CEILING = the invisible barrier that STOPS women and minorities from rising to top positions in the first place. NOTE: the reviewer's definition of glass ceiling actually describes the glass cliff. Use the definition here.", "hint": "She got the job, but at the most dangerous possible moment."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Careers", "q": "A brilliant senior software engineer has no interest in managing people. The company lets her keep rising in title, pay, and prestige as a technical expert. This is a:", "opts": ["Dual career ladder", "Demotion", "Lateral career path", "Spiral career path"], "ans": 0, "why": "Dual career ladder = lets skilled individual contributors advance in pay and prestige WITHOUT taking on management duties. It helps retain technical talent. A lateral path = moving across to a different role at a similar level.", "hint": "She advances without becoming a manager."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRM vs HRD", "q": "Which of these activities is best classified as HUMAN RESOURCE DEVELOPMENT rather than Human Resource Management?", "opts": ["Designing a leadership program to prepare employees for future management roles", "Filling current vacancies quickly", "Processing payroll and government-mandated benefits", "Ensuring compliance with labor laws"], "ans": 0, "why": "HRM = administrative/operational, PRESENT needs: right people, right place, right time; compliance; compensation. HRD = investing in employees' GROWTH for FUTURE needs and building a learning culture. Preparing people for future roles = HRD.", "hint": "HRM covers present needs and compliance. Which option builds for the future?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Motivation", "q": "A plant pays a group bonus to all its workers whenever the plant's productivity improves above its baseline. The bonus is based on the plant's performance, not on company-wide profits. This incentive is:", "opts": ["Profit sharing", "Merit pay", "Gain sharing", "Stock options"], "ans": 2, "why": "GAIN sharing = group-wide financial incentives tied to IMPROVEMENTS in performance or productivity. PROFIT sharing = a percentage of company PROFITS above a certain amount. MERIT pay = individual raises based on performance APPRAISAL scores.", "hint": "The bonus is tied to the plant's productivity improvement, not company profits."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "An applicant sits before the HR manager, the department head, and a senior engineer at the same time, and each takes turns asking questions. This interview style is a:", "opts": ["Panel interview", "Return interview", "Group interview", "Serial interview"], "ans": 0, "why": "Panel = multiple interviewers, one applicant. Serial = a series of single interviews. Return = like serial but with time passing between interviews. Group = multiple applicants interviewed at the same time.", "hint": "Count the interviewers and the applicants in the room."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "A kind-hearted supervisor gives almost every one of her 15 staff an 'Outstanding' rating, including several who clearly underperform. This rating error is:", "opts": ["Halo effect", "Central tendency error", "Strictness error", "Leniency error"], "ans": 3, "why": "Leniency = consistently giving HIGHER-than-deserved ratings to most or all employees. Strictness = consistently lower. Central tendency = everyone in the middle. Halo = one trait coloring other traits of the SAME person.", "hint": "She's rating everyone too high, not just one person on several traits."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "Throughout the year, a supervisor keeps a running log of specific, observable examples of each employee's effective and ineffective behaviors, then uses the log at appraisal time. This is the:", "opts": ["Critical incident method", "Graphic rating scale", "Forced distribution method", "Paired comparison method"], "ans": 0, "why": "The critical incident method keeps a running record of specific, observable examples of effective and ineffective job behaviors during the appraisal period. It also reduces recency error, since the whole year is documented.", "hint": "A year-long record of specific examples."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "To design a new training program for bank tellers, HR interviews experienced tellers, observes them at work, and uses task inventories to list the tasks performed and the competencies needed. Which part of needs analysis is this?", "opts": ["Reaction evaluation", "Organizational analysis", "Task analysis", "Person analysis"], "ans": 2, "why": "Task analysis uses job analysis methods (interviews, observation, task inventories) to identify the tasks performed, the conditions under which they're performed, and the competencies needed. Person analysis identifies WHICH employees need training.", "hint": "HR is studying the job's tasks, not which tellers need training."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRD vs OD", "q": "HR runs a coaching program to build each employee's skills, while a separate initiative redesigns the company's culture and processes to improve the organization's overall health. Which statement correctly distinguishes them?", "opts": ["Both are OD because they involve people", "The coaching program is HRD (focused on individuals); the culture redesign is OD (focused on the organization as a whole)", "The coaching is OD; the culture redesign is HRD", "Both are HRM because HR runs them"], "ans": 1, "why": "HRD = primarily the INDIVIDUAL employee and their skills, knowledge, and growth. OD = primarily the ORGANIZATION AS A WHOLE: its processes, culture, structure, and long-term effectiveness.", "hint": "Who is the main target of each effort: one person, or the whole organization?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRD vs Training", "q": "A one-day workshop teaches new cashiers how to use the store's POS system so they can do their current job. Compared with HRD, this is best described as:", "opts": ["Employee training: short-term, task-oriented, for the current job", "HRD: long-term, broad, for future roles", "Career planning", "OD: organization-wide change"], "ans": 0, "why": "Employee TRAINING = acquiring specific knowledge and skills for the CURRENT job; short-term, narrow, task-oriented. HRD = holistic, long-term, and continuous, covering current and future roles and career progression.", "hint": "Is it for the current job or long-term growth?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRM vs HRD", "q": "Which responsibility belongs more to the Human Resource DEVELOPMENT Manager than to the HR Manager?", "opts": ["Empowering employees through training and career-growth opportunities and retraining talent", "Ensuring compliance with labor laws", "Filling vacancies with the right people at the right time", "Administering payroll and benefits"], "ans": 0, "why": "The HRD Manager empowers employees to become a major asset through training, career growth, and retraining talent. The HR Manager handles the administrative and operational side: staffing, compliance, compensation, and the right people in the right place at the right time.", "hint": "Which manager focuses on growing people?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Staffing", "q": "An excellent sales agent keeps getting promoted until she becomes a regional manager, a role where she struggles badly and burns out. This illustrates the:", "opts": ["Glass cliff", "Peter Principle", "Galatea effect", "Dual career ladder"], "ans": 1, "why": "The Peter Principle = organizations tend to promote good employees until they reach the level at which they're no longer competent (their 'highest level of incompetence'). Using job analysis to base promotions on actual job requirements helps prevent it. (Source: Ms. Chiqui's IO notes)", "hint": "Being great at one job doesn't guarantee being good at the next one up."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Job Evaluation", "q": "To set salaries, a company identifies compensable factors (responsibility, education, working conditions), assigns points to each based on importance, and totals the points for every job. Which job evaluation method is this?", "opts": ["Classification method", "Point method", "Ranking method", "Salary survey"], "ans": 1, "why": "Point method = jobs are scored on key factors with assigned points that are summed to determine the wage rate. Ranking = simply ordering jobs from highest to lowest. Classification = sorting jobs into predetermined classes or grades. A salary survey asks OTHER companies what they pay. (Source: Ms. Chiqui's IO notes)", "hint": "Factors, points, then a total."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Job Evaluation", "q": "An HR officer sends surveys to other banks to compare what they pay their tellers, so the bank's own teller salaries stay competitive. She is checking:", "opts": ["Pay compression", "Internal equity", "Distributive justice within a team", "External equity"], "ans": 3, "why": "EXTERNAL equity compares a job's pay with the external market (other organizations). INTERNAL equity compares jobs within the same organization based on their relative value. (Source: Ms. Chiqui's IO notes)", "hint": "Is she comparing with other companies or within her own?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Job Analysis", "q": "A job analyst uses a structured questionnaire by McCormick and colleagues, with 194 items organized into six dimensions such as information input, mental processes, and work output. Which method is this?", "opts": ["Critical Incident Technique", "Functional Job Analysis", "Position Analysis Questionnaire (PAQ)", "Job Elements Inventory (JEI)"], "ans": 2, "why": "PAQ (McCormick, Jeanneret, and Mecham, 1972): structured, 194 items, six dimensions. The JEI (Cornelius and Hakel) is a 153-item alternative that's easier to read. The Critical Incident Technique (Flanagan) uses reports of good and bad behavior. (Source: Ms. Chiqui's IO notes)", "hint": "194 items in six dimensions is the classic structured questionnaire."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Job Analysis", "q": "Instead of analyzing each job's tasks, a company identifies broad competencies (like 'customer obsession' and 'integrity') that apply to ALL employees and link to the company's mission. This approach is:", "opts": ["Task inventory", "Job evaluation", "Competency modeling", "Job analysis"], "ans": 2, "why": "Competency modeling identifies universal, more abstract competencies tied to high performance and the organization's mission, and doesn't focus on the specific work performed. Job analysis examines specific tasks and the KSAOs that distinguish jobs. (Source: Ms. Chiqui's IO notes)", "hint": "Broad competencies for everyone, tied to the mission."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Compensation", "q": "Besides her salary, an employee receives HMO coverage, paid leaves, and a retirement plan. These are forms of:", "opts": ["Direct financial compensation", "Merit pay", "Non-financial compensation", "Indirect financial compensation"], "ans": 3, "why": "Direct financial = wages, salaries, bonuses, commissions. INDIRECT financial = benefits, leaves, retirement plans. Non-financial = career development and recognition opportunities. (Source: Ms. Chiqui's IO notes)", "hint": "They're worth money, but they aren't paid as cash."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Employee Attitudes", "q": "HR wants separate satisfaction scores for supervision, pay, promotion opportunities, coworkers, and the work itself so it can locate the weakest area. Which measure best matches that specific plan?", "opts": ["Job in General Scale", "Job Descriptive Index", "Allen and Meyer commitment survey", "Organizational Commitment Questionnaire"], "ans": 1, "why": "The Job Descriptive Index reports these five facets of job satisfaction. The Job in General Scale measures overall satisfaction, so it would not by itself provide the requested five-part diagnosis. (Source: Ms. Chiqui's notes)", "hint": "Check whether HR needs one global judgment or a profile of specific work facets."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Employee Attitudes", "q": "A pulse survey needs one broad measure of how satisfied employees are with their jobs, rather than separate ratings of pay or coworkers. Which instrument is the closest fit?", "opts": ["Organizational Commitment Scale", "Job in General Scale", "Job Descriptive Index", "Organizational Commitment Questionnaire"], "ans": 1, "why": "The Job in General Scale targets overall job satisfaction. Commitment instruments address employees' bond with the organization rather than the same global satisfaction judgment. (Source: Ms. Chiqui's notes)", "hint": "Decide whether the survey concerns liking the job or attachment to the organization."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Employee Attitudes", "q": "HR asks about acceptance of organizational goals, willingness to exert effort for the organization, and desire to remain a member. Which instrument was designed around these three aspects?", "opts": ["Minnesota Satisfaction Questionnaire", "Job Descriptive Index", "Job in General Scale", "Organizational Commitment Questionnaire"], "ans": 3, "why": "The Organizational Commitment Questionnaire covers acceptance of goals and values, willingness to help, and desire to remain. Satisfaction measures focus on evaluations of the job or its facets rather than this pattern of organizational attachment. (Source: Ms. Chiqui's notes)", "hint": "The questions emphasize the employee's relationship with the organization as a whole."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Recruitment Evaluation", "q": "Recruitment channel A costs P12,000 and yields 60 qualified applicants; channel B costs P9,000 and yields 30. Based only on cost per qualified applicant, which channel performs better?", "opts": ["A, at P200 per qualified applicant", "B, because its total spending is lower", "B, at P300 per qualified applicant", "Both, at P233.33 per qualified applicant"], "ans": 0, "why": "A costs 12,000/60 = P200 per qualified applicant, compared with B's 9,000/30 = P300. Lower total spending does not necessarily mean lower cost for each qualified applicant. (Source: Ms. Chiqui's notes)", "hint": "Use the relevant applicant count as the denominator for each channel."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Recruitment Evaluation", "q": "An online advertisement attracts many applicants, but few meet the job's essential qualifications. What additional evidence is most useful before calling this recruitment channel effective?", "opts": ["The speed with which unqualified applications arrive", "The total number of page views on the advertisement", "The number and cost of qualified applicants it produces", "The visual appeal of the advertisement's layout"], "ans": 2, "why": "Recruitment evaluation should consider qualified applicants and their cost rather than volume alone. A high response count can be misleading when the channel produces few suitable candidates. (Source: Ms. Chiqui's notes)", "hint": "Distinguish attracting attention from building a usable applicant pool."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Employee Selection", "q": "An experienced bookkeeper applying for a job is asked to reconcile a sample ledger using the same kind of documents used at work. Which selection method is being used?", "opts": ["Work sample", "Interest inventory", "General ability test", "Biodata inventory"], "ans": 0, "why": "A work sample asks the applicant to perform actual job-related tasks and shows an existing skill. An ability test estimates capacity to learn or perform rather than directly sampling the specific bookkeeping task. (Source: Ms. Chiqui's notes)", "hint": "Notice whether the applicant reports a skill or demonstrates it."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Employee Selection", "q": "Management applicants complete an in-basket exercise, a group problem-solving task, and a simulated coaching meeting, with several trained evaluators rating their behavior. What is this approach?", "opts": ["Single work sample", "Reference check", "Unstructured interview", "Assessment center"], "ans": 3, "why": "An assessment center combines several job-related activities, including simulation, and ratings by multiple trained evaluators. A single work sample would not capture the multi-exercise, multi-evaluator arrangement described. (Source: Ms. Chiqui's notes)", "hint": "Look at the combination of exercises and evaluators rather than the building's name."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Employee Selection", "q": "A company uses an application form containing life-history questions selected because prior research linked the answers to job performance. Which method is this?", "opts": ["Job evaluation", "Job knowledge testing", "Biodata", "Reference checking"], "ans": 2, "why": "Biodata uses background or life-history information in questions supported by evidence of prediction. Reference checking obtains information from other people rather than relying on the applicant's research-keyed application responses. (Source: Ms. Chiqui's notes)", "hint": "Consider both the source of the information and how the questions were selected."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training Evaluation", "q": "At the end of a workshop, participants rate the trainer's clarity, the usefulness of examples, and their enjoyment of the session. Which evaluation criterion is directly measured?", "opts": ["Employee reactions", "Employee learning", "Business impact", "Application of training"], "ans": 0, "why": "Reaction measures ask participants for their opinions of training. Favorable reactions do not directly demonstrate that participants learned the material or used it back at work. (Source: Ms. Chiqui's notes)", "hint": "Identify whether the evidence concerns opinions, knowledge, or workplace behavior."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training Evaluation", "q": "Employees complete equivalent knowledge tests before and after safety training. Scores improve, but no workplace observations have yet been collected. What conclusion is most directly supported?", "opts": ["Employees are consistently applying the procedures at work", "The participants necessarily enjoyed the teaching method", "The program has already reduced the plant's accident costs", "Employees demonstrated increased learning on the measured material"], "ans": 3, "why": "Knowledge measures before and after training provide evidence about learning. Application requires evidence of actual use on the job, which these test scores alone do not supply. (Source: Ms. Chiqui's notes)", "hint": "Keep the conclusion at the same level as the evidence collected."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training Evaluation", "q": "Sales rose after a workshop, but a major advertising campaign started in the same week. Which evaluation improvement most directly helps assess whether training contributed to the rise?", "opts": ["Collect satisfaction ratings from workshop participants only", "Replace performance measures with attendance records", "Compare pre/post results with a comparable untrained control group", "Compare only the trained group's final sales with its target"], "ans": 2, "why": "Pretests, posttests, and control groups strengthen evaluation of training effects. A post-training increase alone cannot separate training from the advertising campaign occurring at the same time. (Source: Ms. Chiqui's notes)", "hint": "Find a comparison that helps rule out an event shared by trained and untrained employees."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRM Functions", "q": "A manufacturing firm's HR officer meets employee representatives to address grievances and negotiate working arrangements. Which HRM function is most directly involved?", "opts": ["Manpower forecasting", "Labor relations", "Job evaluation", "Career development"], "ans": 1, "why": "Labor relations concerns the organization's relationship with unions and employee representatives. Manpower forecasting estimates future staffing needs rather than managing these representative relationships.", "hint": "Identify whose relationship the officer is managing."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRM Functions", "q": "HR updates employee records and coordinates the documentation required when employees leave the organization. Which HRM activity does this most directly represent in the reviewer?", "opts": ["Manpower planning", "Maintaining", "Staffing", "Developing"], "ans": 1, "why": "Maintaining includes managing employee records and offboarding processes. Staffing concerns attracting, hiring, and onboarding employees rather than maintaining records through separation.", "hint": "Look at the employment stage and the records being managed."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HRD and Training", "q": "A director proposes replacing a multi-year career-development program with one short software workshop, arguing that the two have the same scope. What is the best response?", "opts": ["HRD is limited to the employee's current software tasks", "The workshop can support HRD but does not cover its broader long-term development scope", "Career development concerns compensation rather than employee capabilities", "A workshop covers future career growth whenever it teaches any new skill"], "ans": 1, "why": "HRD includes continuous growth for current and future roles, while training can focus narrowly on immediate job skills. The workshop may be part of HRD without replacing the broader career-development program.", "hint": "Compare the time horizon and range of capabilities each activity addresses."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "HR Manager and HRD Manager", "q": "Automation will change the skills and staffing mix needed next year. Which division of work best combines the HR manager and HRD manager roles?", "opts": ["HRD processes payroll while HR confines its work to employee courses", "HR plans staffing requirements while HRD develops employees for the new work", "HR handles future learning while HRD limits its role to hiring records", "Both focus only on current vacancies and postpone capability development"], "ans": 1, "why": "The HR manager coordinates having the right people in place, while HRD builds employee capabilities and growth. Their work should connect staffing requirements with development rather than leaving future skill needs unaddressed.", "hint": "Which assignment changes what employees will be able to do?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A newly formed project team keeps clashing: members argue over who should lead, push back on each other's ideas, and disagree about roles. In Tuckman's model, the team is in the:", "opts": ["Performing stage", "Storming stage", "Norming stage", "Forming stage"], "ans": 1, "why": "Forming = orienting, defining the task, ground rules. STORMING = conflict over roles, leadership, and norms. Norming = unity, shared understanding, agreed processes. Performing = achieving goals and high-level problem solving. Adjourning = temporary teams disband.", "hint": "Conflict over roles and leadership is the giveaway."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A task force set its direction at its first meeting, did very little for weeks, then at exactly the halfway point of its deadline drastically revised its whole strategy and worked intensely. This pattern is described by:", "opts": ["Tuckman's storming stage", "Brooks' Law", "Group polarization", "Punctuated equilibrium"], "ans": 3, "why": "Punctuated equilibrium (Gersick): instead of moving through stages, teams set direction at the first meeting, follow it, then drastically revise their strategy about HALFWAY through. The midpoint is the giveaway.", "hint": "Look at WHEN the big change happened."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "In a group thesis, Mika notices that Ben is barely contributing but will still get the same grade. To avoid being 'taken advantage of,' Mika reduces her own effort too. Mika's behavior is the:", "opts": ["Social compensation", "Sucker effect", "Free-rider effect", "Social facilitation"], "ans": 1, "why": "SUCKER effect = reducing your effort because you see OTHERS free-riding. Ben is the FREE RIDER (low effort because his contribution feels dispensable). SOCIAL COMPENSATION is the opposite of Mika: working HARDER to make up for weak teammates.", "hint": "Mika isn't the one coasting. She's reacting to someone who is."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "For an important company pitch, Carla works much harder than usual because she expects her less-capable teammates to perform poorly. This is:", "opts": ["Social inhibition", "The sucker effect", "Social loafing", "Social compensation"], "ans": 3, "why": "Social compensation = a motivational GAIN where an individual INCREASES effort to make up for the anticipated poor performance of other members, especially on tasks that matter to them.", "hint": "She works HARDER because of weak teammates."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A manager wants to reduce social loafing in a 12-person team. Which strategy is MOST effective?", "opts": ["Give only one shared team grade or rating", "Assign everyone identical tasks", "Measure and make each member's individual contribution visible", "Increase the team size so the workload is spread out"], "ans": 2, "why": "Ways to minimize social loafing: form SMALLER groups, SPECIALIZE tasks, MEASURE INDIVIDUAL performance, enrich the job, and select motivated, team-oriented people. Larger groups, a single shared rating, and identical tasks all make loafing EASIER, because individual effort gets hidden.", "hint": "Loafing thrives when individual effort is hidden."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Groupthink", "q": "During a board meeting, a director has serious doubts about an expansion plan but stays silent because everyone else seems to agree and she doesn't want to disrupt the harmony. Which groupthink symptom is this?", "opts": ["Self-censorship", "Direct conformity pressure", "Mindguards", "Illusion of unanimity"], "ans": 0, "why": "SELF-CENSORSHIP = members suppress their OWN doubts. Illusion of unanimity = the group wrongly reads that silence as agreement. Mindguards shield the group from outside contradicting information. Direct conformity pressure = OTHERS pressure a dissenter.", "hint": "The doubt stays inside her own head."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Groupthink", "q": "The CEO's executive assistant quietly filters out consultants' reports that criticize the merger plan before they reach the board, so the board stays confident in its decision. The assistant is acting as a:", "opts": ["Devil's advocate", "Liaison", "Mindguard", "Change analyst"], "ans": 2, "why": "Mindguards actively protect the group from information that might contradict its shared beliefs or consensus. A devil's advocate does the OPPOSITE: deliberately raises counterarguments, which is a remedy for groupthink.", "hint": "Someone is blocking information from reaching the group."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A mountain-climbing team can only move as fast as its slowest climber. In terms of group tasks, this is a(n):", "opts": ["Conjunctive task", "Disjunctive task", "Additive task", "Pooled task"], "ans": 0, "why": "Conjunctive = performance is determined by the WEAKEST member. Disjunctive = determined by the BEST member (e.g., a quiz bee where one right answer is enough). Additive = output is the SUM of all members' contributions (e.g., tug of war).", "hint": "Who sets the pace for the whole team?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A newly hired data encoder makes far more errors whenever his supervisor stands behind him and watches. This is:", "opts": ["Social inhibition", "Social loafing", "Social facilitation", "Social compensation"], "ans": 0, "why": "The presence of others helps performance on easy or well-learned tasks (SOCIAL FACILITATION) but HURTS performance on new or difficult tasks (SOCIAL INHIBITION). As a beginner, this task is still hard for him, so being watched makes him worse.", "hint": "Is this task easy or still hard for him?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A software project is already behind schedule, so the manager adds five new programmers to the team. The project ends up finishing even LATER. This illustrates:", "opts": ["Brooks' Law", "Parkinson's Law", "Social loafing", "Punctuated equilibrium"], "ans": 0, "why": "Brooks' Law: adding people to a project that is already running late makes it later, because new members need time to learn and communication overhead increases. It's an example of process losses.", "hint": "Why could more people make a late project even slower?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "In an emergency room, doctors, nurses, and technicians constantly pass the patient and information back and forth to one another until the patient is stabilized. This is which type of task interdependence?", "opts": ["Additive interdependence", "Reciprocal interdependence", "Pooled interdependence", "Sequential interdependence"], "ans": 1, "why": "POOLED = sharing a common resource (budget, machine, admin support): the lowest interdependence. SEQUENTIAL = one person's output is the next person's input, like an assembly line. RECIPROCAL = work goes back and forth among members: the HIGHEST interdependence.", "hint": "Work goes back and forth repeatedly, not one-way."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Conflict", "q": "Two department heads both want the full ₱1M training budget. After discussion, each department gets ₱500,000. Neither gets everything it wanted. Which conflict style is this?", "opts": ["Accommodating", "Forcing", "Collaborating", "Compromising"], "ans": 3, "why": "Compromising = each party gives up something; the reviewer labels it 'lose-lose'. Collaborating = both find a solution that FULLY meets both needs ('win-win'). Accommodating = one side gives in ('lose-win'). Forcing = one side wins at the other's expense ('win-lose').", "hint": "Each side gave up half."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Conflict", "q": "A union and management cannot agree on a wage increase. They bring in a neutral third party who listens to both sides and then hands down a decision both must follow. This is:", "opts": ["Mediation", "Triangling", "Negotiation and bargaining", "Arbitration"], "ans": 3, "why": "MEDIATION = a neutral third party HELPS both sides reach their own agreement (the mediator does not decide). ARBITRATION = the neutral third party listens, then MAKES THE DECISION. Triangling = discussing the conflict with a third party instead of the person involved (an avoiding style).", "hint": "The third party makes the decision, not just helps."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "Jessa says about her teammate: 'I trust Mark because I've worked with him for three years and he always delivers exactly when he says he will.' This is:", "opts": ["Identification-based trust", "Collective efficacy", "Calculus-based trust", "Knowledge-based trust"], "ans": 3, "why": "Calculus-based = trust because the other person would face SANCTIONS for violating it. KNOWLEDGE-based = trust from the PREDICTABILITY of their behavior (track record). Identification-based = mutual understanding and an EMOTIONAL bond.", "hint": "His track record makes him predictable."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "Each member of a cautious investment committee leaned slightly toward a safe option. After group discussion, the committee chose an even MORE cautious option than any member originally preferred. This is:", "opts": ["Social loafing", "Illusion of invulnerability", "Group polarization", "Groupthink"], "ans": 2, "why": "Group polarization = groups make decisions that are MORE EXTREME than individuals' initial positions, in whichever direction the group already leaned (riskier OR more cautious). Groupthink is about poor decisions from excessive cohesion and suppressed dissent.", "hint": "The group ended up more extreme than any individual."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "To generate ideas without production blocking or evaluation apprehension, a facilitator asks members to silently write down their ideas on paper before any discussion happens. This technique is:", "opts": ["Interacting group", "Brainwriting", "Brainstorming", "Confrontation meeting"], "ans": 1, "why": "Brainwriting removes conversation during idea generation, so people don't have to wait their turn or fear judgment. In brainstorming, people say ideas ALOUD (with no criticism allowed until all ideas are given).", "hint": "No talking during idea generation; ideas are written."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Dynamics", "q": "A team's unwritten rule is that everyone 'should' cover for a coworker who is sick, and those who refuse are frowned upon. This expectation of what OUGHT to be done is a(n):", "opts": ["Injunctive (prescriptive) norm", "Role ambiguity", "Descriptive norm", "Formal policy"], "ans": 0, "why": "Injunctive/prescriptive norms = what people SHOULD do, or what is approved or disapproved of. Descriptive norms = what most people actually DO. 'Should' and 'frowned upon' point to injunctive.", "hint": "Is this about what people actually do, or what they ought to do?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Conflict", "q": "Instead of talking to the coworker she's in conflict with, Liza keeps complaining about him to a third coworker. In conflict-style terms, this is:", "opts": ["Arbitration", "Accommodating", "Collaborating", "Triangling, a form of the avoiding style"], "ans": 3, "why": "Triangling = discussing the conflict with a third party instead of the person involved. It falls under the AVOIDING style, along with withdrawal. It keeps the conflict from being resolved directly.", "hint": "She's talking about him, not to him."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Types", "q": "A tech company sets up a small, secretive team that works outside normal bureaucracy with high autonomy to rapidly prototype a risky new product. This is a:", "opts": ["Skunkworks", "Advisory team", "Production team", "Departmental team"], "ans": 0, "why": "Skunkworks = a small, often secretive, highly autonomous team working on innovative, high-risk projects outside traditional constraints. Advisory teams give expert recommendations; departmental teams are permanent functional units.", "hint": "Secret, autonomous, risky innovation."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Types", "q": "A team of nurses runs an entire hospital ward with no traditional manager, sharing leadership and full responsibility for the unit's outcomes. This is a:", "opts": ["Self-directed team", "Task force (project) team", "Virtual team", "Advisory team"], "ans": 0, "why": "Self-directed teams have high autonomy, are responsible for a complete work process, and operate without a traditional manager, sharing leadership. Task force teams are TEMPORARY and cross-functional.", "hint": "No manager, full responsibility."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Development", "q": "At a project team's first meeting, members politely introduce themselves, clarify the mission, and ask what each person will do. Which developmental stage is most evident?", "opts": ["Storming", "Norming", "Forming", "Performing"], "ans": 2, "why": "Forming includes orientation, initial role clarification, and establishing the team's goals. Norming involves resolving earlier tensions and developing shared working patterns, which the scenario has not yet described. (Source: Ms. Chiqui's notes)", "hint": "Consider what members need before they can begin working through differences."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Development", "q": "After several tense meetings, a team accepts its leader, adjusts roles to members' strengths, and agrees how to work together. Which stage is it moving into?", "opts": ["Forming", "Norming", "Storming", "Adjourning"], "ans": 1, "why": "Norming involves easing storming tensions, accepting leadership, and settling workable roles. Storming describes the disagreements being worked through rather than the emerging agreements. (Source: Ms. Chiqui's notes)", "hint": "Focus on the shift from contesting roles to accepting workable arrangements."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Development", "q": "Team members now challenge ideas without becoming defensive, track their progress, and adjust strategy while completing their goals. Which stage best describes this pattern?", "opts": ["Storming", "Forming", "Performing", "Adjourning"], "ans": 2, "why": "Performing features effective goal achievement, constructive challenges, and ongoing strategic adjustments. Disagreement alone does not indicate storming when members handle it productively while delivering results. (Source: Ms. Chiqui's notes)", "hint": "Evaluate the function of the disagreement and its effect on the team's work."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Development", "q": "A temporary disaster-response team completes its assignment, reviews lessons, and prepares members to return to their regular jobs. Which stage needs attention now?", "opts": ["Norming", "Storming", "Forming", "Adjourning"], "ans": 3, "why": "Adjourning concerns the ending of temporary or project teams. Norming establishes shared ways of working during the team's life rather than managing its completion and separation.", "hint": "The assignment has ended; think about the team's remaining transition."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Effort", "q": "A member sees that her team's strong performers can finish the work without her, so she stops preparing because her own effort seems unnecessary. Which explanation fits best?", "opts": ["Social compensation", "Evaluation apprehension", "Free-rider effect", "Sucker effect"], "ans": 2, "why": "Free riding occurs when someone withholds effort because others appear able to secure the group result. The sucker effect instead concerns reducing effort in response to being exploited by other low contributors. (Source: Ms. Chiqui's notes)", "hint": "Ask whether she is relying on others' strength or reacting to their lack of effort."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Presence of Others", "q": "Two typists perform separate typing tasks side by side; neither is watching or scoring the other. Which social-performance condition is being studied?", "opts": ["Coaction", "Groupthink", "Social loafing", "Audience effect"], "ans": 0, "why": "Coaction involves people performing the same kind of task in one another's presence. An audience effect involves a person being passively watched rather than working alongside another performer. (Source: Ms. Chiqui's notes)", "hint": "Distinguish another performer from a spectator."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Presence of Others", "q": "An encoder becomes tense when a dashboard displays her live performance to supervisors, even though nobody is physically nearby. Which explanation most directly fits her concern about being judged?", "opts": ["Evaluation apprehension", "Free riding", "Group polarization", "Task interdependence"], "ans": 0, "why": "Evaluation apprehension is arousal linked to concern about others evaluating performance and can occur with electronic monitoring. Free riding concerns reduced effort when relying on a group, which is not the issue here. (Source: Ms. Chiqui's notes)", "hint": "Physical presence is not required for this particular concern."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Group Roles", "q": "During planning, Pia gathers missing data and coordinates who will complete each step. Which category best describes these contributions?", "opts": ["Task-oriented role", "Individual role", "Formal leadership position", "Social-oriented role"], "ans": 0, "why": "Task-oriented contributions include obtaining information, proposing ideas, and coordinating activities. Social-oriented contributions primarily support participation and cohesion rather than organizing the substantive work. (Source: Ms. Chiqui's notes)", "hint": "Identify whether her contribution advances the work itself or mainly supports relationships."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Group Roles", "q": "When quieter members stop speaking, Nico invites their views and acknowledges their contributions so they remain involved. Which group role does this most clearly illustrate?", "opts": ["Social-oriented role", "Individual blocking role", "Task-oriented information seeking", "Task-related conflict"], "ans": 0, "why": "Social-oriented roles encourage participation and cohesion. Information seeking may advance the task, but the distinctive purpose here is keeping people included in the interaction. (Source: Ms. Chiqui's notes)", "hint": "Focus on why he invites the contributions, rather than the content of the eventual ideas."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Group Roles", "q": "A committee member repeatedly diverts discussion to his personal achievements and blocks others' proposals without offering task-relevant reasons. Which role pattern is most evident?", "opts": ["Individual role", "Coordinating role", "Social-oriented role", "Task-oriented role"], "ans": 0, "why": "Individual roles center on self-attention or blocking group activity and seldom improve productivity. Task-oriented disagreement would contribute relevant information or ideas toward completing the work. (Source: Ms. Chiqui's notes)", "hint": "Ask whose needs the behavior serves and whether it advances the group's work."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Group Tasks", "q": "A warehouse team's daily total is the combined number of parcels packed independently by all members. Which task model best describes how its output is determined?", "opts": ["Compensatory task", "Conjunctive task", "Disjunctive task", "Additive task"], "ans": 3, "why": "For an additive task, the group's output is the sum of members' contributions. A conjunctive task is constrained by the weakest member rather than simply adding everyone's output.", "hint": "Determine how individual outputs enter the team's total."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Group Tasks", "q": "A puzzle team wins once any one member discovers the correct solution, which the others can readily recognize and use. Which task type best fits?", "opts": ["Disjunctive task", "Conjunctive task", "Compensatory task", "Additive task"], "ans": 0, "why": "A disjunctive task can depend on the group's best capable contributor. An additive task requires summing separate contributions rather than using one correct solution for the whole group.", "hint": "Does success require a sum, a weakest link, or one usable solution?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Task Interdependence", "q": "A designer must finish an approved layout before the printer can begin. The printer does not send work back for joint processing. What relationship should the manager plan around?", "opts": ["Reciprocal interdependence", "Sequential interdependence", "Independent parallel work", "Pooled interdependence"], "ans": 1, "why": "Sequential interdependence means one person's output becomes another's input. Reciprocal interdependence involves back-and-forth exchanges, which the scenario explicitly excludes.", "hint": "Trace the direction in which the work moves."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Trust", "q": "A supplier team follows its agreement mainly because members know that breaking it will bring a financial penalty. Which basis of trust is most directly operating?", "opts": ["Identification-based trust", "Group cohesiveness", "Knowledge-based trust", "Calculus-based trust"], "ans": 3, "why": "Calculus-based trust rests on the calculation that others will behave appropriately because misconduct has consequences. Knowledge-based trust instead rests on predictability learned through experience with the person.", "hint": "What is making compliance a sensible choice for the other party?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Trust", "q": "Two colleagues understand one another's priorities so well that each can represent the other's interests, supported by a strong emotional bond. Which basis of trust is emphasized?", "opts": ["Calculus-based trust", "Identification-based trust", "Organizational commitment", "Knowledge-based trust"], "ans": 1, "why": "Identification-based trust grows from mutual understanding and emotional connection. Knowledge-based trust emphasizes predictable behavior, while this scenario adds shared understanding of the other's interests and values.", "hint": "Look beyond a history of reliable behavior to the depth of mutual understanding."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Conflict Management", "q": "Two teams need access to the same laboratory. Instead of splitting the contested hours equally, they examine their underlying needs and design a schedule that fully meets both teams' essential requirements. Which style is this?", "opts": ["Collaborating", "Compromising", "Avoiding", "Accommodating"], "ans": 0, "why": "Collaborating seeks a solution that benefits both parties by addressing their needs. Compromising typically gives each side only part of what it sought rather than fully resolving both sets of essential requirements.", "hint": "Distinguish meeting underlying needs from dividing a fixed demand in half."}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Conflict Management", "q": "A neutral facilitator helps two employees discuss options and reach an agreement, but cannot impose a binding decision. Which dispute-resolution process is this?", "opts": ["Avoidance", "Mediation", "Forcing", "Arbitration"], "ans": 1, "why": "Mediation helps parties develop a mutually acceptable solution. Arbitration gives the third party decision-making authority, which the facilitator here does not have.", "hint": "Who retains the final power to agree on a solution?"}, {"subj": "io", "set": "Set 4 - Team Dynamics", "topic": "Team Problems", "q": "A team loses several hours each week to meetings about issues that only one or two members need to handle. Which adjustment most directly addresses this problem?", "opts": ["Add more attendees so every issue has a possible representative", "Meet as a full team only when the topic requires everyone's contribution", "Keep the meeting schedule and ask everyone to work faster afterward", "M
