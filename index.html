instructions, format, content, or the target population changes materially. Keeping the number of items unchanged does not show that the adapted scores support the same intended inferences. (Source: Ms. Chiqui's notes)", "hint": "Ask which conditions supporting the earlier interpretation have been altered."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Content Review", "q": "A developer asks experts whether items are relevant, whether important topics are missing, and whether some topics are overrepresented. Which purpose does this review primarily serve?", "opts": ["Estimate temporal stability from repeated administrations", "Evaluate coverage against the defined content domain", "Calculate chance-corrected agreement between scorers", "Evaluate prediction of later job performance"], "ans": 1, "why": "Expert content review compares items with the defined domain for relevance, coverage, clarity, gaps, and redundancy. Temporal stability requires repeated score data, which these expert judgments do not provide.", "hint": "Identify what the experts compare the items against."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Construct Development", "q": "A developer defines test anxiety, then turns that abstract definition into observable items about worry and bodily tension before exams. Which step is represented by turning the definition into measurable indicators?", "opts": ["Cut-score setting", "Operationalization", "Cross-validation", "Norm conversion"], "ans": 1, "why": "Operationalization translates an abstract construct into measurable indicators. Norm conversion gives meaning to scores after data exist; it does not define the observable content of the construct.", "hint": "Identify the bridge between an abstract idea and the responses a person can provide."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Construct Evidence", "q": "A measure of a childhood skill is expected to rise with development. A longitudinal study finds the predicted pattern as children grow older. What does this pattern contribute?", "opts": ["An estimate of item essentiality from experts", "Proof that test scores are unaffected by development", "Interrater agreement between independent examiners", "Construct-validity evidence from expected age-related change"], "ans": 3, "why": "Age-related score changes can support construct interpretation when theory predicts those changes. They are not evidence of temporal stability, since the expected development involves genuine change.", "hint": "Evaluate the result against the theory's developmental prediction."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Construct Evidence", "q": "A coping-skills scale changes in the predicted direction after an intervention designed to improve coping, with other evidence supporting that the program worked. How should this finding be used?", "opts": ["As evidence that the scale measures an unchanging trait", "As proof that reliability must be perfect", "As a replacement for all other validation evidence", "As one source of construct-validity evidence"], "ans": 3, "why": "Expected pretest-posttest changes can support a construct interpretation. Such a finding contributes to validation but does not establish perfect reliability or eliminate the need for other evidence.", "hint": "The finding can support an interpretation without being a complete validation argument."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Multitrait-Multimethod Evidence", "q": "Measures of different traits correlate strongly whenever the same questionnaire method is used, while the pattern weakens across methods. What should a validator investigate?", "opts": ["Shared method influence rather than assuming all correlations reflect the traits", "Whether using one method removes the need to distinguish constructs", "Whether every trait must be identical because one correlation is high", "Whether the high correlations alone prove perfect temporal stability"], "ans": 0, "why": "An MTMM design separates trait and method patterns by comparing correlations across both. Strong same-method associations among different traits warrant checking method influence rather than automatically treating them as evidence that the constructs are the same.", "hint": "Compare what stays common when the correlations rise: the trait or the measurement approach."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Data Reduction", "q": "An analyst's immediate goal is to summarize the variance in many observed test variables with fewer uncorrelated components, rather than test a specified latent-trait model. Which procedure best matches this goal?", "opts": ["Principal component analysis", "Content-validity ratio analysis", "Confirmatory factor analysis", "Test-retest correlation"], "ans": 0, "why": "PCA summarizes observed variance in a smaller set of components. Confirmatory factor analysis instead evaluates a hypothesized factor structure, so it addresses a different immediate aim.", "hint": "Focus on summarizing observed variance rather than confirming a proposed trait model."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Factor Interpretation", "q": "Two questionnaire items have loadings of .80 and .20 on the same factor. Considering loading magnitude alone, which statement is supported?", "opts": ["The .80 item is necessarily free of cultural bias", "The .20 item has four times the association with the factor", "The .80 item has a stronger association with that factor", "The .20 item must have a higher test-retest reliability"], "ans": 2, "why": "Factor loading reflects how strongly an observed item relates to a factor, so .80 indicates the stronger association here. Loading size alone does not establish fairness or temporal reliability.", "hint": "Limit the conclusion to what a loading represents."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validation Design", "q": "A predictor was selected because it worked well in one development sample. Which next step best checks whether that relationship carries to new test takers?", "opts": ["Validate it against the criterion in an independent sample", "Remove the lowest-scoring cases until the correlation rises", "Use the predictor's reliability as the sole validation result", "Recalculate the same correlation in the same records"], "ans": 0, "why": "Cross-validation evaluates the test-criterion relationship in a different group. Reusing the same development data does not provide an independent check of how well the predictor generalizes.", "hint": "The next evidence should not depend on the same cases that made the predictor look promising."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norm Development", "q": "A publisher standardizes two instruments using the same group so their normative references are coordinated. Which term specifically describes this shared norming arrangement?", "opts": ["Test-retest assessment", "Predictive validation", "Cross-validation", "Co-norming"], "ans": 3, "why": "Co-norming derives norms for more than one instrument from the same group. Cross-validation uses a different group to check validity rather than establishing a shared normative reference.", "hint": "Identify whether the shared sample is being used for norms or for a new prediction study."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Criterion Quality", "q": "A test is intended to predict accurate accounting work. Which criterion is most directly aligned with that intended outcome?", "opts": ["The inventory's internal-consistency coefficient", "The applicant's agreement that the test looked professional", "The number of social events attended by the applicant", "An independently scored audit of job-relevant accounting accuracy"], "ans": 3, "why": "A criterion should be a relevant external measure of the outcome of interest, making actual accounting accuracy a direct fit. Internal consistency describes the test's reliability rather than job performance.", "hint": "Choose an external outcome that matches the particular performance claim."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Incremental Value", "q": "A costly extra scale predicts performance by itself but adds no useful prediction once the existing battery is considered. What should the assessor examine before including it?", "opts": ["Whether a longer battery is automatically more useful", "Whether its attractive score report can substitute for new information", "Whether it contributes enough incremental information to justify its costs", "Whether its standalone correlation makes added-value analysis unnecessary"], "ans": 2, "why": "Incremental validity concerns information beyond the predictors already used. A standalone relationship does not show that the extra scale improves this battery enough to justify additional costs.", "hint": "Evaluate the new scale in combination with what is already known."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norms and Criteria", "q": "A school needs to decide whether pupils have mastered specified multiplication skills, regardless of classmates' performance. Which interpretation framework is appropriate?", "opts": ["Criterion-referenced interpretation", "Rank-order interpretation only", "Fixed reference-group ranking only", "Norm-referenced interpretation"], "ans": 0, "why": "Criterion-referenced interpretation compares performance with a defined standard of proficiency. A norm-based rank shows relative standing but does not by itself establish mastery of specified skills.", "hint": "Ask whether the decision depends on a learning standard or on how other pupils scored."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Score Interpretation", "q": "A student answers 36 of 40 questions correctly. Her parent says this means she is at the 90th percentile. Which response is accurate?", "opts": ["It is the 90th percentile whenever a test contains 40 items", "It is a T-score of 90 because the result is expressed as a percentage", "It is 90% correct; the percentile requires comparison with norm-group scores", "It is a standard score of 36 regardless of the norm distribution"], "ans": 2, "why": "36/40 gives 90% correct, a proportion of items answered correctly. A percentile describes position relative to a reference group and cannot be obtained from that item proportion alone.", "hint": "The two percentages have different denominators."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Subgroup Norms", "q": "A national test manual provides a separate reference distribution for each age band drawn from its standardization sample. What kind of norming information is being provided by those segments?", "opts": ["An item-validity coefficient", "A job-specific passing standard", "Subgroup norms", "Local norms from one clinic"], "ans": 2, "why": "Subgroup norms segment the normative sample by a relevant criterion such as age. Local norms instead describe a particular local population, not necessarily age segments of a national sample.", "hint": "Look at how the original reference sample was divided."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Norm Representativeness", "q": "A publisher labels norms 'national,' but the reference sample contains only volunteers from one selective urban school. What is the main concern?", "opts": ["Only the raw-score mean is needed to verify population coverage", "A large sample size alone demonstrates adequate subgroup coverage", "The reference group may not represent the national target population", "Good item wording is sufficient to establish national representativeness"], "ans": 2, "why": "National norms require a nationally representative reference sample. An accessible selective-school sample can omit important parts of the intended population, regardless of the label printed in the manual.", "hint": "Inspect who is represented rather than relying on the norm label."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reference Groups", "q": "A scoring system continues converting new examinees' scores using the distribution established by one earlier reference group. Which arrangement is described?", "opts": ["Individualized item branching", "Fixed reference-group scoring", "Criterion setting by expert essentiality ratings", "Re-norming after every administration"], "ans": 1, "why": "Fixed reference-group scoring uses one group's distribution as the basis for later score calculations. Re-norming every administration would instead change that reference distribution over time.", "hint": "Determine whether the comparison distribution stays fixed or is replaced."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Sampling for Norms", "q": "A developer recruits whoever is easiest to reach because time and money are limited, then clearly reports that limitation. Which sampling approach is being used?", "opts": ["Simple random sampling from a full population list", "Systematic sampling from an ordered population frame", "Stratified random sampling", "Convenience sampling"], "ans": 3, "why": "Convenience sampling selects participants based on accessibility. Stratified random sampling deliberately represents defined subgroups and randomly samples within them, which this procedure does not do.", "hint": "Focus on the rule that actually determines who enters the sample."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Comparing Scores", "q": "A student scores 70 on Test A (mean 50, SD 10) and 70 on Test B (mean 70, SD 5). Which result represents the higher relative standing?", "opts": ["Test B, because its score is fourteen SDs above its mean", "They are equal because both raw scores are 70", "Test B, because its norm-group mean is higher", "Test A, because its score is two SDs above its mean"], "ans": 3, "why": "For A, z = (70 - 50)/10 = 2; for B, z = (70 - 70)/5 = 0. Equal raw scores do not imply equal standing when tests have different reference distributions.", "hint": "Locate each score relative to its own mean before comparing them."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Deviation IQ", "q": "On an IQ scale explicitly defined with mean 100 and SD 15, a score is two standard deviations above the mean. What is the deviation IQ?", "opts": ["120", "145", "130", "115"], "ans": 2, "why": "Two SDs above the mean is 100 + 2(15) = 130. A score of 115 is only one SD above the mean on this specified scale. (Source: Ms. Chiqui's notes)", "hint": "Use the stated scale parameters rather than borrowing another standard-score system."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Stanines", "q": "A child receives stanine 5 on an aptitude test. Which interpretation best matches the stanine system?", "opts": ["Exactly five questions were answered correctly", "The child performed five SDs above the mean", "The child is necessarily at the fifth percentile", "Performance falls in the middle, average range of the reference distribution"], "ans": 3, "why": "Stanines group scores into nine bands, with 5 at the middle of the scale. The digit is a standard-score band rather than a raw item count or a percentile rank. (Source: Ms. Chiqui's notes)", "hint": "First identify what kind of score the single digit represents."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Standard-Score Metrics", "q": "A manual reports scores with mean 5.5 and SD 2, using a ten-point standard-score system. Which score metric is this?", "opts": ["Stanine", "T-score", "IQ subtest scaled score", "STEN"], "ans": 3, "why": "STEN scores have mean 5.5 and SD 2 in the reviewer's standard-score table. Stanines instead center on 5 and use nine bands, so the similar spread does not make the systems identical.", "hint": "Compare both the center and the number of score points."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Developmental Norms", "q": "A particular reading score has an age equivalent of 10 years. What does that score most directly describe?", "opts": ["The child functions exactly like a 10-year-old in every area", "The score is ten SDs above the population mean", "The child should automatically be placed in a class for 10-year-olds", "The raw score matches the norm sample's average for that age on the measured task"], "ans": 3, "why": "An age-equivalent score matches a raw result with the average result at a specified age in the norm sample. It does not establish the child's overall developmental age or determine placement by itself.", "hint": "Keep the interpretation tied to the particular task and reference sample."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Reference-Group Interpretation", "q": "The same raw result is at the 70th percentile in one reference group and the 45th in another. Which explanation is most appropriate?", "opts": ["The higher percentile proves that the first scoring key is correct", "Percentile ranks identify the number of test items passed", "The examinee's raw answers must have changed between conversions", "Percentile standing depends on the comparison group's score distribution"], "ans": 3, "why": "Norm-based standing depends on the distribution used for comparison, so one raw score can occupy different positions in different groups. The change does not by itself show that the answers or scoring key changed.", "hint": "Identify what changed in the comparison even though the raw performance stayed fixed."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Measurement Equivalence", "q": "Two language versions use clear translations and refer to the same construct, but their psychometric properties have not been shown to function similarly across groups. Which equivalence question remains?", "opts": ["Face validity", "Linguistic equivalence", "Metric equivalence", "Conceptual equivalence"], "ans": 2, "why": "Metric equivalence concerns comparable psychometric functioning across groups. Linguistic accuracy and shared construct meaning are important but do not by themselves establish that the scores operate comparably.", "hint": "Separate matching words and concepts from comparable measurement properties."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Validity in Context", "q": "A scale supports research on general stress in students. An employer wants to use it to decide who can safely operate heavy machinery. What is the central validation question?", "opts": ["Whether evidence supports that specific inference and use in the intended work context", "Whether a student percentile can be copied into the employment report", "Whether the existing reliability coefficient is above the publisher's preferred cutoff", "Whether the inventory's items appear relevant to stress at work"], "ans": 0, "why": "Validity concerns the appropriateness of the interpretation in a particular context, so evidence for one research use does not automatically justify a safety decision. Reliability alone cannot establish the new inference about safe job performance.", "hint": "Identify the new claim the employer wants to make from the score."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Utility Analysis", "q": "Two tests provide equally suitable evidence for the same referral. One costs much more, takes longer, and offers no additional useful information. Which consideration favors the less burdensome option?", "opts": ["Higher content validity merely because it is cheaper", "Perfect reliability due to its shorter duration", "Greater practical utility for the same assessment purpose", "A guarantee that its norms apply to every population"], "ans": 2, "why": "Utility considers practical benefits and costs along with psychometric soundness. Lower cost does not itself create validity, but when suitability and useful information are comparable it can improve practical value.", "hint": "Assume the necessary measurement evidence is comparable, then assess the burden and benefit."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Utility Calculation", "q": "A proposed assessment process is expected to yield P180,000 in annual benefits and P65,000 in annual testing costs. Using benefits minus costs, what is the expected annual net benefit?", "opts": ["P115,000", "P180,000", "P65,000", "P245,000"], "ans": 0, "why": "Net benefit is P180,000 - P65,000 = P115,000. Adding the two figures gives total amounts involved, not the gain remaining after costs.", "hint": "Ask what remains after the expense is taken from the expected benefit."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Utility Costs", "q": "A testing program is inexpensive to purchase but requires long absences from work and creates substantial examinee burden. What should its utility analysis include?", "opts": ["Economic and noneconomic costs alongside expected benefits", "Only the number of scores produced per examinee", "Only the correlation between the two test halves", "Only the price printed on the test booklet"], "ans": 0, "why": "Costs in utility analysis include disadvantages and losses as well as direct economic expenses. Purchase price alone misses time and other burdens relevant to practical usefulness.", "hint": "Consider consequences that matter even when no separate invoice is issued."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Expectancy Information", "q": "An expectancy table links a test-score band with the likelihood of later acceptable job performance. How should an assessor communicate the table's result?", "opts": ["As a guarantee that every individual in the band will succeed", "As a probabilistic estimate for the criterion outcome", "As the examinee's exact future performance score", "As a direct measure of test-retest reliability"], "ans": 1, "why": "Expectancy information indicates the likelihood of an outcome or criterion-score interval. It should not be presented as certainty about one individual's future performance. (Source: Ms. Chiqui's notes)", "hint": "Distinguish a likelihood for similar cases from a guaranteed individual outcome."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Decision Errors", "q": "A screening test labels an examinee as not having a target condition, but a sound independent evaluation shows that the condition is present. Which error occurred?", "opts": ["True positive", "True negative", "False positive", "False negative"], "ans": 3, "why": "A false negative occurs when the test fails to identify a characteristic that is actually present. A false positive reverses the pattern by indicating a characteristic that is absent. (Source: Ms. Chiqui's notes)", "hint": "State the test's conclusion first, then compare it with the independently established condition."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Classification Rules", "q": "One placement test uses two boundaries to classify examinees as beginning, intermediate, or advanced. Which arrangement is described?", "opts": ["Multiple hurdles across successive predictors", "A compensatory combination of several tests", "A single relative cutoff selecting the top group", "Multiple cut scores on one predictor"], "ans": 3, "why": "Multiple cut scores use two or more boundaries on one predictor to create categories. Multiple hurdles instead require passing separate stages or predictors.", "hint": "Count the predictors separately from the boundaries placed on their scores."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Standard Setting", "q": "Judges inspect items ordered by difficulty and place a marker at the boundary separating minimally qualified from not-yet-qualified performance. Which standard-setting procedure is this?", "opts": ["Angoff method", "Nedelsky method", "Bookmark method", "Known-groups method"], "ans": 2, "why": "The bookmark method uses a marker in an ordered item presentation to identify the performance boundary. Angoff asks judges for item-level success probabilities rather than placing a marker between ordered items.", "hint": "Focus on what the judges physically do with the ordered item material."}, {"subj": "pa", "set": "Set 1 - Reliability, Validity, Norms", "topic": "Selection Planning", "q": "A company sets a selection threshold while considering how many jobs must be filled, applicants' score distribution, and the chance that offers will be accepted. Which method incorporates these considerations?", "opts": ["Content-validity ratio", "Method of predictive yield", "Known-groups mastery comparison", "Odd-even reliability estimation"], "ans": 1, "why": "The method of predictive yield considers positions available, expected offer acceptance, and applicant-score distribution. A content-validity ratio concerns experts' item essentiality judgments rather than filling a planned number of positions.", "hint": "The decision must connect test scores with the practical number of people who will actually join."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "IQ scores have equal intervals between values but no true zero point (an IQ of 0 doesn't mean 'no intelligence'). On what scale of measurement are they?", "opts": ["Interval", "Ordinal", "Ratio", "Nominal"], "ans": 0, "why": "Interval = ordered, equal intervals, NO absolute zero (IQ, Celsius, calendar years). Ratio adds a true zero (height, weight, reaction time, Kelvin). Ordinal = ranked but unequal gaps. Nominal = categories only.", "hint": "Equal gaps between values, but zero isn't 'none of it'."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher measures participants' reaction times in milliseconds. On what scale is reaction time measured?", "opts": ["Ordinal", "Interval", "Nominal", "Ratio"], "ans": 3, "why": "Reaction time has equal intervals AND a true zero (0 ms = no time elapsed), so it's ratio data. You can say 400 ms is twice as long as 200 ms, which you can only do on a ratio scale.", "hint": "Does 0 ms mean truly 'no time at all'?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Monthly household incomes in a barangay survey are extremely skewed because of a few very wealthy families. Which measure of central tendency best represents the typical household?", "opts": ["Range", "Mean", "Mode", "Median"], "ans": 3, "why": "For skewed interval/ratio data, use the MEDIAN, because the mean gets pulled toward the extreme values. Mean = interval/ratio data that's roughly normal; mode = nominal data. Range measures variability, not central tendency.", "hint": "Which average ignores how extreme the richest families are?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A professor gives an extremely difficult exam. Most students score low and only a few score high. The distribution is:", "opts": ["Mesokurtic", "Positively skewed (mean > median > mode)", "Perfectly normal", "Negatively skewed (mean < median < mode)"], "ans": 1, "why": "POSITIVE skew = relatively few scores at the HIGH end, with the tail pointing right. This is typical of a DIFFICULT test, and mean > median > mode. NEGATIVE skew = few scores at the low end (an EASY test).", "hint": "Where do the few unusual scores sit? The tail points toward them."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "On a very easy quiz, almost everyone scores high and only a few students score low. The distribution is:", "opts": ["Negatively skewed", "Bimodal", "Platykurtic", "Positively skewed"], "ans": 0, "why": "Easy test → most scores pile up high, and the few low scores form a tail to the LEFT = negative skew (mean < median < mode).", "hint": "Where is the tail: among the high scores or the low scores?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A test taker's z-score is −1.5. What is her equivalent T-score?", "opts": ["65", "35", "15", "45"], "ans": 1, "why": "T = 50 + 10(z) = 50 + 10(−1.5) = 50 − 15 = 35. T-scores have a mean of 50 and an SD of 10. A negative z means below the mean, so the T-score must be below 50.", "hint": "T-scores have mean 50 and SD 10. A negative z puts her below 50."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "In a normal distribution, approximately what percentage of scores fall between one standard deviation below and one standard deviation above the mean?", "opts": ["95%", "34%", "68%", "50%"], "ans": 2, "why": "About 34% lie between the mean and +1 SD, and another 34% between the mean and −1 SD, so 68% fall within ±1 SD. About 95% fall within ±2 SD and about 99.7% within ±3 SD.", "hint": "Add the area on both sides of the mean, one SD each way."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher compares the exam scores of a tutored group and a separate untutored group. Scores are interval and normally distributed. Which test should she use?", "opts": ["Chi-square test of independence", "Independent samples t-test", "Paired (dependent) t-test", "Mann-Whitney U test"], "ans": 1, "why": "Two separate, unrelated groups + normal interval/ratio data → independent samples t-test. If the data were skewed or ordinal, its nonparametric equivalent is Mann-Whitney U. A paired t-test is for the SAME people measured twice.", "hint": "How many groups, are they the same people, and is the data normal?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "The same researcher compares tutored vs. untutored students again, but this time the outcome is a Likert-type satisfaction rating and the scores are badly skewed. Which test fits now?", "opts": ["Mann-Whitney U test", "Friedman test", "Independent samples t-test", "Wilcoxon signed-rank test"], "ans": 0, "why": "Mann-Whitney U is the nonparametric equivalent of the independent samples t-test, used for ordinal or non-normal data from two independent groups. Wilcoxon signed-rank is for two RELATED (paired) samples.", "hint": "It's still two separate groups, but the data is no longer normal."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Stress levels of the same 30 students are measured before and after their board exam. The difference scores are normally distributed. Which test should be used?", "opts": ["One-way ANOVA", "Independent samples t-test", "Kruskal-Wallis H test", "Paired (dependent) t-test"], "ans": 3, "why": "Same group measured twice (pre and post) = dependent/paired design → paired t-test. If the difference scores were not normal, you'd use the Wilcoxon signed-rank test.", "hint": "Is this two different groups, or the same people measured twice?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "One group of participants rates their mood (an ordinal rating) at three time points: morning, afternoon, and evening. Which nonparametric test compares the three conditions?", "opts": ["Chi-square goodness of fit", "Kruskal-Wallis H test", "Mann-Whitney U test", "Friedman test"], "ans": 3, "why": "Friedman = nonparametric test for ONE group measured across 3+ conditions (the counterpart of repeated measures ANOVA). Kruskal-Wallis = 3+ INDEPENDENT groups (the counterpart of one-way ANOVA).", "hint": "Same people, three or more measurements, ranked data."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher wants to know whether sex (male/female) is related to preferred counseling format (face-to-face, online, group). The data are frequency counts. Which test fits?", "opts": ["Chi-square test of independence", "Pearson r", "Chi-square goodness of fit", "Independent samples t-test"], "ans": 0, "why": "Two categorical variables in a contingency table → chi-square test of INDEPENDENCE. Goodness of fit is for ONE categorical variable compared against an expected distribution. Chi-square needs raw counts, not percentages.", "hint": "Count how many categorical variables are involved."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A chi-square test of independence uses a contingency table with 3 rows and 4 columns. What are its degrees of freedom?", "opts": ["12", "6", "7", "5"], "ans": 1, "why": "df = (r − 1)(c − 1) = (3 − 1)(4 − 1) = 2 × 3 = 6. For goodness of fit, df = k − 1.", "hint": "Subtract one from the rows and one from the columns, then multiply."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A one-way ANOVA comparing four teaching methods is significant. The groups have equal sizes and equal variances, and the researcher wants to compare all possible pairs of groups. Which post hoc test is ideal?", "opts": ["Dunnett's test", "Tukey's HSD", "Dunn's test", "Games-Howell test"], "ans": 1, "why": "Tukey's HSD = all pairwise comparisons when variances and group sizes are equal. Dunnett's = compares each treatment ONLY against one control group. Games-Howell = when variances are UNEQUAL (Levene's test is significant). Dunn's = follow-up to Kruskal-Wallis.", "hint": "All pairs, with every assumption met."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "In a drug trial, three dosage groups are each compared only against a single placebo control group after a significant ANOVA. Which post hoc test is designed for this?", "opts": ["Dunnett's test", "Tukey's HSD", "Nemenyi test", "Scheffé's test"], "ans": 0, "why": "Dunnett's test compares multiple treatment groups against ONE control/benchmark group only. It reduces the comparisons from k(k−1)/2 to k − 1, which preserves power.", "hint": "Everything is compared with one special group."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A correlation of r = .60 is found between study hours and exam scores. What percentage of the variance in exam scores is accounted for by study hours?", "opts": ["60%", "64%", "40%", "36%"], "ans": 3, "why": "The coefficient of determination = r² = .60² = .36, so 36% of the variance is explained. The remaining 64% (1 − r²) is the coefficient of alienation: variance NOT accounted for.", "hint": "Square the correlation."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher correlates sex (a true dichotomy: male/female) with scores on an interval-level anxiety scale. Which correlation coefficient is appropriate?", "opts": ["Biserial", "Phi coefficient", "Tetrachoric", "Point-biserial"], "ans": 3, "why": "Point-biserial = TRUE dichotomy + interval/ratio. Biserial = ARTIFICIAL dichotomy (e.g., pass/fail created from a score) + interval/ratio. Phi = two dichotomies (true or artificial) in a 2×2 table. Tetrachoric = two artificial dichotomies.", "hint": "Is the two-category variable naturally two categories, or made that way by a cutoff?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Before running a t-test, a researcher checks normality with the Shapiro-Wilk test and gets p = .21. What should she conclude?", "opts": ["The data are not normally distributed", "The result is statistically significant, so normality is violated", "She must use a nonparametric test", "Fail to reject normality at alpha = .05; normality is not proved"], "ans": 3, "why": "Because .21 exceeds .05, this test does not provide statistically significant evidence against its normality null hypothesis. Failing to reject that hypothesis does not prove normality or establish every other assumption of the planned t-test.", "hint": "In normality tests, what does the null hypothesis claim?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher plans 5 pairwise comparisons and wants to keep the familywise alpha at .05 using the Bonferroni correction. What alpha should each comparison use?", "opts": [".01", ".001", ".05", ".25"], "ans": 0, "why": "Bonferroni: α adjusted = α / k = .05 / 5 = .01. It controls the inflated Type I error risk from running many tests, but becomes very conservative as k grows.", "hint": "Divide the overall alpha by the number of comparisons."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Research Design", "q": "A school psychologist wants to test whether a new study-skills program raises grades, but she must use two existing class sections and cannot randomly assign students. Which design is this?", "opts": ["Correlational design", "Cross-sectional design", "Quasi-experimental design", "True experimental design"], "ans": 2, "why": "Quasi-experimental = infers cause and effect when random assignment isn't feasible, using intact groups. A true experiment requires random assignment. Correlational designs don't manipulate anything.", "hint": "What's missing compared to a true experiment?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "A researcher compares Likert-scale satisfaction ratings (ordinal) across THREE independent groups: freshmen, sophomores, and juniors. Which nonparametric test should she use?", "opts": ["Friedman test", "Kruskal-Wallis H test", "Mann-Whitney U test", "Wilcoxon signed-rank test"], "ans": 1, "why": "Kruskal-Wallis H = the nonparametric counterpart of one-way ANOVA, for 3+ INDEPENDENT groups. Friedman is for ONE group measured 3+ times. Mann-Whitney is for only two independent groups.", "hint": "How many groups, and are they different people?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Before a post hoc analysis, Levene's test is significant (p = .01), meaning the group variances are unequal. Which pairwise post hoc test is the standard choice?", "opts": ["Dunnett's test", "Scheffé's test", "Tukey's HSD", "Games-Howell test"], "ans": 3, "why": "When Levene's test is significant, homogeneity of variance is violated and Tukey or Scheffé become invalid. Games-Howell doesn't require equal variances or equal group sizes.", "hint": "Which test was designed for unequal variances?"}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Statistics", "q": "Ten clients rate their anxiety before and after a mindfulness workshop. The difference scores are badly skewed. Which test compares the two conditions?", "opts": ["Paired t-test", "Wilcoxon signed-rank test", "Mann-Whitney U test", "Kruskal-Wallis H test"], "ans": 1, "why": "Wilcoxon signed-rank = the nonparametric counterpart of the paired t-test: the same people measured twice when the difference scores aren't normal. Mann-Whitney is for two INDEPENDENT groups.", "hint": "Same people, two times, non-normal data."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Test Development", "q": "A developer creating national norms for a new aptitude test gives it to 2,000 examinees selected to match the country's population by region, age, sex, and education. This step is called:", "opts": ["Item analysis", "Cross-validation", "Pilot testing with known groups", "Standardization (norming) with a representative sample"], "ans": 3, "why": "Standardization = administering the test to a REPRESENTATIVE sample to establish norms. Matching the sample to the population (e.g., through stratified sampling) makes the norms trustworthy for interpreting individual scores.", "hint": "Giving the test to a sample that mirrors the population."}, {"subj": "pa", "set": "Set 2 - Research Methods and Statistics", "topic": "Test Development", "q": "To check whether the items of a new 'workplace resilience' scale cluster into the three dimensions the theory predicts, the developer analyzes the item intercorrelations. Which statistical method is she using, and for what purpose?", "opts": ["Kappa, as evidence of inter-rater reliability", "t-test, as evidence of content validity", "Factor analysis, as evidence of construct validity", "Chi-square test, as evidence of reliability"], "ans": 2, "why": "Factor analysis identifies the underlying dimensions (factors) among items. Confirming the theory's predicted structure is evidence of CONSTRUCT validity. Here she's testing a predicted structure, so confirmatory factor analysis fits.", "hint": "Items clustering into dimensions."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Development", "q": "A developer wants the final version of her test to have 50 items. As a rule of thumb, about how many items should the first draft of the item pool contain?", "opts": ["About 60", "About 500", "About 100", "About 50"], "ans": 2, "why": "It's usually advisable for the first draft to contain about TWICE the number of items the final version will have, since many will be dropped after tryout and item analysis.", "hint": "Expect to throw out a lot of items after tryout."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Development", "q": "For a 40-item test, roughly how many people should be in the tryout sample according to the informal rule of thumb?", "opts": ["At least 1,000", "20 to 40", "40 to 80", "200 to 400"], "ans": 3, "why": "Rule of thumb: no fewer than 5 and preferably up to 10 subjects per item. 40 items × 5–10 = 200–400. Too few subjects risks 'phantom factors' (artifacts of small samples) in factor analysis.", "hint": "Multiply the number of items by the subjects-per-item rule."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "On a 120-examinee tryout, 102 people answer Item 7 correctly. Its item-difficulty index (p) is .85. How should the item be described?", "opts": ["Difficult", "Average", "Very easy", "Very difficult"], "ans": 2, "why": "p = proportion who answered correctly; the HIGHER the p, the EASIER the item. Ranges: .80–1.00 very easy; .61–.79 easy; .40–.60 average; .20–.39 difficult; .00–.19 very difficult.", "hint": "For p, a bigger number means more people got it right."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "For a four-option multiple-choice item, the chance (guessing) score is .25. Using the 'midpoint' rule, what is the optimal item difficulty?", "opts": [".25", ".625", ".50", ".875"], "ans": 1, "why": "Optimal difficulty = (1.0 + chance) / 2 = (1 + .25) / 2 = .625. The reviewer adds that a value slightly higher, around .74, is often cited for four-option items.", "hint": "Find the point halfway between pure guessing and a perfect score."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "In the upper-scoring group (n = 40), 24 examinees answered an item correctly. In the lower-scoring group (n = 40), 8 did. What is the item-discrimination index d, and how good is the item?", "opts": ["d = .80, a very good item", "d = .16, a poor item", "d = .40, a poor item", "d = .40, a very good item"], "ans": 3, "why": "d = (RH − RL) / n = (24 − 8) / 40 = 16 / 40 = .40. A d of .40 and above = very good item; .30–.39 good; .20–.29 fair; below .20 poor.", "hint": "Subtract the low group's correct count from the high group's, then divide by one group's size."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "An item is answered correctly by MORE low scorers than high scorers, giving a negative discrimination index. What should the developer do?", "opts": ["Use it as an anchor item", "Keep it because it is very difficult", "Revise or discard the item", "Move it to the start of the test"], "ans": 2, "why": "A good item is answered correctly by high scorers on the test as a whole. A negative d means the item works backwards: it may be ambiguous, miskeyed, or misleading. It should be rewritten or dropped.", "hint": "A good item is answered correctly more by high scorers."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "An attitude scale's items run from mild to strong ('I would work beside a person with depression' up to 'I would marry a person with depression'), so agreeing with a strong item implies agreement with the milder ones. This is a:", "opts": ["Stapel scale", "Semantic differential scale", "Likert scale", "Guttman scale"], "ans": 3, "why": "A Guttman scale arranges items sequentially from WEAKER to STRONGER expressions of the attitude. Likert = degree of agreement with independent statements. Semantic differential = bipolar adjectives.", "hint": "Notice how the statements are ordered."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "Respondents rate 'My workplace' on a 7-point scale anchored by opposite adjectives, such as Cold–Warm and Weak–Strong. This item format is a:", "opts": ["Thurstone scale", "Visual analogue scale", "Likert scale", "Semantic differential scale"], "ans": 3, "why": "Semantic differential = a 7-point scale bounded by BIPOLAR adjectives. Likert measures agree/disagree with statements. Thurstone uses judges' scale values (equal-appearing intervals). A visual analogue scale is a continuous 100 mm line.", "hint": "Look at what sits at each end of the scale."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A panel of expert judges assigns each attitude statement a scale value so that intervals between statements are equal across the continuum. Respondents then endorse statements they agree with. This is the:", "opts": ["Thurstone scale (method of equal-appearing intervals)", "Guttman scale", "Q-sort technique", "Likert scale"], "ans": 0, "why": "Thurstone's method of equal-appearing intervals uses expert judges to assign scale values to statements. The phrase 'equal-appearing intervals' points straight to Thurstone.", "hint": "Expert judges assign values with equal-appearing distances."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A personality test presents pairs of statements matched for social desirability, and the respondent must choose the one more like her. Scores show the relative strength of traits within the person. This scaling approach is:", "opts": ["Forced-choice (ipsative) scaling", "Absolute scaling", "Visual analogue scaling", "Non-comparative scaling"], "ans": 0, "why": "Forced-choice items yield IPSATIVE scores: choices are interdependent, so scores reflect relative strengths within one person rather than comparison with others. The EPPS uses this format to reduce faking good.", "hint": "Choosing one option means not choosing the other. What kind of score does that produce?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "To set a passing score for a licensure exam, expert judges estimate, item by item, the proportion of 'minimally competent' candidates who would answer correctly, and these estimates are summed. This is the:", "opts": ["Angoff method", "Known-groups method", "Method of predictive yield", "Bookmark method"], "ans": 0, "why": "Angoff = judges estimate the proportion of minimally competent candidates answering each item correctly; the sum forms the cut score. Bookmark = judges place a bookmark in a booklet of items ordered by IRT difficulty.", "hint": "Judges rate each item one at a time, imagining a barely-passing candidate."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "On a test of advanced math, many gifted students all earn the maximum score, so the test cannot distinguish among them. This is a(n):", "opts": ["Practice effect", "Floor effect", "Halo effect", "Ceiling effect"], "ans": 3, "why": "Ceiling effect = the test can't measure the HIGH end of ability because too many people max out. Floor effect = the test can't distinguish people at the LOW end. Computerized adaptive testing helps reduce both.", "hint": "Everyone is stuck at the top of the scale."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "An item reads: 'I feel anxious and depressed at work.' What item-writing guideline does it violate?", "opts": ["It is double-barreled", "It uses a double negative", "It uses an absolute qualifier", "Its reading level is too low"], "ans": 0, "why": "A double-barreled item combines two distinct ideas (anxiety AND depression) into one. A person who is anxious but not depressed can't answer it accurately. Each item should target a single construct.", "hint": "How many different feelings is the item asking about?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "A developer deliberately writes some items in the negative direction ('I rarely feel confident') so that a person who agrees with everything won't get a misleadingly high score. This controls for:", "opts": ["Item branching", "Acquiescence response set", "Ceiling effect", "Central tendency error"], "ans": 1, "why": "Reverse/keyed scoring with negatively phrased items controls ACQUIESCENCE: the tendency to agree with items regardless of content.", "hint": "Some people agree with every statement no matter what it says."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "Boys and girls with the SAME overall level of verbal ability have very different probabilities of answering a particular item correctly. This item shows:", "opts": ["Validity shrinkage", "A ceiling effect", "High item reliability", "Differential item functioning (DIF)"], "ans": 3, "why": "DIF = an item functions differently for one group than another even when the groups have the same level of the underlying trait. It signals possible item bias. 'Same ability, different results' is the giveaway.", "hint": "The two groups are equal in ability. So what does the gap point to?"}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Revision", "q": "To keep scoring consistent, a publisher gives scorers a protocol scored by a highly authoritative expert as the model to follow. Months later, one scorer's scoring has gradually moved away from that model. The model protocol and the problem are:", "opts": ["Item pool; test sophistication", "Norm group; validity shrinkage", "Test blueprint; observer bias", "Anchor protocol; scoring drift"], "ans": 3, "why": "An ANCHOR protocol is scored by a highly authoritative scorer to serve as a model and resolve discrepancies. SCORING DRIFT is a discrepancy that develops between the anchor protocol's scoring and another scorer's.", "hint": "One is the model protocol; the other is a gradual change away from it."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "On a 120-examinee tryout, only 30 people answer Item 12 correctly. What is its difficulty index, and how is it classified?", "opts": ["p = .25, easy", "p = .25, difficult", "p = .75, easy", "p = .30, average"], "ans": 1, "why": "p = R / T = 30 / 120 = .25. Ranges: .20–.39 = difficult; .00–.19 = very difficult; .40–.60 = average. Remember: a low p means few got it right, so the item is hard.", "hint": "Divide the number correct by the total, then find its band."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "To set a cut score, judges look at each multiple-choice item and decide how many of the distractors a minimally competent candidate could rule out as wrong. Which standard-setting method is this?", "opts": ["Angoff method", "Nedelsky method", "Bookmark method", "Known-groups method"], "ans": 1, "why": "Nedelsky = judges evaluate the options and identify how many distractors a minimally competent candidate could eliminate on each item. Angoff = judges estimate the proportion of minimally competent candidates answering correctly.", "hint": "The judges are looking at the wrong options, not the right answer."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Construction", "q": "In a computerized test, a student who misses an item is next given an easier item, while a student who answers correctly gets a harder one. The computer's ability to tailor the order and content of items this way is called:", "opts": ["Item fairness", "Item banking", "Item branching", "Co-validation"], "ans": 2, "why": "Item branching = the computer tailors the content and order of items based on responses to previous items. It's the core of computerized adaptive testing (CAT). An item BANK is just a large collection of test questions.", "hint": "The next item depends on the previous answer."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Range", "q": "A basic-skills test is given to students who need intensive support. Most receive the minimum possible score, making their different levels of need hard to distinguish. Which limitation is present?", "opts": ["Floor effect", "Ceiling effect", "Practice effect", "Scoring drift"], "ans": 0, "why": "A floor effect compresses performance at the low end of the score range. A ceiling effect compresses the high end, so it would be the opposite range problem.", "hint": "Identify the end of the score range where differences have become hidden."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Item Analysis", "q": "The final items on a timed test have very low proportions correct, but many examinees never reached them. What should the developer consider before concluding that their content is extremely difficult?", "opts": ["Unreached items establish that the answer key is reversed", "Late placement guarantees excellent discrimination", "The low proportions alone establish poor content validity", "Time limits may make late items appear more difficult than they are"], "ans": 3, "why": "Speed conditions can make item statistics misleading because later items may be missed through lack of opportunity rather than lack of knowledge. Low proportions correct alone do not identify which explanation applies.", "hint": "Check whether examinees had a real opportunity to respond."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Qualitative Item Analysis", "q": "A developer asks pilot participants to describe their reasoning as they answer an item, discovering that they interpret a phrase in an unintended way. Which procedure produced this evidence?", "opts": ["A test-retest stability coefficient", "Think-aloud qualitative item analysis", "A comparison of selected-group means", "A calculation of item difficulty alone"], "ans": 1, "why": "Think-aloud administration examines respondents' thought processes and can reveal unintended interpretations. An item-difficulty proportion shows how often an answer is correct but does not explain the reasoning used.", "hint": "The evidence comes from the response process, not just the final answer count."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Test Tryout", "q": "A very small pilot sample produces several unstable factors that disappear when more appropriate data are collected. Which risk mentioned in the reviewer is illustrated?", "opts": ["A ceiling effect caused by too many easy items", "Phantom factors from inadequate tryout data", "Scoring drift caused by an examiner's changing rubric", "A fixed cutoff established by expert consensus"], "ans": 1, "why": "Phantom factors are apparent factors arising as artifacts of too little tryout data. Their appearance does not justify treating every extracted factor as a stable psychological dimension.", "hint": "Distinguish a replicable structure from a pattern produced by insufficient data."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Difficulty and Discrimination", "q": "An item is answered correctly by 50% of both the high-scoring and low-scoring groups. Which conclusion is justified?", "opts": ["Its moderate difficulty does not mean it distinguishes the groups", "Its discrimination must equal .50 because its difficulty is .50", "Its equal group performance proves every response was guessed", "Its 50% correct rate guarantees strong discrimination"], "ans": 0, "why": "Difficulty concerns the proportion correct, while discrimination concerns separation between high and low scorers. Equal correct proportions in the two groups provide no such separation despite a middle-range difficulty.", "hint": "Keep the item's overall success rate separate from the difference between groups."}, {"subj": "pa", "set": "Set 3 - Test Development and Item Analysis", "topic": "Personality Item Analysis", "q": "For a personality statement without a right or wrong answer, a researcher calculates the proportion of respondents who agree with it. What statistic is most directly described?", "opts": ["Item endorsement index", "Test-retest correlation", "Achievement-item difficulty as percent correct", "Criterion-related validity coefficient"], "ans": 0, "why": "The endorsement index describes how often respondents endorse an item. It is not a percentage of correct answers when the personality statement has no keyed correct response.", "hint": "Ask what the counted response means in this kind of instrument."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "A psychologist answers a court's referral question by integrating test scores, interviews with the client and family, school records, and behavioral observation into a psychological report. Compared with testing alone, this is:", "opts": ["A cut score decision", "Psychometric soundness", "Psychological testing", "Psychological assessment"], "ans": 3, "why": "ASSESSMENT gathers and INTEGRATES data from many sources (tests, interviews, observation, collateral sources) to answer a referral question. The assessor is key, and the output is a psychological report. TESTING measures variables with a test and yields a score or psychometric report.", "hint": "Count the sources of information, and notice who puts them together."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "An assessor gives a reasoning task, then teaches the child a strategy, then gives a similar task again to see how much the child can learn with help. This 'sandwich' approach is:", "opts": ["Ecological momentary assessment", "Collaborative psychological assessment", "Retrospective assessment", "Dynamic psychological assessment"], "ans": 3, "why": "Dynamic assessment = evaluation → intervention → evaluation (the 'sandwich method'). It estimates learning potential, the zone of proximal development, rather than only current performance.", "hint": "Look at the order: test, teach, test again."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "Throughout an evaluation, the assessor and client work as partners, from deciding what questions to explore all the way to the final feedback. This is:", "opts": ["Remote assessment", "Actuarial assessment", "Collaborative psychological assessment", "Dynamic psychological assessment"], "ans": 2, "why": "Collaborative assessment = assessor and assessee as 'partners' from initial contact to final feedback. Therapeutic assessment goes further, emphasizing self-discovery and new understanding throughout the process.", "hint": "Assessor and client are equal partners."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Testing vs Assessment", "q": "A patient with panic disorder gets app prompts five times a day asking her to rate her anxiety and note where she is and what she's doing at that exact moment. This is:", "opts": ["Retrospective assessment", "Analogue study", "Ecological momentary assessment", "Psychological autopsy"], "ans": 2, "why": "Ecological momentary assessment = 'in the moment' evaluation of problems and related thoughts and behaviors at the very time and place they occur. Retrospective assessment looks back at a person's state at an earlier time.", "hint": "When and where is the information being collected?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Under the A/B/C classification of test user qualifications, an individually administered intelligence test or a projective test like the Rorschach is usually:", "opts": ["Level B, usable by any teacher", "Unclassified", "Level A, usable with just the manual", "Level C, requiring a Registered Psychologist"], "ans": 3, "why": "Level A = straightforward with the manual (e.g., achievement tests). Level B = needs psychometric knowledge (group intelligence tests, objective personality tests), typically RPm with supervision. Level C = highly specialized training (individual intelligence tests, projectives) = RPsy.", "hint": "Which tests need the most specialized training to interpret?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Under RA 10029, which task is within the role of a Registered Psychometrician?", "opts": ["Interpreting the Rorschach Inkblot Test", "Administering, scoring, and interpreting an objective/structured personality test like the 16PF", "Conducting psychotherapy", "Diagnosing a client with major depressive disorder"], "ans": 1, "why": "An RPm's role: administering and scoring objective and structured personality tests (excluding projective tests and other higher-level tests), interpreting those results and writing reports on them, and conducting preparatory intake interviews. Projectives, diagnosis, and psychotherapy belong to psychologists.", "hint": "RPms handle structured tests, not projectives or treatment."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Classification", "q": "Which pairing of test type and time orientation is correct?", "opts": ["Achievement predicts the future; aptitude measures past learning", "Aptitude tests rely only on content validity", "Intelligence measures only past learning", "Achievement measures past learning; aptitude predicts future potential"], "ans": 3, "why": "ACHIEVEMENT = prior/learned information (past-oriented, content validity). INTELLIGENCE = general mental ability (present-oriented). APTITUDE = potential for learning and performance (future-oriented, content AND criterion-related validity).", "hint": "Think past, present, and future."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Battery", "q": "A psychologist includes two different depression measures in a battery so that a second measure can strengthen her initial impression from the first. This is the battery's:", "opts": ["Comparative function", "Confirmatory function", "Complementary function", "Additive function"], "ans": 1, "why": "Confirmatory = two or more measures of the SAME domain to strengthen an impression. Additive = measuring DIFFERENT domains to broaden understanding. Complementary = measures of the same domain that yield different rather than confirming results.", "hint": "Same domain, and the goal is to back up a first impression."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Test Decisions", "q": "A government agency hires every applicant who meets the minimum qualifying score on its exam, without comparing applicants to one another. What type of decision is this?", "opts": ["Individual decision", "Comparative decision", "Absolute decision", "Institutional ranking decision"], "ans": 2, "why": "ABSOLUTE decisions look at who meets the minimum score needed to qualify. COMPARATIVE decisions compare people's scores to see who scored best. INDIVIDUAL decisions are made by test takers about themselves.", "hint": "Is anyone being ranked against anyone else?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Interviews", "q": "Clinicians in a hospital reach different diagnoses for the same patients because each uses vague, personal guidelines for including or excluding symptoms. A structured interview mainly reduces this source of error, called:", "opts": ["Error variance from test construction", "Criterion variance", "Information variance", "Observer drift"], "ans": 1, "why": "Criterion variance = error from vague guidelines for inclusion or exclusion in categories. Information variance = variability in the amount and type of information gathered from clients. Structured interviews reduce both.", "hint": "The problem is the rules for deciding, not the information collected."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Behavioral Assessment", "q": "A client trying to quit smoking is asked to record every cigarette in a log as it happens. Just from keeping the log, her smoking drops. This is the:", "opts": ["Hawthorne effect of analogue studies", "Halo effect", "Reactivity effect of self-monitoring", "Practice effect"], "ans": 2, "why": "Self-monitoring often produces REACTIVITY: the act of measuring your own behavior changes it, usually reducing undesirable behaviors or increasing adaptive ones.", "hint": "The act of recording changed the behavior."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Behavioral Assessment", "q": "A client with a spider phobia is asked to approach a caged spider in a clinic room while the clinician records how close she gets, her heart rate, and her distress ratings. This is a(n):", "opts": ["Situational interview", "Behavioral avoidance task in an analogue study", "Psychological autopsy", "Naturalistic observation"], "ans": 1, "why": "Analogue studies evaluate behavior in controlled, simulated settings that mirror real situations. A Behavioral Avoidance Task (BAT), approaching a feared stimulus under control, is a classic example. Naturalistic observation happens in real-world settings.", "hint": "A controlled, simulated situation with the feared object."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Computers in Testing", "q": "A computer-generated report combines the client's test results with data from other sources, such as interview notes and history, into one interpretive narrative. This is a(n):", "opts": ["Consultative report", "Simple scoring report", "Integrative report", "Extended scoring report"], "ans": 2, "why": "Simple scoring report = only lists scores. Extended scoring report = adds statistical analyses. Interpretive report = adds interpretive statements. Consultative report = written for professionals, with an expert opinion. INTEGRATIVE report = integrates data from sources OTHER than the test.", "hint": "Is the report using only test data, or other information too?"}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Clinical Judgment", "q": "Instead of relying on intuition, a forensic team decides a parolee's risk level using empirically demonstrated statistical rules applied to his records. This approach is:", "opts": ["Authoritative interpretation", "Actuarial assessment", "Collaborative assessment", "Intuitive interpretation"], "ans": 1, "why": "Actuarial assessment = applying empirically demonstrated statistical rules as the deciding factor in the assessor's judgment. The mechanical approach goes further, adding computer algorithms. Intuitive interpretation relies on feelings with no empirical basis.", "hint": "Statistical rules, not gut feeling."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Projective Tests", "q": "A client is given stems like 'My mother...' and 'I fear...' and asked to finish each sentence. In the classification of projective techniques, this is a(n):", "opts": ["Association technique", "Construction technique", "Expressive technique", "Completion technique"], "ans": 3, "why": "Projective techniques: Completion = finish a statement (sentence completion tests); Association = say the first thing that comes to mind (word association, Rorschach); Construction = make something from a stimulus (stories, as in the TAT); Expressive = express through creative means (drawing).", "hint": "The client finishes something that was started."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Assessment Tools", "q": "A design program wants evidence of an applicant's actual completed work and growth over time, while recognizing that selecting and rating the work can be subjective. Which method fits?", "opts": ["Portfolio review", "A single vocabulary score", "A brief symptom screener", "An interest checklist alone"], "ans": 0, "why": "A portfolio contains samples of abilities and accomplishments and can show work in context over time. An interest checklist concerns preferences rather than direct evidence of completed design work.", "hint": "The desired evidence is a collection of products the person has already created."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Clinical Assessment", "q": "After a client's illness, an assessor reviews school and employment records to estimate functioning before symptoms developed. What is the main value of those records here?", "opts": ["They help estimate premorbid functioning", "They replace the need to assess present functioning", "They establish a diagnosis from job titles alone", "They directly measure the client's current mood"], "ans": 0, "why": "Case-history information can help estimate performance before the illness or disability, providing context for current findings. Those historical records do not directly measure the client's present state. (Source: Ms. Chiqui's notes)", "hint": "Identify the period of functioning the assessor is trying to reconstruct."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Role-Play Assessment", "q": "A counselor asks a client to act out requesting help from a supervisor so the counselor can observe communication skills in a simulated situation. Which tool is this?", "opts": ["Role-play test", "Case-history review", "Interest inventory", "Naturalistic workplace observation"], "ans": 0, "why": "Role play samples behavior in an improvised or partly improvised simulated situation. Naturalistic observation would examine behavior in the actual setting rather than an enacted conversation.", "hint": "Consider whether the observed interaction is enacted or occurs naturally."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Interview Benefits", "q": "A client gives an unexpected answer, and the assessor asks follow-up questions to understand what the client means. Which interview advantage is being used?", "opts": ["Flexible clarification and depth", "Automatic elimination of interviewer bias", "Uniform question coverage across different examiners", "Fixed scoring without examiner judgment"], "ans": 0, "why": "Interviews allow clarification, flexible follow-up, and rich information. That flexibility does not automatically remove interviewer bias or guarantee standardized scoring.", "hint": "Focus on what becomes possible through a reciprocal conversation."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Observation Limits", "q": "An observer records that a student leaves her seat six times, then claims the count alone proves she feels anxious. Which limitation should be recognized?", "opts": ["Behavioral observation cannot record actions reliably under any conditions", "Observed actions do not by themselves establish the person's internal experience", "A behavior count is equivalent to a direct self-report of feelings", "Counting actions automatically identifies the psychological cause"], "ans": 1, "why": "Observation records actions and can identify behavioral patterns. Inferring an internal feeling from a count alone goes beyond the directly observed evidence and requires additional support.", "hint": "Separate the behavior recorded from the explanation assigned to it."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Computer Reports", "q": "A computer report provides scores plus statistical analyses of performance, but no narrative statements interpreting psychological meaning. Which report type best fits?", "opts": ["Interpretative report", "Integrative report", "Simple scoring report", "Extended scoring report"], "ans": 3, "why": "An extended scoring report adds statistical detail to the score listing. An interpretative report goes further by providing interpretive statements about what the results mean.", "hint": "Distinguish added numerical analysis from interpretation of psychological meaning."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Computer Reports", "q": "A printout merely lists a client's test and subtest scores, without additional statistical analysis or interpretive statements. Which report type is this?", "opts": ["Integrative report", "Extended scoring report", "Simple scoring report", "Consultative report"], "ans": 2, "why": "A simple scoring report is a listing of scores. An extended report contains additional statistical analysis, which is absent from this printout.", "hint": "Identify how much processing beyond a score list the report provides."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Computers in Assessment", "q": "Software helps an examiner score protocols and organize assessment data, but does not change the items presented to examinees. Which description best fits its role?", "opts": ["A projective technique", "Computer-assisted psychological assessment", "Computerized adaptive testing", "A test-intervene-retest procedure"], "ans": 1, "why": "CAPA refers to computer assistance to the test user, including assessment processing. Adaptive testing instead adjusts test content to the examinee's responses or ability.", "hint": "Identify whether the computer is supporting the examiner's work or tailoring the examinee's test."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Mental Status Examination", "q": "An emergency clinician needs a structured description of a patient's psychological functioning at the present encounter rather than a reconstruction of the entire life history. Which assessment is most directly relevant?", "opts": ["Career-interest profiling", "A lifetime achievement portfolio", "Mental status examination", "Retrospective case-history review alone"], "ans": 2, "why": "The mental status examination provides a cross-sectional view of current psychological functioning. Case history contributes background but does not by itself describe the person's present mental status.", "hint": "Match the time frame of the question with the time frame of the method."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Interview Standardization", "q": "Two interviewers use the same diagnostic rules but ask clients about very different sets of symptoms and life events. Which source of interview error is most directly implicated?", "opts": ["Information variance", "Scoring-key drift", "Norm-sample restriction", "Criterion variance"], "ans": 0, "why": "Information variance concerns differences in the amount and type of information obtained. Criterion variance concerns vague inclusion or exclusion rules, which are held constant here.", "hint": "The interviewers agree on the decision rules but do not collect the same information."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Behavioral Assessment", "q": "During a functional interview, a parent reports that a child's tantrum usually begins immediately after being asked to stop a game. In the ABC model, what does that request represent?", "opts": ["Consequence", "Antecedent", "Normative reference", "Behavior"], "ans": 1, "why": "An antecedent is an event occurring immediately before the target behavior. A consequence follows the behavior and may help maintain or reduce it, so the request is not the consequence in this sequence.", "hint": "Place the event before or after the target behavior."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Self-Report Assessment", "q": "A clinician wants the client's own account of private worries that others may not observe. What is a major benefit, with an accompanying limit, of using self-report?", "opts": ["It bypasses the client's perspective and measures behavior only", "It removes the need to consider misunderstanding or response style", "It accesses the client's perspective but depends on the accuracy and honesty of that account", "It guarantees that reports of private feelings are completely accurate"], "ans": 2, "why": "Self-report provides information directly from the person, including experiences others may not see. It remains possible for that information to be incomplete, mistaken, or deliberately distorted. (Source: Ms. Chiqui's notes)", "hint": "Consider both access to experience and the limits of reporting about oneself."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Multiple Informants", "q": "A parent describes a child as withdrawn at home, while a teacher reports active participation at school. What is the most useful initial interpretation of the differing reports?", "opts": ["One informant must be lying because descriptions differ", "They may reflect different contexts and perspectives that should be explored", "A numerical average alone resolves the contextual difference", "Both reports should be discarded without further inquiry"], "ans": 1, "why": "Informants can have different perspectives based on their interactions with the person. Differences should prompt examination of context rather than an automatic assumption that one report is dishonest. (Source: Ms. Chiqui's notes)", "hint": "Ask where and under what conditions each person observes the child."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Projective Methods", "q": "An assessor uses ambiguous material on the assumption that the way a person organizes it may reflect personal needs and tendencies. Which assumption underlies this method?", "opts": ["A diagnostic rule mapping each response to one disorder", "A direct ability test with one objectively correct response", "A factual-knowledge measure with ambiguous wording", "The projective hypothesis about supplying personal structure"], "ans": 3, "why": "The projective hypothesis proposes that a person supplies structure to ambiguous material in ways related to personality. It does not make every response a uniquely diagnostic sign or an objectively right-or-wrong answer. (Source: Ms. Chiqui's notes)", "hint": "Consider what the person contributes when the stimulus does not supply a clear structure."}, {"subj": "pa", "set": "Set 4 - Uses of Assessment Tools", "topic": "Assessment Approaches", "q": "A clinician emphasizes a client's unique pattern of personal
