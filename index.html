 with assessments mandated by law and decisional-capacity evaluations).", "hint": "Routine school activity falls under one of the three consent exceptions."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A client's employer calls and asks the psychometrician to email the client's raw and scaled scores on the personality test. What should she do?", "opts": ["Post the scores to the company's shared drive for transparency", "Send only the raw scores, since they're less sensitive", "Decline to release raw and scaled scores; share results only as agreed with the referral source and with proper consent", "Send the scores, since the employer paid for the assessment"], "ans": 2, "why": "The Code says 'We do not release test data in the forms of raw and scaled scores.' Results go only to those explicitly agreed upon with the referral source, and with written permission for self-referrals. Raw scores can be misinterpreted by untrained readers.", "hint": "What does the Code say about raw and scaled scores?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "To decide a student's special-class placement this year, a counselor plans to rely on an IQ score from a test the student took six years ago. What is the ethical concern?", "opts": ["It is fine as long as the test was standardized", "Old IQ scores are always more accurate", "She needs the parents' permission to read old records", "Interpretations and recommendations should not be based on outdated test results"], "ans": 3, "why": "We do not base interpretations, conclusions, and recommendations on OUTDATED test results, nor on OBSOLETE tests. Abilities and norms change (remember the Flynn effect), so a current assessment is needed.", "hint": "How current must test results be?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "To save money, a testing center makes photocopies of a published test booklet and answer sheet for a large group administration. Which standard does this violate?", "opts": ["Discuss the limits of confidentiality", "Explain results in non-technical language", "Avoid multiple relationships", "Use only original test materials, not photocopies"], "ans": 3, "why": "Under the Assessment Tools standard: 'We use only original copies of test materials (not photocopies).' Photocopying also violates test security and copyright.", "hint": "What kind of test materials should be used?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician is asked to assess her own cousin, who is applying to the company where she works. What is the most appropriate action?", "opts": ["Ask the cousin to sign a waiver and continue", "Avoid the multiple relationship by referring the assessment to a colleague", "Proceed but give slightly lower scores to stay objective", "Proceed, since she knows the cousin's background well"], "ans": 1, "why": "Refrain from a multiple relationship that could reasonably be expected to impair objectivity, competence, or effectiveness, or that risks exploitation or harm. Assessing a relative for a hiring decision is a clear conflict, so refer it out.", "hint": "Could her objectivity be questioned?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician notices a colleague leaving a client's test folder unattended on a café table. It appears to be a minor lapse, and no confidentiality would be violated by speaking up. What is the appropriate FIRST step?", "opts": ["Post about it on social media to warn others", "Bring it to the colleague's attention informally", "Immediately file a formal complaint with the PRC", "Ignore it since no harm has happened yet"], "ans": 1, "why": "Informal resolution: when appropriate, first bring the issue to the attention of the professional concerned, if informal resolution is sufficient and doesn't violate confidentiality. Formal reporting comes next if the issue isn't resolved or is serious.", "hint": "For a minor lapse, what's the gentlest step that could fix it?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "At the very start of a counseling intake, a psychometrician explains that what the client shares is confidential except where the law requires disclosure, such as serious risk of harm. Which ethical duty is she fulfilling?", "opts": ["Discussing the limitations of confidentiality", "Cooperating with an ethics committee", "Avoiding a multiple relationship", "Releasing test data"], "ans": 0, "why": "We have a duty to discuss the LIMITS of confidentiality with clients (due to laws, institutional rules, or professional relationships) and explain all anticipated uses of the information they disclose.", "hint": "Clients should know, from the start, when confidentiality can be broken."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A 12-year-old is referred for a psychoeducational assessment. Whose agreement is needed?", "opts": ["No agreement is needed for minors", "Only the child's verbal agreement", "Informed consent from the parent or guardian, plus the child's assent", "Only the teacher's signature"], "ans": 2, "why": "For minors or people legally incapable of consent, the parent, guardian, or legal representative gives informed consent and is told the limits of confidentiality. The child gives ASSENT, which respects their dignity and understanding.", "hint": "A minor can't give legal consent alone."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "After assessing a child, a psychologist meets with the parents to explain the results. How should the findings be communicated?", "opts": ["Only to the child's teacher", "In non-technical language the parents can understand", "Only in writing, with no discussion", "Using exact raw and scaled scores and statistical terms"], "ans": 1, "why": "When findings are explained to relatives, parents, or teachers, we explain them in NON-TECHNICAL language. Technical jargon and raw scores invite misunderstanding.", "hint": "Parents aren't psychologists."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "An HR clerk with no psychology background wants to give and interpret a personality test on her own because she 'read the manual.' What does the Code say?", "opts": ["Assessment tools should not be used by unqualified persons, except for training with adequate supervision", "She may use it since the manual is clear", "She may interpret it but not score it", "She may use it if the applicants agree"], "ans": 0, "why": "We do not promote the use of assessment tools and methods by unqualified persons, except for training purposes with adequate supervision. Protocols and records must also be kept secure from unqualified persons.", "hint": "Who is allowed to use assessment tools?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A client takes a timed online cognitive test from home. What does the Code specifically require the psychometrician to tell her beforehand?", "opts": ["How poor internet connectivity could affect her performance, especially on timed tests", "Nothing, since online tests don't need consent", "That she may look up answers online", "That online results are always more accurate"], "ans": 0, "why": "For online assessment, we inform test takers of the implications of poor internet connectivity on their performance, particularly for timed assessments. We also tell them about privacy risks in electronic transmission.", "hint": "Online testing has a specific technical risk to explain."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "RA 10029", "q": "Under RA 10029, a board examinee gets a weighted general average of 78% but scores 58% in one subject. What happens?", "opts": ["She passes because her weighted average is above 75%", "She fails and must retake all subjects", "She may retake that subject within two years and must score at least 75% in it to pass", "She passes as long as no subject is below 50%"], "ans": 2, "why": "To pass: a weighted general average of at least 75%, with NO subject below 60%. An examinee with WGA ≥ 75% but a subject below 60% may retake that subject within the next two years and must get at least 75% in it to be deemed passed.", "hint": "There are two rules: the overall average, and the minimum per subject."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Laws", "q": "A company's HR department plans to store applicants' psychological test results in a cloud folder that the whole office can access. Which Philippine law most directly governs how this personal information must be protected?", "opts": ["RA 9258, the Guidance and Counseling Act", "RA 11036, the Mental Health Act", "RA 7877, the Anti-Sexual Harassment Act", "RA 10173, the Data Privacy Act"], "ans": 3, "why": "RA 10173 (Data Privacy Act) governs the processing and protection of personal information. RA 11036 = Mental Health Act; RA 9258 = Guidance and Counseling Act; RA 7877 = Anti-Sexual Harassment Act; RA 10029 = Philippine Psychology Act.", "hint": "Which law is about personal information?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Laws", "q": "Which law aims to establish a comprehensive national mental health care system and integrate mental health promotion into schools, workplaces, and communities?", "opts": ["RA 11036 (Mental Health Act)", "RA 10029 (Philippine Psychology Act)", "RA 12080 (Basic Education Mental Health and Well-Being Promotion Act)", "RA 9165 (Comprehensive Dangerous Drugs Act)"], "ans": 0, "why": "RA 11036's objectives include strong mental health governance, a comprehensive national mental health care system, protecting the rights of people with psychiatric, neurologic, and psychosocial needs, and integrating mental health in schools, workplaces, and communities. RA 12080 is specific to basic education.", "hint": "It's about the national mental health care system."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychologist is angry at a rival and files an ethics complaint against her without checking facts that would clearly disprove the allegation. Which standard is being violated?", "opts": ["Cooperating with ethics committees", "Release of test data", "Improper complaints", "Informal resolution"], "ans": 2, "why": "Improper complaints: we refrain from filing ethical complaints with reckless disregard or willful ignorance of facts that would disprove the allegations, or without supporting factual evidence.", "hint": "Filing without checking the facts."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "Which ethical principle covers doing no harm, maximizing benefits, developing and maintaining competence, self-knowledge, and delivering services competently online (telepsychology)?", "opts": ["Principle IV: Professional and scientific responsibilities to society", "Principle III: Integrity", "Principle II: Competent caring for the well-being of persons and peoples", "Principle I: Respect for the dignity of persons and peoples"], "ans": 2, "why": "Principle II (Competent Caring) = working for clients' benefit and above all doing no harm, maximizing benefit and minimizing harm, competence, self-knowledge, and telepsychology. Principle I = dignity, diversity, informed consent, privacy. Principle III = honesty, avoiding conflicts of interest. Principle IV = responsibility to society.", "hint": "Doing no harm and competence belong to which principle?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician is offered a commission by a test publisher for every booklet her company buys, and she is the one who recommends which test the company should use. Which ethical principle is most at stake?", "opts": ["Competent caring", "Respect for the dignity of persons", "Integrity (avoiding conflicts of interest)", "Professional responsibilities to society"], "ans": 2, "why": "Principle III, Integrity, covers honesty, maximizing impartiality, not exploiting persons, and AVOIDING CONFLICTS OF INTEREST. A commission tied to her own recommendation creates a clear conflict of interest.", "hint": "Her personal gain could bias her recommendation."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A police officer asks a psychologist for a client's test results without the client's consent and without a court order. When may confidential information be disclosed WITHOUT the client's consent?", "opts": ["Only when disclosure is mandated or permitted by law", "Never, under any circumstance", "Whenever a person in authority asks for it", "Whenever the psychologist thinks it would help"], "ans": 0, "why": "The Code: disclose confidential information without the consent of the client or legal representative ONLY when mandated or permitted by law, and limit what is disclosed to what's needed for the purpose. An informal request from authority isn't enough.", "hint": "Who can authorize disclosure without the client's consent?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "During therapy, a client credibly tells his psychologist he plans to seriously harm a specific, identifiable person. The landmark case that established the clinician's duty in this situation is:", "opts": ["The ALI standard: criminal responsibility", "The Georgetown criteria: competency to stand trial", "Tarasoff v. Regents of the University of California: the duty to warn/protect the intended victim", "RA 7877: sexual harassment"], "ans": 2, "why": "Tarasoff (1974/1976) established the DUTY TO WARN: when a client poses a serious danger to an identifiable person, confidentiality can be overridden to protect them. It's a classic limit of confidentiality that clients should be told about at the start. (Source: Ms. Chiqui's notes)", "hint": "A specific, identifiable person is in danger."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A court issues an order requiring a psychologist to submit a client's raw test protocols and scores. Normally raw data isn't released. What does the PAP Code allow here?", "opts": ["Raw data may be given to anyone who asks politely", "The psychologist should destroy the data to protect the client", "Raw data can never be released under any circumstance", "Raw and scaled scores may be released when regulated by the court"], "ans": 3, "why": "The Code: do not release test data as raw and scaled scores, client responses, or notes about the client's behavior during testing, UNLESS regulated by the court. Destroying data would itself be a violation. (Source: PAP Code of Ethics, Ms. Chiqui's folder)", "hint": "The rule against releasing raw data has one stated exception."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A company director orders the in-house psychometrician to release applicants' individual test answers to line managers, which would violate the Code of Ethics. According to the Code's hierarchy for resolving such conflicts, what should she do?", "opts": ["Quit immediately without saying anything", "Make her commitment to the Code known and resolve the conflict in line with the Code (Law > Ethics > Organization)", "Follow the director because the organization comes first", "Release the data but ask managers to keep it secret"], "ans": 1, "why": "When the Code conflicts with organizational demands, we make our commitment to the Code known and resolve the conflict accordingly. The priority is LAW > ETHICS > ORGANIZATION. When the Code conflicts with the LAW, we try to resolve it first, but adhere to the law if it can't be resolved. (Source: PAP Code of Ethics, Ms. Chiqui's folder)", "hint": "Recall the priority order of law, ethics, and the organization."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychologist learns that a colleague is using an obsolete IQ test to make special-education placement decisions that are likely to seriously harm several children. Informal discussion didn't stop it. What is the appropriate next step?", "opts": ["Report the violation to the appropriate institutional authorities", "Secretly change the colleague's reports", "Do nothing, since she already spoke to the colleague", "Post about the colleague online"], "ans": 0, "why": "Informal resolution comes first. But when there is likely to be SUBSTANTIAL HARM, or informal resolution fails, we take further action and report the violation to appropriate institutional authorities, unless doing so would violate confidentiality rights.", "hint": "Informal resolution was tried and the harm is serious."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician finds that a test's norms are 25 years old and the client differs from the norm group in language and culture. She still decides to report the results. What does the Code require her to do in the report?", "opts": ["Indicate her reservations about the interpretation, considering the test's validity, reliability, and appropriateness", "Leave out the scores but keep the conclusions", "Report the scores as completely accurate", "Adjust the scores upward to be fair"], "ans": 0, "why": "Under no circumstances should we report results without considering the validity, reliability, and appropriateness of the test, and we must indicate reservations about the interpretations. Ideally, outdated tests shouldn't be the basis of conclusions at all. (Source: PAP Code of Ethics, Ms. Chiqui's folder)", "hint": "The Code wants honesty about the test's limits."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Third-Party Referrals", "q": "An employer commissions an assessment but the employee expects private counseling. What should the psychologist clarify before proceeding?", "opts": ["Promise counseling confidentiality before resolving the purpose of the referral", "Defer discussion of recipients and uses until the completed report is delivered", "Clarify roles, client identity, intended uses, and confidentiality with those involved", "Accept the employer's instructions as a substitute for explaining the service"], "ans": 2, "why": "Third-party requests require clarification of roles, client identity, uses of information, and confidentiality limits. The commissioning organization does not replace the need to clarify these matters with the people involved. (Source: Ms. Chiqui's notes)", "hint": "Compare what each party believes the professional is being asked to do."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Consent Exceptions", "q": "An assessment's specific purpose is to determine an individual's decisional capacity. Under the PAP assessment standard, how is prior informed consent treated?", "opts": ["The exception automatically permits public release of all findings", "Prior informed consent is required without exception even to assess capacity", "This purpose is a listed exception to the usual prior-consent requirement", "The exception permits any unrelated testing without further safeguards"], "ans": 2, "why": "Assessing decisional capacity is one of the listed exceptions to prior informed consent. That limited exception does not remove duties concerning welfare, appropriate assessment, or confidentiality. (Source: Ms. Chiqui's notes)", "hint": "Distinguish an exception for a particular assessment purpose from removal of all ethical duties."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Mandated Assessments", "q": "A court-mandated assessment falls within a consent exception. What should the psychologist still explain to the examinee before proceeding?", "opts": ["The nature of the services and the relevant limits of confidentiality", "That the examinee will receive no information about the assessment process", "That the court order makes all professional safeguards unnecessary", "That confidentiality is unlimited because the court requested the service"], "ans": 0, "why": "The Code still requires explaining the nature of court-ordered services and confidentiality limits. An exception to obtaining consent is not an exception to informing the person about those matters. (Source: Ms. Chiqui's notes)", "hint": "Identify which information duties remain even when participation is mandated."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Meaningful Consent", "q": "A competent adult signs a consent form written in technical language she cannot understand. What should the assessor do before treating this as adequately informed consent?", "opts": ["Explain the service in understandable language and check that she understands", "Ask a coworker to sign in place of the competent adult", "Rely on the signature alone as proof that every term was understood", "Skip explanation because the form is professionally worded"], "ans": 0, "why": "Consent information must be reasonably understandable to the person receiving the service. A signature does not compensate for an explanation the client cannot understand. (Source: Ms. Chiqui's notes)", "hint": "Ask whether the person has the information needed to make the choice, not just whether a form is complete."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Recording", "q": "An examiner wants to record a client's assessment interview for later review. What must be addressed before recording?", "opts": ["Obtain consent and explain the anticipated uses of the recording", "Begin recording secretly so behavior remains natural", "Wait until after sharing the recording to discuss its purpose", "Assume consent to assessment automatically permits every recording use"], "ans": 0, "why": "Recording voices or images requires consent and explanation of anticipated uses. General participation in assessment does not automatically authorize every use of a recording. (Source: Ms. Chiqui's notes)", "hint": "Consider whether agreeing to a service also settled how a new record of it will be used."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Professional Consultation", "q": "A psychologist seeks case advice from a colleague. The advice can be obtained without naming the client or revealing identifying details. What should she share?", "opts": ["The full identifying file provided the colleague promises not to copy it", "Only relevant information, without unnecessary identifying details", "The full identifying file because the colleague is also a psychologist", "Identifying case details in a shared meeting without checking their necessity"], "ans": 1, "why": "Consultation should avoid identifying the client unless permitted or unavoidable and should disclose only what is needed. A colleague's professional status alone does not justify unnecessary identifiable disclosure. (Source: Ms. Chiqui's notes)", "hint": "Ask which details are actually needed for the consultation to help."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Confidential Records", "q": "Assessment records are entered into a database accessible to several staff roles. Which arrangement best protects confidentiality?", "opts": ["Separate the folder but retain unrestricted shared login credentials", "Rely on confidentiality agreements while giving every employee full access", "Protect paper protocols while leaving matching digital copies generally accessible", "Use appropriate access controls and protective coding for identifying information"], "ans": 3, "why": "The Code calls for confidentiality protections such as codes, passwords, and other safeguards when records enter shared databases. Convenience does not justify unrestricted access to identifiable client information. (Source: Ms. Chiqui's notes)", "hint": "Match access to legitimate duties rather than mere employment in the organization."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Records and Fees", "q": "Records are requested and needed for a client's emergency treatment, but the client has an unpaid assessment bill. May the practitioner withhold those records solely for nonpayment?", "opts": ["Yes; payment always takes priority over emergency access", "No; the unpaid bill alone does not justify withholding emergency-treatment records", "No; an emergency therefore permits unrestricted disclosure of all client records", "Yes; records may be withheld until all future services are prepaid"], "ans": 1, "why": "The Code prohibits withholding records needed for emergency treatment solely because payment has not been received. This does not make the records public or remove ordinary confidentiality safeguards. (Source: Ms. Chiqui's notes)", "hint": "Keep the urgent need for treatment separate from the ordinary billing dispute."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Professional Functioning", "q": "A practitioner recognizes that serious personal distress is interfering with careful scoring and judgment. What is the appropriate ethical response?", "opts": ["Continue unchanged because professional status prevents impaired judgment", "Hide the difficulty and ask clients to accept possible scoring errors", "Seek appropriate help or consultation and consider limiting affected duties", "Shorten appointments without checking whether scoring and judgment improve"], "ans": 2, "why": "Personal problems that interfere with competent work require appropriate measures, which can include help and limits on duties. A license does not eliminate the need to respond when current functioning affects clients. (Source: Ms. Chiqui's notes)", "hint": "Focus on the practitioner's ability to provide competent service at the present time."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Delegation", "q": "An assessor delegates a scoring task to an assistant. Which safeguard is required rather than assuming delegation transfers all professional responsibility?", "opts": ["Assume any scoring error becomes only the assistant's responsibility", "Avoid informing the client about delegated work", "Assign work the assistant can perform competently and check that it is done competently", "Choose the assistant solely because she is available that day"], "ans": 2, "why": "Delegation requires matching tasks to competence and taking steps to ensure competent performance; the notes also require informing the client. Delegating a task is not a reason to ignore the assistant's qualifications or work quality. (Source: Ms. Chiqui's notes)", "hint": "Consider what the delegating professional must establish about the person and the work."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Supervised Training", "q": "A trainee practices an assessment procedure in a controlled training activity under adequate qualified supervision. How does the PAP standard distinguish this from independent testing by an unqualified person?", "opts": ["Adequately supervised training is a specified exception to the general restriction", "Training removes all duties concerning test security", "Being enrolled in a course alone establishes independent professional competence", "Any trainee may therefore independently assess clients outside supervision"], "ans": 0, "why": "The restriction on promoting assessment by unqualified persons includes an exception for training with adequate supervision. That exception does not authorize unsupervised independent practice or remove security duties. (Source: Ms. Chiqui's notes)", "hint": "Identify the condition that makes the training exception limited."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Competence", "q": "A licensed practitioner plans to offer a specialized assessment method she has never been trained to use. What is the appropriate response before providing that service independently?", "opts": ["Assume a license confers competence in every assessment procedure", "Obtain relevant training or supervision and refer when competence is insufficient", "Use the method immediately if the publisher's website is persuasive", "Rely on confidence in her general interviewing style as sufficient preparation"], "ans": 1, "why": "Competence depends on relevant education, training, supervised experience, consultation, and professional knowledge. General licensure does not by itself establish competence in every specialized method. (Source: Ms. Chiqui's notes)", "hint": "Distinguish permission to practice a profession from preparation for a particular procedure."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Limits of Opinions", "q": "An assessor is asked to review existing reports about a person without conducting a direct examination. If offering an opinion, what must be made clear?", "opts": ["That a firm diagnosis is required regardless of the available information", "That no limitation needs disclosure if the assessor is experienced", "That reviewing any prior report is equivalent to examining the person", "The information used and the limitations of an opinion without examination"], "ans": 3, "why": "Record-based opinions must explain their basis and limitations when no examination was conducted. Professional experience does not turn indirect information into a direct assessment. (Source: Ms. Chiqui's notes)", "hint": "Tell the reader what the available evidence can and cannot support."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Misrepresentation", "q": "A school advertises that a psychologist's report guarantees a pupil will succeed, although the report makes no such claim. What should the psychologist do after learning of this?", "opts": ["Ignore the statement because the school wrote the advertisement", "Change the original report to match the school's unsupported claim", "Take reasonable steps to correct or minimize the misrepresentation", "Treat the exaggeration as acceptable because it promotes the service"], "ans": 2, "why": "The Code calls for appropriate reasonable steps when a professional's work is misused or misrepresented. Another organization's authorship of the statement does not remove that responsibility once the misuse is known. (Source: Ms. Chiqui's notes)", "hint": "Consider the professional's responsibility after discovering how the work is being presented."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Accurate Public Claims", "q": "A testing service advertises that one brief inventory can diagnose every psychological disorder with complete certainty. Which ethical concern most directly applies?", "opts": ["A valid claim whenever the inventory produces numerical scores", "A confidentiality violation solely because the test is named", "A permitted simplification because it is used only in advertising", "An exaggerated and scientifically unsupported public claim"], "ans": 3, "why": "Public announcements should be scientifically acceptable and factually informative without exaggeration. Producing numerical scores does not justify claims of universal diagnosis or certainty. (Source: Ms. Chiqui's notes)", "hint": "Evaluate whether the claimed capability is supported rather than merely marketable."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Test Security", "q": "An assessor wants to post a photograph of a secure test page and its answer key in a public study group. What is the most appropriate response?", "opts": ["Post it because a study group counts as qualified test access", "Assume digital sharing is exempt from handling restrictions", "Protect the secure content and use nonsecure teaching examples instead", "Cover the publisher's name while leaving the items and key visible"], "ans": 2, "why": "Test materials and records must be protected from unqualified access. A public educational purpose or hidden publisher name does not make exposure of secure items and keys appropriate. (Source: Ms. Chiqui's notes)", "hint": "Consider who can access the material after it is posted."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Fair Ethical Procedures", "q": "A training center denies an otherwise qualified applicant solely because she filed an ethics complaint, without any adverse finding about her conduct. Which standard is implicated?", "opts": ["Allowing retaliation until an ethics proceeding has ended", "Avoiding unfair discrimination against complainants and respondents", "Requiring every complainant to surrender training opportunities", "Treating filing a complaint as proof of professional misconduct"], "ans": 1, "why": "The Code prohibits denying opportunities solely on the basis of being a complainant or respondent. Appropriate action based on the outcome of proceedings is different from retaliation for participation in the process. (Source: Ms. Chiqui's notes)", "hint": "Distinguish participating in a complaint process from an established finding about conduct."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Multiple Relationships", "q": "In a small community, an assessor discovers an additional social connection with a client. What should guide the response rather than assuming either that every connection is harmless or that every overlap is identical?", "opts": ["Let the social relationship determine the client's test interpretation", "Evaluate risks to objectivity, competence, exploitation, or harm and manage the situation appropriately", "Continue without considering the connection because social ties never affect assessment", "End all services automatically without considering the client's needs or transfer arrangements"], "ans": 1, "why": "The concern is whether overlapping roles impair professional functioning or create exploitation or harm. When an unforeseen harmful overlap arises, it should be resolved with attention to the person's interests and the Code. (Source: Ms. Chiqui's notes)", "hint": "Assess the effect of the overlap on the professional role and the person being served."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Continuity and Records", "q": "An assessment practitioner plans to retire while several clients may need their records for continuing services. What should be arranged in advance?", "opts": ["Unrestricted distribution of records to all local practitioners", "Automatic deletion of every record on the retirement date", "An appropriate record-transfer plan that protects confidentiality", "Indefinite personal retention without any continuity arrangement"], "ans": 2, "why": "Anticipated retirement or withdrawal calls for advance plans for appropriate transfer and confidentiality of records. Simply deleting files or distributing them indiscriminately does not protect continuity and privacy. (Source: Ms. Chiqui's notes)", "hint": "Consider both future access for legitimate care and protection from unnecessary disclosure."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Self-Referral Reports", "q": "A self-referred adult wants an appropriate summary report sent to a designated school office. What should the practitioner obtain before that agreed release of results?", "opts": ["A teacher's statement that all assessment information is public", "Only the school's informal request for the report", "The client's written permission for the release", "Automatic permission inferred from payment of the assessment fee"], "ans": 2, "why": "The PAP provisions specify written permission for release of results in a self-referral. Permission to provide an appropriate report does not make raw responses or secure test materials generally releasable. (Source: Ms. Chiqui's notes)", "hint": "Separate consent to receive an assessment from authorization to send its findings to someone else."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Integrity in Reporting", "q": "A client asks the assessor to alter a score in a scholarship report because the true result may reduce her chances. Which response is ethically appropriate?", "opts": ["Raise the score if the client accepts responsibility for the alteration", "Use the client's financial need as a replacement for the assessment evidence", "Report accurately and explain that findings cannot be changed to secure a desired outcome", "Change only the written interpretation so it implies a score not obtained"], "ans": 2, "why": "Integrity requires honesty and accurate professional work grounded in appropriate knowledge. Wanting a beneficial outcome does not justify falsifying a score or making the report imply unsupported findings. (Source: Ms. Chiqui's notes)", "hint": "Distinguish advocating appropriately for a client from changing the evidence."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Automated Interpretations", "q": "An automated report makes a strong conclusion that does not fit the client's referral or testing conditions. What should the examiner do before adopting that conclusion?", "opts": ["Treat the software's conclusion as more valid merely because it is detailed", "Evaluate its appropriateness and limitations against the actual assessment evidence", "Omit the testing conditions so the automated interpretation appears consistent", "Accept it because computer-generated text does not need professional review"], "ans": 1, "why": "Interpretation must consider purpose and other relevant factors; computer assistance does not establish that a conclusion fits the case. A detailed automated narrative still needs professional evaluation against the obtained evidence.", "hint": "Ask whether the conclusion is supported for this client, not how polished the report appears."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Minimum Relevant Disclosure", "q": "A school needs assessment findings to plan learning support, but a draft report includes unrelated intimate family details. Which revision best follows the privacy standard?", "opts": ["Replace the relevant findings with the entire interview transcript", "Release unrelated details if they were mentioned during testing", "Include every detail because a longer report is more professional", "Limit the report to information relevant to the communication's purpose"], "ans": 3, "why": "Written and oral reports should disclose information relevant to their purpose. The fact that information was obtained in assessment does not by itself make it necessary for a school's learning-support decision. (Source: Ms. Chiqui's notes)", "hint": "Link each disclosed detail to the decision the recipient actually needs to make."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethical Principles", "q": "A professional association teaches the public responsible uses of assessment and trains members to prevent misuse of psychological knowledge. Which PAP principle most directly addresses this profession-wide responsibility?", "opts": ["Competent caring for the well-being of persons and peoples", "Respect for the dignity of persons and peoples", "Professional and scientific responsibilities to society", "Integrity"], "ans": 2, "why": "Principle IV includes beneficial use of psychological knowledge, protection against misuse, and ethical training of the profession. Competence in one protocol is important but does not capture the broader profession-wide responsibility described. (Source: Ms. Chiqui's notes)", "hint": "Consider who is responsible for improving the discipline's use of assessment over time."}], "flashcards": [{"subj": "io", "t": "Unity of command", "d": "Each subordinate answers to only ONE superior (part of the scalar principle)"}, {"subj": "io", "t": "Scalar principle", "d": "Chain of command; vertical growth of the organization through added levels"}, {"subj": "io", "t": "Functional principle", "d": "Division of labor into units doing similar functions; horizontal growth"}, {"subj": "io", "t": "Line vs. staff functions", "d": "Line = directly meets major goals; Staff = supports the line"}, {"subj": "io", "t": "Span of control", "d": "Number of subordinates one manager supervises (Urwick: about 5–6 is optimal)"}, {"subj": "io", "t": "Scientific Management", "d": "Frederick Taylor; time studies to find the \"one best way\"; scientific selection and training"}, {"subj": "io", "t": "Bureaucracy", "d": "Max Weber; hierarchy, formal rules, division of labor, impersonality, merit, written records"}, {"subj": "io", "t": "Administrative Theory", "d": "Henri Fayol; what managers do: Plan, Organize, Command, Coordinate, Control; 14 principles"}, {"subj": "io", "t": "Esprit de corps", "d": "Fayol principle: sense of belonging and team spirit within the organization"}, {"subj": "io", "t": "Hawthorne effect", "d": "Elton Mayo; people change behavior because they know they're being observed"}, {"subj": "io", "t": "Chester Barnard", "d": "Organizations are cooperative systems; authority depends on subordinates' acceptance"}, {"subj": "io", "t": "Herbert Simon", "d": "Bounded rationality; managers SATISFICE (choose \"good enough\"), not optimize"}, {"subj": "io", "t": "Chris Argyris", "d": "Growth perspective; healthy organizations help people grow from passive to active"}, {"subj": "io", "t": "Theory X", "d": "McGregor; assumes workers are lazy and avoid work, so management is controlling/authoritarian"}, {"subj": "io", "t": "Theory Y", "d": "McGregor; assumes workers are self-motivated and seek responsibility, so management is participative"}, {"subj": "io", "t": "Self-fulfilling prophecy", "d": "Employees come to act the way managers expect them to act"}, {"subj": "io", "t": "Contingency theory", "d": "\"It depends\": no one best way to organize or lead"}, {"subj": "io", "t": "Joan Woodward", "d": "Contingency model based on TECHNOLOGY (unit/small-batch, mass, continuous-process)"}, {"subj": "io", "t": "Lawrence and Lorsch", "d": "Contingency model based on ENVIRONMENT; differentiation and integration"}, {"subj": "io", "t": "Open systems (Katz and Kahn)", "d": "Organizations exchange inputs → throughput → outputs with the environment"}, {"subj": "io", "t": "Equifinality", "d": "Same end state reached from different starting points and paths"}, {"subj": "io", "t": "Negative entropy (negentropy)", "d": "Importing more energy and resources than spent, to avoid decay"}, {"subj": "io", "t": "Maslow's hierarchy", "d": "Physiological → Safety → Love/Belonging → Esteem → Self-actualization; first 4 = D-needs, top = B-need"}, {"subj": "io", "t": "Herzberg hygiene factors", "d": "Salary, working conditions, policies; prevent DISsatisfaction but don't motivate"}, {"subj": "io", "t": "Herzberg motivators", "d": "Achievement, recognition, the work itself, responsibility, growth; create motivation"}, {"subj": "io", "t": "McClelland's needs", "d": "Achievement, Affiliation, Power (learned/acquired needs)"}, {"subj": "io", "t": "Leadership motive pattern", "d": "High need for power + low need for affiliation (linked to effective leaders)"}, {"subj": "io", "t": "Alderfer's ERG", "d": "Existence, Relatedness, Growth; steps can be skipped; frustration-regression"}, {"subj": "io", "t": "Frustration-regression", "d": "ERG: when a higher need is blocked, the person falls back to a lower need"}, {"subj": "io", "t": "Equity theory", "d": "J. Stacey Adams; compare your outcome/input ratio to a referent's"}, {"subj": "io", "t": "Underpayment inequity", "d": "Getting less than you deserve compared with others → often reduce inputs"}, {"subj": "io", "t": "Expectancy (VIE)", "d": "Vroom; Expectancy (effort → performance), Instrumentality (performance → reward), Valence (value of reward)"}, {"subj": "io", "t": "Goal-setting theory", "d": "Edwin Locke; specific, challenging goals plus commitment → higher performance"}, {"subj": "io", "t": "Self-efficacy", "d": "Bandura; belief in your own ability to succeed at a specific task"}, {"subj": "io", "t": "Self-Determination Theory", "d": "Needs for Autonomy, Competence, Relatedness"}, {"subj": "io", "t": "Four-Drive Theory", "d": "Drives to Acquire, Bond, Comprehend, Defend"}, {"subj": "io", "t": "MARS model", "d": "Performance = Motivation, Ability, Role perceptions, Situational factors"}, {"subj": "io", "t": "Distributive justice", "d": "Fairness of the OUTCOME/decision itself"}, {"subj": "io", "t": "Procedural justice", "d": "Fairness of the PROCESS used to reach the decision"}, {"subj": "io", "t": "Galatea effect", "d": "Your OWN high self-expectations raise your performance"}, {"subj": "io", "t": "Pygmalion (Rosenthal) effect", "d": "A SUPERIOR's high expectations raise a subordinate's performance"}, {"subj": "io", "t": "Golem effect", "d": "Others' LOW expectations lower performance"}, {"subj": "io", "t": "Premack Principle", "d": "A preferred activity can reinforce a less-preferred one"}, {"subj": "io", "t": "Fixed vs. variable ratio", "d": "Reward after a set vs. unpredictable NUMBER of responses"}, {"subj": "io", "t": "Fixed vs. variable interval", "d": "Reward after a set vs. unpredictable amount of TIME"}, {"subj": "io", "t": "Gain sharing", "d": "Group bonus tied to improvements in productivity/performance"}, {"subj": "io", "t": "Profit sharing", "d": "Employees get a percentage of company profits above a set amount"}, {"subj": "io", "t": "Merit pay", "d": "Incentives based on performance APPRAISAL scores"}, {"subj": "io", "t": "Great Man theory", "d": "Leaders are born, not made"}, {"subj": "io", "t": "Lewin's leadership styles", "d": "Autocratic, Democratic (participative), Laissez-faire (delegative)"}, {"subj": "io", "t": "Fiedler's contingency model", "d": "Effectiveness = leader style (task vs. relationship, LPC) × situation favorableness"}, {"subj": "io", "t": "Fiedler: when is task-oriented best?", "d": "In VERY favorable or VERY unfavorable situations (relationship-oriented = moderate)"}, {"subj": "io", "t": "Fiedler's situational factors", "d": "Leader-member relations, task str /* ---------- bonus PA math: computed at round creation, never added to the bank ---------- */
const GENERATORS = [
  ["zT",1],["Tz",1],["zIQ",1],["IQz",1],["zStanine",1],["stanineZ",1],["percentile",1],
  ["sem",1],["cvr",1],["sb",1],["r2",2],["alienation",2],["dfFit",2],["dfInd",2],
  ["bonferroni",2],["pairs",2],["difficulty",3],["discrimination",3],["optimal",3],["selection",5]
].map(([id,set]) => ({id,set}));
const int = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const dec = (n, places = 2) => Number(n.toFixed(places)).toString();
const difficultyBand = p => p < .2 ? "Very difficult" : p < .4 ? "Difficult" : p <= .6 ? "Average" : p < .8 ? "Easy" : "Very easy";
const discriminationBand = d => d < 0 ? "Negative: check the key" : d < .2 ? "Poor" : d < .3 ? "Marginal" : d < .4 ? "Good" : "Very good";
function generate(id){
  const g = GENERATORS.find(g => g.id === id), set = Object.keys(DATA.tos.pa).find(s => s.startsWith(`Set ${g.set} -`));
  let q, answer, wrong, why, hint = "Write the formula first and identify the denominator.";
  const z = shuffle([-2,-1,1,2])[0];
  if (["zT","Tz","zIQ","IQz","zStanine","stanineZ"].includes(id)) {
    const type = id.includes("T") ? "T" : id.includes("IQ") ? "deviation IQ" : "stanine";
    const mean = type === "T" ? 50 : type === "deviation IQ" ? 100 : 5, sd = type === "T" ? 10 : type === "deviation IQ" ? 15 : 2;
    const forward = id.startsWith("z"), value = mean + sd * z;
    q = forward ? `A student has z = ${z}. On a ${type} scale (mean ${mean}, SD ${sd}), what is the converted score?${type === "stanine" ? " Use rounded 5 + 2z, bounded from 1 to 9." : ""}`
      : `A student has ${type} = ${value} (scale mean ${mean}, SD ${sd}). What is the corresponding z score?${type === "stanine" ? " Use the approximate linear conversion." : ""}`;
    answer = dec(forward ? value : z);
    wrong = (forward ? [mean + z, sd * z, mean - sd * z, mean + sd / z, mean + sd + z] : [value / sd, value - mean, (mean - value) / sd, (value + mean) / sd, value / mean]).map(x => dec(x));
    why = forward ? `Score = mean + SD × z = ${mean} + ${sd} × (${z}) = ${value}. Do not omit the mean or use z as the raw score.`
      : `z = (score − mean) / SD = (${value} − ${mean}) / ${sd} = ${z}. Dividing the raw score by SD omits centering.`;
    hint = "How many scale SDs above or below the mean does this score represent?";
  } else if (id === "percentile") {
    const table = {"-2":2.28,"-1":15.87,"1":84.13,"2":97.72};
    q = `In a normal distribution, z = ${z} corresponds approximately to which percentile (percentage below the score)?`;
    answer = `${table[z]}%`; wrong = [100-table[z],68.27,95.45,50,34.13].map(x => `${dec(x)}%`);
    why = `The standard normal cumulative area below z = ${z} is about ${table[z]}%. The area between ±1 or ±2 SD is not the percentile of one boundary.`;
    hint = "A percentile is the area to the left, not the area between two boundaries.";
  } else if (id === "sem") {
    const sd = int(5,12), k = int(2,5), r = 1 - 1 / (k*k), x = int(60,110), level = int(0,1) ? 95 : 68, m = level === 95 ? 2 : 1;
    const band = width => `${dec(x-width)} to ${dec(x+width)}`;
    q = `Observed score = ${x}, SD = ${sd}, reliability = ${dec(r,4)}. What is the approximate ${level}% confidence interval? Use SEM = SD√(1−r) and ${m === 2 ? "±2 SEM for 95%" : "±1 SEM for 68%"}. Round endpoints to 2 decimals.`;
    // Keep r exact to the displayed precision when k=3 (recurring decimal).
    const exactSEM = sd * Math.sqrt(1-Number(dec(r,4)));
    answer = band(m * exactSEM); wrong = [m === 2 ? exactSEM : 2*exactSEM, m*sd*(1-Number(dec(r,4))), m*sd, m*sd*Math.sqrt(Number(dec(r,4))), exactSEM/2].map(band);
    why = `SEM = ${sd}√(1−${dec(r,4)}) = ${dec(exactSEM,4)}. Apply ±${m} SEM: ${answer}. Using SD directly ignores reliability; 95% here explicitly uses the ±2 approximation.`;
    hint = "First find SEM, then apply the multiplier stated for this confidence level.";
  } else if (id === "cvr") {
    const n = int(10,20), e = int(Math.ceil(n*.6),n-1);
    q = `${e} of ${n} experts rate an item essential. What is Lawshe's CVR? Round to 2 decimals.`;
    answer = dec((e-n/2)/(n/2)); wrong = [e/n,(e-n/2)/n,(n-e)/n,2*e/n,(e-n)/n].map(x => dec(x));
    why = `CVR = (ne − N/2) / (N/2) = (${e} − ${n/2}) / ${n/2} = ${answer}. The proportion essential (${dec(e/n)}) is not CVR.`;
  } else if (id === "sb") {
    const r = int(3,8)/10;
    q = `Two equal test halves correlate r = ${r}. What is the Spearman–Brown estimate of full-test reliability? Round to 2 decimals.`;
    answer = dec(2*r/(1+r)); wrong = [r,r*r,2*r,2*r/(1-r),r/(1+r)].map(x => dec(x));
    why = `Full-test reliability = 2r / (1+r) = ${2*r} / ${dec(1+r)} = ${answer}. The half-test correlation alone underestimates full-test reliability.`;
  } else if (id === "r2" || id === "alienation") {
    const r = int(3,9)/10, alien = id === "alienation";
    q = `Two measures correlate r = ${r}. What is ${alien ? "the coefficient of alienation, √(1−r²) (not the unexplained-variance proportion)" : "the coefficient of determination, r²"}? Round to 2 decimals.`;
    answer = dec(alien ? Math.sqrt(1-r*r) : r*r);
    wrong = [r,1-r*r,1-r,Math.sqrt(r),alien ? r*r : Math.sqrt(1-r*r)].map(x => dec(x));
    why = alien ? `Alienation = √(1−${r}²) = √${dec(1-r*r)} = ${answer}. The unexplained-variance proportion is 1−r², before taking the square root.` : `r² = ${r} × ${r} = ${answer}. The correlation itself is not the proportion of variance explained.`;
    hint = "Distinguish r, r squared, and the square root of unexplained variance.";
  } else if (id === "dfFit" || id === "dfInd") {
    const rows = int(2,5), cols = int(3,7), fit = id === "dfFit";
    q = fit ? `A chi-square goodness-of-fit test compares ${cols} categories against fully specified probabilities; no parameters are estimated. What is df?`
      : `A chi-square test of independence uses a ${rows} × ${cols} contingency table. What is df?`;
    answer = String(fit ? cols-1 : (rows-1)*(cols-1));
    wrong = (fit ? [cols,cols-2,cols+1,cols*2,cols*cols] : [rows*cols,rows+cols-2,rows*cols-1,(rows-1)*cols,rows*(cols-1),rows+cols]).map(String);
    why = fit ? `With no estimated parameters, df = k−1 = ${cols}−1 = ${answer}. Estimating distribution parameters would require additional subtraction.`
      : `df = (rows−1)(columns−1) = (${rows}−1)(${cols}−1) = ${answer}. Subtracting one from the total number of cells is incorrect.`;
  } else if (id === "bonferroni") {
    const n = int(2,10), alpha = .05;
    q = `A researcher plans ${n} comparisons and wants familywise α = 0.05. What is Bonferroni's per-comparison α? Round to 4 decimals.`;
    answer = dec(alpha/n,4); wrong = [alpha,alpha*n,alpha/(n-1),1-alpha/n,alpha/(n+1)].map(x => dec(x,4));
    why = `Per-comparison α = familywise α / number of tests = 0.05 / ${n} = ${answer}. Multiplying increases rather than controls the error allowance.`;
  } else if (id === "pairs") {
    const n = int(5,14);
    q = `A psychologist compares every pair of ${n} stimuli once. How many unique unordered pairs are needed?`;
    answer = String(n*(n-1)/2); wrong = [n*(n-1),n*n,n*(n+1)/2,n-1,n*2].map(String);
    why = `Pairs = n(n−1)/2 = ${n}(${n-1})/2 = ${answer}. Without dividing by 2, each pair is counted twice.`;
  } else if (id === "difficulty") {
    const n = int(4,10)*10, correct = int(1,n-1), p = correct/n;
    q = `${correct} of ${n} students answer correctly. Find item difficulty p and its band. Use <.20 very difficult; .20–<.40 difficult; .40–.60 average; >.60–<.80 easy; ≥.80 very easy. Round p to 2 decimals after classifying.`;
    const label = x => `${dec(x)} · ${difficultyBand(x)}`;
    answer = label(p); wrong = [label(1-p),`${dec(p)} · ${p <= .6 ? "Easy" : "Difficult"}`,label(p/2),label(p*p),label(Math.sqrt(p))];
    why = `p = correct / total = ${correct}/${n} = ${dec(p,4)}: ${difficultyBand(p)} by the stated bands. Larger p means easier, not harder.`;
  } else if (id === "discrimination") {
    const n = 20, upper = int(9,19), lower = int(2,17), d = (upper-lower)/n;
    q = `Equal upper and lower groups each contain ${n} students. ${upper} upper-group and ${lower} lower-group students answer correctly. Find d and its band. Use negative: check key; 0–<.20 poor; .20–<.30 marginal; .30–<.40 good; ≥.40 very good.`;
    const label = x => `${dec(x)} · ${discriminationBand(x)}`;
    answer = label(d); wrong = [label(-d),label(d/2),label((upper+lower)/(2*n)),`${dec(d)} · ${d >= .3 ? "Poor" : "Very good"}`,label(upper/n),label(lower/n)];
    why = `d = (U−L)/one group's size = (${upper}−${lower})/${n} = ${dec(d)}: ${discriminationBand(d)} by the stated bands. Dividing by both groups' combined size halves d incorrectly.`;
  } else if (id === "optimal") {
    const n = int(3,6);
    q = `Using the midpoint heuristic p = (1 + chance success)/2, what is the optimal difficulty for a ${n}-option item? Round to 3 decimals.`;
    answer = dec((1+1/n)/2,3); wrong = [1/n,.5,(1-1/n)/2,1-1/n,1/(2*n)].map(x => dec(x,3));
    why = `Chance = 1/${n}. The specified midpoint heuristic gives p = (1 + 1/${n})/2 = ${answer}. This heuristic is not a universal optimum for every testing purpose.`;
    hint = "Locate the midpoint between chance success and perfect success.";
  } else if (id === "selection") {
    const applicants = int(5,15)*10, selected = int(1,4)*10;
    q = `An organization selects ${selected} of ${applicants} applicants. What is the selection ratio? Round to 2 decimals.`;
    answer = dec(selected/applicants); wrong = [applicants/selected,1-selected/applicants,selected/(applicants+selected),selected/100,applicants/(applicants+selected)].map(x => dec(x));
    why = `Selection ratio = selected / applicants = ${selected}/${applicants} = ${answer}. Applicants divided by selected reverses the ratio.`;
  }
  const distractors = [...new Set(wrong)].filter(x => x !== answer).slice(0,3);
  if (distractors.length !== 3) return generate(id);
  const opts = shuffle([answer,...distractors]);
  return {subj:"pa",set,topic:"Bonus math · " + short(set),q,opts,ans:opts.indexOf(answer),why,hint,generated:id};
}

let savedSession = store.get("session", null);
function saveSession(s){ savedSession = s; store.set("session", s) }
const item = x => typeof x === "number" ? Q[x] : x;
function preferred(idx){
  const unique = [...new Map(idx.map(x => [item(x).q, x])).values()];
  return shuffle(unique).sort((a, b) => Number(!!seen[item(a).q]) - Number(!!seen[item(b).q]) || (lastTs[item(a).q] || 0) - (lastTs[item(b).q] || 0));
}
function practice(idx, n = idx.length){
  // Bonus math replaces a few slots; the static bank and its progress denominator stay unchanged.
  let out = preferred(idx).slice(0, n);
  if (subj === "pa") {
    const sets = [...new Set(idx.map(x => item(x).set))];
    const bonus = shuffle(GENERATORS.filter(g => sets.some(s => s.startsWith(`Set ${g.set} -`)))).slice(0, Math.max(1, Math.floor(out.length / 5)));
    out.splice(Math.max(0, out.length - bonus.length), bonus.length, ...bonus.map(g => generate(g.id)));
  }
  return out;
}
function mockPlan(){
  const parts = [];
  for (const [set, n] of Object.entries(DATA.tos[subj])) {
    const combined = subj === "pa" && /^Set [23] -/.test(set);

    if (!part) { part = { name: combined ? "Research & Stats" : short(set), sets: [], count: 0 }; parts.push(part) }
    part.sets.push([set, n]); part.count += n;
  }
  return parts;
}

function sessionLabel(s){

  if (s.key.endsWith("-mock")) {

    return `Mock exam · Part ${p + 1} of ${s.parts.length} · ${s.list.slice(0, s.i + 1).filter(q => q.part === p).length} of ${rows.length}`;
  }

}
function resumeSession(){
  const s = savedSession; if (!s) return home();
  subj = s.subj; store.set("subj", subj);
  if (s.type === "cards") return cards(s);
  // Keep saved options/keys intact; only remove bank questions that no longer exist.
  const keep = s.list.map((q, i) => q.generated || byText.has(q.q) ? i : -1).filter(i => i >= 0);
  const next = keep.findIndex(k => k >= s.i);
  if (keep.length !== s.list.length) {
    s.list = keep.map(k => s.list[k]); s.picks = keep.map(k => s.picks[k]); s.hinted = keep.map(k => s.hinted[k]);
    s.i = next < 0 ? Math.max(0, s.list.length - 1) : next;
  }
  if (!s.list.length) { saveSession(null); return home() }
  quiz(s.list, s.key, s);
}

/* ---------- quiz ---------- */
function quiz(list, key, restored = null){
  const s = restored || {type:"quiz", subj, key, list:list.map(x => ({...item(x)})), i:0, picks:[], hinted:[], parts:key.endsWith("-mock") ? mockPlan() : []};
  list = s.list;
  setTab("quiz"); app.classList.add("wide");
  const picks = s.picks, hinted = s.hinted;
  let i = s.i, completed = false, reviewMisses = null;
  const isMock = key.endsWith("-mock");
  const answered = () => picks.filter(p => p != null).length;
  const score = () => list.filter((q,k) => picks[k] === q.ans).length;
  const misses = () => list.map((q,k) => picks[k] != null && picks[k] !== q.ans ? k : -1).filter(k => k >= 0);
  const save = () => { if (!completed) { s.i = i; saveSession(s) } };
  const partLabel = () => {
    const p = list[i].part, rows = list.filter(q => q.part === p);
    return `Part ${p+1} of ${s.parts.length} · ${s.parts[p].name} · ${list.slice(0,i+1).filter(q => q.part === p).length} of ${rows.length}`;
  };
  function show(){
    save();
    const q = list[i], picked = picks[i];
    app.innerHTML = `
      <div class="qhead"><button class="back press" id="menu">${LEFT}Menu</button><span class="num">${isMock ? esc(partLabel()) : `${i+1} of ${list.length}`}</span></div>
      <div class="bar"><div style="width:${answered()/list.length*100}%"></div></div>
      <div class="qgrid"><div class="qmain"><p class="qtopic">${esc(q.topic)}</p><p class="qtext">${esc(q.q)}</p>
        <div class="rows stagger" id="opts">${q.opts.map((o,n) => `<button class="opt press" data-n="${n}" style="animation-delay:${n*60}ms"><span class="k">${n+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div id="hintbox">${!isMock && hinted[i] ? hintHTML(q) : ""}</div><div id="ctl"></div></div><div id="after"></div></div>`;
    document.getElementById("menu").onclick = home;
    document.getElementById("opts").onclick = e => { const b = e.target.closest(".opt"); if (b && !b.disabled) pick(+b.dataset.n) };
    picked == null ? askControls() : reveal(picked, false);
  }
  const hintHTML = q => `<div class="why hintb"><b>Hint</b>${esc(q.hint)}</div>`;
  const prevBtn = () => `<button class="secondary press" id="prev" ${i === 0 || reviewMisses && i === reviewMisses[0] ? "disabled" : ""}>${LEFT}Previous</button>`;
  const keys = `<p class="hint keys"><kbd>1</kbd>–<kbd>4</kbd> answer${isMock ? "" : " · <kbd>H</kbd> hint"} · <kbd>Enter</kbd> next · <kbd>←</kbd> previous · <kbd>Esc</kbd> menu</p>`;
  function wirePrev(){ document.getElementById("prev").onclick = () => { if (i > 0) { i = reviewMisses ? reviewMisses[Math.max(0,reviewMisses.indexOf(i)-1)] : i-1; show(); scrollTo(0,0) } } }
  function askControls(){
    document.getElementById("ctl").innerHTML = `<div class="two next">${prevBtn()}${isMock ? "" : `<button class="secondary press" id="hintbtn" ${hinted[i] ? "disabled" : ""}>${hinted[i] ? "Hint shown" : "Hint"}</button>`}</div><p class="hint mob">Tap an answer.</p>${keys}`;
    wirePrev();
    document.getElementById("hintbtn")?.addEventListener("click", () => {
      if (hinted[i]) return;
      hinted[i] = true; save(); document.getElementById("hintbox").innerHTML = hintHTML(list[i]); askControls();
    });
  }
  function pick(n){
    if (picks[i] != null || completed) return;
    const q = list[i], ok = n === q.ans;
    picks[i] = n; recordAnswer(q,ok); rewardAnswer(ok,hinted[i]); save();
    if (ok) burst(document.querySelectorAll(".opt")[n]);
    reveal(n,true);
  }
  function reveal(n,fresh){
    const q = list[i], ok = n === q.ans, last = reviewMisses ? i === reviewMisses[reviewMisses.length-1] : i === list.length-1;
    document.querySelectorAll(".opt").forEach((b,k) => {
      b.disabled = true;
      if (isMock && !completed) { if (k === n) b.setAttribute("aria-label", "Selected: " + q.opts[k]); b.classList.toggle("selected", k === n) }
      else b.classList.add(k === q.ans ? "right" : k === n ? "wrong" : "dim");
    });
    document.querySelector(".bar>div").style.width = answered()/list.length*100 + "%";
    document.getElementById("ctl").innerHTML = "";
    document.getElementById("after").innerHTML = `
      ${isMock && !completed ? '<p class="hint">Answer saved. Explanations appear after completion.</p>' : `<div class="why"><b class="${ok ? "ok" : "no"}">${ok ? "Correct" : "Answer: " + (q.ans+1)}</b>${esc(q.why)}</div>`}
      <button class="primary press next" id="nx">${last ? "See my score" : "Next question"}</button><div class="two">${prevBtn()}<span></span></div>${keys}`;
    wirePrev();
    const nx = document.getElementById("nx");
    nx.onclick = () => {
      if (last) return done();
      i = reviewMisses ? reviewMisses[reviewMisses.indexOf(i)+1] : i+1; show(); scrollTo(0,0);
    };
    if (fresh) { nx.focus({preventScroll:true}); if (innerWidth < 1200) document.getElementById("after").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth",block:"nearest"}) }
  }
  function review(indices){
    reviewMisses = indices; i = indices ? indices[0] : 0; setTab("quiz"); app.classList.add("wide"); show(); wireKeys(); scrollTo(0,0);
  }
  function done(){
    if (!completed) { completed = true; saveSession(null) }
    setTab("home"); document.onkeydown = null;
    const pct = Math.round(score()/list.length*100), wrong = misses();
    if (key !== "redo" && key !== "mixed" && (best[key] == null || pct > best[key])) { best[key] = pct; store.set("best",best) }
    app.innerHTML = `<h1 class="hero"><span class="num" id="pc">0</span>%</h1><p class="sub num">${score()} of ${list.length} correct. ${pct >= 73 ? "Above 73, the score you need." : "Review the misses while the questions are fresh."}</p>
      ${isMock ? `<div class="rows part-scores">${s.parts.map((p,k) => { const indices = list.map((q,j) => q.part === k ? j : -1).filter(j => j >= 0); const n = indices.filter(j => picks[j] === list[j].ans).length; return `<div class="row"><span>${esc(p.name)}</span><span class="num">${n}/${indices.length} · ${Math.round(n/indices.length*100)}%</span></div>` }).join("")}</div>` : ""}
      <button class="primary press" id="again">${wrong.length ? isMock ? "Review my misses" : "Redo these " + wrong.length + " mistakes" : "Back to sets"}</button>
      <div class="two"><button class="secondary press" id="review">${LEFT}Review answers</button><button class="secondary press" id="back">Back to sets</button></div>`;
    countUp(document.getElementById("pc"),pct);
    document.getElementById("again").onclick = () => wrong.length ? isMock ? review(wrong) : quiz(wrong.map(j => list[j]),"redo") : home();
    document.getElementById("back").onclick = home;
    document.getElementById("review").onclick = () => review(null);
  }
  function wireKeys(){
    document.onkeydown = e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches("input,textarea")) return;
      if (e.key === "Escape") { home(); return }
      if (!document.getElementById("opts")) return;
      const k = "1234".indexOf(e.key);
      if (k >= 0) { const b = document.querySelectorAll(".opt")[k]; if (b && !b.disabled) { e.preventDefault(); pick(k) } }
      if (/^h$/i.test(e.key)) document.getElementById("hintbtn")?.click();
      if (e.key === "ArrowLeft") { e.preventDefault(); document.getElementById("prev")?.click() }
      if (e.key === "Enter") {
        const nx = document.getElementById("nx");
        if (nx && (document.activeElement === nx || !document.activeElement.closest("button"))) { e.preventDefault(); nx.click() }
      }
    };
  }
  show(); wireKeys(); scrollTo(0,0);
}

/* ---------- flashcards: Flip (self-check) or Quiz me (definition -> pick the term, +10) ---------- */
let cardMode = store.get("cardmode", "flip");
function openCards(){
  if (!savedSession || savedSession.type === "cards" && savedSession.subj === subj) return cards(savedSession);
  setTab("cards"); document.onkeydown = null;
  app.innerHTML = `<div class="mob">${segHTML()}</div><h1 class="hero">Flashcards</h1><p class="sub">Starting a round replaces your saved ${esc(savedSession.type === "quiz" ? "quiz" : "flashcard round")}.</p><button class="primary press" id="newcards">Start a flashcard round</button>${continueHTML()}`;
  document.getElementById("newcards").onclick = () => cards();
  document.getElementById("continue").onclick = resumeSession; wireSeg(openCards);
}
function cards(restored = null){
  setTab("cards");
  const all = () => FC.map((_, k) => k).filter(k => FC[k].subj === subj);
  if (restored) { cardMode = restored.mode; store.set("cardmode",cardMode) }
  const find = c => {
    const k = FC.findIndex(x => x.subj === c.subj && x.t === c.t && x.d === c.d);
    if (k >= 0) return k;
    return FC.push(c) - 1;
  };
  let deck = restored ? restored.deck.map(find) : shuffle(all()), i = restored?.i || 0, flipped = restored?.flipped || false, again = restored ? restored.again.map(find).filter(k => k >= 0) : [];
  const qpicks = restored?.picks || [], qopts = restored ? restored.options.map(opts => opts?.map(find)) : [];
  const save = () => saveSession({type:"cards",subj,mode:cardMode,deck:deck.map(k => FC[k]),i,flipped,again:again.map(k => FC[k]),picks:qpicks,options:qopts.map(opts => opts?.map(k => FC[k]))});
  const modeHTML = `<div class="seg small" id="mode"><button class="press ${cardMode === "flip" ? "on" : ""}" data-m="flip">Flip</button><button class="press ${cardMode === "quiz" ? "on" : ""}" data-m="quiz">Quiz me (coins)</button></div>`;
  function optionsFor(k){
    if (!qopts[i]) {
      // wrong choices: cards whose wording overlaps most with this definition, so the right term isn't obvious
      const words = s => new Set(s.toLowerCase().match(/[a-z]{4,}/g) || []);
      const mine = words(FC[k].d + " " + FC[k].t);
      const pool = shuffle(all().filter(x => x !== k && FC[x].t !== FC[k].t))
        .map(x => [x, [...words(FC[x].d + " " + FC[x].t)].filter(w => mine.has(w)).length + Math.random()])
        .sort((a, b) => b[1] - a[1]).slice(0, 3).map(p => p[0]);
      qopts[i] = shuffle([k, ...pool]);
    }
    return qopts[i];
  }
  function show(){
    if (i >= deck.length) {
      saveSession(null);
      app.innerHTML = `
        <div class="mob">${segHTML()}</div>${modeHTML}
        <h1 class="hero">Deck done</h1>
        <p class="sub num">${again.length ? again.length + " cards to go over again." : "You knew every card this round."}</p>
        <button class="primary press" id="re">${again.length ? "Go over the " + again.length + " again" : "Shuffle and restart"}</button>`;
      wire();
      document.getElementById("re").onclick = () => { deck = again.length ? shuffle(again) : shuffle(all()); again = []; i = 0; qpicks.length = 0; qopts.length = 0; show() };
      return;
    }
    const k = deck[i], c = FC[k];
    const nav = `<div class="two"><button class="secondary press" id="prev" ${i === 0 ? "disabled" : ""}>${LEFT}Back</button><button class="secondary press" id="next" ${cardMode === "quiz" && qpicks[i] == null ? "disabled" : ""}>Next${RIGHT}</button></div>`;
    if (cardMode === "flip") {
      app.innerHTML = `
        <div class="mob">${segHTML()}</div>${modeHTML}
        <div class="qhead"><span class="num">${i + 1} of ${deck.length}</span><span class="num">${again.length} to repeat</span></div>
        <button class="card press" id="card"><span class="term">${esc(c.t)}</span>${flipped ? `<span class="def">${esc(c.d)}</span>` : ""}</button>
        ${flipped
          ? `<div class="two"><button class="secondary press" id="no">Again</button><button class="primary press" id="yes">Got it</button></div>`
          : `<p class="hint">Say the answer out loud first, then tap the card to check</p>`}
        ${nav}<p class="hint keys"><kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> move</p>`;
      document.getElementById("card").onclick = () => { flipped = !flipped; show() };
      if (flipped) {
        document.getElementById("yes").onclick = () => { again = again.filter(x => x !== k); move(1) };
        document.getElementById("no").onclick = () => { if (!again.includes(k)) again.push(k); move(1) };
      }
    } else {
      const opts = optionsFor(k), picked = qpicks[i];
      app.innerHTML = `
        <div class="mob">${segHTML()}</div>${modeHTML}
        <div class="qhead"><span class="num">${i + 1} of ${deck.length}</span><span class="num">${again.length} to repeat</span></div>
        <div class="card"><span class="cap">Which term matches this definition?</span><span class="defq">${esc(c.d)}</span></div>
        <div class="rows" id="opts">${opts.map((x, n) => {
          const cls = picked == null ? "" : x === k ? "right" : n === picked ? "wrong" : "dim";
          return `<button class="opt press ${cls}" data-n="${n}" ${picked != null ? "disabled" : ""}><span class="k">${n + 1}</span><span>${esc(FC[x].t)}</span></button>`;
        }).join("")}</div>
        <div style="height:12px"></div>${nav}<p class="hint keys"><kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>←</kbd> <kbd>→</kbd> move</p>`;
      if (picked == null) document.getElementById("opts").onclick = e => {
        const b = e.target.closest(".opt"); if (!b) return;
        const n = +b.dataset.n; qpicks[i] = n;
        const ok = opts[n] === k; rewardAnswer(ok);
        if (ok) again = again.filter(x => x !== k); else if (!again.includes(k)) again.push(k);
        show(); if (ok) burst(document.querySelectorAll(".opt")[n]);
      };
    }
    document.getElementById("prev").onclick = () => move(-1);
    document.getElementById("next").onclick = () => move(1);
    wire(); save();
  }
  function wire(){
    wireSeg(openCards);
    document.getElementById("mode").onclick = e => {
      const b = e.target.closest("button[data-m]"); if (!b || b.dataset.m === cardMode) return;
      cardMode = b.dataset.m; store.set("cardmode", cardMode); cards();
    };
  }
  const move = d => { i = Math.max(0, i + d); flipped = false; show() };
  show();
  document.onkeydown = e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches("input,textarea")) return;
    if (e.key === "Escape") { home(); return }
    if (e.key === " " && cardMode === "flip") { e.preventDefault(); document.getElementById("card")?.click() }
    if (e.key === "ArrowLeft") { e.preventDefault(); document.getElementById("prev")?.click() }
    if (e.key === "ArrowRight" || e.key === "Enter" && (document.activeElement.id === "next" || !document.activeElement.closest("button"))) {
      e.preventDefault(); const n = document.getElementById("next"); if (n && !n.disabled) n.click();
    }
    const k = "1234".indexOf(e.key);
    if (k >= 0 && cardMode === "quiz") document.querySelectorAll("#opts .opt")[k]?.click();
  };
}

/* ---------- sync: copy a code on one device, paste it on the other (merges, never overwrites) ---------- */
const SEAL = "strawberry-sempsych-2026";
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
async function pack(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  let body, ver = "SP0";
  if (window.CompressionStream) {
    body = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    ver = "SP1";
  } else body = raw;
  const b = b64u(body);
  return `${ver}.${b}.${fnv(SEAL + b + fnv(b + SEAL))}`;
}
async function unpack(code){
  const parts = code.trim().replace(/\s+/g, "").split(".");
  if (parts.length !== 3 || !/^SP[01]$/.test(parts[0])) throw new Error("bad");
  const [ver, b, sig] = parts;
  if (fnv(SEAL + b + fnv(b + SEAL)) !== sig) throw new Error("bad");
  let bytes = unb64u(b);
  if (ver === "SP1") bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}
function snapshot(){
  const id = t => fnv(t);
  const s = Object.keys(seen).filter(t => byText.has(t));
  return { v: 1, e: earned, c: correct, k: coupons, s: s.map(id), m: Object.keys(mistakes).filter(t => byText.has(t)).map(id),
           t: Object.fromEntries(s.map(t => [id(t), lastTs[t] || 0])), b: best, d: days };
}
function mergeIn(o){
  const before = { done: Object.keys(seen).length, coins: coinsNow() };
  const idToText = new Map(Q.map(q => [fnv(q.q), q.q]));
  for (const [d, n] of Object.entries(o.e || {})) earned[d] = Math.max(earned[d] || 0, n);
  for (const [d, n] of Object.entries(o.c || {})) correct[d] = Math.max(correct[d] || 0, n);
  const have = new Set(coupons.map(c => c.code));
  for (const c of o.k || []) if (c && c.code && !have.has(c.code))
    coupons.push({ ...c, cost: Number.isFinite(c.cost) ? c.cost : (REWARDS.find(r => r.name === c.name)?.cost || OLD_REWARDS[c.name] || 0) });
  const theirMiss = new Set(o.m || []);
  for (const id of o.s || []) {
    const t = idToText.get(id); if (!t) continue;
    const theirTs = (o.t || {})[id] || 0;
    if (!seen[t] || theirTs > (lastTs[t] || 0)) {     // their answer is newer (or we never answered): take their status
      seen[t] = 1; lastTs[t] = theirTs;
      if (theirMiss.has(id)) mistakes[t] = 1; else delete mistakes[t];
    }
  }
  for (const [k, v] of Object.entries(o.b || {})) best[k] = Math.max(best[k] ?? 0, v);
  days = [...new Set([...days, ...(o.d || [])])].sort();
  for (const [k, v] of [["earned", earned], ["correct", correct], ["coupons", coupons], ["seen2", seen], ["mistakes2", mistakes], ["ts", lastTs], ["best", best], ["days", days]]) store.set(k, v);
  showCoins();
  return { added: Object.keys(seen).length - before.done, coins: coinsNow() };
}
function sync(msg){
  setTab("sync");
  document.onkeydown = null;
  app.innerHTML = `
    <h1 class="hero">Sync devices</h1>
    <p class="sub">Copy your code here, then paste it in the app on your other device. Pasting merges both devices, so nothing is ever lost.</p>
    ${msg ? `<div class="note ${msg.ok ? "ok" : "no"}">${esc(msg.text)}</div>` : ""}
    <p class="label">1. On this device</p>
    <button class="primary press" id="copy">Copy my progress</button>
    <textarea class="input" id="mycode" readonly aria-label="Your sync code" placeholder="Your code appears here"></textarea>
    <p class="label" style="margin-top:10px">2. Code from your other device</p>
    <textarea class="input" id="theirs" aria-label="Paste a sync code" placeholder="Paste the code here"></textarea>
    <button class="secondary press" id="merge" style="width:100%">Merge into this device</button>`;
  const mine = document.getElementById("mycode");
  document.getElementById("copy").onclick = async () => {
    const code = await pack(snapshot());
    mine.value = code; mine.select();
    try { await navigator.clipboard.writeText(code); document.getElementById("copy").textContent = "Copied. Send it to your other device." }
    catch { document.getElementById("copy").textContent = "Code ready below. Select and copy it." }
  };
  document.getElementById("merge").onclick = async () => {
    const code = document.getElementById("theirs").value;
    if (!code.trim()) return;
    try {
      const o = await unpack(code);
      const r = mergeIn(o);
      sync({ ok: true, text: `Merged. ${r.added > 0 ? `${r.added} more questions marked done, ` : ""}${fmt(r.coins)} strawberry coins now.` });
    } catch { sync({ ok: false, text: "This code is damaged or incomplete. Copy it again from your other device." }) }
  };
}
