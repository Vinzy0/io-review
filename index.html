 Carnall's stages of change acceptance, they are in:", "opts": ["Discarding", "Adaptation", "Internalization", "Defense"], "ans": 1, "why": "Carnall's 5 stages: Denial → Defense (justifying the old ways) → Discarding (realizing they must change too) → ADAPTATION (testing the system, learning, adjusting) → Internalization (fully comfortable and immersed in the new culture).", "hint": "They're past denial and actually testing the new system."}, {"set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "When told about the new process, an employee says she won't push for it, but she'll go along if it's really necessary. Then she asks, 'But are you SURE the old system is actually broken?' She is a:", "opts": ["Reluctant changer", "Change resister", "Receptive changer", "Change analyst"], "ans": 0, "why": "Reluctant changers won't instigate or welcome change but will change if necessary: 'Are you sure it's broken?' Receptive changers: 'If it's broke, I'll help fix it.' Change analysts: change only if it improves things. Change resisters: 'It may be broke, but it's still better than the unknown.'", "hint": "Won't push for change, will go along if necessary, asks if it's really broken."}, {"set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "A consultant administers an anonymous attitude survey to all employees, compiles results by department, presents the data back to each group, and then helps them plan changes. Which OD intervention is this?", "opts": ["Appreciative inquiry", "Total Quality Management", "Survey feedback", "Team building"], "ans": 2, "why": "Survey feedback = systematic data collection through an anonymous survey, results compiled by unit, FED BACK to members, then groups identify changes. Top management supports and participates.", "hint": "Survey, then results fed back to each group."}, {"set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "Instead of asking 'What's wrong with our department?', a facilitator asks employees to describe moments when the team was at its best, then uses those strengths to plan the future. This intervention is:", "opts": ["Confrontation meeting", "Survey feedback", "Appreciative inquiry", "Process consultation"], "ans": 2, "why": "Appreciative Inquiry (positive OD) focuses on STRENGTHS, the best of what employees offer, and past successes rather than problems. Its 5-D cycle: Define → Discover → Dream → Design → Deliver.", "hint": "The focus is on strengths, not problems."}, {"set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "In an Appreciative Inquiry session, employees have just finished identifying their past successes. They are now asked to imagine and describe the ideal future of their department. Which phase is this?", "opts": ["Discover", "Design", "Deliver", "Dream"], "ans": 3, "why": "Define (focus of inquiry) → DISCOVER (what's working, past successes) → DREAM (envision the positive future) → DESIGN (strategies and plans to make it happen) → DELIVER (implement).", "hint": "They've finished discovering. Now they imagine."}, {"set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Overnight, a traditional bank closes all its physical branches and becomes a purely digital bank, drastically changing how everything is done. According to Burke, this is:", "opts": ["Evolutionary change", "Developmental change", "Incremental change", "Revolutionary change"], "ans": 3, "why": "Burke: EVOLUTIONARY change = continual upgrading and improvement of processes. REVOLUTIONARY change = a 'real jolt to the system' that drastically changes how things are done.", "hint": "Overnight and drastic, or gradual?"}, {"set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "Middle managers quietly oppose a restructuring because it will cut their authority, headcount, and budgets. This is mainly which type of resistance to change?", "opts": ["Technical resistance", "Cultural resistance", "Reluctant change", "Political resistance"], "ans": 3, "why": "POLITICAL resistance = concerns about power, influence, resources, and self-interest. TECHNICAL = practical or operational concerns (e.g., the system is hard to use). CULTURAL = clashes with deeply ingrained values, norms, and traditions ('this isn't who we are').", "hint": "What do the middle managers stand to lose?"}, {"set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A company asks employees to identify and eliminate unnecessary forms, reports, and paperwork that serve no useful purpose. In a 'sacred cow hunt,' this targets the:", "opts": ["Paper cow", "Process cow", "Meeting cow", "Speed cow"], "ans": 0, "why": "Sacred cow hunt = removing practices with no useful purpose. PAPER cow = unnecessary paperwork. MEETING cow = too many or too-long meetings. SPEED cow = unnecessary deadlines. There is no 'process cow'.", "hint": "Forms and reports are the target."}, {"set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "A hospital is about to switch to a new electronic scheduling system that nurses will use daily. Which approach is MOST likely to reduce nurses' resistance?", "opts": ["Penalize nurses who keep using the old system", "Involve nurse representatives in selecting and testing the system", "Delay the change until every nurse agrees to it", "Announce the change in a memo the day before launch"], "ans": 1, "why": "The three major strategies for dealing with resistance: EMPATHY and SUPPORT, COMMUNICATION, and PARTICIPATION/INVOLVEMENT. People resist less when they help shape the change. Last-minute memos and penalties raise resistance.", "hint": "People resist less when they help shape the change."}, {"set": "Set 5 - Org Change and Development", "topic": "OD Interventions", "q": "A consultant observes a team's meetings and helps members become aware of HOW they communicate, make decisions, and handle conflict, so they can solve their own problems in the future. This is a:", "opts": ["Structural intervention", "Technostructural intervention", "Process intervention (process consultation)", "Content intervention"], "ans": 2, "why": "PROCESS interventions help the group see its own INTERNAL DYNAMICS (communication, roles, decision-making, norms). CONTENT interventions address the substance of the work or mission. STRUCTURAL interventions change the group's structure.", "hint": "The consultant focuses on HOW they work together, not on the work itself."}, {"set": "Set 5 - Org Change and Development", "topic": "Org Change", "q": "After a major market disruption, a 50-year-old print publisher redefines its core identity, purpose, and mission, rebuilding itself from the ground up as a digital media company. This is best described as:", "opts": ["Incremental change", "Organizational transformation", "Remedial change", "Organizational development"], "ans": 1, "why": "Organizational TRANSFORMATION = comprehensive change to the organization's fundamental 'DNA' (identity, purpose, mission), usually triggered by major disruption. OD = planned, long-term, organization-wide improvement of the existing system. Remedial change = fixing specific existing problems.", "hint": "They redefined who they are, not just a process."}], "flashcards": [{"t": "Unity of command", "d": "Each subordinate answers to only ONE superior (part of the scalar principle)"}, {"t": "Scalar principle", "d": "Chain of command; vertical growth of the organization through added levels"}, {"t": "Functional principle", "d": "Division of labor into units doing similar functions; horizontal growth"}, {"t": "Line vs. staff functions", "d": "Line = directly meets major goals; Staff = supports the line"}, {"t": "Span of control", "d": "Number of subordinates one manager supervises (Urwick: about 5–6 is optimal)"}, {"t": "Scientific Management", "d": "Frederick Taylor; time studies to find the \"one best way\"; scientific selection and training"}, {"t": "Bureaucracy", "d": "Max Weber; hierarchy, formal rules, division of labor, impersonality, merit, written records"}, {"t": "Administrative Theory", "d": "Henri Fayol; what managers do: Plan, Organize, Command, Coordinate, Control; 14 principles"}, {"t": "Esprit de corps", "d": "Fayol principle: sense of belonging and team spirit within the organization"}, {"t": "Hawthorne effect", "d": "Elton Mayo; people change behavior because they know they're being observed"}, {"t": "Chester Barnard", "d": "Organizations are cooperative systems; authority depends on subordinates' acceptance"}, {"t": "Herbert Simon", "d": "Bounded rationality; managers SATISFICE (choose \"good enough\"), not optimize"}, {"t": "Chris Argyris", "d": "Growth perspective; healthy organizations help people grow from passive to active"}, {"t": "Theory X", "d": "McGregor; assumes workers are lazy and avoid work, so management is controlling/authoritarian"}, {"t": "Theory Y", "d": "McGregor; assumes workers are self-motivated and seek responsibility, so management is participative"}, {"t": "Self-fulfilling prophecy", "d": "Employees come to act the way managers expect them to act"}, {"t": "Contingency theory", "d": "\"It depends\": no one best way to organize or lead"}, {"t": "Joan Woodward", "d": "Contingency model based on TECHNOLOGY (unit/small-batch, mass, continuous-process)"}, {"t": "Lawrence and Lorsch", "d": "Contingency model based on ENVIRONMENT; differentiation and integration"}, {"t": "Open systems (Katz and Kahn)", "d": "Organizations exchange inputs → throughput → outputs with the environment"}, {"t": "Equifinality", "d": "Same end state reached from different starting points and paths"}, {"t": "Negative entropy (negentropy)", "d": "Importing more energy and resources than spent, to avoid decay"}, {"t": "Maslow's hierarchy", "d": "Physiological → Safety → Love/Belonging → Esteem → Self-actualization; first 4 = D-needs, top = B-need"}, {"t": "Herzberg hygiene factors", "d": "Salary, working conditions, policies; prevent DISsatisfaction but don't motivate"}, {"t": "Herzberg motivators", "d": "Achievement, recognition, the work itself, responsibility, growth; create motivation"}, {"t": "McClelland's needs", "d": "Achievement, Affiliation, Power (learned/acquired needs)"}, {"t": "Leadership motive pattern", "d": "High need for power + low need for affiliation (linked to effective leaders)"}, {"t": "Alderfer's ERG", "d": "Existence, Relatedness, Growth; steps can be skipped; frustration-regression"}, {"t": "Frustration-regression", "d": "ERG: when a higher need is blocked, the person falls back to a lower need"}, {"t": "Equity theory", "d": "J. Stacey Adams; compare your outcome/input ratio to a referent's"}, {"t": "Underpayment inequity", "d": "Getting less than you deserve compared with others → often reduce inputs"}, {"t": "Expectancy (VIE)", "d": "Vroom; Expectancy (effort → performance), Instrumentality (performance → reward), Valence (value of reward)"}, {"t": "Goal-setting theory", "d": "Edwin Locke; specific, challenging goals plus commitment → higher performance"}, {"t": "Self-efficacy", "d": "Bandura; belief in your own ability to succeed at a specific task"}, {"t": "Self-Determination Theory", "d": "Needs for Autonomy, Competence, Relatedness"}, {"t": "Four-Drive Theory", "d": "Drives to Acquire, Bond, Comprehend, Defend"}, {"t": "MARS model", "d": "Performance = Motivation, Ability, Role perceptions, Situational factors"}, {"t": "Distributive justice", "d": "Fairness of the OUTCOME/decision itself"}, {"t": "Procedural justice", "d": "Fairness of the PROCESS used to reach the decision"}, {"t": "Galatea effect", "d": "Your OWN high self-expectations raise your performance"}, {"t": "Pygmalion (Rosenthal) effect", "d": "A SUPERIOR's high expectations raise a subordinate's performance"}, {"t": "Golem effect", "d": "Others' LOW expectations lower performance"}, {"t": "Premack Principle", "d": "A preferred activity can reinforce a less-preferred one"}, {"t": function countUp(el, to){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || to === 0) { el.textContent = to; return }
  const t0 = performance.now(), dur = 650;
  setTimeout(() => { el.textContent = to }, dur + 50); // in case animation frames are paused (background tab)
  (function tick(t){ const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick) })(t0);
}

}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  b.dataset.tab === "cards" ? cards() : home();
});

function home(){
  setTab("home");
  document.onkeydown = null;
  const nMiss = missIdx().length, nSeen = Object.keys(seen).filter(t => byText.has(t)).length;
  const best = store.get("best", {});
  app.innerHTML = `
    <h1 class="hero"><span class="num" id="hn">0</span> IO questions</h1>
    <p class="sub">Situational, board-style, with a reason for every answer.</p>
    ${canSave ? "" : `<div class="row warn"><span class="meta">Progress isn't saving here. Open this link in Safari, then tap Share and Add to Home Screen.</span><span class="chip c-attn">Not saving</span></div>`}
    <p class="pep">${esc(PEP[Math.floor(Math.random() * PEP.length)])}</p>
    <div class="tiles">
      <button class="tile t-attn press" id="redo" ${nMiss ? "" : "disabled"}>
        <span class="big num" id="mn">0</span><small>${nMiss === 1 ? "mistake" : "mistakes"} to redo</small>
        <span class="act">${nMiss ? "Redo now" : "None yet"}</span>
      </button>
      <div class="tile t-ok">
        <span class="big num"><span id="sn">0</span><span class="of">/${Q.length}</span></span><small>questions done</small>
      </div>
    </div>
    <button class="primary press" id="go">Start a mixed 20</button>
    <p class="label">Practice by topic</p>
    <div class="rows stagger" id="sets"></div>
    <p class="hint" style="margin-top:22px"><button class="link press" id="reset">Reset all progress</button></p>`;
  countUp(document.getElementById("hn"), Q.length);
  countUp(document.getElementById("mn"), nMiss);
  countUp(document.getElementById("sn"), nSeen);
  const rows = [...sets.map(s => ({ name: s.replace(/^Set \d - /, ""), key: s, items: idx.filter(i => Q[i].set === s) })),
                { name: "Mock exam (50 random, timed feel)", key: "mock", items: null }];
  const el = document.getElementById("sets");
  rows.forEach((r, n) => {
    const b = document.createElement("button");
    b.className = "row press"; b.style.animationDelay = n * 70 + "ms";
    const count = r.items ? r.items.length : 50;
    const doneN = r.items ? r.items.filter(i => seen[Q[i].q]).length : 0;
    const sc = best[r.key];
    b.innerHTML = `<span><span>${esc(r.name)}</span><br><span class="meta num">${r.items ? `${doneN} of ${count} done` : "50 random from all sets"}</span></span>` +
      (sc != null ? `<span class="chip ${sc >= 80 ? "c-ok" : "c-attn"} num">Best ${sc}%</span>` : "");
    b.onclick = () => quiz(r.items ? shuffle(r.items) : shuffle(idx).slice(0, 50), r.key);
    el.appendChild(b);
  });
  document.getElementById("go").onclick = () => quiz(shuffle(idx).slice(0, 20), "mixed");
  document.getElementById("reset").onclick = confirmReset;
  if (nMiss) document.getElementById("redo").onclick = () => quiz(shuffle(missIdx()), "redo");
}

function confirmReset(){
  const nSeen = Object.keys(seen).length, nMiss = Object.keys(mistakes).length;
  app.innerHTML = `
    <h1 class="hero">Reset everything?</h1>
    <p class="sub num">This erases ${nSeen} done ${nSeen === 1 ? "question" : "questions"}, ${nMiss} ${nMiss === 1 ? "mistake" : "mistakes"} to redo, and every best score. It can't be undone.</p>
    <label class="label" for="rc">Type RESET to confirm</label>
    <input id="rc" class="input" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    <button class="danger press" id="rgo" disabled>Erase all progress</button>
    <button class="primary press" id="rno">Keep my progress</button>`;
  const rc = document.getElementById("rc"), go = document.getElementById("rgo");
  rc.oninput = () => { go.disabled = rc.value.trim().toUpperCase() !== "RESET" };
  go.onclick = () => {
    if (go.disabled) return;
    ["mistakes2", "seen2", "best"].forEach(k => { try { localStorage.removeItem("io_" + k) } catch {} });
    mistakes = {}; seen = {};
    home();
  };
  document.getElementById("rno").onclick = home;
  document.onkeydown = null;
}

function quiz(list, key){
  let i = 0, score = 0;
  const picks = [];   // picks[n] = choice made on question n; empty until answered
  const hinted = [];  // hinted[n] = true once the hint was shown
  const wrongNow = [];
  const answered = () => picks.filter(p => p != null).length;
  function show(){
    const q = Q[list[i]], picked = picks[i];
    app.innerHTML = `
      <div class="qhead"><button class="back press" id="menu"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Menu</button><span class="num">${i + 1} of ${list.length}</span></div>
      <div class="bar"><div style="width:${answered() / list.length * 100}%"></div></div>
      <p class="qtopic">${esc(q.topic)}</p>
      <p class="qtext">${esc(q.q)}</p>
      <div class="rows stagger" id="opts">${q.opts.map((o, n) =>
        `<button class="opt press" data-n="${n}" style="animation-delay:${n * 60}ms"><span class="k">${"ABCD"[n]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="hintbox">${hinted[i] ? hintHTML(q) : ""}</div>
      <div id="after"></div>`;
    document.getElementById("menu").onclick = home;
    document.getElementById("opts").onclick = e => { const b = e.target.closest(".opt"); if (b && !b.disabled) pick(+b.dataset.n) };
    picked == null ? askControls() : reveal(picked, false);
  }
  const hintHTML = q => `<div class="why hintb"><b>Hint</b>${esc(q.hint)}</div>`;
  const prevBtn = () => `<button class="secondary press" id="prev" ${i === 0 ? "disabled" : ""}><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Previous</button>`;
  function wirePrev(){ document.getElementById("prev").onclick = () => { if (i > 0) { i--; show(); scrollTo(0, 0) } } }
  function askControls(){
    document.getElementById("after").innerHTML = `
      <div class="two next">${prevBtn()}<button class="secondary press" id="hintbtn" ${hinted[i] ? "disabled" : ""}>${hinted[i] ? "Hint shown" : "Hint"}</button></div>
      <p class="hint">Tap an answer. Keys 1-4 work too.</p>`;
    wirePrev();
    document.getElementById("hintbtn").onclick = () => {
      hinted[i] = true;
      document.getElementById("hintbox").innerHTML = hintHTML(Q[list[i]]);
      askControls();
    };
  }
  function pick(n){
    const qi = list[i], q = Q[qi];
    picks[i] = n;
    seen[q.q] = 1; store.set("seen2", seen);
    if (n === q.ans) { score++; delete mistakes[q.q] } else { mistakes[q.q] = 1; wrongNow.push(qi) }
    store.set("mistakes2", mistakes);
    reveal(n, true);
  }
  // answered state: right after answering, and when reviewing an earlier question
  function reveal(n, fresh){
    const q = Q[list[i]], ok = n === q.ans, last = i === list.length - 1;
    document.querySelectorAll(".opt").forEach((b, k) => {
      b.disabled = true;
      b.classList.add(k === q.ans ? "right" : k === n ? "wrong" : "dim");
    });
    document.querySelector(".bar>div").style.width = answered() / list.length * 100 + "%";
    const ahead = picks[i + 1] != null;
    document.getElementById("after").innerHTML = `
      <div class="why"><b class="${ok ? "ok" : "no"}">${ok ? "Correct" : "Answer: " + "ABCD"[q.ans]}</b>${esc(q.why)}</div>
      <button class="primary press next" id="nx">${last ? (fresh ? "See my score" : "Back to my score") : ahead ? "Next" : "Next question"}</button>
      <div class="two">${prevBtn()}<span></span></div>`;
    wirePrev();
    const nx = document.getElementById("nx");
    nx.onclick = () => { i++; i < list.length ? (show(), scrollTo(0, 0)) : done() };
    if (fresh) { nx.focus({ preventScroll: true }); document.getElementById("after").scrollIntoView({ behavior: "smooth", block: "nearest" }) }
  }
  function done(){
    const pct = Math.round(score / list.length * 100);
    const best = store.get("best", {});
    if (key !== "redo" && key !== "mixed" && (best[key] == null || pct > best[key])) { best[key] = pct; store.set("best", best) }
    app.innerHTML = `
      <h1 class="hero"><span class="num" id="pc">0</span>%</h1>
      <p class="sub num">${score} of ${list.length} correct. ${pct >= 80 ? "That's above your 80 target." : pct >= 73 ? "Above 73, the score you need. Redo the misses to push it higher." : "Redo the misses now while the explanations are fresh."}</p>
      ${wrongNow.length ? `<button class="primary press" id="again">Redo ${wrongNow.length === 1 ? "this mistake" : "these " + wrongNow.length + " mistakes"}</button>` : `<button class="primary press" id="again">Back to sets</button>`}
      <div class="two"><button class="secondary press" id="review"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Review answers</button><button class="secondary press" id="back">Back to sets</button></div>`;
    countUp(document.getElementById("pc"), pct);
    document.getElementById("again").onclick = () => wrongNow.length ? quiz(shuffle(wrongNow), "redo") : home();
    document.getElementById("back").onclick = home;
    document.getElementById("review").onclick = () => { i = list.length - 1; show(); scrollTo(0, 0) };
  }
  show(); scrollTo(0, 0);
  document.onkeydown = e => {
    if (!document.getElementById("opts")) return;
    const k = "1234".indexOf(e.key);
    if (k >= 0) { const b = document.querySelectorAll(".opt")[k]; if (b && !b.disabled) pick(k) }
    if (e.key === "ArrowLeft") document.getElementById("prev")?.click();
    if (e.key === "Enter" && document.getElementById("nx") && document.activeElement !== document.getElementById("nx")) document.getElementById("nx").click();
  };
}

function cards(){
  setTab("cards");
  let deck = shuffle(FC.map((_, i) => i)), i = 0, flipped = false, again = [];
  function show(){
    if (i >= deck.length) {
      app.innerHTML = `
        <h1 class="hero">Deck done</h1>
        <p class="sub num">${again.length ? again.length + " cards to go over again." : "You knew every card this round."}</p>
        <button class="primary press" id="re">${again.length ? "Go over the " + again.length + " again" : "Shuffle and restart"}</button>`;
      document.getElementById("re").onclick = () => { deck = again.length ? shuffle(again) : shuffle(FC.map((_, k) => k)); again = []; i = 0; show() };
      return;
    }
    const c = FC[deck[i]];
    app.innerHTML = `
      <div class="qhead"><span class="num">${i + 1} of ${deck.length}</span><span class="num">${again.length} to repeat</span></div>
      <button class="card press" id="card"><span class="term">${esc(c.t)}</span>${flipped ? `<span class="def">${esc(c.d)}</span>` : ""}</button>
      ${flipped
        ? `<div class="two"><button class="secondary press" id="no">Again</button><button class="primary press" id="yes">Got it</button></div>`
        : `<p class="hint">Say the answer out loud first, then tap the card to check</p>`}
      <div class="two"><button class="secondary press" id="prev" ${i === 0 ? "disabled" : ""}><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Back</button><button class="secondary press" id="next">Next<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/></svg></button></div>`;
    const go = d => { i = Math.max(0, i + d); flipped = false; show() };
    document.getElementById("card").onclick = () => { flipped = !flipped; show() };
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    if (flipped) {
      document.getElementById("yes").onclick = () => { again = again.filter(k => k !== deck[i]); go(1) };
      document.getElementById("no").onclick = () => { if (!again.includes(deck[i])) again.push(deck[i]); go(1) };
    }
  }
  show();
  document.onkeydown = e => {
    if (e.key === " ") { e.preventDefault(); document.getElementById("card")?.click() }
    if (e.key === "ArrowLeft") document.getElementById("prev")?.click();
    if (e.key === "ArrowRight") document.getElementById("next")?.click();
  };
}

home();
if ("serviceWorker" in navigator && isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
const remeasure = () => setTab(document.querySelector(".tab[aria-selected=true]").dataset.tab);
document.fonts?.ready.then(remeasure);
addEventListener("resize", remeasure);
</script>
