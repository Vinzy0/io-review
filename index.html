": "MOOD = the patient's SUBJECTIVE, self-reported emotional state ('I feel happy'). AFFECT = the clinician's OBJECTIVE observation of emotional expression ('flat affect'). A mismatch between them is clinically important.", "hint": "One comes from the patient's own words; the other is what the clinician sees."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "MSE", "q": "In the mental status exam, a patient's understanding of the nature and severity of his own illness is assessed under:", "opts": ["Thought content", "Orientation", "Insight", "Judgment"], "ans": 2, "why": "Insight = the patient's understanding of their own illness, including its nature and severity. Judgment = the ability to make sound decisions and act appropriately. Orientation = awareness of person, place, and time.", "hint": "Does he understand his own condition?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Cut Scores", "q": "A company decides it will hire only the top 10% of scorers on its exam, whatever their actual scores turn out to be. This kind of cut score is:", "opts": ["Compensatory cut score", "Multiple cut scores", "Relative (norm-referenced) cut score", "Fixed cut score"], "ans": 2, "why": "A RELATIVE cut score is based on norm-related considerations (where you stand compared with others, like the top 10%). A FIXED cut score is set by judgment of the minimum proficiency required, no matter how others perform.", "hint": "Is the cutoff based on a minimum skill level or on ranking against others?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretation", "q": "From a single elevated score on a test-anxiety scale, a report concludes the student 'has a general tendency toward high test anxiety.' In Sundberg's levels of interpretation, this is:", "opts": ["Level I: direct sample", "Level II: descriptive generalization", "Level III: dynamic case conceptualization", "Extra-test behavior"], "ans": 1, "why": "Level II includes DESCRIPTIVE GENERALIZATION: expanding a specific score into a general trait category. Level I treats data as a direct sample with no inference. Level III integrates everything into a full, high-inference model of the person.", "hint": "One score has been expanded into a general trait."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Equivalence", "q": "A team adapting a 'self-esteem' scale finds that in the new culture, the construct itself is understood differently, as tied to family honor rather than individual worth. Which type of test equivalence is in question?", "opts": ["Parallel-forms equivalence", "Conceptual equivalence", "Metric equivalence", "Linguistic equivalence"], "ans": 1, "why": "Conceptual equivalence = the construct has the same MEANING across cultures. Linguistic equivalence = accurate wording and translation. Metric equivalence = the same psychometric properties across groups. A perfect translation can still fail conceptually.", "hint": "The problem isn't the words; it's what the idea means."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration Challenges", "q": "Halfway through a timed group intelligence test, a fire drill forces everyone out of the room for 15 minutes. What is the most appropriate response?", "opts": ["Ignore it and score the tests normally without mention", "Give everyone extra points to make up for it", "Document the irregularity and consider its effect on the scores' validity in the report (or re-test if the manual requires)", "Tell examinees the answers they missed"], "ans": 2, "why": "Unusual administration conditions are a source of error. The examiner should record the irregularity, follow the manual's guidance (which may require a re-test), and note any reservations in the interpretation. The Code says we must indicate reservations about interpretations.", "hint": "Something non-standard happened. What should the record say?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration Challenges", "q": "During an individually administered vocabulary subtest, the examinee asks, 'What does that word mean?' What should the examiner do?", "opts": ["Give only the neutral prompts allowed by the manual, without defining or hinting at the word", "Explain the word so the examinee isn't anxious", "Give a synonym as a hint", "Skip the rest of the subtest"], "ans": 0, "why": "Standardized administration means following the manual exactly. Defining a word on a VOCABULARY test gives away the answer and changes what's being measured. Rapport should ease anxiety without providing unfair hints or encouragement.", "hint": "What is a vocabulary subtest actually measuring?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration Challenges", "q": "A 7-year-old becomes tired and restless halfway through a long test battery and starts guessing randomly. What is the best course of action?", "opts": ["Push through so the battery finishes today", "Discard all results without noting why", "Score the random guesses as her true ability", "Allow a break or continue in another session, and note the fatigue as extra-test behavior"], "ans": 3, "why": "Test-taker state factors like fatigue and low motivation are sources of error variance. Breaks (where the manual permits) or a second session protect validity, and noting the behavior helps interpretation.", "hint": "What causes error here, and how can you protect the results?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A court orders a psychological evaluation of a defendant. Under the Code of Ethics, is the psychologist required to obtain the defendant's informed consent before assessment?", "opts": ["Yes, but only from the judge", "No, informed consent is not required when the assessment is mandated by law", "Yes, informed consent is always required with no exceptions", "No, because defendants have no right to privacy"], "ans": 1, "why": "The Code says we gather informed consent prior to assessment EXCEPT when (a) it is mandated by law, (b) consent is implied, as in routine educational, institutional, and organizational activity, or (c) the purpose is to determine the person's decisional capacity. NOTE: the reviewer lists these three without the word 'EXCEPT,' which flips the meaning. They are EXCEPTIONS to the consent requirement.", "hint": "The Code lists situations where consent is NOT needed. Is a court order one of them?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A school gives its yearly routine group achievement test to all Grade 9 students as part of normal school operations. What kind of consent situation is this under the Code?", "opts": ["Implied consent, as in routine educational activity", "Consent is not possible for minors, so the test cannot be given", "Consent must be signed individually by every student before testing", "Only verbal assent from the principal is needed"], "ans": 0, "why": "Routine educational, institutional, or organizational assessments fall under IMPLIED consent, one of the three exceptions to formal informed consent (along with assessments mandated by law and decisional-capacity evaluations).", "hint": "Routine school activity falls under one of the three consent exceptions."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A client's employer calls and asks the psychometrician to email the client's raw and scaled scores on the personality test. What should she do?", "opts": ["Post the scores to the company's shared drive for transparency", "Send the scores, since the employer paid for the assessment", "Decline to release raw and scaled scores; share results only as agreed with the referral source and with proper consent", "Send only the raw scores, since they're less sensitive"], "ans": 2, "why": "The Code says 'We do not release test data in the forms of raw and scaled scores.' Results go only to those explicitly agreed upon with the referral source, and with written permission for self-referrals. Raw scores can be misinterpreted by untrained readers.", "hint": "What does the Code say about raw and scaled scores?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "To decide a student's special-class placement this year, a counselor plans to rely on an IQ score from a test the student took six years ago. What is the ethical concern?", "opts": ["She needs the parents' permission to read old records", "It is fine as long as the test was standardized", "Old IQ scores are always more accurate", "Interpretations and recommendations should not be based on outdated test results"], "ans": 3, "why": "We do not base interpretations, conclusions, and recommendations on OUTDATED test results, nor on OBSOLETE tests. Abilities and norms change (remember the Flynn effect), so a current assessment is needed.", "hint": "How current must test results be?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "To save money, a testing center makes photocopies of a published test booklet and answer sheet for a large group administration. Which standard does this violate?", "opts": ["Use only original test materials, not photocopies", "Discuss the limits of confidentiality", "Avoid multiple relationships", "Explain results in non-technical language"], "ans": 0, "why": "Under the Assessment Tools standard: 'We use only original copies of test materials (not photocopies).' Photocopying also violates test security and copyright.", "hint": "What kind of test materials should be used?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician is asked to assess her own cousin, who is applying to the company where she works. What is the most appropriate action?", "opts": ["Proceed, since she knows the cousin's background well", "Avoid the multiple relationship by referring the assessment to a colleague", "Ask the cousin to sign a waiver and continue", "Proceed but give slightly lower scores to stay objective"], "ans": 1, "why": "Refrain from a multiple relationship that could reasonably be expected to impair objectivity, competence, or effectiveness, or that risks exploitation or harm. Assessing a relative for a hiring decision is a clear conflict, so refer it out.", "hint": "Could her objectivity be questioned?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician notices a colleague leaving a client's test folder unattended on a café table. It appears to be a minor lapse, and no confidentiality would be violated by speaking up. What is the appropriate FIRST step?", "opts": ["Immediately file a formal complaint with the PRC", "Ignore it since no harm has happened yet", "Post about it on social media to warn others", "Bring it to the colleague's attention informally"], "ans": 3, "why": "Informal resolution: when appropriate, first bring the issue to the attention of the professional concerned, if informal resolution is sufficient and doesn't violate confidentiality. Formal reporting comes next if the issue isn't resolved or is serious.", "hint": "For a minor lapse, what's the gentlest step that could fix it?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "At the very start of a counseling intake, a psychometrician explains that what the client shares is confidential except where the law requires disclosure, such as serious risk of harm. Which ethical duty is she fulfilling?", "opts": ["Cooperating with an ethics committee", "Avoiding a multiple relationship", "Discussing the limitations of confidentiality", "Releasing test data"], "ans": 2, "why": "We have a duty to discuss the LIMITS of confidentiality with clients (due to laws, institutional rules, or professional relationships) and explain all anticipated uses of the information they disclose.", "hint": "Clients should know, from the start, when confidentiality can be broken."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A 12-year-old is referred for a psychoeducational assessment. Whose agreement is needed?", "opts": ["Informed consent from the parent or guardian, plus the child's assent", "No agreement is needed for minors", "Only the child's verbal agreement", "Only the teacher's signature"], "ans": 0, "why": "For minors or people legally incapable of consent, the parent, guardian, or legal representative gives informed consent and is told the limits of confidentiality. The child gives ASSENT, which respects their dignity and understanding.", "hint": "A minor can't give legal consent alone."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "After assessing a child, a psychologist meets with the parents to explain the results. How should the findings be communicated?", "opts": ["Only in writing, with no discussion", "In non-technical language the parents can understand", "Using exact raw and scaled scores and statistical terms", "Only to the child's teacher"], "ans": 1, "why": "When findings are explained to relatives, parents, or teachers, we explain them in NON-TECHNICAL language. Technical jargon and raw scores invite misunderstanding.", "hint": "Parents aren't psychologists."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "An HR clerk with no psychology background wants to give and interpret a personality test on her own because she 'read the manual.' What does the Code say?", "opts": ["She may interpret it but not score it", "She may use it since the manual is clear", "She may use it if the applicants agree", "Assessment tools should not be used by unqualified persons, except for training with adequate supervision"], "ans": 3, "why": "We do not promote the use of assessment tools and methods by unqualified persons, except for training purposes with adequate supervision. Protocols and records must also be kept secure from unqualified persons.", "hint": "Who is allowed to use assessment tools?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A client takes a timed online cognitive test from home. What does the Code specifically require the psychometrician to tell her beforehand?", "opts": ["That she may look up answers online", "How poor internet connectivity could affect her performance, especially on timed tests", "That online results are always more accurate", "Nothing, since online tests don't need consent"], "ans": 1, "why": "For online assessment, we inform test takers of the implications of poor internet connectivity on their performance, particularly for timed assessments. We also tell them about privacy risks in electronic transmission.", "hint": "Online testing has a specific technical risk to explain."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "RA 10029", "q": "Under RA 10029, a board examinee gets a weighted general average of 78% but scores 58% in one subject. What happens?", "opts": ["She passes because her weighted average is above 75%", "She fails and must retake all subjects", "She passes as long as no subject is below 50%", "She may retake that subject within two years and must score at least 75% in it to pass"], "ans": 3, "why": "To pass: a weighted general average of at least 75%, with NO subject below 60%. An examinee with WGA ≥ 75% but a subject below 60% may retake that subject within the next two years and must get at least 75% in it to be deemed passed.", "hint": "There are two rules: the overall average, and the minimum per subject."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Laws", "q": "A company's HR department plans to store applicants' psychological test results in a cloud folder that the whole office can access. Which Philippine law most directly governs how this personal information must be protected?", "opts": ["RA 10173, the Data Privacy Act", "RA 11036, the Mental Health Act", "RA 7877, the Anti-Sexual Harassment Act", "RA 9258, the Guidance and Counseling Act"], "ans": 0, "why": "RA 10173 (Data Privacy Act) governs the processing and protection of personal information. RA 11036 = Mental Health Act; RA 9258 = Guidance and Counseling Act; RA 7877 = Anti-Sexual Harassment Act; RA 10029 = Philippine Psychology Act.", "hint": "Which law is about personal information?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Laws", "q": "Which law aims to establish a comprehensive national mental health care system and integrate mental health promotion into schools, workplaces, and communities?", "opts": ["RA 10029 (Philippine Psychology Act)", "RA 9165 (Comprehensive Dangerous Drugs Act)", "RA 11036 (Mental Health Act)", "RA 12080 (Basic Education Mental Health and Well-Being Promotion Act)"], "ans": 2, "why": "RA 11036's objectives include strong mental health governance, a comprehensive national mental health care system, protecting the rights of people with psychiatric, neurologic, and psychosocial needs, and integrating mental health in schools, workplaces, and communities. RA 12080 is specific to basic education.", "hint": "It's about the national mental health care system."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychologist is angry at a rival and files an ethics complaint against her without checking facts that would clearly disprove the allegation. Which standard is being violated?", "opts": ["Informal resolution", "Release of test data", "Improper complaints", "Cooperating with ethics committees"], "ans": 2, "why": "Improper complaints: we refrain from filing ethical complaints with reckless disregard or willful ignorance of facts that would disprove the allegations, or without supporting factual evidence.", "hint": "Filing without checking the facts."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "Which ethical principle covers doing no harm, maximizing benefits, developing and maintaining competence, self-knowledge, and delivering services competently online (telepsychology)?", "opts": ["Principle I: Respect for the dignity of persons and peoples", "Principle II: Competent caring for the well-being of persons and peoples", "Principle III: Integrity", "Principle IV: Professional and scientific responsibilities to society"], "ans": 1, "why": "Principle II (Competent Caring) = working for clients' benefit and above all doing no harm, maximizing benefit and minimizing harm, competence, self-knowledge, and telepsychology. Principle I = dignity, diversity, informed consent, privacy. Principle III = honesty, avoiding conflicts of interest. Principle IV = responsibility to society.", "hint": "Doing no harm and competence belong to which principle?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician is offered a commission by a test publisher for every booklet her company buys, and she is the one who recommends which test the company should use. Which ethical principle is most at stake?", "opts": ["Respect for the dignity of persons", "Integrity (avoiding conflicts of interest)", "Professional responsibilities to society", "Competent caring"], "ans": 1, "why": "Principle III, Integrity, covers honesty, maximizing impartiality, not exploiting persons, and AVOIDING CONFLICTS OF INTEREST. A commission tied to her own recommendation creates a clear conflict of interest.", "hint": "Her personal gain could bias her recommendation."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A police officer asks a psychologist for a client's test results without the client's consent and without a court order. When may confidential information be disclosed WITHOUT the client's consent?", "opts": ["Never, under any circumstance", "Whenever a person in authority asks for it", "Whenever the psychologist thinks it would help", "Only when disclosure is mandated or permitted by law"], "ans": 3, "why": "The Code: disclose confidential information without the consent of the client or legal representative ONLY when mandated or permitted by law, and limit what is disclosed to what's needed for the purpose. An informal request from authority isn't enough.", "hint": "Who can authorize disclosure without the client's consent?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "During therapy, a client credibly tells his psychologist he plans to seriously harm a specific, identifiable person. The landmark case that established the clinician's duty in this situation is:", "opts": ["The Georgetown criteria: competency to stand trial", "RA 7877: sexual harassment", "Tarasoff v. Regents of the University of California: the duty to warn/protect the intended victim", "The ALI standard: criminal responsibility"], "ans": 2, "why": "Tarasoff (1974/1976) established the DUTY TO WARN: when a client poses a serious danger to an identifiable person, confidentiality can be overridden to protect them. It's a classic limit of confidentiality that clients should be told about at the start. (Source: Ms. Chiqui's notes)", "hint": "A specific, identifiable person is in danger."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A court issues an order requiring a psychologist to submit a client's raw test protocols and scores. Normally raw data isn't released. What does the PAP Code allow here?", "opts": ["Raw data can never be released under any circumstance", "Raw data may be given to anyone who asks politely", "Raw and scaled scores may be released when regulated by the court", "The psychologist should destroy the data to protect the client"], "ans": 2, "why": "The Code: do not release test data as raw and scaled scores, client responses, or notes about the client's behavior during testing, UNLESS regulated by the court. Destroying data would itself be a violation. (Source: PAP Code of Ethics, Ms. Chiqui's folder)", "hint": "The rule against releasing raw data has one stated exception."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A company director orders the in-house psychometrician to release applicants' individual test answers to line managers, which would violate the Code of Ethics. According to the Code's hierarchy for resolving such conflicts, what should she do?", "opts": ["Release the data but ask managers to keep it secret", "Quit immediately without saying anything", "Follow the director because the organization comes first", "Make her commitment to the Code known and resolve the conflict in line with the Code (Law > Ethics > Organization)"], "ans": 3, "why": "When the Code conflicts with organizational demands, we make our commitment to the Code known and resolve the conflict accordingly. The priority is LAW > ETHICS > ORGANIZATION. When the Code conflicts with the LAW, we try to resolve it first, but adhere to the law if it can't be resolved. (Source: PAP Code of Ethics, Ms. Chiqui's folder)", "hint": "Recall the priority order of law, ethics, and the organization."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychologist learns that a colleague is using an obsolete IQ test to make special-education placement decisions that are likely to seriously harm several children. Informal discussion didn't stop it. What is the appropriate next step?", "opts": ["Do nothing, since she already spoke to the colleague", "Report the violation to the appropriate institutional authorities", "Post about the colleague online", "Secretly change the colleague's reports"], "ans": 1, "why": "Informal resolution comes first. But when there is likely to be SUBSTANTIAL HARM, or informal resolution fails, we take further action and report the violation to appropriate institutional authorities, unless doing so would violate confidentiality rights.", "hint": "Informal resolution was tried and the harm is serious."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician finds that a test's norms are 25 years old and the client differs from the norm group in language and culture. She still decides to report the results. What does the Code require her to do in the report?", "opts": ["Leave out the scores but keep the conclusions", "Report the scores as completely accurate", "Adjust the scores upward to be fair", "Indicate her reservations about the interpretation, considering the test's validity, reliability, and appropriateness"], "ans": 3, "why": "Under no circumstances should we report results without considering the validity, reliability, and appropriateness of the test, and we must indicate reservations about the interpretations. Ideally, outdated tests shouldn't be the basis of conclusions at all. (Source: PAP Code of Ethics, Ms. Chiqui's folder)", "hint": "The Code wants honesty about the test's limits."}], "flashcards": [{"subj": "io", "t": "Unity of command", "d": "Each subordinate answers to only ONE superior (part of the scalar principle)"}, {"subj": "io", "t": "Scalar principle", "d": "Chain of command; vertical growth of the organization through added levels"}, {"subj": "io", "t": "Functional principle", "d": "Division of labor into units doing similar functions; horizontal growth"}, {"subj": "io", "t": "Line vs. staff functions", "d": "Line = directly meets major goals; Staff = supports the line"}, {"subj": "io", "t": "Span of control", "d": "Number of subordinates one manager supervises (Urwick: about 5–6 is optimal)"}, {"subj": "io", "t": "Scientific Management", "d": "Frederick Taylor; time studies to find the \"one best way\"; scientific selection and training"}, {"subj": "io", "t": "Bureaucracy", "d": "Max Weber; hierarchy, formal rules, division of labor, impersonality, merit, written records"}, {"subj": "io", "t": "Administrative Theory", "d": "Henri Fayol; what managers do: Plan, Organize, Command, Coordinate, Control; 14 principles"}, {"subj": "io", "t": "Esprit de corps", "d": "Fayol principle: sense of belonging and team spirit within the organization"}, {"subj": "io", "t": "Hawthorne effect", "d": "Elton Mayo; people change behavior because they know they're being observed"}, {"subj": "io", "t": "Chester Barnard", "d": "Organizations are cooperative systems; authority depends on subordinates' acceptance"}, {"subj": "io", "t": "Herbert Simon", "d": "Bounded rationality; managers SATISFICE (choose \"good enough\"), not optimize"}, {"subj": "io", "t": "Chris Argyris", "d": "Growth perspective; healthy organizations help people grow from passive to active"}, {"subj": "io", "t": "Theory X", "d": "McGregor; assumes workers are lazy and avoid work, so management is controlling/authoritarian"}, {"subj": "io", "t": "Theory Y", "d": "McGregor; assumes workers are self-motivated and seek responsibility, so management is participative"}, {"subj": "io", "t": "Self-fulfilling prophecy", "d": "Employees come to act the way managers expect them to act"}, {"subj": "io", "t": "Contingency theory", "d": "\"It depends\": no one best way to organize or lead"}, {"subj": "io", "t": "Joan Woodward", "d": "Contingency model based on TECHNOLOGY (unit/small-batch, mass, continuous-process)"}, {"subj": "io", "t": "Lawrence and Lorsch", "d": "Contingency model based on ENVIRONMENT; differentiation and integration"}, {"subj": "io", "t": "Open systems (Katz and Kahn)", "d": "Organizations exchange inputs → throughput → outputs with the environment"}, {"subj": "io", "t": "Equifinality", "d": "Same end state reached from different starting points and paths"}, {"subj": "io", "t": "Negative entropy (negentropy)", "d": "Importing more energy and resources than spent, to avoid decay"}, {"subj": "io", "t": "Maslow's hierarchy", "d": "Physiological → Safety → Love/Belonging → Esteem → Self-actualization; firs /* ---------- bonus PA math: computed at round creation, never added to the bank ---------- */
const GENERATORS = [
  ["zT",1],["Tz",1],["zIQ",1],["IQz",1],["zStanine",1],["stanineZ",1],["percentile",1],
  ["sem",1],["cvr",1],["sb",1],["r2",2],["alienation",2],["dfFit",2],["dfInd",2],
  ["bonferroni",2],["pairs",2],["difficulty",3],["discrimination",3],["optimal",3],["selection",5]
].map(([id,set]) => ({id,set}));
const int = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const dec = (n, places = 2) => Number(n.toFixed(places)).toString();
const difficultyBand = p => p < .2 ? "Very difficult" : p < .4 ? "Difficult" : p <= .6 ? "Average" : p < .8 ? "Easy" : "Very easy";
const discriminationBand = d => d < 0 ? "Negative: check the key" : d < .2 ? "Poor" : d < .3 ? "Marginal" : d < .4 ? "Good" : "Very good";
function generate(id){
  const g = GENERATORS.find(g => g.id === id), set = Object.keys(DATA.tos.pa).find(s => s.startsWith(`Set ${g.set} -`));
  let q, answer, wrong, why, hint = "Write the formula first and identify the denominator.";
  const z = shuffle([-2,-1,1,2])[0];
  if (["zT","Tz","zIQ","IQz","zStanine","stanineZ"].includes(id)) {
    const type = id.includes("T") ? "T" : id.includes("IQ") ? "deviation IQ" : "stanine";
    const mean = type === "T" ? 50 : type === "deviation IQ" ? 100 : 5, sd = type === "T" ? 10 : type === "deviation IQ" ? 15 : 2;
    const forward = id.startsWith("z"), value = mean + sd * z;
    q = forward ? `A student has z = ${z}. On a ${type} scale (mean ${mean}, SD ${sd}), what is the converted score?${type === "stanine" ? " Use rounded 5 + 2z, bounded from 1 to 9." : ""}`
      : `A student has ${type} = ${value} (scale mean ${mean}, SD ${sd}). What is the corresponding z score?${type === "stanine" ? " Use the approximate linear conversion." : ""}`;
    answer = dec(forward ? value : z);
    wrong = (forward ? [mean + z, sd * z, mean - sd * z, mean + sd / z, mean + sd + z] : [value / sd, value - mean, (mean - value) / sd, (value + mean) / sd, value / mean]).map(x => dec(x));
    why = forward ? `Score = mean + SD × z = ${mean} + ${sd} × (${z}) = ${value}. Do not omit the mean or use z as the raw score.`
      : `z = (score − mean) / SD = (${value} − ${mean}) / ${sd} = ${z}. Dividing the raw score by SD omits centering.`;
    hint = "How many scale SDs above or below the mean does this score represent?";
  } else if (id === "percentile") {
    const table = {"-2":2.28,"-1":15.87,"1":84.13,"2":97.72};
    q = `In a normal distribution, z = ${z} corresponds approximately to which percentile (percentage below the score)?`;
    answer = `${table[z]}%`; wrong = [100-table[z],68.27,95.45,50,34.13].map(x => `${dec(x)}%`);
    why = `The standard normal cumulative area below z = ${z} is about ${table[z]}%. The area between ±1 or ±2 SD is not the percentile of one boundary.`;
    hint = "A percentile is the area to the left, not the area between two boundaries.";
  } else if (id === "sem") {
    const sd = int(5,12), k = int(2,5), r = 1 - 1 / (k*k), x = int(60,110), level = int(0,1) ? 95 : 68, m = level === 95 ? 2 : 1;
    const band = width => `${dec(x-width)} to ${dec(x+width)}`;
    q = `Observed score = ${x}, SD = ${sd}, reliability = ${dec(r,4)}. What is the approximate ${level}% confidence interval? Use SEM = SD√(1−r) and ${m === 2 ? "±2 SEM for 95%" : "±1 SEM for 68%"}. Round endpoints to 2 decimals.`;
    // Keep r exact to the displayed precision when k=3 (recurring decimal).
    const exactSEM = sd * Math.sqrt(1-Number(dec(r,4)));
    answer = band(m * exactSEM); wrong = [m === 2 ? exactSEM : 2*exactSEM, m*sd*(1-Number(dec(r,4))), m*sd, m*sd*Math.sqrt(Number(dec(r,4))), exactSEM/2].map(band);
    why = `SEM = ${sd}√(1−${dec(r,4)}) = ${dec(exactSEM,4)}. Apply ±${m} SEM: ${answer}. Using SD directly ignores reliability; 95% here explicitly uses the ±2 approximation.`;
    hint = "First find SEM, then apply the multiplier stated for this confidence level.";
  } else if (id === "cvr") {
    const n = int(10,20), e = int(Math.ceil(n*.6),n-1);
    q = `${e} of ${n} experts rate an item essential. What is Lawshe's CVR? Round to 2 decimals.`;
    answer = dec((e-n/2)/(n/2)); wrong = [e/n,(e-n/2)/n,(n-e)/n,2*e/n,(e-n)/n].map(x => dec(x));
    why = `CVR = (ne − N/2) / (N/2) = (${e} − ${n/2}) / ${n/2} = ${answer}. The proportion essential (${dec(e/n)}) is not CVR.`;
  } else if (id === "sb") {
    const r = int(3,8)/10;
    q = `Two equal test halves correlate r = ${r}. What is the Spearman–Brown estimate of full-test reliability? Round to 2 decimals.`;
    answer = dec(2*r/(1+r)); wrong = [r,r*r,2*r,2*r/(1-r),r/(1+r)].map(x => dec(x));
    why = `Full-test reliability = 2r / (1+r) = ${2*r} / ${dec(1+r)} = ${answer}. The half-test correlation alone underestimates full-test reliability.`;
  } else if (id === "r2" || id === "alienation") {
    const r = int(3,9)/10, alien = id === "alienation";
    q = `Two measures correlate r = ${r}. What is ${alien ? "the coefficient of alienation, √(1−r²) (not the unexplained-variance proportion)" : "the coefficient of determination, r²"}? Round to 2 decimals.`;
    answer = dec(alien ? Math.sqrt(1-r*r) : r*r);
    wrong = [r,1-r*r,1-r,Math.sqrt(r),alien ? r*r : Math.sqrt(1-r*r)].map(x => dec(x));
    why = alien ? `Alienation = √(1−${r}²) = √${dec(1-r*r)} = ${answer}. The unexplained-variance proportion is 1−r², before taking the square root.` : `r² = ${r} × ${r} = ${answer}. The correlation itself is not the proportion of variance explained.`;
    hint = "Distinguish r, r squared, and the square root of unexplained variance.";
  } else if (id === "dfFit" || id === "dfInd") {
    const rows = int(2,5), cols = int(3,7), fit = id === "dfFit";
    q = fit ? `A chi-square goodness-of-fit test compares ${cols} categories against fully specified probabilities; no parameters are estimated. What is df?`
      : `A chi-square test of independence uses a ${rows} × ${cols} contingency table. What is df?`;
    answer = String(fit ? cols-1 : (rows-1)*(cols-1));
    wrong = (fit ? [cols,cols-2,cols+1,cols*2,cols*cols] : [rows*cols,rows+cols-2,rows*cols-1,(rows-1)*cols,rows*(cols-1),rows+cols]).map(String);
    why = fit ? `With no estimated parameters, df = k−1 = ${cols}−1 = ${answer}. Estimating distribution parameters would require additional subtraction.`
      : `df = (rows−1)(columns−1) = (${rows}−1)(${cols}−1) = ${answer}. Subtracting one from the total number of cells is incorrect.`;
  } else if (id === "bonferroni") {
    const n = int(2,10), alpha = .05;
    q = `A researcher plans ${n} comparisons and wants familywise α = 0.05. What is Bonferroni's per-comparison α? Round to 4 decimals.`;
    answer = dec(alpha/n,4); wrong = [alpha,alpha*n,alpha/(n-1),1-alpha/n,alpha/(n+1)].map(x => dec(x,4));
    why = `Per-comparison α = familywise α / number of tests = 0.05 / ${n} = ${answer}. Multiplying increases rather than controls the error allowance.`;
  } else if (id === "pairs") {
    const n = int(5,14);
    q = `A psychologist compares every pair of ${n} stimuli once. How many unique unordered pairs are needed?`;
    answer = String(n*(n-1)/2); wrong = [n*(n-1),n*n,n*(n+1)/2,n-1,n*2].map(String);
    why = `Pairs = n(n−1)/2 = ${n}(${n-1})/2 = ${answer}. Without dividing by 2, each pair is counted twice.`;
  } else if (id === "difficulty") {
    const n = int(4,10)*10, correct = int(1,n-1), p = correct/n;
    q = `${correct} of ${n} students answer correctly. Find item difficulty p and its band. Use <.20 very difficult; .20–<.40 difficult; .40–.60 average; >.60–<.80 easy; ≥.80 very easy. Round p to 2 decimals after classifying.`;
    const label = x => `${dec(x)} · ${difficultyBand(x)}`;
    answer = label(p); wrong = [label(1-p),`${dec(p)} · ${p <= .6 ? "Easy" : "Difficult"}`,label(p/2),label(p*p),label(Math.sqrt(p))];
    why = `p = correct / total = ${correct}/${n} = ${dec(p,4)}: ${difficultyBand(p)} by the stated bands. Larger p means easier, not harder.`;
  } else if (id === "discrimination") {
    const n = 20, upper = int(9,19), lower = int(2,17), d = (upper-lower)/n;
    q = `Equal upper and lower groups each contain ${n} students. ${upper} upper-group and ${lower} lower-group students answer correctly. Find d and its band. Use negative: check key; 0–<.20 poor; .20–<.30 marginal; .30–<.40 good; ≥.40 very good.`;
    const label = x => `${dec(x)} · ${discriminationBand(x)}`;
    answer = label(d); wrong = [label(-d),label(d/2),label((upper+lower)/(2*n)),`${dec(d)} · ${d >= .3 ? "Poor" : "Very good"}`,label(upper/n),label(lower/n)];
    why = `d = (U−L)/one group's size = (${upper}−${lower})/${n} = ${dec(d)}: ${discriminationBand(d)} by the stated bands. Dividing by both groups' combined size halves d incorrectly.`;
  } else if (id === "optimal") {
    const n = int(3,6);
    q = `Using the midpoint heuristic p = (1 + chance success)/2, what is the optimal difficulty for a ${n}-option item? Round to 3 decimals.`;
    answer = dec((1+1/n)/2,3); wrong = [1/n,.5,(1-1/n)/2,1-1/n,1/(2*n)].map(x => dec(x,3));
    why = `Chance = 1/${n}. The specified midpoint heuristic gives p = (1 + 1/${n})/2 = ${answer}. This heuristic is not a universal optimum for every testing purpose.`;
    hint = "Locate the midpoint between chance success and perfect success.";
  } else if (id === "selection") {
    const applicants = int(5,15)*10, selected = int(1,4)*10;
    q = `An organization selects ${selected} of ${applicants} applicants. What is the selection ratio? Round to 2 decimals.`;
    answer = dec(selected/applicants); wrong = [applicants/selected,1-selected/applicants,selected/(applicants+selected),selected/100,applicants/(applicants+selected)].map(x => dec(x));
    why = `Selection ratio = selected / applicants = ${selected}/${applicants} = ${answer}. Applicants divided by selected reverses the ratio.`;
  }
  const distractors = [...new Set(wrong)].filter(x => x !== answer).slice(0,3);
  if (distractors.length !== 3) return generate(id);
  const opts = shuffle([answer,...distractors]);
  return {subj:"pa",set,topic:"Bonus math · " + short(set),q,opts,ans:opts.indexOf(answer),why,hint,generated:id};
}

/* ---------- practice selection and local sessions ---------- */
let savedSession = store.get("session", null);
function saveSession(s){ savedSession = s; store.set("session", s) }
const item = x => typeof x === "number" ? Q[x] : x;
function preferred(idx){
  const unique = [...new Map(idx.map(x => [item(x).q, x])).values()];
  return shuffle(unique).sort((a, b) => Number(!!seen[item(a).q]) - Number(!!seen[item(b).q]) || (lastTs[item(a).q] || 0) - (lastTs[item(b).q] || 0));
}
function practice(idx, n = idx.length){
  // Bonus math replaces a few slots; the static bank and its progress denominator stay unchanged.
  let out = preferred(idx).slice(0, n);
  if (subj === "pa") {
    const sets = [...new Set(idx.map(x => item(x).set))];
    const bonus = shuffle(GENERATORS.filter(g => sets.some(s => s.startsWith(`Set ${g.set} -`)))).slice(0, Math.max(1, Math.floor(out.length / 5)));
    out.splice(Math.max(0, out.length - bonus.length), bonus.length, ...bonus.map(g => generate(g.id)));
  }
  return out;
}
function mockPlan(){
  const parts = [];
  for (const [set, n] of Object.entries(DATA.tos[subj])) {
    const combined = subj === "pa" && /^Set [23] -/.test(set);
    let part = combined && parts.find(p => p.name === "Research & Stats");
    if (!part) { part = { name: combined ? "Research & Stats" : short(set), sets: [], count: 0 }; parts.push(part) }
    part.sets.push([set, n]); part.count += n;
  }
  return parts;
}
function mockExamList(){
  return mockPlan().flatMap((part, p) => shuffle(part.sets.flatMap(([set, n]) =>

}
function sessionLabel(s){
  if (s.type === "cards") return `Flashcards · ${s.mode === "quiz" ? "Quiz me" : "Flip"} · ${s.i + 1} of ${s.deck.length}`;
  if (s.key.endsWith("-mock")) {
    const p = s.list[s.i]?.part || 0, rows = s.list.filter(q => q.part === p);
    return `Mock exam · Part ${p + 1} of ${s.parts.length} · ${s.list.slice(0, s.i + 1).filter(q => q.part === p).length} of ${rows.length}`;
  }
  return `${s.key === "mixed" ? "Mixed 20" : s.key === "redo" ? "Redo pile" : short(s.key)} · ${s.i + 1} of ${s.list.length}`;
}
function resumeSession(){
  const s = savedSession; if (!s) return home();
  subj = s.subj; store.set("subj", subj);
  if (s.type === "cards") return cards(s);
  // Keep saved options/keys intact; only remove bank questions that no longer exist.
  const keep = s.list.map((q, i) => q.generated || byText.has(q.q) ? i : -1).filter(i => i >= 0);
  const next = keep.findIndex(k => k >= s.i);
  if (keep.length !== s.list.length) {
    s.list = keep.map(k => s.list[k]); s.picks = keep.map(k => s.picks[k]); s.hinted = keep.map(k => s.hinted[k]);
    s.i = next < 0 ? Math.max(0, s.list.length - 1) : next;
  }
  if (!s.list.length) { saveSession(null); return home() }
  quiz(s.list, s.key, s);
}

/* ---------- quiz ---------- */
function quiz(list, key, restored = null){
  const s = restored || {type:"quiz", subj, key, list:list.map(x => ({...item(x)})), i:0, picks:[], hinted:[], parts:key.endsWith("-mock") ? mockPlan() : []};
  list = s.list;
  setTab("quiz"); app.classList.add("wide");
  const picks = s.picks, hinted = s.hinted;
  let i = s.i, completed = false, reviewMisses = null;
  const isMock = key.endsWith("-mock");
  const answered = () => picks.filter(p => p != null).length;
  const score = () => list.filter((q,k) => picks[k] === q.ans).length;
  const misses = () => list.map((q,k) => picks[k] != null && picks[k] !== q.ans ? k : -1).filter(k => k >= 0);
  const save = () => { if (!completed) { s.i = i; saveSession(s) } };
  const partLabel = () => {
    const p = list[i].part, rows = list.filter(q => q.part === p);
    return `Part ${p+1} of ${s.parts.length} · ${s.parts[p].name} · ${list.slice(0,i+1).filter(q => q.part === p).length} of ${rows.length}`;
  };
  function show(){
    save();
    const q = list[i], picked = picks[i];
    app.innerHTML = `
      <div class="qhead"><button class="back press" id="menu">${LEFT}Menu</button><span class="num">${isMock ? esc(partLabel()) : `${i+1} of ${list.length}`}</span></div>
      <div class="bar"><div style="width:${answered()/list.length*100}%"></div></div>
      <div class="qgrid"><div class="qmain"><p class="qtopic">${esc(q.topic)}</p><p class="qtext">${esc(q.q)}</p>
        <div class="rows stagger" id="opts">${q.opts.map((o,n) => `<button class="opt press" data-n="${n}" style="animation-delay:${n*60}ms"><span class="k">${n+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div id="hintbox">${!isMock && hinted[i] ? hintHTML(q) : ""}</div><div id="ctl"></div></div><div id="after"></div></div>`;
    document.getElementById("menu").onclick = home;
    document.getElementById("opts").onclick = e => { const b = e.target.closest(".opt"); if (b && !b.disabled) pick(+b.dataset.n) };
    picked == null ? askControls() : reveal(picked, false);
  }
  const hintHTML = q => `<div class="why hintb"><b>Hint</b>${esc(q.hint)}</div>`;
  const prevBtn = () => `<button class="secondary press" id="prev" ${i === 0 || reviewMisses && i === reviewMisses[0] ? "disabled" : ""}>${LEFT}Previous</button>`;
  const keys = `<p class="hint keys"><kbd>1</kbd>–<kbd>4</kbd> answer${isMock ? "" : " · <kbd>H</kbd> hint"} · <kbd>Enter</kbd> next · <kbd>←</kbd> previous · <kbd>Esc</kbd> menu</p>`;
  function wirePrev(){ document.getElementById("prev").onclick = () => { if (i > 0) { i = reviewMisses ? reviewMisses[Math.max(0,reviewMisses.indexOf(i)-1)] : i-1; show(); scrollTo(0,0) } } }
  function askControls(){
    document.getElementById("ctl").innerHTML = `<div class="two next">${prevBtn()}${isMock ? "" : `<button class="secondary press" id="hintbtn" ${hinted[i] ? "disabled" : ""}>${hinted[i] ? "Hint shown" : "Hint"}</button>`}</div><p class="hint mob">Tap an answer.</p>${keys}`;
    wirePrev();
    document.getElementById("hintbtn")?.addEventListener("click", () => {
      if (hinted[i]) return;
      hinted[i] = true; save(); document.getElementById("hintbox").innerHTML = hintHTML(list[i]); askControls();
    });
  }
  function pick(n){
    if (picks[i] != null || completed) return;
    const q = list[i], ok = n === q.ans;
    picks[i] = n; recordAnswer(q,ok); rewardAnswer(ok,hinted[i]); save();
    if (ok) burst(document.querySelectorAll(".opt")[n]);
    reveal(n,true);
  }
  function reveal(n,fresh){
    const q = list[i], ok = n === q.ans, last = reviewMisses ? i === reviewMisses[reviewMisses.length-1] : i === list.length-1;
    document.querySelectorAll(".opt").forEach((b,k) => {
      b.disabled = true;
      if (isMock && !completed) { if (k === n) b.setAttribute("aria-label", "Selected: " + q.opts[k]); b.classList.toggle("selected", k === n) }
      else b.classList.add(k === q.ans ? "right" : k === n ? "wrong" : "dim");
    });
    document.querySelector(".bar>div").style.width = answered()/list.length*100 + "%";
    document.getElementById("ctl").innerHTML = "";
    document.getElementById("after").innerHTML = `
      ${isMock && !completed ? '<p class="hint">Answer saved. Explanations appear after completion.</p>' : `<div class="why"><b class="${ok ? "ok" : "no"}">${ok ? "Correct" : "Answer: " + (q.ans+1)}</b>${esc(q.why)}</div>`}
      <button class="primary press next" id="nx">${last ? "See my score" : "Next question"}</button><div class="two">${prevBtn()}<span></span></div>${keys}`;
    wirePrev();
    const nx = document.getElementById("nx");
    nx.onclick = () => {
      if (last) return done();
      i = reviewMisses ? reviewMisses[reviewMisses.indexOf(i)+1] : i+1; show(); scrollTo(0,0);
    };
    if (fresh) { nx.focus({preventScroll:true}); if (innerWidth < 1200) document.getElementById("after").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth",block:"nearest"}) }
  }
  function review(indices){
    reviewMisses = indices; i = indices ? indices[0] : 0; setTab("quiz"); app.classList.add("wide"); show(); wireKeys(); scrollTo(0,0);
  }
  function done(){
    if (!completed) { completed = true; saveSession(null) }
    setTab("home"); document.onkeydown = null;
    const pct = Math.round(score()/list.length*100), wrong = misses();
    if (key !== "redo" && key !== "mixed" && (best[key] == null || pct > best[key])) { best[key] = pct; store.set("best",best) }
    app.innerHTML = `<h1 class="hero"><span class="num" id="pc">0</span>%</h1><p class="sub num">${score()} of ${list.length} correct. ${pct >= 73 ? "Above 73, the score you need." : "Review the misses while the questions are fresh."}</p>
      ${isMock ? `<div class="rows part-scores">${s.parts.map((p,k) => { const indices = list.map((q,j) => q.part === k ? j : -1).filter(j => j >= 0); const n = indices.filter(j => picks[j] === list[j].ans).length; return `<div class="row"><span>${esc(p.name)}</span><span class="num">${n}/${indices.length} · ${Math.round(n/indices.length*100)}%</span></div>` }).join("")}</div>` : ""}
      <button class="primary press" id="again">${wrong.length ? isMock ? "Review my misses" : "Redo these " + wrong.length + " mistakes" : "Back to sets"}</button>
      <div class="two"><button class="secondary press" id="review">${LEFT}Review answers</button><button class="secondary press" id="back">Back to sets</button></div>`;
    countUp(document.getElementById("pc"),pct);
    document.getElementById("again").onclick = () => wrong.length ? isMock ? review(wrong) : quiz(wrong.map(j => list[j]),"redo") : home();
    document.getElementById("back").onclick = home;
    document.getElementById("review").onclick = () => review(null);
  }
  function wireKeys(){
    document.onkeydown = e => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches("input,textarea")) return;
      if (e.key === "Escape") { home(); return }
      if (!document.getElementById("opts")) return;
      const k = "1234".indexOf(e.key);
      if (k >= 0) { const b = document.querySelectorAll(".opt")[k]; if (b && !b.disabled) { e.preventDefault(); pick(k) } }
      if (/^h$/i.test(e.key)) document.getElementById("hintbtn")?.click();
      if (e.key === "ArrowLeft") { e.preventDefault(); document.getElementById("prev")?.click() }
      if (e.key === "Enter") {
        const nx = document.getElementById("nx");
        if (nx && (document.activeElement === nx || !document.activeElement.closest("button"))) { e.preventDefault(); nx.click() }
      }
    };
  }
  show(); wireKeys(); scrollTo(0,0);
}

/* ---------- flashcards: Flip (self-check) or Quiz me (definition -> pick the term, +10) ---------- */
let cardMode = store.get("cardmode", "flip");
function openCards(){
  if (!savedSession || savedSession.type === "cards" && savedSession.subj === subj) return cards(savedSession);
  setTab("cards"); document.onkeydown = null;
  app.innerHTML = `<div class="mob">${segHTML()}</div><h1 class="hero">Flashcards</h1><p class="sub">Starting a round replaces your saved ${esc(savedSession.type === "quiz" ? "quiz" : "flashcard round")}.</p><button class="primary press" id="newcards">Start a flashcard round</button>${continueHTML()}`;
  document.getElementById("newcards").onclick = () => cards();
  document.getElementById("continue").onclick = resumeSession; wireSeg(openCards);
}
function cards(restored = null){
  setTab("cards");
  const all = () => FC.map((_, k) => k).filter(k => FC[k].subj === subj);
  if (restored) { cardMode = restored.mode; store.set("cardmode",cardMode) }
  const find = c => {
    const k = FC.findIndex(x => x.subj === c.subj && x.t === c.t && x.d === c.d);
    if (k >= 0) return k;
    return FC.push(c) - 1;
  };
  let deck = restored ? restored.deck.map(find) : shuffle(all()), i = restored?.i || 0, flipped = restored?.flipped || false, again = restored ? restored.again.map(find).filter(k => k >= 0) : [];
  const qpicks = restored?.picks || [], qopts = restored ? restored.options.map(opts => opts?.map(find)) : [];
  const save = () => saveSession({type:"cards",subj,mode:cardMode,deck:deck.map(k => FC[k]),i,flipped,again:again.map(k => FC[k]),picks:qpicks,options:qopts.map(opts => opts?.map(k => FC[k]))});
  const modeHTML = `<div class="seg small" id="mode"><button class="press ${cardMode === "flip" ? "on" : ""}" data-m="flip">Flip</button><button class="press ${cardMode === "quiz" ? "on" : ""}" data-m="quiz">Quiz me (coins)</button></div>`;
  function optionsFor(k){
    if (!qopts[i]) {
      // wrong choices: cards whose wording overlaps most with this definition, so the right term isn't obvious
      const words = s => new Set(s.toLowerCase().match(/[a-z]{4,}/g) || []);
      const mine = words(FC[k].d + " " + FC[k].t);
      const pool = shuffle(all().filter(x => x !== k && FC[x].t !== FC[k].t))
        .map(x => [x, [...words(FC[x].d + " " + FC[x].t)].filter(w => mine.has(w)).length + Math.random()])
        .sort((a, b) => b[1] - a[1]).slice(0, 3).map(p => p[0]);
      qopts[i] = shuffle([k, ...pool]);
    }
    return qopts[i];
  }
  function show(){
    if (i >= deck.length) {
      saveSession(null);
      app.innerHTML = `
        <div class="mob">${segHTML()}</div>${modeHTML}
        <h1 class="hero">Deck done</h1>
        <p class="sub num">${again.length ? again.length + " cards to go over again." : "You knew every card this round."}</p>
        <button class="primary press" id="re">${again.length ? "Go over the " + again.length + " again" : "Shuffle and restart"}</button>`;
      wire();
      document.getElementById("re").onclick = () => { deck = again.length ? shuffle(again) : shuffle(all()); again = []; i = 0; qpicks.length = 0; qopts.length = 0; show() };
      return;
    }
    const k = deck[i], c = FC[k];
    const nav = `<div class="two"><button class="secondary press" id="prev" ${i === 0 ? "disabled" : ""}>${LEFT}Back</button><button class="secondary press" id="next" ${cardMode === "quiz" && qpicks[i] == null ? "disabled" : ""}>Next${RIGHT}</button></div>`;
    if (cardMode === "flip") {
      app.innerHTML = `
        <div class="mob">${segHTML()}</div>${modeHTML}
        <div class="qhead"><span class="num">${i + 1} of ${deck.length}</span><span class="num">${again.length} to repeat</span></div>
        <button class="card press" id="card"><span class="term">${esc(c.t)}</span>${flipped ? `<span class="def">${esc(c.d)}</span>` : ""}</button>
        ${flipped
          ? `<div class="two"><button class="secondary press" id="no">Again</button><button class="primary press" id="yes">Got it</button></div>`
          : `<p class="hint">Say the answer out loud first, then tap the card to check</p>`}
        ${nav}<p class="hint keys"><kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> move</p>`;
      document.getElementById("card").onclick = () => { flipped = !flipped; show() };
      if (flipped) {
        document.getElementById("yes").onclick = () => { again = again.filter(x => x !== k); move(1) };
        document.getElementById("no").onclick = () => { if (!again.includes(k)) again.push(k); move(1) };
      }
    } else {
      const opts = optionsFor(k), picked = qpicks[i];
      app.innerHTML = `
        <div class="mob">${segHTML()}</div>${modeHTML}
        <div class="qhead"><span class="num">${i + 1} of ${deck.length}</span><span class="num">${again.length} to repeat</span></div>
        <div class="card"><span class="cap">Which term matches this definition?</span><span class="defq">${esc(c.d)}</span></div>
        <div class="rows" id="opts">${opts.map((x, n) => {
          const cls = picked == null ? "" : x === k ? "right" : n === picked ? "wrong" : "dim";
          return `<button class="opt press ${cls}" data-n="${n}" ${picked != null ? "disabled" : ""}><span class="k">${n + 1}</span><span>${esc(FC[x].t)}</span></button>`;
        }).join("")}</div>
        <div style="height:12px"></div>${nav}<p class="hint keys"><kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>←</kbd> <kbd>→</kbd> move</p>`;
      if (picked == null) document.getElementById("opts").onclick = e => {
        const b = e.target.closest(".opt"); if (!b) return;
        const n = +b.dataset.n; qpicks[i] = n;
        const ok = opts[n] === k; rewardAnswer(ok);
        if (ok) again = again.filter(x => x !== k); else if (!again.includes(k)) again.push(k);
        show(); if (ok) burst(document.querySelectorAll(".opt")[n]);
      };
    }
    document.getElementById("prev").onclick = () => move(-1);
    document.getElementById("next").onclick = () => move(1);
    wire(); save();
  }
  function wire(){
    wireSeg(openCards);
    document.getElementById("mode").onclick = e => {
      const b = e.target.closest("button[data-m]"); if (!b || b.dataset.m === cardMode) return;
      cardMode = b.dataset.m; store.set("cardmode", cardMode); cards();
    };
  }
  const move = d => { i = Math.max(0, i + d); flipped = false; show() };
  show();
  document.onkeydown = e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches("input,textarea")) return;
    if (e.key === "Escape") { home(); return }
    if (e.key === " " && cardMode === "flip") { e.preventDefault(); document.getElementById("card")?.click() }
    if (e.key === "ArrowLeft") { e.preventDefault(); document.getElementById("prev")?.click() }
    if (e.key === "ArrowRight" || e.key === "Enter" && (document.activeElement.id === "next" || !document.activeElement.closest("button"))) {
      e.preventDefault(); const n = document.getElementById("next"); if (n && !n.disabled) n.click();
    }
    const k = "1234".indexOf(e.key);
    if (k >= 0 && cardMode === "quiz") document.querySelectorAll("#opts .opt")[k]?.click();
  };
}

/* ---------- sync: copy a code on one device, paste it on the other (merges, never overwrites) ---------- */
const SEAL = "strawberry-sempsych-2026";
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
async function pack(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  let body, ver = "SP0";
  if (window.CompressionStream) {
    body = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    ver = "SP1";
  } else body = raw;
  const b = b64u(body);
  return `${ver}.${b}.${fnv(SEAL + b + fnv(b + SEAL))}`;
}
async function unpack(code){
  const parts = code.trim().replace(/\s+/g, "").split(".");
  if (parts.length !== 3 || !/^SP[01]$/.test(parts[0])) throw new Error("bad");
  const [ver, b, sig] = parts;
  if (fnv(SEAL + b + fnv(b + SEAL)) !== sig) throw new Error("bad");
  let bytes = unb64u(b);
  if (ver === "SP1") bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}
function snapshot(){
  const id = t => fnv(t);
  const s = Object.keys(seen).filter(t => byText.has(t));
  return { v: 1, e: earned, c: correct, k: coupons, s: s.map(id), m: Object.keys(mistakes).filter(t => byText.has(t)).map(id),
           t: Object.fromEntries(s.map(t => [id(t), lastTs[t] || 0])), b: best, d: days };
}
function mergeIn(o){
  const before = { done: Object.keys(seen).length, coins: coinsNow() };
  const idToText = new Map(Q.map(q => [fnv(q.q), q.q]));
  for (const [d, n] of Object.entries(o.e || {})) earned[d] = Math.max(earned[d] || 0, n);
  for (const [d, n] of Object.entries(o.c || {})) correct[d] = Math.max(correct[d] || 0, n);
  const have = new Set(coupons.map(c => c.code));
  for (const c of o.k || []) if (c && c.code && !have.has(c.code))
    coupons.push({ ...c, cost: Number.isFinite(c.cost) ? c.cost : (REWARDS.find(r => r.name === c.name)?.cost || OLD_REWARDS[c.name] || 0) });
  const theirMiss = new Set(o.m || []);
  for (const id of o.s || []) {
    const t = idToText.get(id); if (!t) continue;
    const theirTs = (o.t || {})[id] || 0;
    if (!seen[t] || theirTs > (lastTs[t] || 0)) {     // their answer is newer (or we never answered): take their status
      seen[t] = 1; lastTs[t] = theirTs;
      if (theirMiss.has(id)) mistakes[t] = 1; else delete mistakes[t];
    }
  }
  for (const [k, v] of Object.entries(o.b || {})) best[k] = Math.max(best[k] ?? 0, v);
  days = [...new Set([...days, ...(o.d || [])])].sort();
  for (const [k, v] of [["earned", earned], ["correct", correct], ["coupons", coupons], ["seen2", seen], ["mistakes2", mistakes], ["ts", lastTs], ["best", best], ["days", days]]) store.set(k, v);
  showCoins();
  return { added: Object.keys(seen).length - before.done, coins: coinsNow() };
}
function sync(msg){
  setTab("sync");
  document.onkeydown = null;
  app.innerHTML = `
    <h1 class="hero">Sync devices</h1>
    <p class="sub">Copy your code here, then paste it in the app on your other device. Pasting merges both devices, so nothing is ever lost.</p>
    ${msg ? `<div class="note ${msg.ok ? "ok" : "no"}">${esc(msg.text)}</div>` : ""}
    <p class="label">1. On this device</p>
    <button class="primary press" id="copy">Copy my progress</button>
    <textarea class="input" id="mycode" readonly aria-label="Your sync code" placeholder="Your code appears here"></textarea>
    <p class="label" style="margin-top:10px">2. Code from your other device</p>
    <textarea class="input" id="theirs" aria-label="Paste a sync code" placeholder="Paste the code here"></textarea>
    <button class="secondary press" id="merge" style="width:100%">Merge into this device</button>`;
  const mine = document.getElementById("mycode");
  document.getElementById("copy").onclick = async () => {
    const code = await pack(snapshot());
    mine.value = code; mine.select();
    try { await navigator.clipboard.writeText(code); document.getElementById("copy").textContent = "Copied. Send it to your other device." }
    catch { document.getElementById("copy").textContent = "Code ready below. Select and copy it." }
  };
  document.getElementById("merge").onclick = async () => {
    const code = document.getElementById("theirs").value;
    if (!code.trim()) return;
    try {
      const o = await unpack(code);
      const r = mergeIn(o);
      sync({ ok: true, text: `Merged. ${r.added > 0 ? `${r.added} more questions marked done, ` : ""}${fmt(r.coins)} strawberry coins now.` });
    } catch { sync({ ok: false, text: "This code is damaged or incomplete. Copy it again from your other device." }) }
  };
}
