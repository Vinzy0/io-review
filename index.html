of the current edition."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Filipino Tests", "q": "A researcher wants a Filipino personality test with three forms: Form K (interpersonal relationships), Form S (personal traits), and Form KS (intelligence and creativity). Which test is this?", "opts": ["Panukat ng Katalinuhang Pilipino (PKP) by Palacio", "Pictorial Self-Concept Scale by Pasao", "Panukat ng Pagkataong Pilipino (PPP) by Carlota", "Panukat ng Ugali at Pagkatao (PUP) by Enriquez"], "ans": 2, "why": "PPP (Carlota) has Forms K, S, and KS and is for ages 13+. PUP (Enriquez) measures Filipino-oriented traits with validity scales Pagkakaila (denial) and Kaugalian (cultural norms). PKP is an intelligence test.", "hint": "Remember which author's test has the K, S, and KS forms."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Interest Tests", "q": "A career inventory compares a student's interests with those of satisfied workers in hundreds of occupations, and organizes results by RIASEC General Occupational Themes. Which test is this?", "opts": ["Thurstone Interest Schedule", "Strong Interest Inventory", "Differential Aptitude Tests", "Edwards Personal Preference Schedule"], "ans": 1, "why": "The Strong (SVIB → Strong-Campbell → modern SII) uses General Occupational Themes (RIASEC), Basic Interest Scales, Occupational Scales (matching satisfied workers), and Personal Style Scales. It's an INTEREST inventory, not an aptitude test.", "hint": "RIASEC themes and comparisons with satisfied workers."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "A child client is shown picture cards of animals (lions, bears, monkeys) in human-like social situations and asked to tell a story about each. Which test is this?", "opts": ["Rorschach Inkblot Test", "Kinetic Family Drawing", "Children's Apperception Test (CAT) by Bellak", "Hand Test"], "ans": 2, "why": "The CAT (Leopold and Sonya Bellak, 1949) is the children's version of the TAT and uses animal figures in human situations. The Philippine versions (PTAT and PCTAT) were developed by Alfredo Lagmay, with Filipino scenes.", "hint": "Animals in human-like scenes for children."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "A psychologist asks a child to 'draw everyone in your family, including yourself, DOING something.' Which projective technique is this?", "opts": ["House-Tree-Person (HTP)", "Draw-A-Person Test", "Hand Test", "Kinetic Family Drawing (KFD)"], "ans": 3, "why": "The KFD's unique instruction is that family members must be drawn DOING something (in action). HTP asks for a house, a tree, and a person. Draw-A-Person estimates intellectual maturity in children.", "hint": "The family members are doing something."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "In a correctional setting, a psychologist wants a projective test specifically aimed at action tendencies, particularly acting out and aggressive behavior. Which test fits?", "opts": ["Satisfaction with Life Scale", "Thematic Apperception Test", "Sacks Sentence Completion Test", "Hand Test"], "ans": 3, "why": "The Hand Test (ages 5+) measures action tendencies, especially acting out and aggression. The SSCT taps attitudes about family, sex, interpersonal relationships, and self-concept. The TAT reveals perceptions of interpersonal relationships.", "hint": "This test focuses on acting out."}, {"subj": "pa", "set": "Set 5 - Selecting Tests", "topic": "Projective Tests", "q": "Of the 10 Rorschach inkblot cards, how are they grouped by color?", "opts": ["5 black and gray; 2 black, gray, and red; 3 multicolored", "3 black and gray; 7 multicolored", "5 multicolored; 5 black and gray", "10 black and gray"], "ans": 0, "why": "Rorschach: 5 achromatic (black and gray) cards, 2 black-gray-red cards, and 3 multicolored cards, for 10 in total.", "hint": "There are three color groups across the ten cards."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "During a standardized group test, a proctor notices examinees look confused, so she rephrases the instructions in her own words and gives an extra two minutes. What is the main problem?", "opts": ["She built rapport correctly", "She prevented a ceiling effect", "She provided a legitimate accommodation", "She made administrative deviations that threaten comparison with the norms"], "ans": 3, "why": "Standardized administration means reading instructions VERBATIM and keeping exact timing. Rephrasing instructions or changing time limits are administrative deviations, so scores can no longer be fairly compared with the norm group.", "hint": "What does 'standardized' require of the examiner?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "For a student with low vision, the examiner provides a large-print version of a math reasoning test. The construct measured stays the same. This change is a(n):", "opts": ["Accommodation", "Administrative deviation", "Construct bias", "Modification"], "ans": 0, "why": "ACCOMMODATION = an adjustment that reduces the impact of a disability WITHOUT changing the construct being measured (extra time for motor deficits, large print). MODIFICATION = a change that alters the construct and can invalidate comparison with norms.", "hint": "Is the test still measuring the same skill?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "An examiner reads a reading-comprehension passage ALOUD to a student with dyslexia. Why is this considered a modification rather than an accommodation?", "opts": ["It was done after the test", "It uses large-print materials", "It gives the student extra time", "It changes the construct from reading comprehension to listening comprehension"], "ans": 3, "why": "Reading the passage aloud means the student no longer has to READ, so the test now measures listening, not reading comprehension. Changing the construct makes it a modification, and scores can't be compared to the norms.", "hint": "What skill is the student using now?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Administration", "q": "An examiner who expects a child to be gifted unconsciously gives subtle encouraging cues and scores the child's ambiguous answers generously. This examiner effect is the:", "opts": ["Carryover effect", "Expectancy (Rosenthal) effect", "Flynn effect", "Halo effect in self-report"], "ans": 1, "why": "The expectancy/Rosenthal effect: examiner expectations subtly influence the test taker's performance through micro-cues or biased scoring of ambiguous responses.", "hint": "The examiner's expectations shaped the result."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Intelligence Issues", "q": "A school compares this year's students with norms collected 30 years ago and finds their IQs inflated by about 9 points. This is consistent with the:", "opts": ["Hawthorne effect", "Flynn effect", "Practice effect", "Restriction of range"], "ans": 1, "why": "The Flynn effect = the worldwide historic rise in raw intelligence test scores, about 3 IQ points per decade. Thirty years × 3 points ≈ 9 points. That's why outdated norms inflate scores.", "hint": "How many points per decade, and how many decades?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Equivalence", "q": "To adapt an English personality inventory for Filipinos, a team translates it into Filipino, then has a separate translator turn the Filipino version back into English to check that the meaning was preserved. This procedure is:", "opts": ["Conceptual equivalence testing only", "Cross-validation", "Co-norming", "Back translation, for linguistic equivalence"], "ans": 3, "why": "Back translation checks LINGUISTIC equivalence: whether the test was translated accurately. CONCEPTUAL equivalence = the construct means the same thing across cultures. METRIC equivalence = the same psychometric properties across groups.", "hint": "Translate, then translate back."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Bias", "q": "Two groups with equal overall ability perform very differently on a few specific items that refer to snow sports, which one group has never experienced. This is an example of:", "opts": ["Item (content) bias", "Predictive (criterion) bias", "Construct bias", "Ceiling effect"], "ans": 0, "why": "Item bias = specific items are easier or harder for members of a group of EQUAL ability. Construct bias = the whole test measures different constructs across groups. Predictive bias = the test predicts criterion outcomes differently for different groups.", "hint": "Equal ability, but a few specific items are unfair."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Behavioral Assessment", "q": "After several weeks of classroom observation, an observer has gradually started coding milder behaviors as 'aggression' than she did on day one, without realizing it. This error is:", "opts": ["Reactivity", "Observer drift", "Demand characteristics", "Central tendency error"], "ans": 1, "why": "Observer drift = a gradual, unintentional shift over time in how an observer applies the coding criteria. Retraining and periodic inter-observer reliability checks help prevent it.", "hint": "The observer's standards slowly shifted over time."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Behavioral Assessment", "q": "A normally rowdy student becomes unusually quiet and well-behaved only while the school psychologist sits in the back of the classroom observing. This is:", "opts": ["Observer drift", "Observer bias", "Reactivity", "Time sampling error"], "ans": 2, "why": "Reactivity = an alteration in a person's natural behavior caused by the AWARENESS of being observed. It's a subject-related error, unlike observer drift or observer bias, which come from the observer.", "hint": "Whose behavior changed: the observer's or the student's?"}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretation", "q": "An examiner's report simply states: 'The client typed 45 words per minute on the typing test,' with no inference about underlying traits. In Sundberg's levels of interpretation, this is:", "opts": ["Level I: direct sample, minimal inference", "Level III: dynamic case conceptualization", "Level II: hypothetical construct", "Level II: descriptive generalization"], "ans": 0, "why": "Level I = test data treated as a direct behavior sample with minimal inference. Level II = generalizing to broader traits or inferring internal constructs. Level III = a fully integrated, high-inference case conceptualization of the person.", "hint": "No inference at all, just what was observed."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "A company's selection test predicted that an applicant would succeed, so she was hired, but she failed in the job. In decision theory terms, this outcome is a:", "opts": ["True negative", "True positive", "False negative", "False positive"], "ans": 3, "why": "FALSE POSITIVE (Type I) = predicted success that does not occur. FALSE NEGATIVE (Type II) = predicted failure, but the person would have succeeded. True positives and true negatives are correct predictions (hits).", "hint": "The test said 'yes' and reality said 'no'."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "A company has 10 job openings and 200 applicants. What is the selection ratio?", "opts": ["20", ".20", ".05", "2.0"], "ans": 2, "why": "Selection ratio = number to be hired ÷ number of applicants = 10 / 200 = .05. A low selection ratio means the company can be very selective, which increases a valid test's utility.", "hint": "Openings divided by applicants."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Test Utility", "q": "An HR analyst wants to estimate the MEAN difference in performance between employees selected with the test and those not selected, as an index of what the test adds to existing procedures. Which tool fits?", "opts": ["Expectancy tables", "Naylor-Shine tables", "Taylor-Russell tables", "Brogden-Cronbach-Gleser formula"], "ans": 1, "why": "Naylor-Shine = difference between the MEANS of the selected and unselected groups. Taylor-Russell = how much adding a test improves selection, as a proportion of successful hires. Brogden-Cronbach-Gleser = the peso/dollar utility gain.", "hint": "It compares the MEANS of selected and unselected groups."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Cut Scores", "q": "An employer decides that a high score on a teamwork test can make up for a lower score on a technical test when combining applicants' results. This is the:", "opts": ["Fixed cut score method", "Known-groups method", "Multiple hurdle model", "Compensatory model of selection"], "ans": 3, "why": "Compensatory model = high scores on one attribute can compensate for lower scores on another. Multiple hurdle = a cut score must be passed at each stage, with no compensation.", "hint": "Strength in one area makes up for weakness in another."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Cut Scores", "q": "To set a cut score, a developer gives the test to a group known to have mastered the skill and a group known NOT to have mastered it, then sets the cut where the two groups' distributions separate. This is the:", "opts": ["Angoff method", "Bookmark method", "Known-groups method", "Method of predictive yield"], "ans": 2, "why": "The known-groups method collects predictor data from groups known to possess, and not to possess, the trait or ability of interest. Angoff relies on experts' item-by-item judgments; bookmark relies on items ordered by IRT difficulty.", "hint": "Compare two groups that differ on the skill."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "Interpretation", "q": "During a WISC-V session, the examiner notes that the child repeatedly sighs, erases answers, and says 'I'm stupid' whenever an item gets hard. These observations, which aren't part of the test content but may matter for interpretation, are called:", "opts": ["Test sophistication", "Construct-irrelevant variance", "Extra-test behavior", "Scoring drift"], "ans": 2, "why": "Extra-test behavior = observations of what the examinee does and how they react during testing that are only indirectly related to the test content but may be significant for interpretation.", "hint": "Behavior that isn't part of the test content."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "MSE", "q": "During a mental status exam, the patient says 'I feel fine, really happy,' but the clinician observes a blank face and little emotional expression throughout the interview. Which statement is correct?", "opts": ["Both describe her insight", "'Happy' is her reported mood; the blank expression describes her affect", "Both describe her thought content", "'Happy' is her affect; the blank expression is her mood"], "ans": 1, "why": "MOOD = the patient's SUBJECTIVE, self-reported emotional state ('I feel happy'). AFFECT = the clinician's OBJECTIVE observation of emotional expression ('flat affect'). A mismatch between them is clinically important.", "hint": "One comes from the patient's own words; the other is what the clinician sees."}, {"subj": "pa", "set": "Set 6 - Administration, Scoring, Interpretation", "topic": "MSE", "q": "In the mental status exam, a patient's understanding of the nature and severity of his own illness is assessed under:", "opts": ["Judgment", "Orientation", "Thought content", "Insight"], "ans": 3, "why": "Insight = the patient's understanding of their own illness, including its nature and severity. Judgment = the ability to make sound decisions and act appropriately. Orientation = awareness of person, place, and time.", "hint": "Does he understand his own condition?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A court orders a psychological evaluation of a defendant. Under the Code of Ethics, is the psychologist required to obtain the defendant's informed consent before assessment?", "opts": ["Yes, but only from the judge", "No, informed consent is not required when the assessment is mandated by law", "No, because defendants have no right to privacy", "Yes, informed consent is always required with no exceptions"], "ans": 1, "why": "The Code says we gather informed consent prior to assessment EXCEPT when (a) it is mandated by law, (b) consent is implied, as in routine educational, institutional, and organizational activity, or (c) the purpose is to determine the person's decisional capacity. NOTE: the reviewer lists these three without the word 'EXCEPT,' which flips the meaning. They are EXCEPTIONS to the consent requirement.", "hint": "The Code lists situations where consent is NOT needed. Is a court order one of them?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A school gives its yearly routine group achievement test to all Grade 9 students as part of normal school operations. What kind of consent situation is this under the Code?", "opts": ["Implied consent, as in routine educational activity", "Consent is not possible for minors, so the test cannot be given", "Consent must be signed individually by every student before testing", "Only verbal assent from the principal is needed"], "ans": 0, "why": "Routine educational, institutional, or organizational assessments fall under IMPLIED consent, one of the three exceptions to formal informed consent (along with assessments mandated by law and decisional-capacity evaluations).", "hint": "Routine school activity falls under one of the three consent exceptions."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A client's employer calls and asks the psychometrician to email the client's raw and scaled scores on the personality test. What should she do?", "opts": ["Send only the raw scores, since they're less sensitive", "Decline to release raw and scaled scores; share results only as agreed with the referral source and with proper consent", "Send the scores, since the employer paid for the assessment", "Post the scores to the company's shared drive for transparency"], "ans": 1, "why": "The Code says 'We do not release test data in the forms of raw and scaled scores.' Results go only to those explicitly agreed upon with the referral source, and with written permission for self-referrals. Raw scores can be misinterpreted by untrained readers.", "hint": "What does the Code say about raw and scaled scores?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "To decide a student's special-class placement this year, a counselor plans to rely on an IQ score from a test the student took six years ago. What is the ethical concern?", "opts": ["She needs the parents' permission to read old records", "It is fine as long as the test was standardized", "Old IQ scores are always more accurate", "Interpretations and recommendations should not be based on outdated test results"], "ans": 3, "why": "We do not base interpretations, conclusions, and recommendations on OUTDATED test results, nor on OBSOLETE tests. Abilities and norms change (remember the Flynn effect), so a current assessment is needed.", "hint": "How current must test results be?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "To save money, a testing center makes photocopies of a published test booklet and answer sheet for a large group administration. Which standard does this violate?", "opts": ["Discuss the limits of confidentiality", "Avoid multiple relationships", "Use only original test materials, not photocopies", "Explain results in non-technical language"], "ans": 2, "why": "Under the Assessment Tools standard: 'We use only original copies of test materials (not photocopies).' Photocopying also violates test security and copyright.", "hint": "What kind of test materials should be used?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician is asked to assess her own cousin, who is applying to the company where she works. What is the most appropriate action?", "opts": ["Avoid the multiple relationship by referring the assessment to a colleague", "Proceed, since she knows the cousin's background well", "Proceed but give slightly lower scores to stay objective", "Ask the cousin to sign a waiver and continue"], "ans": 0, "why": "Refrain from a multiple relationship that could reasonably be expected to impair objectivity, competence, or effectiveness, or that risks exploitation or harm. Assessing a relative for a hiring decision is a clear conflict, so refer it out.", "hint": "Could her objectivity be questioned?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychometrician notices a colleague leaving a client's test folder unattended on a café table. It appears to be a minor lapse, and no confidentiality would be violated by speaking up. What is the appropriate FIRST step?", "opts": ["Immediately file a formal complaint with the PRC", "Bring it to the colleague's attention informally", "Ignore it since no harm has happened yet", "Post about it on social media to warn others"], "ans": 1, "why": "Informal resolution: when appropriate, first bring the issue to the attention of the professional concerned, if informal resolution is sufficient and doesn't violate confidentiality. Formal reporting comes next if the issue isn't resolved or is serious.", "hint": "For a minor lapse, what's the gentlest step that could fix it?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "At the very start of a counseling intake, a psychometrician explains that what the client shares is confidential except where the law requires disclosure, such as serious risk of harm. Which ethical duty is she fulfilling?", "opts": ["Releasing test data", "Avoiding a multiple relationship", "Cooperating with an ethics committee", "Discussing the limitations of confidentiality"], "ans": 3, "why": "We have a duty to discuss the LIMITS of confidentiality with clients (due to laws, institutional rules, or professional relationships) and explain all anticipated uses of the information they disclose.", "hint": "Clients should know, from the start, when confidentiality can be broken."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A 12-year-old is referred for a psychoeducational assessment. Whose agreement is needed?", "opts": ["Only the child's verbal agreement", "Informed consent from the parent or guardian, plus the child's assent", "Only the teacher's signature", "No agreement is needed for minors"], "ans": 1, "why": "For minors or people legally incapable of consent, the parent, guardian, or legal representative gives informed consent and is told the limits of confidentiality. The child gives ASSENT, which respects their dignity and understanding.", "hint": "A minor can't give legal consent alone."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "After assessing a child, a psychologist meets with the parents to explain the results. How should the findings be communicated?", "opts": ["Only to the child's teacher", "Only in writing, with no discussion", "Using exact raw and scaled scores and statistical terms", "In non-technical language the parents can understand"], "ans": 3, "why": "When findings are explained to relatives, parents, or teachers, we explain them in NON-TECHNICAL language. Technical jargon and raw scores invite misunderstanding.", "hint": "Parents aren't psychologists."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "An HR clerk with no psychology background wants to give and interpret a personality test on her own because she 'read the manual.' What does the Code say?", "opts": ["She may interpret it but not score it", "She may use it since the manual is clear", "Assessment tools should not be used by unqualified persons, except for training with adequate supervision", "She may use it if the applicants agree"], "ans": 2, "why": "We do not promote the use of assessment tools and methods by unqualified persons, except for training purposes with adequate supervision. Protocols and records must also be kept secure from unqualified persons.", "hint": "Who is allowed to use assessment tools?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A client takes a timed online cognitive test from home. What does the Code specifically require the psychometrician to tell her beforehand?", "opts": ["That online results are always more accurate", "Nothing, since online tests don't need consent", "How poor internet connectivity could affect her performance, especially on timed tests", "That she may look up answers online"], "ans": 2, "why": "For online assessment, we inform test takers of the implications of poor internet connectivity on their performance, particularly for timed assessments. We also tell them about privacy risks in electronic transmission.", "hint": "Online testing has a specific technical risk to explain."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "RA 10029", "q": "Under RA 10029, a board examinee gets a weighted general average of 78% but scores 58% in one subject. What happens?", "opts": ["She fails and must retake all subjects", "She may retake that subject within two years and must score at least 75% in it to pass", "She passes because her weighted average is above 75%", "She passes as long as no subject is below 50%"], "ans": 1, "why": "To pass: a weighted general average of at least 75%, with NO subject below 60%. An examinee with WGA ≥ 75% but a subject below 60% may retake that subject within the next two years and must get at least 75% in it to be deemed passed.", "hint": "There are two rules: the overall average, and the minimum per subject."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Laws", "q": "A company's HR department plans to store applicants' psychological test results in a cloud folder that the whole office can access. Which Philippine law most directly governs how this personal information must be protected?", "opts": ["RA 11036, the Mental Health Act", "RA 10173, the Data Privacy Act", "RA 9258, the Guidance and Counseling Act", "RA 7877, the Anti-Sexual Harassment Act"], "ans": 1, "why": "RA 10173 (Data Privacy Act) governs the processing and protection of personal information. RA 11036 = Mental Health Act; RA 9258 = Guidance and Counseling Act; RA 7877 = Anti-Sexual Harassment Act; RA 10029 = Philippine Psychology Act.", "hint": "Which law is about personal information?"}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Laws", "q": "Which law aims to establish a comprehensive national mental health care system and integrate mental health promotion into schools, workplaces, and communities?", "opts": ["RA 9165 (Comprehensive Dangerous Drugs Act)", "RA 12080 (Basic Education Mental Health and Well-Being Promotion Act)", "RA 10029 (Philippine Psychology Act)", "RA 11036 (Mental Health Act)"], "ans": 3, "why": "RA 11036's objectives include strong mental health governance, a comprehensive national mental health care system, protecting the rights of people with psychiatric, neurologic, and psychosocial needs, and integrating mental health in schools, workplaces, and communities. RA 12080 is specific to basic education.", "hint": "It's about the national mental health care system."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "A psychologist is angry at a rival and files an ethics complaint against her without checking facts that would clearly disprove the allegation. Which standard is being violated?", "opts": ["Release of test data", "Informal resolution", "Improper complaints", "Cooperating with ethics committees"], "ans": 2, "why": "Improper complaints: we refrain from filing ethical complaints with reckless disregard or willful ignorance of facts that would disprove the allegations, or without supporting factual evidence.", "hint": "Filing without checking the facts."}, {"subj": "pa", "set": "Set 7 - Ethics and Laws", "topic": "Ethics", "q": "Which ethical principle covers doing no harm, maximizing benefits, developing and maintaining competence, self-knowledge, and delivering services competently online (telepsychology)?", "opts": ["Principle IV: Professional and scientific responsibilities to society", "Principle III: Integrity", "Principle I: Respect for the dignity of persons and peoples", "Principle II: Competent caring for the well-being of persons and peoples"], "ans": 3, "why": "Principle II (Competent Caring) = working for clients' benefit and above all doing no harm, maximizing benefit and minimizing harm, competence, self-knowledge, and telepsychology. Principle I = dignity, diversity, informed consent, privacy. Principle III = honesty, avoiding conflicts of interest. Principle IV = responsibility to society.", "hint": "Doing no harm and competence belong to which principle?"}], "flashcards": [{"subj": "io", "t": "Unity of command", "d": "Each subordinate answers to only ONE superior (part of the scalar principle)"}, {"subj": "io", "t": "Scalar principle", "d": "Chain of command; vertical growth of the organization through added levels"}, {"subj": "io", "t": "Functional principle", "d": "Division of labor into units doing similar functions; horizontal growth"}, {"subj": "io", "t": "Line vs. staff functions", "d": "Line = directly meets major goals; Staff = supports the line"}, {"subj": "io", "t": "Span of control", "d": "Number of subordinates one manager supervises (Urwick: about 5–6 is optimal)"}, {"subj": "io", "t": "Scientific Management", "d": "Frederick Taylor; time studies to find the \"one best way\"; scientific selection and training"}, {"subj": "io", "t": "Bureaucracy", "d": "Max Weber; hierarchy, formal rules, division of labor, impersonality, merit, written records"}, {"subj": "io", "t": "Administrative Theory", "d": "Henri Fayol; what managers do: Plan, Organize, Command, Coordinate, Control; 14 principles"}, {"subj": "io", "t": "Esprit de corps", "d": "Fayol principle: sense of belonging and team spirit within the organization"}, {"subj": "io", "t": "Hawthorne effect", "d": "Elton Mayo; people change behavior because they know they're being observed"}, {"subj": "io", "t": "Chester Barnard", "d": "Organizations are cooperative systems; authority depends on subordinates' acceptance"}, {"subj": "io", "t": "Herbert Simon", "d": "Bounded rationality; managers SATISFICE (choose \"good enough\"), not optimize"}, {"subj": "io", "t": "Chris Argyris", "d": "Growth perspective; healthy organizations help people grow from passive to active"}, {"subj": "io", "t": "Theory X", "d": "McGregor; assumes workers are lazy and avoid work, so management is controlling/authoritarian"}, {"subj": "io", "t": "Theory Y", "d": "McGregor; assumes workers are self-motivated and seek responsibility, so management is participative"}, {"subj": "io", "t": "Self-fulfilling prophecy", "d": "Employees come to act the way managers expect them to act"}, {"subj": "io", "t": "Contingency theory", "d": "\"It depends\": no one best way to organize or lead"}, {"subj": "io", "t": "Joan Woodward", "d": "Contingency model based on TECHNOLOGY (un function countUp(el, to){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || to === 0) { el.textContent = to; return }
  const t0 = performance.now(), dur = 650;
  setTimeout(() => { el.textContent = to }, dur + 50); // in case animation frames are paused (background tab)
  (function tick(t){ const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick) })(t0);
}

function quiz(list, key){
  let i = 0, score = 0;
  const picks = [];   // picks[n] = choice made on question n; empty until answered
  const hinted = [];  // hinted[n] = true once the hint was shown
  const wrongNow = [];
  const answered = () => picks.filter(p => p != null).length;
  function show(){
    const q = Q[list[i]], picked = picks[i];
    app.innerHTML = `
      <div class="qhead"><button class="back press" id="menu"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Menu</button><span class="num">${i + 1} of ${list.length}</span></div>
      <div class="bar"><div style="width:${answered() / list.length * 100}%"></div></div>
      <p class="qtopic">${esc(q.topic)}</p>
      <p class="qtext">${esc(q.q)}</p>
      <div class="rows stagger" id="opts">${q.opts.map((o, n) =>
        `<button class="opt press" data-n="${n}" style="animation-delay:${n * 60}ms"><span class="k">${"ABCD"[n]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="hintbox">${hinted[i] ? hintHTML(q) : ""}</div>
      <div id="after"></div>`;
    document.getElementById("menu").onclick = home;
    document.getElementById("opts").onclick = e => { const b = e.target.closest(".opt"); if (b && !b.disabled) pick(+b.dataset.n) };
    picked == null ? askControls() : reveal(picked, false);
  }
  const hintHTML = q => `<div class="why hintb"><b>Hint</b>${esc(q.hint)}</div>`;
  const prevBtn = () => `<button class="secondary press" id="prev" ${i === 0 ? "disabled" : ""}><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Previous</button>`;
  function wirePrev(){ document.getElementById("prev").onclick = () => { if (i > 0) { i--; show(); scrollTo(0, 0) } } }
  function askControls(){
    document.getElementById("after").innerHTML = `
      <div class="two next">${prevBtn()}<button class="secondary press" id="hintbtn" ${hinted[i] ? "disabled" : ""}>${hinted[i] ? "Hint shown" : "Hint"}</button></div>
      <p class="hint">Tap an answer. Keys 1-4 work too.</p>`;
    wirePrev();
    document.getElementById("hintbtn").onclick = () => {
      hinted[i] = true;
      document.getElementById("hintbox").innerHTML = hintHTML(Q[list[i]]);
      askControls();
    };
  }
  function pick(n){
    const qi = list[i], q = Q[qi];
    picks[i] = n;
    seen[q.q] = 1; store.set("seen2", seen);
    if (n === q.ans) { score++; delete mistakes[q.q]; addCoins(hinted[i] ? 5 : 10) } else { mistakes[q.q] = 1; wrongNow.push(qi) }
    store.set("mistakes2", mistakes);
    reveal(n, true);
  }
  // answered state: right after answering, and when reviewing an earlier question
  function reveal(n, fresh){
    const q = Q[list[i]], ok = n === q.ans, last = i === list.length - 1;
    document.querySelectorAll(".opt").forEach((b, k) => {
      b.disabled = true;
      b.classList.add(k === q.ans ? "right" : k === n ? "wrong" : "dim");
    });
    document.querySelector(".bar>div").style.width = answered() / list.length * 100 + "%";
    const ahead = picks[i + 1] != null;
    document.getElementById("after").innerHTML = `
      <div class="why"><b class="${ok ? "ok" : "no"}">${ok ? "Correct" : "Answer: " + "ABCD"[q.ans]}</b>${esc(q.why)}</div>
      <button class="primary press next" id="nx">${last ? (fresh ? "See my score" : "Back to my score") : ahead ? "Next" : "Next question"}</button>
      <div class="two">${prevBtn()}<span></span></div>`;
    wirePrev();
    const nx = document.getElementById("nx");
    nx.onclick = () => { i++; i < list.length ? (show(), scrollTo(0, 0)) : done() };
    if (fresh) { nx.focus({ preventScroll: true }); document.getElementById("after").scrollIntoView({ behavior: "smooth", block: "nearest" }) }
  }
  function done(){
    const pct = Math.round(score / list.length * 100);
    const best = store.get("best", {});
    if (key !== "redo" && key !== "mixed" && (best[key] == null || pct > best[key])) { best[key] = pct; store.set("best", best) }
    app.innerHTML = `
      <h1 class="hero"><span class="num" id="pc">0</span>%</h1>
      <p class="sub num">${score} of ${list.length} correct. ${pct >= 80 ? "That's above your 80 target." : pct >= 73 ? "Above 73, the score you need. Redo the misses to push it higher." : "Redo the misses now while the explanations are fresh."}</p>
      ${wrongNow.length ? `<button class="primary press" id="again">Redo ${wrongNow.length === 1 ? "this mistake" : "these " + wrongNow.length + " mistakes"}</button>` : `<button class="primary press" id="again">Back to sets</button>`}
      <div class="two"><button class="secondary press" id="review"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Review answers</button><button class="secondary press" id="back">Back to sets</button></div>`;
    countUp(document.getElementById("pc"), pct);
    document.getElementById("again").onclick = () => wrongNow.length ? quiz(shuffle(wrongNow), "redo") : home();
    document.getElementById("back").onclick = home;
    document.getElementById("review").onclick = () => { i = list.length - 1; show(); scrollTo(0, 0) };
  }
  show(); scrollTo(0, 0);
  document.onkeydown = e => {
    if (!document.getElementById("opts")) return;
    const k = "1234".indexOf(e.key);
    if (k >= 0) { const b = document.querySelectorAll(".opt")[k]; if (b && !b.disabled) pick(k) }
    if (e.key === "ArrowLeft") document.getElementById("prev")?.click();
    if (e.key === "Enter" && document.getElementById("nx") && document.activeElement !== document.getElementById("nx")) document.getElementById("nx").click();
  };
}

  return `<button class="goal press" id="goal">
    <div class="line"><span>Next reward: ${esc(nx.name)}</span><span class="price num">${fmt(coins)} / ${fmt(nx.cost)}</span></div>
    <div class="track"><div style="width:${Math.min(100, coins / nx.cost * 100)}%"></div></div>
    <p class="meta num" style="margin-top:6px">${fmt(left)} more correct ${left === 1 ? "answer" : "answers"}${prev ? `. ${esc(prev.name)} is ready to redeem.` : ""}</p>

}

    rw.appendChild(row);
  });
  const mine = document.getElementById("mine");
  if (mine) [...coupons].reverse().forEach(c => {
    const row = document.createElement("button");
    row.className = "row mine press";
    row.innerHTML = `<span><span>${esc(c.name)}</span><br><span class="meta">${esc(c.date)}</span></span><span class="code">${esc(c.code)}</span>`;
    row.onclick = () => coupon(c);
    mine.appendChild(row);
  });
}

function confirmRedeem(r){
  app.innerHTML = `
    <h1 class="hero">Redeem ${esc(r.name)}?</h1>
    <p class="sub num">This uses ${fmt(r.cost)} of your ${fmt(coins)} strawberry coins. You'll get a coupon to send to Vinzy.</p>
    <button class="primary press" id="yes">Redeem for ${fmt(r.cost)}</button>
    <button class="secondary press" id="no" style="width:100%">Not yet</button>`;
  document.getElementById("no").onclick = shop;
  document.getElementById("yes").onclick = () => {
    if (coins < r.cost) return shop();
    const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = new Uint32Array(5);
    crypto.getRandomValues(b);
    const c = { name: r.name, code: "SB-" + [...b].map(x => a[x % a.length]).join(""),
                date: new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) };
    coins -= r.cost; store.set("coins", coins); showCoins();
    coupons.push(c); store.set("coupons", coupons);
    coupon(c);
  };
}

function coupon(c){
  app.innerHTML = `
    <div class="coupon"><span class="notch l"></span><span class="notch r"></span>
      <div class="for">Coupon for Vinzy's girlfriend</div>
      <div class="what">${esc(c.name)}</div>
      <div class="code">${esc(c.code)}</div>
      <div class="when">Redeemed ${esc(c.date)}</div>
    </div>
    <p class="sub" style="text-align:center">Screenshot this and send it to Vinzy.</p>
    <button class="primary press" id="ok">Back to rewards</button>`;
  document.getElementById("ok").onclick = shop;
}

function cards(){
  setTab("cards");
  const all = () => FC.map((_, k) => k).filter(k => FC[k].subj === subj);
  let deck = shuffle(all()), i = 0, flipped = false, again = [];
  function show(){
    if (i >= deck.length) {
      app.innerHTML = `
        <h1 class="hero">Deck done</h1>
        <p class="sub num">${again.length ? again.length + " cards to go over again." : "You knew every card this round."}</p>
        <button class="primary press" id="re">${again.length ? "Go over the " + again.length + " again" : "Shuffle and restart"}</button>`;
      document.getElementById("re").onclick = () => { deck = again.length ? shuffle(again) : shuffle(all()); again = []; i = 0; show() };
      return;
    }
    const c = FC[deck[i]];
    app.innerHTML = `
      ${segHTML()}
      <div class="qhead"><span class="num">${i + 1} of ${deck.length}</span><span class="num">${again.length} to repeat</span></div>
      <button class="card press" id="card"><span class="term">${esc(c.t)}</span>${flipped ? `<span class="def">${esc(c.d)}</span>` : ""}</button>
      ${flipped
        ? `<div class="two"><button class="secondary press" id="no">Again</button><button class="primary press" id="yes">Got it</button></div>`
        : `<p class="hint">Say the answer out loud first, then tap the card to check</p>`}
      <div class="two"><button class="secondary press" id="prev" ${i === 0 ? "disabled" : ""}><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>Back</button><button class="secondary press" id="next">Next<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/></svg></button></div>`;
    wireSeg(cards);
    const go = d => { i = Math.max(0, i + d); flipped = false; show() };
    document.getElementById("card").onclick = () => { flipped = !flipped; show() };
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    if (flipped) {
      document.getElementById("yes").onclick = () => { again = again.filter(k => k !== deck[i]); go(1) };
      document.getElementById("no").onclick = () => { if (!again.includes(deck[i])) again.push(deck[i]); go(1) };
    }
  }
  show();
  document.onkeydown = e => {
    if (e.key === " ") { e.preventDefault(); document.getElementById("card")?.click() }
    if (e.key === "ArrowLeft") document.getElementById("prev")?.click();
    if (e.key === "ArrowRight") document.getElementById("next")?.click();
  };
}

document.getElementById("coins").insertAdjacentHTML("beforeend", BERRY);
showCoins();
document.getElementById("coins").onclick = () => shop();
home();
if ("serviceWorker" in navigator && isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
const remeasure = () => setTab(document.querySelector(".tab[aria-selected=true]").dataset.tab);
document.fonts?.ready.then(remeasure);
addEventListener("resize", remeasure);
</script>
