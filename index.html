<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1D33">
<title>Sem Psych Review</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sem Psych">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500&family=Rubik:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1D33;--side:#0B1628;--surface:#172A47;--hover:#20375A;--text:#EAF1FB;--muted:#9AAECB;--faint:#566B8C;
  --action:#BCD6F5;--error:#E8806F;--ink:#0F1D33;
  --sky:#BCD6F5;--sky-soft:#DCE8F8;--sky-chip:#8DB6E8;
  --berry:#F4A9BE;--berry-deep:#E57F9C;--leaf:#9ED2B5;
  --fast:120ms;--base:200ms;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.6,.5,1);
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
body{font:400 15px/1.5 "M PLUS Rounded 1c",system-ui,sans-serif;max-width:560px;margin:0 auto;
  padding:20px 18px calc(32px + env(safe-area-inset-bottom));min-height:100dvh}
h1,h2,.display{font-family:Rubik,system-ui,sans-serif;font-weight:500;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.press{transition:transform var(--fast) var(--spring),background var(--base) var(--ease)}
.press:active{transform:scale(.96)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mark{font:500 18px Rubik,sans-serif;letter-spacing:-.02em}
.mark i{font-style:normal;color:var(--sky)}
.tabs{display:flex;gap:2px;background:var(--surface);border-radius:999px;padding:3px;position:relative;margin-bottom:20px}
.tab{flex:1;position:relative;z-index:1;padding:7px 12px;border-radius:999px;color:var(--muted);font-size:13px;transition:color var(--base) var(--ease)}
.tab[aria-selected=true]{color:var(--text)}
.pill{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--hover);transition:left var(--base) var(--ease),width var(--base) var(--ease)}

.hero{font-size:30px;line-height:1.15;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.tile{border-radius:18px;padding:14px;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform var(--fast) var(--spring)}
.tile:hover{transform:translateY(-1px)}
.tile:active{transform:scale(.96)}
.tile .big{font:500 26px Rubik,sans-serif;letter-spacing:-.02em}
.tile small{font-size:13px}
.tile .act{font:500 11px Rubik,sans-serif;text-decoration:underline;text-underline-offset:3px;margin-top:4px}
.t-attn{background:var(--sky)}.t-ok{background:var(--sky-soft)}
.tile[disabled]{cursor:default}

.primary{display:block;width:100%;background:var(--action);color:var(--bg);font:500 15px Rubik,sans-serif;border-radius:12px;padding:13px;margin-bottom:22px}
.label{font-size:13px;color:var(--muted);margin:0 2px 8px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:12px 14px}
.row:hover{background:var(--hover)}
.row .meta{font-size:12px;color:var(--muted)}
.chip{font:500 11px Rubik,sans-serif;border-radius:6px;padding:2px 7px;color:var(--ink);white-space:nowrap}
.c-ok{background:var(--sky)}.c-attn{background:var(--sky-chip)}
.stagger>*{animation:rise var(--base) var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--surface);border-radius:4px;margin-bottom:18px;overflow:hidden}
.bar>div{height:100%;background:var(--text);transition:width var(--base) var(--ease)}
.qtext{font-size:17px;line-height:1.55;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:13px 14px;line-height:1.45}
.opt:hover:not([disabled]){background:var(--hover)}
.opt .k{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:500 12px Rubik,sans-serif;background:var(--hover);transition:background var(--base),transform var(--base) var(--spring)}
.opt[disabled]{cursor:default}
.opt.right .k{background:var(--sky);color:var(--ink);transform:scale(1.1)}
.opt.wrong .k{background:var(--error);color:var(--ink)}
.opt.selected{background:var(--hover);outline:1px solid var(--sky)}
.opt.dim{color:var(--faint)}
.why{background:var(--surface);border-radius:14px;padding:14px;margin-top:12px;animation:rise var(--base) var(--ease) both}
.why b{font:500 14px Rubik,sans-serif;display:block;margin-bottom:4px}
.why .ok{color:var(--sky)}.why .no{color:var(--error)}
.next{margin-top:14px;margin-bottom:8px}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:6px 0}
.hint{font-size:12px;color:var(--muted);text-align:center}
.keys{display:none}
kbd{font:500 11px Rubik,sans-serif;background:var(--hover);border-radius:5px;padding:1px 6px;color:var(--text)}

/* flashcards */
.card{width:100%;min-height:240px;background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px;margin-bottom:12px}
.card .term{font:500 22px Rubik,sans-serif;letter-spacing:-.02em}
.card .def{font-size:16px;color:var(--text);animation:rise var(--base) var(--ease) both}
.card .defq{font-size:17px;line-height:1.55}
.card .cap{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.secondary{background:var(--surface);border-radius:12px;padding:12px;font:500 14px Rubik,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.secondary:hover{background:var(--hover)}
.secondary[disabled]{opacity:.35;cursor:default}
.secondary[disabled]:active{transform:none}
.two .primary{margin:0}

.pep{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px;line-height:1.5}
.warn{margin-bottom:12px}
.tile .of{font-size:16px}
.back{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px;color:var(--text)}
.back:hover{background:var(--hover)}
.qtopic{font-size:12px;color:var(--muted);margin-bottom:6px}
.hintb b{color:var(--muted)}
.input{display:block;width:100%;background:var(--surface);color:var(--text);border:0;border-radius:14px;padding:12px 14px;font:500 16px Rubik,sans-serif;letter-spacing:.04em;margin-bottom:12px}
.input:focus{outline:2px solid var(--text);outline-offset:1px}
textarea.input{font:400 13px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:0;min-height:96px;resize:vertical;word-break:break-all}
.danger{display:block;width:100%;background:var(--error);color:var(--ink);font:500 15px Rubik,sans-serif;border-radius:12px;padding:13px;margin-bottom:10px}
.danger[disabled]{opacity:.35;cursor:default}
.danger[disabled]:active{transform:none}
.coins{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:5px 8px 5px 12px;font:500 15px Rubik,sans-serif;color:var(--text)}
.coins svg{flex:none}
.coins.bump{animation:bump 300ms var(--spring)}
@keyframes bump{40%{transform:scale(1.12)}}
.plus{position:absolute;right:4px;top:-4px;font:500 13px Rubik,sans-serif;color:var(--berry);pointer-events:none;animation:float 900ms var(--ease) forwards}
@keyframes float{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-18px)}}
.goal{display:block;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:18px}
.goal:hover{background:var(--hover)}
.goal .line{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:8px}
.goal .meta{font-size:12px;color:var(--muted)}
.track{height:6px;background:var(--hover);border-radius:6px;overflow:hidden}
.track>div{height:100%;background:var(--berry);border-radius:6px;transition:width 600ms var(--ease)}
.price{font:500 13px Rubik,sans-serif;color:var(--berry);white-space:nowrap}
.redeem{background:var(--berry);color:var(--ink);font:500 13px Rubik,sans-serif;border-radius:10px;padding:8px 12px;white-space:nowrap}
.redeem[disabled]{background:var(--hover);color:var(--muted);cursor:default}
.redeem[disabled]:active{transform:none}
.reward .meta{display:block;margin-top:2px}
.coupon{background:var(--berry);color:var(--ink);border-radius:18px;padding:22px 20px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.coupon .for{font-size:13px;opacity:.75}
.coupon .what{font:500 28px Rubik,sans-serif;letter-spacing:-.02em;margin:6px 0 10px}
.coupon .code{display:inline-block;font:500 16px Rubik,sans-serif;letter-spacing:.12em;background:rgba(15,29,51,.1);border-radius:8px;padding:6px 12px;margin-bottom:10px}
.coupon .when{font-size:12px;opacity:.75}
.coupon .notch{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.coupon .notch.l{left:-11px}.coupon .notch.r{right:-11px}
.mine{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mine .code{font:500 12px Rubik,sans-serif;letter-spacing:.08em;color:var(--berry)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{padding:8px 6px;border-radius:10px;color:var(--muted);font:500 14px Rubik,sans-serif;transition:background var(--base) var(--ease),color var(--base) var(--ease)}
.seg button.on{background:var(--sky);color:var(--ink)}
.seg.small button{font-size:13px;padding:6px}
.note{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.note.ok{color:var(--sky)}.note.no{color:var(--error)}
.footlinks{display:flex;justify-content:center;gap:18px;margin-top:22px}

/* desktop sidebar (hidden on phones) */
#side{display:none}
@media (min-width:1000px){
  body{max-width:none;margin:0;padding:0;display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
  .mobwrap{display:none}
  #side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);padding:24px 18px}
  #side .head{display:flex;align-items:center;justify-content:space-between}
  #side .nav{display:flex;flex-direction:column;gap:2px}
  #side .nav button{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:9px 12px;border-radius:10px;color:var(--muted);font:500 14px Rubik,sans-serif}
  #side .nav button:hover{background:var(--surface);color:var(--text)}
  #side .nav button.on{background:var(--surface);color:var(--text)}
  #side .seg{margin:0}
  #side .lbl{font-size:12px;color:var(--muted);margin:6px 4px -6px}
  #side .topic{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px}
  #side .topic:hover{background:var(--surface)}
  #side .topic .nm{font-size:13px;display:block;margin-bottom:6px}
  #side .topic .track{display:block;height:4px}
  #side .topic .track>div{background:var(--sky)}
  main{padding:36px 48px 60px;min-width:0}
  #app{max-width:760px;margin:0 auto}
  #app.wide{max-width:1120px}
  .mob{display:none!important}
  .hero{font-size:34px}
  .qtext{font-size:18px}
  .keys{display:block;margin-top:10px}
  .card{min-height:320px;padding:32px}
  .card .term{font-size:26px}
  .rewardgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
}
@media (min-width:1200px){
  .qgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
  .qgrid #after{position:sticky;top:36px}
  .qgrid #after .why{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:color var(--fast),background var(--fast)!important}}

.streak{display:inline-flex;align-items:center;gap:4px;color:var(--sky);font:500 12px Rubik,sans-serif;white-space:nowrap}
.streak svg{width:14px;height:14px}
.opt{position:relative}
.burst{position:fixed;pointer-events:none;z-index:10;animation:berryburst 480ms ease-out forwards}
@keyframes berryburst{from{opacity:1;transform:translate(0,0) scale(.7)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.welcome{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.welcome:focus,#app:focus{outline:none}
.welcome-inner{width:100%;max-width:460px}
.welcome-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.welcome-brand .mark{font-size:40px}
.welcome-brand>svg{width:48px;height:48px}
.welcome.intro .welcome-brand{animation:introbrand 900ms var(--ease) both}
.welcome.intro .welcome-content{animation:rise 250ms 700ms var(--ease) both}
@keyframes introbrand{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
.welcome.leaving{animation:welcomeout 200ms var(--ease) forwards;pointer-events:none}
@keyframes welcomeout{to{opacity:0;transform:translateY(-8px)}}
.welcome .status{line-height:1.8;margin:16px 0 24px}
.part-scores{margin:16px 0}
.skip{position:fixed;top:-60px;left:12px;z-index:30;background:var(--action);color:var(--ink);padding:10px}
.skip:focus{top:12px}
@media(max-width:600px){.qhead{align-items:flex-start;gap:12px}.qhead>span{text-align:right;max-width:73%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.press:active{transform:none}}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to study content</a>
<aside id="side" aria-label="Study menu"></aside>
<div class="mobwrap">
<header class="top">
  <span class="mark">sempsych<i>.</i></span>
  <button class="coins press" aria-label="Strawberry coins"><span class="coin-n num">0</span></button>
</header>
<nav class="tabs" role="tablist" id="tabs">
  <span class="pill" id="pill"></span>
  <button class="tab press" role="tab" data-tab="home">Quiz</button>
  <button class="tab press" role="tab" data-tab="cards">Flashcards</button>
  <button class="tab press" role="tab" data-tab="shop">Rewards</button>
</nav>
</div>
<main><div id="app" tabindex="-1"></div></main>

<script>
const DATA = {"subjects": {"io": "IO", "pa": "Psych Assessment"}, "tos": {"io": {"Set 1 - Org Theory, Motivation, Leadership": 20, "Set 2 - Org Structure": 20, "Set 3 - HRM and HRD": 25, "Set 4 - Team Dynamics": 15, "Set 5 - Org Change and Development": 20}, "pa": {"Set 1 - Reliability, Validity, Norms": 39, "Set 2 - Research Methods and Statistics": 10, "Set 3 - Test Development and Item Analysis": 10, "Set 4 - Uses of Assessment Tools": 13, "Set 5 - Selecting Tests": 19, "Set 6 - Administration, Scoring, Interpretation": 20, "Set 7 - Ethics and Laws": 19}}, "questions": [{"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Theory", "q": "At a factory, an assembly worker gets conflicting instructions every shift: one from the production supervisor and another from the quality supervisor. Which classical structural principle is most directly violated?", "opts": ["Span of control", "Unity of command", "Functional principle", "Line/staff principle"], "ans": 1, "why": "Unity of command (part of the scalar principle) means each subordinate answers to only ONE superior. Two bosses giving conflicting orders breaks it. Span of control = how many people one manager supervises; line/staff = core vs. support functions; functional principle = division of labor into similar units.", "hint": "The problem isn't how many people a supervisor handles. Look at the worker's side of the chain."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Theory", "q": "A consultant times every movement of warehouse pickers, finds the fastest sequence, trains all pickers to follow that exact method, and pays them per item picked. This approach best reflects:", "opts": ["Taylor's Scientific Management", "Mayo's Human Relations approach", "Fayol's Administrative Theory", "Weber's Bureaucracy"], "ans": 0, "why": "Time studies to find the 'one best way', scientific training, and incentive pay are pure Taylorism. Fayol focused on what MANAGERS do (plan, organize, command, coordinate, control). Weber focused on hierarchy, rules, and division of labor. Mayo focused on social factors.", "hint": "Which theorist was obsessed with finding the 'one best way' through measurement?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Theory", "q": "In a study, workers' productivity rose whether the lighting was increased OR decreased. Researchers concluded the workers were responding to the attention of being studied. This is the:", "opts": ["Pygmalion effect", "Halo effect", "Galatea effect", "Hawthorne effect"], "ans": 3, "why": "The Hawthorne effect (Elton Mayo's Hawthorne studies) = people change their behavior because they know they are being observed. Pygmalion = a superior's high expectations raise performance; Galatea = your own expectations raise performance; Halo = one trait colors judgments of other traits.", "hint": "The lighting barely mattered. What else changed for the workers during the study?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Theory", "q": "A herbal-supplement company's founder writes rules for every task, hires and promotes strictly based on exam results, keeps written records of all decisions, and has a clear pyramid of authority. Which theorist's model is she following?", "opts": ["Max Weber", "Chester Barnard", "Chris Argyris", "Frederick Taylor"], "ans": 0, "why": "Weber's bureaucracy: division of labor, hierarchy, formal rules, impersonality, merit-based employment decisions, and written records. Barnard = organizations as cooperative systems where authority depends on subordinates' acceptance. Argyris = growth perspective (organizations should support employees' growth from passive to active).", "hint": "Rules, written records, merit, pyramid. Think of the sociologist who described the ideal efficient organization."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Theory", "q": "A new branch manager believes her staff are lazy and will avoid responsibility, so she installs strict time clocks, close supervision, and penalties. Months later, the staff do only the bare minimum. McGregor would explain this as:", "opts": ["A failure of Herzberg's hygiene factors", "A Theory Y self-fulfilling prophecy", "A Theory X self-fulfilling prophecy", "Underpayment inequity"], "ans": 2, "why": "Theory X = managers assume workers dislike work, so they control them tightly. Workers then act the way they are treated: a self-fulfilling prophecy. Theory Y assumes workers are self-motivated and seek responsibility. NOTE: the reviewer's Theory X/Y table lists Theory Y's management style as 'Authoritative, controlling'. That's a typo. Theory Y management is participative/democratic.", "hint": "The manager's assumptions came first; the staff's behavior followed. Which McGregor assumption was she holding?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Theory", "q": "Herbert Simon argued that because managers have limited information and limited thinking capacity, they usually pick the first option that is 'good enough' instead of the best possible one. This is called:", "opts": ["Satisficing (bounded rationality)", "Groupthink", "Equifinality", "Optimizing"], "ans": 0, "why": "Simon's bounded rationality: decisions are limited by information and cognitive ability, so people SATISFICE (accept 'good enough'). NOTE: the reviewer misspells it as 'satisfying'. The correct term is 'satisficing'. Equifinality = many paths lead to the same end state (open systems).", "hint": "Does Simon think managers actually find the BEST option?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A company raises salaries and renovates the break room, yet employees still say their jobs feel meaningless and unmotivating. According to Herzberg, why?", "opts": ["Pay and working conditions are motivators that take time to work", "Employees perceive underpayment inequity", "Pay and working conditions are hygiene factors: they prevent dissatisfaction but don't create motivation", "Lower-level needs must be fully met before esteem needs"], "ans": 2, "why": "Herzberg's Two-Factor Theory: HYGIENE factors (salary, working conditions, policies) only remove dissatisfaction. MOTIVATORS (achievement, recognition, the work itself, responsibility, growth) create satisfaction and motivation. To motivate, enrich the job itself.", "hint": "Herzberg split job factors into two groups. Which group are salary and the break room in?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "Ana was passed over for a promotion she really wanted. Instead of pursuing growth, she now puts her energy into building close friendships with coworkers. Which theory best explains this shift?", "opts": ["Herzberg's Two-Factor Theory", "McClelland's Acquired Needs Theory", "Alderfer's ERG Theory (frustration-regression)", "Maslow's Hierarchy of Needs"], "ans": 2, "why": "ERG's frustration-regression principle: when a higher need (Growth) is frustrated, the person falls back to a lower need (Relatedness). Maslow's model has no regression; it moves up step by step. That's the key difference examiners test.", "hint": "She moved DOWN to a lower need after a higher one was blocked. Only one need theory allows that."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "Leo, a sales agent, discovers that a colleague with the same experience and the same sales numbers earns ₱8,000 more per month. Leo starts putting in less effort. This is best explained by:", "opts": ["Goal-Setting Theory", "Reinforcement Theory", "Equity Theory (underpayment inequity)", "Expectancy Theory"], "ans": 2, "why": "Adams' Equity Theory: people compare their outcome/input ratio with a referent's. Leo feels UNDERPAID relative to his referent, so he restores balance by reducing his inputs (effort). Overpayment inequity is the opposite: getting more than your inputs deserve.", "hint": "Leo is comparing himself with someone else's ratio of rewards to effort."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "An employee says: 'If I work harder I'll definitely hit my quota, and hitting quota definitely gets me the bonus... but the bonus is a gift certificate to a store I never go to.' Which part of Vroom's VIE theory is LOW?", "opts": ["Expectancy", "Valence", "Self-efficacy", "Instrumentality"], "ans": 1, "why": "Valence = how much the person values the reward. Here effort→performance (expectancy) and performance→reward (instrumentality) are both strong; the reward just isn't valued. Tip: Expectancy = 'Can I do it?', Instrumentality = 'Will I get the reward?', Valence = 'Do I want the reward?'", "hint": "Effort leads to performance? Yes. Performance leads to the reward? Yes. So what's left?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A staff nurse says: 'I know I can perform well, and I really want that promotion, but here promotions go to the head nurse's favorites no matter how well you perform.' Which VIE component is LOW?", "opts": ["Expectancy", "Valence", "Equity", "Instrumentality"], "ans": 3, "why": "Instrumentality = belief that good PERFORMANCE will lead to the REWARD. She believes she can perform (expectancy OK) and wants the promotion (valence OK), but performance doesn't lead to the reward. That's broken instrumentality.", "hint": "She believes she can perform, and she wants the reward. Where does the chain break?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A call-center supervisor wants to apply Locke's Goal-Setting Theory. Which goal is BEST?", "opts": ["Answer as many calls as you can", "Handle at least 60 calls per day with a 90% satisfaction rating by the end of the month", "Do your best this month", "Try to improve customer service"], "ans": 1, "why": "Locke: specific, challenging goals that the worker is committed to produce higher performance than vague 'do your best' goals. The correct option is SMART: specific, measurable, attainable, relevant, time-bound.", "hint": "Locke cared about two qualities of a goal: how specific it is and how challenging it is."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A factory gives workers a raffle ticket after an unpredictable number of completed units: sometimes after 3, sometimes after 10. Which reinforcement schedule is this?", "opts": ["Fixed interval", "Fixed ratio", "Variable interval", "Variable ratio"], "ans": 3, "why": "RATIO = based on number of responses; INTERVAL = based on time. VARIABLE = unpredictable. Unpredictable number of units = variable ratio (like a slot machine), which produces the highest and most persistent response rate.", "hint": "Is the reward tied to time or to output? Is it predictable?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "Rina's supervisor has no special expectations of her, but Rina keeps telling herself 'I can master this job,' and her performance steadily improves. This illustrates the:", "opts": ["Golem effect", "Hawthorne effect", "Galatea effect", "Pygmalion effect"], "ans": 2, "why": "Galatea = the power of SELF-expectations. Pygmalion (Rosenthal) = a SUPERIOR's high expectations raise performance. Golem = others' LOW expectations lower performance. Memory tip: Pygmalion is the sculptor (someone else), Galatea is the statue that comes to life (yourself).", "hint": "Nobody else raised their expectations of her. Whose expectations changed?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "Employees accepted a pay freeze without much complaint because management explained the criteria, let them voice concerns, and applied the rule consistently to everyone, even though they disliked the freeze itself. This shows the importance of:", "opts": ["Overpayment inequity", "Distributive justice", "Procedural justice", "Continuance commitment"], "ans": 2, "why": "Procedural justice = fairness of the PROCESS used to reach a decision. Distributive justice = fairness of the OUTCOME itself. Employees disliked the outcome (low distributive) but accepted it because the process was fair (high procedural).", "hint": "They disliked the outcome but accepted it. What did management get right?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A company lets employees choose their own projects, provides skills training so they feel capable, and builds strong team bonds. Which theory's three needs is it targeting?", "opts": ["Self-Determination Theory (autonomy, competence, relatedness)", "Alderfer's ERG Theory (existence, relatedness, growth)", "Four-Drive Theory (acquire, bond, comprehend, defend)", "McClelland's Theory of Needs (achievement, affiliation, power)"], "ans": 0, "why": "Self-Determination Theory: autonomy (choice/control), competence (mastery), relatedness (belonging). Don't mix it up with McClelland (achievement/affiliation/power) or ERG (existence/relatedness/growth). All three have a 'social' need, so look at the OTHER two needs to tell them apart.", "hint": "Choice, feeling capable, belonging. Compare all three needs, not just the social one."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A supervisor notices that a clerk loves organizing the supply room, so she lets him organize it every Friday afternoon as a reward for finishing his reports on time. This applies the:", "opts": ["Gain sharing", "Pygmalion effect", "Galatea effect", "Premack Principle"], "ans": 3, "why": "Premack Principle: reinforcement is relative. A preferred activity can reinforce a less-preferred one, even if it doesn't look like a 'reward' on the surface. Gain sharing = group bonuses for productivity improvements.", "hint": "The 'reward' is just an activity he enjoys more than his reports."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "Fiedler's Contingency Model: A newly appointed supervisor is disliked by her team (poor leader-member relations), the tasks are vague (low task structure), and she has little formal authority (weak position power). Which leader is predicted to be MORE effective here?", "opts": ["A relationship-oriented (high LPC) leader", "A laissez-faire leader", "A task-oriented (low LPC) leader", "It depends on the followers' readiness level"], "ans": 2, "why": "Fiedler: task-oriented leaders do best in VERY favorable or VERY unfavorable situations; relationship-oriented leaders do best in MODERATELY favorable ones. This situation is very unfavorable (all three factors are bad), so task-oriented wins. 'Followers' readiness' belongs to Hersey-Blanchard, not Fiedler.", "hint": "First decide: is this situation moderately favorable or extremely unfavorable? Fiedler's answer depends on that."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "Hersey and Blanchard's Situational Leadership: A newly hired nurse is very eager and enthusiastic but has no experience with the hospital's systems. Which style should her head nurse use?", "opts": ["Supporting (unwilling but able)", "Directing (unwilling and unable)", "Delegating (willing and able)", "Coaching (willing but unable)"], "ans": 3, "why": "Match the style to the follower's ABILITY and WILLINGNESS. Willing but unable → Coaching (lots of direction plus encouragement). Able but unwilling → Supporting. Able and willing → Delegating. Unable and unwilling → Directing.", "hint": "Rate her on two things separately: ability and willingness."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "A team does a clearly defined but very repetitive and boring data-entry task, and morale is low. According to Path-Goal Theory, which leader behavior is MOST appropriate?", "opts": ["Supportive", "Instrumental (directive)", "Participative", "Achievement-oriented"], "ans": 0, "why": "Path-Goal (House): Supportive leadership fits tasks that are boring, stressful, or tedious, because it adds the satisfaction the task lacks. Instrumental/directive is redundant when the task is already clearly structured. Achievement-oriented fits complex, challenging tasks.", "hint": "The task is already clear, so more structure won't help. What's missing from a boring job?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "A department head spends one-on-one time with each staff member discussing their personal career goals, then arranges stretch assignments tailored to each person. Which component of transformational leadership is this?", "opts": ["Intellectual stimulation", "Idealized influence", "Individualized consideration", "Inspirational motivation"], "ans": 2, "why": "The 4 I's: Individualized consideration = personal attention to each follower's growth. Intellectual stimulation = encouraging creativity and questioning. Inspirational motivation = communicating a compelling vision. Idealized influence = being a trusted role model (charisma).", "hint": "Which of the 4 I's is about each follower as an individual person?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "A manager collects input on a problem from her team as a GROUP in a meeting, then makes the final decision herself. In the Vroom-Yetton model, this is:", "opts": ["Consultative I", "Group (G II)", "Autocratic II", "Consultative II"], "ans": 3, "why": "Autocratic I = decides alone. Autocratic II = gets information from subordinates, then decides alone. Consultative I = consults subordinates INDIVIDUALLY, then decides. Consultative II = consults them AS A GROUP, then decides. Group = the group reaches the decision.", "hint": "Two questions: did she consult them individually or as a group? And who made the final call?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "Office staff follow the IT specialist's recommendations on the new system even though she holds no managerial position, because she's the only one who truly understands it. Her influence comes from:", "opts": ["Reward power", "Referent power", "Legitimate power", "Expert power"], "ans": 3, "why": "Expert power = specialized knowledge or skills others depend on. Legitimate = formal position/title. Referent = personal charisma and likability. Reward = ability to give incentives. (Informational power is different: it comes from controlling ACCESS to information, not from expertise.)", "hint": "She has no title. What do people depend on her for?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "An executive assistant decides which reports and memos actually reach the CEO's desk, so department heads go out of their way to stay on her good side. Her influence comes mainly from:", "opts": ["Legitimate power", "Informational power", "Expert power", "Coercive power"], "ans": 1, "why": "Informational power = access to and control over valuable information others need. She isn't an expert in the reports' content; she controls their flow. Coercive = threat of punishment; legitimate = formal rank.", "hint": "She isn't an expert on the reports' content. What does she control?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "A 50-year-old employee says: 'Honestly, I'd love to leave, but I've invested 22 years here and my retirement benefits vest in two years. I can't afford to start over.' This reflects:", "opts": ["Organizational citizenship behavior", "Continuance commitment", "Normative commitment", "Affective commitment"], "ans": 1, "why": "Continuance = 'I NEED to stay' (costs of leaving, sunk investment, lack of alternatives). Affective = 'I WANT to stay' (emotional attachment). Normative = 'I OUGHT to stay' (sense of obligation/loyalty). NOTE: the reviewer's normative example (staying for the salary because you have kids to feed) is really an economic-need reason, which is closer to CONTINUANCE.", "hint": "Listen for 'can't afford to leave' versus 'want to' versus 'ought to'."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "An employee says: 'The company paid for my master's degree, so it would feel wrong to resign now. I owe them.' This reflects:", "opts": ["Affective commitment", "Normative commitment", "Calculus-based trust", "Continuance commitment"], "ans": 1, "why": "Normative commitment = staying out of a sense of OBLIGATION or moral duty ('I owe them'). If she stayed because she loves the company, it would be affective; if because leaving would cost her too much, continuance.", "hint": "Listen for the word 'owe'."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "A newly hired project coordinator has no job description. Her manager just says 'help out wherever you're needed,' and she has no idea what she'll be evaluated on. She is experiencing:", "opts": ["Role overload", "Role ambiguity", "Role conflict", "Role differentiation"], "ans": 1, "why": "Role ambiguity = lack of clarity about expectations and responsibilities. Role conflict = INCOMPATIBLE expectations (e.g., two bosses wanting opposite things). Role overload = demands exceed capacity. Role differentiation = roles becoming specialized and distinct.", "hint": "She doesn't have two bosses pulling her in different directions. She just doesn't know what's expected."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "Carlo always seems to hear the latest office rumors but almost never passes them on to anyone. In grapevine terms, Carlo is a(n):", "opts": ["Isolate", "Ombudsperson", "Liaison", "Dead-ender"], "ans": 3, "why": "Dead-ender = receives much grapevine information but seldom passes it on. Liaison = both sends and receives most of the grapevine information. Isolate = receives less than half of the grapevine information. Ombudsperson = investigates employee complaints (a formal third-party facilitator, not a grapevine role).", "hint": "Hears a lot, passes on little."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "In speeches, a CEO says the firm 'values innovation and learning from mistakes.' But everyone silently takes for granted that one mistake can end your career, and nobody ever says this out loud. The silent, taken-for-granted belief belongs to which layer of culture?", "opts": ["Espoused values", "Basic assumptions", "Observable artifacts", "Organizational climate"], "ans": 1, "why": "Schein's layers: Observable ARTIFACTS (visible: symbols, language, stories, practices), ESPOUSED values (what management SAYS it values, i.e., the CEO's speeches), and BASIC ASSUMPTIONS (unspoken, taken-for-granted beliefs: the real 'code'). Climate = the mood employees perceive, not a culture layer.", "hint": "The CEO's speeches are one layer. The thing nobody ever says out loud is a deeper layer."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "Two bank branches reach the same high customer-satisfaction scores using completely different strategies: one through faster tellers, the other through a mobile app. Which open-systems characteristic does this illustrate?", "opts": ["Dynamic homeostasis", "Throughput", "Negative entropy", "Equifinality"], "ans": 3, "why": "Equifinality = an open system can reach the same final state from different starting points and through different paths. Negative entropy = importing more energy than you spend to avoid decay. Homeostasis = maintaining a stable state. Throughput = transforming inputs into outputs.", "hint": "Same end result, completely different paths."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "A team leader tells a resistant coworker: 'The Vice President already approved this plan, so you should go along with it.' Which influence tactic is this?", "opts": ["Coalition", "Upward appeal", "Ingratiation", "Exchange"], "ans": 1, "why": "Upward appeal = citing the support of higher-ups to gain compliance. Ingratiation = flattering or doing favors to increase your appeal. Exchange = offering something in return. Coalition = combining with others to push a shared goal.", "hint": "She's borrowing the authority of someone above both of them."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "After two equal-sized companies merge, employees from both sides constantly argue about 'how we did things at our old company.' Which merger phase are they in?", "opts": ["Combination", "Refreezing", "Postcombination", "Precombination"], "ans": 0, "why": "Precombination = emphasis on financial issues. Combination = clash between people as they focus on their differences. Postcombination = integrating the two cultures. Refreezing is from Lewin's change model, not merger phases.", "hint": "Financial issues are behind them; integrating the two cultures hasn't happened yet."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Theory", "q": "In a manufacturing company, the production department makes the products that meet the company's main goal, while the HR department recruits and trains people for production. Under the classical line/staff principle, HR is a:", "opts": ["Line function", "Staff function", "Span of control", "Scalar function"], "ans": 1, "why": "LINE functions carry the primary responsibility for the organization's major goals (here, production). STAFF functions support the line and are regarded as subsidiary in overall importance (HR, accounting support). The scalar principle is the chain of command.", "hint": "Which department does the company's core work, and which one supports it?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "Research on leader performance finds that effective managers often show a high need for power combined with a low need for affiliation. This combination is called the:", "opts": ["Affective identity motivation", "Need for achievement", "Galatea effect", "Leadership motive pattern"], "ans": 3, "why": "The leadership motive pattern = high need for power + low need for affiliation. Leaders who need to be liked too much may avoid hard decisions. Affective identity motivation is about leader EMERGENCE (enjoying being in charge).", "hint": "Two of McClelland's needs: one high, one low."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A supervisor keeps reminding an employee about a late report every morning. The day the employee finally submits it, the reminders stop, and from then on he submits reports on time to avoid the nagging. This is:", "opts": ["Extinction", "Negative reinforcement", "Punishment", "Positive reinforcement"], "ans": 1, "why": "Negative reinforcement = behavior increases because it removes or avoids an existing unpleasant condition (the nagging). Punishment is an unpleasant consequence that FOLLOWS a behavior to decrease it. Positive reinforcers are desirable events added after the behavior.", "hint": "Is something pleasant being added, or something unpleasant being taken away?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "Factory workers receive their pay every 15th and 30th of the month regardless of how many units they produced. Which reinforcement schedule is this?", "opts": ["Fixed interval", "Variable ratio", "Variable interval", "Fixed ratio"], "ans": 0, "why": "Fixed INTERVAL = reinforcement after a set amount of TIME, regardless of the number of responses. Fixed RATIO would mean pay after a set number of units (piecework).", "hint": "Is pay tied to the calendar or to output?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A new supervisor openly tells a team member, 'I don't expect much from you.' Over the next months, that employee's performance steadily declines. This illustrates the:", "opts": ["Golem effect", "Hawthorne effect", "Pygmalion effect", "Galatea effect"], "ans": 0, "why": "Golem effect = NEGATIVE or LOW expectations from others lead to decreased performance. It's the opposite of the Pygmalion effect, where a superior's high expectations improve performance. Galatea is about one's own expectations.", "hint": "Whose expectations, and were they high or low?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "An employee hesitates to volunteer for a presentation because she doubts she can do it well, even though she's skilled. Her coach helps her succeed at small presentations first to build her belief in her own capability. The coach is targeting her:", "opts": ["Valence", "Instrumentality", "Need for affiliation", "Self-efficacy"], "ans": 3, "why": "Self-efficacy (Bandura) = a person's belief in their own ability to succeed in a specific situation or task. Small successes build it (compare 'experience-with-success' tasks). Instrumentality and valence belong to expectancy theory.", "hint": "The issue is her belief in her own ability at this specific task."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "A manager trusts a few team members with challenging assignments and frequent one-on-one talks, while others get only routine tasks and formal instructions. Which theory focuses on these differing relationship qualities between a leader and each member?", "opts": ["Path-Goal theory", "Fiedler's contingency model", "Great Man theory", "Leader-Member Exchange (LMX) theory"], "ans": 3, "why": "LMX theory: effective leadership depends on the quality of the interaction between the leader and EACH particular member, often creating 'in-group' and 'out-group' relationships. Fiedler focuses on the leader's style vs. situation favorableness.", "hint": "The leader treats each member differently. Which theory is about that relationship?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "A sales manager tells her team: 'Hit your monthly quota and you get the bonus and my public recognition; miss it and you don't.' The relationship is based on an exchange of rewards for performance. This is:", "opts": ["Transactional leadership", "Servant leadership", "Transformational leadership", "Laissez-faire leadership"], "ans": 0, "why": "Transactional leadership = the leader-follower relationship is based on an exchange or 'transaction' (money or praise for work). Transformational leadership changes followers' values, beliefs, and attitudes through the 4 I's.", "hint": "What is the relationship built on?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "A department head gives her experienced research team almost no direction and leaves nearly all decisions to the group. In Lewin's leadership styles, this is:", "opts": ["Transactional", "Laissez-faire (delegative)", "Democratic (participative)", "Autocratic (authoritarian)"], "ans": 1, "why": "Lewin's styles: Autocratic = the leader decides alone with little input; Democratic = involves members in decisions while offering guidance; Laissez-faire = offers little guidance and leaves decision-making to the group.", "hint": "How much direction is the leader giving?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Leadership", "q": "According to Geier's IMPACT theory, which leadership style tends to emerge in a climate of CRISIS, leading through control and punishment?", "opts": ["Coercive", "Informational", "Tactical", "Magnetic"], "ans": 0, "why": "IMPACT pairs each style with a climate: Informational (ignorance), Magnetic (despair), Position (instability), Affiliation (anxiety), Coercive (crisis), Tactical (disorganization). A crisis calls for the coercive style.", "hint": "Match each style to the climate it fits."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "An HR survey asks employees how they experience the workplace's policies and practices right now: whether it feels supportive, tense, fair, or stressful. This survey is measuring organizational:", "opts": ["Culture", "Climate", "Commitment", "Structure"], "ans": 1, "why": "Organizational CLIMATE = the 'mood' or atmosphere: how employees experience and perceive policies, practices, and procedures. CULTURE = the deep-rooted values, beliefs, and assumptions that form the company's 'DNA.' Climate is the surface feel; culture runs deeper.", "hint": "Is the survey about the current mood or the deep-rooted values?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Org Concepts", "q": "Without being asked and with no extra pay, Ben stays late to help a struggling coworker finish her deadline and volunteers to organize the office's outreach program. These behaviors are:", "opts": ["Counterproductive behaviors", "Organizational citizenship behaviors", "Task performance", "Continuance commitment"], "ans": 1, "why": "OCBs are 'extra-role,' voluntary behaviors beyond the formal job description that aren't explicitly rewarded but support the organization. Task performance = core job duties. Counterproductive behaviors violate norms (theft, sabotage, gossip).", "hint": "Voluntary, beyond the job description, and unpaid."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A new hire discovers he's paid noticeably MORE than coworkers with the same experience and output. Feeling guilty, he starts working extra hours. According to equity theory, he is reacting to:", "opts": ["Procedural justice", "Overpayment inequity", "Low instrumentality", "Underpayment inequity"], "ans": 1, "why": "Overpayment inequity = receiving greater outcomes than your inputs justify compared with a referent. People often restore balance by INCREASING their inputs (working harder). Underpayment inequity leads people to reduce inputs.", "hint": "He's paid more than his inputs justify."}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "A trainee says: 'The bonus is great and they always pay it to top performers, but no matter how hard I try, I just don't think I can reach that sales target.' Which VIE component is LOW?", "opts": ["Equity", "Valence", "Expectancy", "Instrumentality"], "ans": 2, "why": "Expectancy = the belief that EFFORT will lead to good PERFORMANCE. He values the bonus (valence OK) and trusts it's paid for performance (instrumentality OK), but doesn't believe his effort can reach the target.", "hint": "Break the chain into effort → performance → reward → value. Where does he doubt?"}, {"subj": "io", "set": "Set 1 - Org Theory, Motivation, Leadership", "topic": "Motivation", "q": "In Maslow's hierarchy, which need is classified as a growth need (B-need) rather than a deficiency need (D-need)?", "opts": ["Self-actualization", "Esteem", "Love and belonging", "Safety"], "ans": 0, "why": "The first four levels (physiological, safety, love/belonging, esteem) are deficiency needs (D-needs). Self-actualization, becoming the best you can be, is the growth need (B-need).", "hint": "Only one level is about growth rather than filling a deficit."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A 12-person milk-tea startup has almost no written rules. Everyone reports directly to the owner, who makes every decision herself. This is a:", "opts": ["Bureaucratic structure", "Matrix structure", "Simple structure", "Functional structure"], "ans": 2, "why": "Simple structure = low departmentalization, wide span of control, CENTRALIZED authority in one person, little formalization. Typical of small businesses and startups. Its main weakness is overdependence on the owner.", "hint": "A tiny company where one person decides everything."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "Engineers at a firm report to BOTH the head of Engineering and the manager of the product they're assigned to. They often complain that they don't know whose instructions come first. This is a:", "opts": ["Network structure", "Tall structure", "Matrix structure", "Divisional structure"], "ans": 2, "why": "Matrix = combines functional and product/project structures, so employees have DUAL reporting. Its classic cons: unclear lines of authority, power struggles, coordination problems. Its pros: resource sharing, collaboration, flexibility.", "hint": "Two bosses at the same time: one by function, one by product."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A company increases each supervisor's number of direct reports from 5 to 15 and removes one layer of management. What happens to the structure?", "opts": ["Wider span of control; flatter structure", "Narrower span of control; taller structure", "Narrower span of control; flatter structure", "Wider span of control; taller structure"], "ans": 0, "why": "More subordinates per manager = WIDER span. Fewer management layers = FLATTER organization. Narrow span ↔ tall (many layers, close supervision); wide span ↔ flat (fewer layers, more autonomy).", "hint": "More people per manager means fewer layers are needed."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "Using Mintzberg's basic parts of an organization: the industrial engineers and HR analysts who design work standards, systems, and procedures, but don't do the core production work themselves, belong to the:", "opts": ["Support staff", "Middle line", "Operating core", "Technostructure"], "ans": 3, "why": "Technostructure = people with specific technical expertise who design/standardize how work is done. Support staff = services that aid the mission indirectly (mailroom, security, janitorial). Middle line = managers with day-to-day authority. Operating core = people who do the basic work. Strategic apex = top management.", "hint": "They design how work is done but don't do the core work. Mintzberg named the part that analyzes and standardizes."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "In a hospital, surgeons, anesthesiologists, and scrub nurses coordinate smoothly during an operation mainly because each went through standardized professional training and licensure. Which coordinating mechanism is this?", "opts": ["Mutual adjustment", "Direct supervision", "Standardization of work output", "Standardization of skills and knowledge"], "ans": 3, "why": "Standardization of SKILLS = coordination happens because everyone was trained to the same standard beforehand (professions). Mutual adjustment = informal communication. Direct supervision = one person gives orders. Standardization of output = specifying the results, not the method.", "hint": "They coordinate because of what they learned BEFORE entering the operating room."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A fast-moving app company uses cross-functional teams, few written rules, wide spans of control, and lets teams make their own decisions. This is best described as a(n):", "opts": ["Organic structure", "Mechanistic structure", "Tall structure", "Bureaucratic structure"], "ans": 0, "why": "Organic = low specialization, loose departments, cross-functional teams, wide spans, low formalization, DECENTRALIZED decisions. Fits fast-changing environments. Mechanistic is the opposite (high formalization, centralized, rigid), similar to a bureaucracy or tall structure.", "hint": "Few rules, decentralized, cross-functional teams. Which structure is the flexible opposite of a bureaucracy?"}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A bank teller who used to only accept deposits is now also assigned to open new accounts and process bills payment, with no added authority or decision-making power. This is:", "opts": ["Job rotation", "Job crafting", "Job enrichment", "Job enlargement"], "ans": 3, "why": "Job ENLARGEMENT = more tasks at the SAME level of responsibility (horizontal loading). Job ENRICHMENT = more depth: responsibility, autonomy, decision-making (vertical loading). Job rotation = moving between different jobs. Job crafting = changes the EMPLOYEE makes on their own.", "hint": "More tasks, but no added authority or decision-making."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "Assembly workers are given authority to schedule their own work, inspect their own quality, and decide how to fix defects. Which job design strategy is this?", "opts": ["Job enlargement", "Job rotation", "Job specialization", "Job enrichment"], "ans": 3, "why": "Giving workers more control, responsibility, and decision-making = job ENRICHMENT (vertical loading). It increases autonomy, one of the core dimensions in Hackman and Oldham's Job Characteristics Model.", "hint": "They gained control over their own work, not just more tasks."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A skilled technician performs many varied tasks every day, but only ever works on one small component and never sees the finished product. Which Job Characteristics Model dimension is LOW?", "opts": ["Autonomy", "Task identity", "Task significance", "Skill variety"], "ans": 1, "why": "Task identity = completing a WHOLE, identifiable piece of work from start to finish. He has high skill variety (many tasks) but low task identity (never sees the whole). Task significance = impact on others' lives. Autonomy = freedom in how to do the work.", "hint": "His skill variety is high. What does he never get to experience about the finished product?"}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A hospital starts sharing letters from patients describing how the nurses' care saved their lives. Which JCM dimension is the hospital trying to make more salient?", "opts": ["Feedback", "Task identity", "Skill variety", "Task significance"], "ans": 3, "why": "Task significance = the job's impact on other people, inside or outside the organization. Showing nurses the effect of their work on patients increases experienced meaningfulness. Feedback = direct information about how well YOU are performing.", "hint": "The letters show the nurses how their work affects other people's lives."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "Without any instruction from her manager, an accounting clerk starts mentoring new hires and slowly reshapes her daily tasks to include more data analysis, which she enjoys. This is:", "opts": ["Job rotation", "Delegation", "Job crafting", "Job enrichment"], "ans": 2, "why": "Job crafting = INFORMAL changes an employee makes to their own job. Job enrichment is a formal design change by management. The keyword is 'on her own / without instruction'.", "hint": "The changes came from the employee herself, informally."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A national retail chain reorganizes into Luzon, Visayas, and Mindanao divisions, each with its own marketing, finance, and HR department. Which disadvantage is MOST likely?", "opts": ["Duplication of resources", "Role ambiguity due to the absence of middle managers", "Overdependence on the owner", "Dual reporting confusion"], "ans": 0, "why": "Divisional (geographic) structure: each division has its own functional departments, so you get DUPLICATION of resources (three HR departments!), plus possible internal competition. Dual reporting = matrix. Overdependence on the owner = simple. Role ambiguity from no middle managers = flat.", "hint": "Three regions, and each one has its own HR, finance and marketing."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A manager hands a major project to a subordinate. When the project fails, the manager tells the CEO, 'It's not my fault, I delegated it.' What principle does this statement ignore?", "opts": ["Span of control: a manager can only supervise a few people", "Delegation is not abdication: the delegator remains ultimately accountable", "Scalar chain: authority flows upward", "Unity of direction: everyone must work under a single plan"], "ans": 1, "why": "When you delegate, you transfer authority to do the task, but you remain ultimately ACCOUNTABLE for the outcome. 'Delegation does not mean abdication' is the exact line in the reviewer.", "hint": "Passing on the task doesn't pass on everything."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A government agency promotes employees based on qualifying exams and credentials rather than personal connections. Which characteristic of bureaucracy does this reflect?", "opts": ["A well-defined authority hierarchy", "Specialization of labor", "Emphasis on written records", "Employment decisions based on merit"], "ans": 3, "why": "Weber's six bureaucratic characteristics: specialization of labor, well-defined hierarchy, formal rules and procedures, impersonality, employment decisions based on MERIT, and emphasis on written records. Exams and credentials instead of connections = merit.", "hint": "Exams and credentials, not who you know."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A bank scraps its entire 10-day loan-approval process and redesigns it from scratch so approvals now take one day. This is best described as:", "opts": ["Job enlargement", "Total Quality Management", "Evolutionary change", "Re-engineering"], "ans": 3, "why": "Re-engineering = FUNDAMENTAL rethinking and RADICAL redesign of business PROCESSES for DRAMATIC improvements in cost, quality, service, or speed. TQM and evolutionary change are about continuous, gradual improvement, not starting over.", "hint": "They didn't tweak the process; they threw it out and started over."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "A clothing brand designs its products in-house but contracts out manufacturing, delivery, and customer service to partner firms, focusing only on its core competency of design. This is a:", "opts": ["Functional structure", "Network structure", "Team-based structure", "Matrix structure"], "ans": 1, "why": "Network structure = a core organization that relies on external partners, contractors, and alliances to perform other functions. Pros: flexibility, reduced overhead, access to specialized expertise. Cons: less control over partners.", "hint": "The brand keeps only design and partners out everything else."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Org Structure", "q": "An oil refinery runs a highly automated, nonstop flow of production. According to Joan Woodward's contingency model, this technology is classified as:", "opts": ["Continuous-process production", "Unit and small-batch production", "Large-batch and mass production", "Matrix production"], "ans": 0, "why": "Woodward linked structure to TECHNOLOGY: unit/small-batch = low-volume, customized products (prototypes, tailored clothes); large-batch/mass = standardized, high-volume (assembly lines); continuous-process = highly automated, continuous flow (oil refineries, chemical plants).", "hint": "Is the output customized, mass-produced on a line, or flowing nonstop?"}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Business Elements", "q": "A consultant says profitable performance depends on aligning four business elements. Which of these is NOT one of them?", "opts": ["Competitors", "People (human capital)", "Customers (market)", "Processes"], "ans": 0, "why": "The four business elements: PEOPLE (human capital), PROCESSES (activities that turn inputs into outputs), PRODUCTS/SERVICES (offerings), and CUSTOMERS (market). Competitors matter, but they aren't one of the four elements to align.", "hint": "Recall the four: people, processes, products/services, and ..."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Business Elements", "q": "A café redesigns the step-by-step sequence of activities that turns raw coffee beans into a served drink so orders move faster. Which of the four business elements is it improving?", "opts": ["Processes", "Products/Services", "Customers", "People"], "ans": 0, "why": "Processes = the established sequences of activities or steps that transform inputs into outputs. Redesigning the workflow is a process change, not a change in the offering itself.", "hint": "The steps that turn beans into drinks."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Structure Pros & Cons", "q": "A company is organized by function (Marketing, Finance, Production, HR). Each department is highly skilled, but they rarely talk to one another and new ideas stall. Which disadvantage of a functional structure is this?", "opts": ["Dual reporting", "Duplication of resources", "Overdependence on the owner", "Silos"], "ans": 3, "why": "Functional structure pros: deep expertise, efficiency, clear roles. Cons: SILOS, limited innovation, decision bottlenecks, difficulty adapting. Duplication of resources is a divisional con; dual reporting is a matrix con.", "hint": "Each department works in its own bubble."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Structure Pros & Cons", "q": "A startup removes nearly all middle managers. Decisions are faster and morale is high, but employees complain that responsibilities are unclear and there's nowhere to be promoted. These cons belong to a:", "opts": ["Flat structure", "Hierarchical structure", "Tall structure", "Mechanistic structure"], "ans": 0, "why": "Flat structure pros: faster decisions, autonomy, better communication, lower cost, higher morale. Cons: role ambiguity, potential conflict, unequal work distribution, limited career progression, coordination challenges.", "hint": "Few or no middle managers."}, {"subj": "io", "set": "Set 2 - Org Structure", "topic": "Structure Pros & Cons", "q": "A traditional company with many management layers enjoys clear authority and career paths, but a simple request takes weeks because it must climb the whole chain of command. This disadvantage is typical of a:", "opts": ["Hierarchical structure", "Flat structure", "Network structure", "Team-based structure"], "ans": 0, "why": "Hierarchical (pyramid) structure pros: clear authority, specialization, career progression, control, stability. Cons: SLOW decision-making, limited collaboration, reduced autonomy, communication gaps, and expense.", "hint": "Many layers between the person asking and the person deciding."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "Before designing any training, an HR officer checks whether the company's goals call for it, whether the budget allows it, and whether top management will support it. Which part of needs analysis is this?", "opts": ["Job evaluation", "Task analysis", "Organizational analysis", "Person analysis"], "ans": 2, "why": "Needs analysis has 3 levels. ORGANIZATIONAL analysis = goals, resources, climate, and support for training. TASK analysis = which tasks and competencies a job requires (interviews, observation, task inventories). PERSON analysis = WHICH employees need training and in what (appraisal scores, surveys, skills tests).", "hint": "She's looking at the company's goals, budget and support, not at any specific job or person."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "HR reviews performance appraisal scores and gives a skills test to identify exactly which customer-service agents need training and in which areas. This is:", "opts": ["Utility analysis", "Person analysis", "Task analysis", "Organizational analysis"], "ans": 1, "why": "Person analysis = determining WHICH employees need training and in WHAT areas, using appraisal scores, surveys, interviews, skills and knowledge tests, and critical incidents.", "hint": "The question is WHICH employees need training."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "After a customer-service training program, HR tracks whether complaint rates dropped and repeat sales increased over the next six months. Which training-evaluation criterion is being measured?", "opts": ["Organizational results", "Reactions", "Learning", "Behavior change"], "ans": 0, "why": "Four criteria: REACTIONS (did trainees like it/find it useful?), LEARNING (did they understand and retain the content?), BEHAVIOR (do they act differently on the job?), RESULTS (organizational outcomes like productivity, costs, quality, sales). Complaint rates and sales are organizational results.", "hint": "Complaint rates and sales are outcomes for the whole organization."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "Trainees scored 95% on the post-training exam, but six weeks later their supervisors see no change in how they actually do their jobs. Which problem is this?", "opts": ["Poor transfer of training (behavior change failed)", "Overlearning", "Poor learning", "Negative trainee reactions"], "ans": 0, "why": "LEARNING happened (the 95% exam), but it didn't carry over to the workplace. Transfer of training = generalizing and maintaining trained skills on the job. That's the BEHAVIOR criterion.", "hint": "The exam proves they learned it. What didn't happen afterward?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "Airline pilots repeatedly practice emergency landing procedures in a simulator even after they have already mastered them perfectly. This practice is called:", "opts": ["Overlearning", "Programmed instruction", "Job rotation", "Cross-training"], "ans": 0, "why": "Overlearning = continuing to practice a task after it has been successfully learned. It makes the skill automatic and resistant to stress, which is critical for emergencies. It improves transfer of training.", "hint": "They keep practicing after they've already mastered it."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "A trainer explains a task, demonstrates it, has the trainee perform it step by step, and gives immediate feedback until the trainee does it correctly. This on-the-job method is:", "opts": ["Apprenticeship", "Job Instruction Training (JIT)", "Programmed instruction", "Job shadowing"], "ans": 1, "why": "JIT = structured, step-by-step: trainer demonstrates → trainee practices → feedback. Apprenticeship = long-term OJT plus classroom, usually for skilled trades. Job shadowing = only OBSERVING an experienced worker. Programmed instruction = self-paced, off-the-job learning in small chunks.", "hint": "Demonstrate, practice, feedback, step by step, on the job."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "A new employee completes a self-paced online module that presents information in small chunks, asks a question after each chunk, and gives immediate feedback. This is:", "opts": ["Lecture", "Programmed instruction", "Case study", "Role-playing"], "ans": 1, "why": "Programmed instruction = self-paced, small chunks, followed by questions and IMMEDIATE feedback. It's an off-the-job method. A case study = analyzing a real or hypothetical organizational problem. Role-playing = acting out scenarios to practice interpersonal skills.", "hint": "Self-paced, small chunks, a question after each chunk."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "Over several years, a senior partner guides a junior associate not only on work skills but on long-term career direction, professional networks, and personal growth. This is:", "opts": ["Job Instruction Training", "Job shadowing", "Mentoring", "Coaching"], "ans": 2, "why": "MENTORING = long-term, broad career AND personal development. COACHING = short-term, focused on IMMEDIATE performance improvement in a specific skill. Key exam tip: long-term + career + personal = mentoring.", "hint": "Several years, career AND personal growth. Compare that with short-term skill feedback."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Training", "q": "A 24-year-old social media specialist is assigned to teach the 58-year-old marketing director how to use TikTok analytics and AI tools. This is:", "opts": ["Coaching", "Cross-training", "Reverse mentoring", "Apprenticeship"], "ans": 2, "why": "Reverse mentoring = OLDER employees learn from YOUNGER ones, often about technology or new trends.", "hint": "Who is teaching whom here?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "A company collects performance ratings on a supervisor from her own boss, her peers, her subordinates, and the clients she serves. This is:", "opts": ["360-degree feedback", "Management by Objectives", "Forced distribution", "Rating committee"], "ans": 0, "why": "360-degree feedback = performance information from MULTIPLE sources all around the employee (supervisors, peers, subordinates, customers, self). A rating committee = the immediate supervisor plus 3 or 4 other supervisors.", "hint": "Ratings are coming from every direction around her."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "To avoid conflict, a supervisor rates all 20 of her staff '3' on a 5-point scale, even though their performance clearly differs. This is:", "opts": ["Leniency error", "Halo effect", "Central tendency error", "Strictness error"], "ans": 2, "why": "Central tendency = rating most or all employees around the MIDDLE of the scale. Leniency = rating everyone too HIGH. Strictness = rating everyone too LOW. Halo = one trait influences ratings on other, unrelated traits.", "hint": "Everyone gets the same score, right in the middle."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "An employee performed poorly for ten months, then worked extremely hard in the two weeks right before the annual appraisal. He receives an 'Outstanding' rating. This is the:", "opts": ["Halo effect", "Recency effect", "Primacy effect", "Proximity error"], "ans": 1, "why": "Recency effect = giving too much weight to RECENT performance while overlooking earlier performance in the appraisal period. Primacy = relying on the FIRST information. Proximity error = similar ratings for items placed close together on the form.", "hint": "Which part of the year is driving the rating?"}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "Because Joy is always punctual and well-groomed, her supervisor also gives her high ratings on creativity, teamwork, and technical skill, areas where she is only average. This is the:", "opts": ["Halo effect", "Similar-to-me effect", "Contrast effect", "Leniency error"], "ans": 0, "why": "Halo effect = one positive impression or high rating on ONE dimension spills over onto other, UNRELATED dimensions. Leniency would mean rating ALL employees too high, not one employee across traits.", "hint": "One good trait is spilling over onto unrelated ones."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "A division head must place exactly 10% of employees in 'Exceeds,' 70% in 'Meets,' and 20% in 'Needs Improvement,' regardless of how the team actually performed. This is the:", "opts": ["Graphic rating scale", "Forced distribution method", "Paired comparison method", "Behaviorally Anchored Rating Scale"], "ans": 1, "why": "Forced distribution ('rank or yank') = the rater must place set PERCENTAGES of employees into each category. It prevents leniency and central tendency, but can be unfair when a whole team is strong.", "hint": "Set percentages per category, no matter how the team performed."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "A supervisor with 6 staff members uses the paired comparison method on overall effectiveness. How many comparisons must she make?", "opts": ["6", "12", "30", "15"], "ans": 3, "why": "Paired comparison compares every employee with every other employee once. Number of pairs = n(n − 1) / 2 = 6 × 5 / 2 = 15. This formula is a favorite in board exams.", "hint": "Each person is compared with every other person exactly once. Count the pairs."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "An appraisal form describes, for each performance level of 'Handling Customer Complaints,' a specific example of behavior (e.g., Level 5: 'Calmly resolves the issue and follows up within 24 hours'). This is a:", "opts": ["Graphic rating scale", "Critical incident log", "Behaviorally Anchored Rating Scale (BARS)", "Narrative report"], "ans": 2, "why": "BARS = uses specific BEHAVIORAL examples (built from critical incidents) to ANCHOR each level of the scale. A graphic rating scale just lists traits with a numeric scale. The critical incident method = a running log of actual effective/ineffective behaviors, not a scale.", "hint": "Each scale level is anchored by a specific behavior example."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Appraisal", "q": "At the start of the year, a manager and an employee jointly set specific, measurable targets. At year-end, the employee is evaluated on how many of those targets were achieved. This is:", "opts": ["Behaviorally Anchored Rating Scales", "Forced distribution", "Management by Objectives (MBO)", "Alternation ranking"], "ans": 2, "why": "MBO = supervisor and employee COLLABORATIVELY set SMART objectives, then evaluate on goal attainment. It's goal-focused appraisal.", "hint": "Goals set together at the start, then rated on whether they were met."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "An interviewer asks: 'Tell me about a time you had to deal with an angry customer. What exactly did you do?' What type of interview question is this?", "opts": ["Disqualifier", "Future-focused / situational question", "Clarifier", "Past-focused / patterned-behavior question"], "ans": 3, "why": "Past-focused (patterned behavior) questions ask how you ACTUALLY behaved in the past: 'Tell me about a time...' They rest on the idea that past behavior predicts future behavior. Situational questions are hypothetical: 'What WOULD you do if...?'", "hint": "'Tell me about a time...' asks about the past."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "An interviewer asks: 'Suppose a coworker takes credit for a report you wrote. What would you do?' This is a:", "opts": ["Organizational-fit question", "Skill-level determiner", "Future-focused / situational question", "Past-focused / patterned-behavior question"], "ans": 2, "why": "'What WOULD you do if...' = hypothetical future situation = situational question. Compare with 'Tell me about a TIME when...' = past-focused/patterned behavior.", "hint": "'What would you do if...' asks about a hypothetical future."}, {"subj": "io", "set": "Set 3 - HRM and HRD", "topic": "Selection", "q": "For a delivery-rider position, the first interview question is: 'Do you have a valid professional driver's lice
